<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>OCTO CASCADE 옥토 캐스케이드</title>
<style>
:root{
  --bg:#bccdbf; --chassis:#dbe6dc; --chassis-hi:#eef4ee; --rail:#2a3a31; --ink:#13201a; --muted:#4a6153; --line:#9fb6a5;
  --ticket:#ffcc4a; --ticket-ink:#2a1d00; --screen:#050807; --danger:#b8262f;
  --sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; height:100%;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16211b; --chassis:#1f2d26; --chassis-hi:#283a31; --rail:#0b120e; --ink:#e6efe7; --muted:#93a79a; --line:#365045;
    --ticket:#ffd36b; --danger:#ff7b7b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16211b; --chassis:#1f2d26; --chassis-hi:#283a31; --rail:#0b120e; --ink:#e6efe7; --muted:#93a79a; --line:#365045;
  --ticket:#ffd36b; --danger:#ff7b7b; color-scheme:dark;
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:13px; line-height:1.4;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
}
#app{
  height:100%; display:flex; flex-direction:column;
  padding:0 max(8px, env(safe-area-inset-right,0px)) 8px max(8px, env(safe-area-inset-left,0px));
}

/* 상단 */
.top{ flex:none; display:flex; align-items:center; padding:8px 2px; min-height:52px; }
.brand{ flex:1; min-width:0; margin-right:10px; overflow:hidden; }
#mark{ display:block; width:180px; height:17px; }
#sub{ margin:5px 0 0; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
.ctrl{ flex:none; display:flex; }
.ctrl .btn + .btn{ margin-left:6px; }
.btn{
  -webkit-appearance:none; appearance:none; border:1px solid var(--line); background:var(--chassis-hi); color:var(--ink);
  height:34px; min-width:40px; padding:0 11px; border-radius:9px; font:600 13px/1 var(--sans);
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; touch-action:manipulation; white-space:nowrap;
}
.btn svg{ display:block; fill:currentColor; }
.btn:active{ transform:translateY(1px); }
.btn:focus-visible, .panel:focus-visible{ outline:2px solid var(--ticket); outline-offset:2px; }
.btn.samples{ background:var(--ticket); color:var(--ticket-ink); border-color:transparent; font-weight:700; }
.btn.samples b{ margin-left:6px; font-variant-numeric:tabular-nums; }
.btn.samples.bump{ animation:bump .45s ease; }
@keyframes bump{ 35%{ transform:scale(1.08); } }
.btn.on{ background:var(--ink); color:var(--chassis); border-color:transparent; }

/* 8분할 격자 (지그재그 컨베이어) */
.grid{ position:relative; flex:1; min-height:0; display:grid; grid-gap:12px; gap:12px; grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:repeat(4,minmax(0,1fr)); }
#belts{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:2; }
#belts .belt rect{ fill:var(--rail); stroke:var(--line); stroke-width:1; transition:fill .2s; }
#belts .belt path{ fill:var(--muted); }
#belts .belt.on rect{ fill:var(--c); stroke:var(--c); }
#belts .belt.on path{ fill:#10140f; }
.grid.focus{ grid-template-columns:minmax(0,1fr) !important; grid-template-rows:minmax(0,1fr) !important; }
.grid.focus .panel{ display:none; }
.grid.focus .panel.on{ display:flex; grid-row:1 !important; grid-column:1 !important; cursor:zoom-out; }

.panel{
  position:relative; min-width:0; min-height:0; display:flex; flex-direction:column;
  background:var(--chassis); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:zoom-in; outline:none;
}
.panel.active{ border-color:var(--acc); }
.ph{ flex:none; display:flex; align-items:center; height:24px; padding:0 8px; }
.no{ flex:none; width:17px; height:17px; margin-right:6px; border-radius:5px; background:var(--acc); color:#10140f; font:800 11px/17px var(--sans); text-align:center; }
.nm{ min-width:0; font-weight:700; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.st{ flex:none; margin-left:auto; padding-left:6px; display:flex; align-items:center; font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
.st i{ width:7px; height:7px; margin-right:5px; border-radius:50%; background:var(--line); }
.st em{ font-style:normal; white-space:nowrap; }
.grid.tight .st em{ display:none; }
.grid.tight .st i{ margin-right:0; }
.back{ display:none; }
.grid.focus .panel.on .back{ display:inline-block; flex:none; margin-left:8px; padding:2px 8px; border-radius:6px; border:1px solid var(--line); background:var(--chassis-hi); color:var(--ink); font-size:11px; font-weight:600; }
.panel.active .st i{ background:var(--acc); animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse{ 50%{ opacity:.3; } }
.scr{ position:relative; flex:1; min-height:0; margin:0 5px; border-radius:9px; overflow:hidden; background:var(--screen); }
.scr canvas{ position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
.qb{ position:absolute; left:5px; bottom:16px; padding:2px 6px; border-radius:6px; background:rgba(0,0,0,.62); color:#fff; font-size:10px; font-variant-numeric:tabular-nums; pointer-events:none; }
.qb[hidden]{ display:none; }
.pf{ flex:none; display:flex; align-items:center; height:22px; padding:0 8px; font-size:11px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; }
.pf .a{ color:var(--muted); overflow:hidden; text-overflow:ellipsis; min-width:0; }
.pf .b{ margin-left:auto; padding-left:8px; font-weight:700; flex:none; }
.pf .b::before{ content:"▸"; color:var(--muted); font-weight:400; margin-right:4px; }

/* 흐르는 토큰 */
.token{
  position:fixed; left:0; top:0; z-index:30; pointer-events:none; white-space:nowrap;
  padding:3px 9px 3px 7px; border-radius:5px; border-left:4px solid var(--c);
  background:var(--ticket); color:var(--ticket-ink); font:800 12px/1.25 var(--sans); font-variant-numeric:tabular-nums;
  box-shadow:0 6px 16px rgba(0,0,0,.28); will-change:transform,opacity;
}

/* 샘플 기록 */
.modal{ position:fixed; left:0; top:0; right:0; bottom:0; z-index:40; display:flex; align-items:flex-end; justify-content:center; background:rgba(5,10,7,.55); }
.modal[hidden]{ display:none; }
.sheet{
  width:100%; max-width:720px; max-height:calc(100% - env(safe-area-inset-top,0px) - 16px); display:flex; flex-direction:column;
  background:var(--chassis); color:var(--ink); border:1px solid var(--line); border-bottom:none; border-radius:18px 18px 0 0;
  padding:14px 14px calc(12px + env(safe-area-inset-bottom,0px));
}
@media (min-width:720px) and (min-height:560px){
  .modal{ align-items:center; }
  .sheet{ border-radius:18px; border-bottom:1px solid var(--line); max-height:86%; padding-bottom:14px; }
}
.mh{ flex:none; display:flex; align-items:center; margin-bottom:10px; }
.mh h2{ margin:0; flex:1; font-size:17px; font-weight:800; }
.stats{ flex:none; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-gap:6px; gap:6px; margin-bottom:10px; }
.stat{ min-width:0; background:var(--chassis-hi); border:1px solid var(--line); border-radius:10px; padding:6px 8px; }
.stat span{ display:block; font-size:10.5px; color:var(--muted); }
.stat b{ display:block; font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#mChart{ flex:none; display:block; width:100%; height:110px; margin-bottom:8px; border-radius:10px; background:var(--screen); }
.list{ flex:1; min-height:60px; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; margin:0 -4px; padding:0 4px; }
.row{ display:grid; grid-template-columns:48px minmax(0,1fr) auto; grid-column-gap:10px; column-gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
.row canvas{ grid-row:1 / span 2; width:48px; height:48px; border-radius:8px; background:var(--screen); }
.row .t1{ min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .n{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; margin-right:6px; }
.row .v{ font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
.row .tm{ font-size:11px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
.row .ch{ grid-column:2 / 4; font-size:11px; line-height:1.35; color:var(--muted); font-variant-numeric:tabular-nums; word-break:keep-all; }
.more{ display:block; width:100%; margin:10px 0 4px; }
.empty{ padding:26px 8px; text-align:center; color:var(--muted); }
.mf{ flex:none; display:flex; padding-top:10px; }
.mf .btn{ flex:1; }
.mf .btn + .btn{ margin-left:8px; }
.btn.danger{ color:var(--danger); }
.btn.danger.arm{ background:var(--danger); color:#fff; border-color:transparent; }
.copybox{ width:100%; height:130px; margin-top:8px; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--chassis-hi); color:var(--ink); font:11px/1.4 ui-monospace,Menlo,Consolas,monospace; }
.toast{
  position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:60; transform:translateX(-50%);
  max-width:calc(100% - 32px); padding:8px 14px; border-radius:10px; background:var(--ink); color:var(--chassis);
  font-size:12.5px; opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.show{ opacity:1; }
@media (min-width:1100px) and (min-height:700px){
  body{ font-size:14px; }
  .top{ min-height:60px; padding:10px 2px; }
  #sub{ font-size:12.5px; margin-top:6px; }
  .btn{ height:38px; padding:0 14px; font-size:14px; }
  .ph{ height:30px; padding:0 10px; }
  .no{ width:20px; height:20px; margin-right:8px; font-size:12.5px; line-height:20px; }
  .nm{ font-size:14px; }
  .st{ font-size:12px; }
  .st i{ width:8px; height:8px; }
  .pf{ height:28px; padding:0 10px; font-size:13px; }
  .scr{ margin:0 6px; }
}
@media (prefers-reduced-motion: reduce){
  .panel.active .st i, .btn.samples.bump{ animation:none; }
  #belts .belt rect, .toast{ transition:none; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <canvas id="mark" role="img" aria-label="OCTO CASCADE"></canvas>
      <p id="sub">8단 연쇄 공정을 준비하는 중</p>
    </div>
    <div class="ctrl">
      <button class="btn" id="bPause" type="button" aria-label="일시정지" title="일시정지 (Space)"></button>
      <button class="btn" id="bSpeed" type="button" aria-label="배속 1배" title="배속">1×</button>
      <button class="btn samples" id="bSamples" type="button" aria-haspopup="dialog" aria-label="샘플값 기록 보기">샘플<b id="sCount">0</b></button>
    </div>
  </header>
  <main class="grid" id="grid" aria-label="8단 연쇄 공정 화면">
    <svg id="belts" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"></svg>
  </main>
</div>
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mh"><h2 id="mTitle">샘플값 기록</h2><button class="btn" id="mClose" type="button" aria-label="닫기">✕</button></div>
    <div class="stats" id="mStats"></div>
    <canvas id="mChart" role="img" aria-label="샘플값 추이 그래프"></canvas>
    <div class="list" id="mList"></div>
    <div class="mf"><button class="btn" id="mCopy" type="button">표로 복사</button><button class="btn danger" id="mClear" type="button">기록 삭제</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
'use strict';

/* ───────── 기본 도구 ───────── */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = n => Math.round(n || 0).toLocaleString('ko-KR');
const fmt1 = n => {
  const x = Math.round((n || 0) * 10) / 10, ax = Math.abs(x), i = Math.floor(ax);
  return (x < 0 ? '-' : '') + i.toLocaleString('ko-KR') + '.' + (Math.round((ax - i) * 10) % 10);
};
const DPR = Math.min(2, window.devicePixelRatio || 1);
const SANS = '"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = s => Math.round(clamp(((n >> s) & 255) * f, 0, 255));
  return 'rgb(' + c(16) + ',' + c(8) + ',' + c(0) + ')';
}
// 화면 좌표용 작은 라벨 (반투명 받침)
function tag(g, x, y, text, color, align, fs) {
  g.font = '700 ' + fs + 'px ' + SANS;
  const w = g.measureText(text).width + fs * 0.9, h = fs * 1.55;
  const x0 = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  g.fillStyle = 'rgba(0,0,0,.5)'; rr(g, x0, y, w, h, fs * 0.45); g.fill();
  g.fillStyle = color; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(text, x0 + fs * 0.45, y + h / 2 + 0.5);
  return h;
}
function hex6(g, x, y, r) {
  g.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + i * Math.PI / 3, px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i) g.lineTo(px, py); else g.moveTo(px, py);
  }
  g.closePath();
}
function diamond(g, x, y, r) {
  g.beginPath(); g.moveTo(x, y - r); g.lineTo(x + r * 0.72, y); g.lineTo(x, y + r); g.lineTo(x - r * 0.72, y); g.closePath();
}

/* ───────── 시드 PRNG (결과는 전부 시드로 결정) ───────── */
function mulberry32(a) {
  a |= 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash32() {
  let h = 0x811c9dc5 | 0;
  for (let i = 0; i < arguments.length; i++) {
    h ^= arguments[i] | 0; h = Math.imul(h, 0x01000193);
    h ^= h >>> 15; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13;
  }
  return h >>> 0;
}
const QS = new URLSearchParams(location.search);
const SEED = (() => {
  const s = QS.get('seed');
  if (s) { let h = 7; for (let i = 0; i < s.length; i++) h = hash32(h, s.charCodeAt(i)); return h; }
  return hash32(Date.now() % 2147483647, Math.floor(performance.now() * 1000), Math.floor(Math.random() * 4294967295));
})();
const VR = mulberry32(hash32(SEED, 99991));          // 연출 전용 (결과에 영향 없음)
const vr = (a, b) => a + VR() * (b - a);

/* ───────── 8단계 정의 ───────── */
const DEFS = [
  { name: '핀볼',       acc: '#ff5c93', out: 'coins' },
  { name: '레이싱',     acc: '#ffb13b', in: 'coins', out: 'rp',     wait: '코인' },
  { name: '연쇄반응로', acc: '#43d9ff', in: 'rp',    out: 'mj',     wait: 'RP' },
  { name: '방어 포탑',  acc: '#c6f24a', in: 'mj',    out: 'cr',     wait: '에너지' },
  { name: '생명 배양기', acc: '#c585ff', in: 'cr',    out: 'bio',    wait: '결정' },
  { name: '로켓 발사',  acc: '#ff7446', in: 'bio',   out: 'star',   wait: '바이오연료' },
  { name: '테트리스',   acc: '#6f8dff', in: 'star',  out: 'line',   wait: '별조각' },
  { name: '결정 성장',  acc: '#3ff2cf', in: 'line',  out: 'sample', wait: '점수' },
];
function fmtOut(key, v) {
  switch (key) {
    case 'coins': return fmt(v) + ' 코인';
    case 'rp': return fmt(v) + ' RP';
    case 'mj': return fmt(v) + ' MJ';
    case 'cr': return fmt(v) + ' 결정';
    case 'bio': return fmt(v) + ' 바이오';
    case 'star': return fmt(v) + ' 별조각';
    case 'line': return fmt(v) + '점';
    case 'sample': return fmt1(v);
  }
  return fmt(v);
}

/* ───────── 연출용 파티클 ───────── */
class FX {
  constructor() { this.p = []; this.t = []; }
  burst(x, y, n, c, sp, life, sz) {
    sp = sp || 60; life = life || 0.6; sz = sz || 2;
    for (let i = 0; i < n; i++) {
      const a = VR() * TAU, s = sp * (0.35 + VR() * 0.65);
      this.p.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: life * (0.6 + VR() * 0.4), m: life, c, sz });
    }
    if (this.p.length > 500) this.p.splice(0, this.p.length - 500);
  }
  text(x, y, s, c, life, size) {
    this.t.push({ x, y, s, c, l: life || 0.9, m: life || 0.9, size: size || 12 });
    if (this.t.length > 24) this.t.shift();
  }
  update(h) {
    const p = this.p; let j = 0;
    for (let i = 0; i < p.length; i++) {
      const q = p[i]; q.l -= h; if (q.l <= 0) continue;
      q.vx *= 0.985; q.vy *= 0.985; q.x += q.vx * h; q.y += q.vy * h; p[j++] = q;
    }
    p.length = j;
    const t = this.t; j = 0;
    for (let i = 0; i < t.length; i++) { const q = t[i]; q.l -= h; if (q.l <= 0) continue; q.y -= 22 * h; t[j++] = q; }
    t.length = j;
  }
  draw(g, s) {
    for (const q of this.p) { g.globalAlpha = clamp(q.l / q.m, 0, 1); g.fillStyle = q.c; g.fillRect(q.x - q.sz / 2, q.y - q.sz / 2, q.sz, q.sz); }
    g.globalAlpha = 1;
    if (!this.t.length) return;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const q of this.t) {
      g.globalAlpha = clamp(q.l / q.m * 1.6, 0, 1);
      g.font = '800 ' + Math.max(q.size, 9 / s) + 'px ' + SANS;
      g.lineWidth = 3 / s; g.strokeStyle = 'rgba(0,0,0,.55)'; g.strokeText(q.s, q.x, q.y);
      g.fillStyle = q.c; g.fillText(q.s, q.x, q.y);
    }
    g.globalAlpha = 1;
  }
}

/* ───────── 단계 공통 틀 ─────────
   idle → intake(투입 0.9초) → run(각 기믹) → output(산출 1.3초) → idle */
class Stage {
  constructor(k, def) {
    this.k = k; this.def = def; this.queue = []; this.lot = null; this.phase = 'idle'; this.pt = 0;
    this.inV = 0; this.outV = 0; this.lastOut = null; this.W = 200; this.H = 200; this.bg = '#050807';
    this.fx = new FX(); this.clock = 0; this.cw = 0; this.ch = 0; this.s = 1; this.ox = 0; this.oy = 0;
    this.rng = mulberry32(hash32(SEED, 555, k));
  }
  mount(el) {
    this.el = el; this.scr = el.querySelector('.scr'); this.cv = el.querySelector('canvas');
    this.g = this.cv.getContext('2d');

  resize(w, h) {

      g.save(); g.translate(cw / 2, ch / 2 + f1 * 0.15); g.scale(0.7 + 0.3 * e, 0.7 + 0.3 * e);
      g.fillStyle = this.def.acc; g.font = '800 ' + f2 + 'px ' + SANS;

    } else if (this.phase === 'idle' && !this.queue.length && this.k > 0) {

      g.fillStyle = 'rgba(255,255,255,.66)'; g.font = '700 ' + f1 + 'px ' + SANS;
      g.fillText(this.def.wait + ' 기다리는 중' + '...'.slice(0, 1 + (Math.floor(this.clock * 2) % 3)), cw / 2, ch / 2);
    }
  }
}

/* ───────── 저장 (이 브라우저에만, 실패해도 동작) ───────── */
const LS_KEY = 'octo-cascade.samples.v1', LS_SPEED = 'octo-cascade.speed';
const Store = {
  load() {
    try {
      const s = localStorage.getItem(LS_KEY), a = s ? JSON.parse(s) : [];
      return Array.isArray(a) ? a.filter(x => x && typeof x.v === 'number' && typeof x.n === 'number') : [];
    } catch (e) { return []; }
  },
  save(list) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(list)); return true; }
    catch (e) {
      try { // 용량 초과: 오래된 절반의 결정 그림을 빼고 다시
        const half = Math.ceil(list.length / 2);
        for (let i = 0; i < half; i++) delete list[i].p;
        localStorage.setItem(LS_KEY, JSON.stringify(list)); return true;
      } catch (e2) { return false; }
    }
  },
  clear() { try { localStorage.removeItem(LS_KEY); } catch (e) { /* 저장소 없음 */ } },
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 무시 */ } },
};

const Samples = {
  list: [],
  init() { this.list = Store.load(); },
  add(lot, st) {
    const n = (this.list.length ? this.list[this.list.length - 1].n : 0) + 1;
    lot.n = n;
    const c = lot.v;
    const rec = {
      n, v: c.sample, t: Date.now(), lot: lot.id, seed: lot.seed.toString(36),
      c: { coins: c.coins, rp: c.rp, mj: c.mj, cr: c.cr, bio: c.bio, star: c.star, line: c.line },
      N: st.count, D: Math.round(st.D * 1000) / 1000, r: Math.round(st.rMax * 10) / 10, h: st.hue, p: st.encode(),
    };
    this.list.push(rec);
    if (!Store.save(this.list)) UI.toast('저장 공간이 없어 이 샘플은 이 탭에만 남아요');
    UI.onSample(rec);
    return rec;
  },
  clear() { this.list = []; Store.clear(); UI.onSample(null); },
};

/* ───────── 파이프라인: 로트가 1→8단계를 차례로 통과 ───────── */
const Pipe = {
  stages: [], seq: 0,
  newLot(st, coins) {
    const id = ++this.seq;
    this.handoff(st, { id, seed: hash32(SEED, id, 7), v: { coins }, t0: Date.now() });
  },
  handoff(st, lot) {
    if (st.k < 7) { const nx = this.stages[st.k + 1]; nx.receive(lot); UI.fly(st, nx, lot); }
    else { const rec = Samples.add(lot, st); UI.flySample(st, rec); }
  },
};

/* ───────── 1. 핀볼 (자동 플레이, 20초마다 점수 → 코인) ───────── */
function segHit(b, s) {
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
  let t = ((b.x - s.x1) * dx + (b.y - s.y1) * dy) / s.l2;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const px = s.x1 + dx * t, py = s.y1 + dy * t;
  let nx = b.x - px, ny = b.y - py;
  const d2 = nx * nx + ny * ny;
  if (d2 >= b.r * b.r) return 0;
  const dist = Math.sqrt(d2);
  if (dist < 1e-6) { const L = Math.sqrt(s.l2); nx = -dy / L; ny = dx / L; } else { nx /= dist; ny /= dist; }
  if (s.oneWay && nx * s.nx + ny * s.ny <= 0) return 0;
  const pen = b.r - dist;
  b.x += nx * pen; b.y += ny * pen;
  const vn = b.vx * nx + b.vy * ny;
  if (vn >= 0) return 0;
  b.vx -= (1 + s.e) * vn * nx; b.vy -= (1 + s.e) * vn * ny;
  const tx = -ny, ty = nx, vt = b.vx * tx + b.vy * ty;
  b.vx -= vt * 0.015 * tx; b.vy -= vt * 0.015 * ty;
  if (s.kick && -vn > 25) { b.vx += nx * s.kick; b.vy += ny * s.kick; }
  return -vn;
}
function circHit(b, c, e) {
  const dx = b.x - c.x, dy = b.y - c.y, rr2 = b.r + c.r, d2 = dx * dx + dy * dy;
  if (d2 >= rr2 * rr2) return -1;
  let nx = 0, ny = -1;
  if (d2 > 1e-9) { const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; }
  b.x = c.x + nx * rr2; b.y = c.y + ny * rr2;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) { b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; return -vn; }
  return 0;
}
function flipHit(b, f) {
  const ca = Math.cos(f.ang), sa = Math.sin(f.ang), dx = ca * f.len, dy = sa * f.len;
  let t = ((b.x - f.px) * dx + (b.y - f.py) * dy) / (f.len * f.len);
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const cx = f.px + dx * t, cy = f.py + dy * t, fr = 7 - 2.5 * t, rr2 = b.r + fr;
  let nx = b.x - cx, ny = b.y - cy;
  const d2 = nx * nx + ny * ny;
  if (d2 >= rr2 * rr2) return;
  const d = Math.sqrt(d2);
  if (d < 1e-6) { nx = -sa; ny = ca; if (ny > 0) { nx = -nx; ny = -ny; } } else { nx /= d; ny /= d; }
  b.x = cx + nx * rr2; b.y = cy + ny * rr2;
  const rx = cx - f.px, ry = cy - f.py, svx = -f.w * ry, svy = f.w * rx;
  const vn = (b.vx - svx) * nx + (b.vy - svy) * ny;
  if (vn < 0) { b.vx -= 1.3 * vn * nx; b.vy -= 1.3 * vn * ny; }
}

class Pinball extends Stage {
  constructor(k, def) {
    super(k, def);
    this.W = 300; this.H = 440; this.bg = '#0a0714';
    this.rng = mulberry32(hash32(SEED, 101));
    this.phase = 'run';
    this.win = 0; this.winScore = 0; this.mult = 1; this.ball = null; this.respawn = 0.8; this.trail = [];
    this.lanes = [0, 0, 0]; this.laneCd = [0, 0, 0]; this.laneFlash = 0;
    this.tg = [0, 0, 0]; this.tgCd = 0; this.tgFlash = 0;
    this.settle = 0; this.settleV = 0; this.balls = 0; this.drains = 0;
    this.segs = []; this.bumpers = []; this.posts = [];
    this.build();
    const mk = (px, py, rest, up) => ({ px, py, len: 44, rest, up, ang: rest, w: 0, on: false, hold: 0, cd: 0, dec: false, aim: 0.5, miss: false });
    this.fl = [mk(86, 390, 0.52, -0.42), mk(190, 390, Math.PI - 0.52, Math.PI + 0.42)];
  }
  build() {
    const S = (x1, y1, x2, y2, o) => {
      const s = Object.assign({ x1, y1, x2, y2, e: 0.5, flash: 0 }, o || {});
      s.l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1); this.segs.push(s); return s;
    };
    S(12, 330, 12, 60, { tag: 'lwall' });
    S(12, 60, 62, 12);
    S(62, 12, 238, 12);
    S(238, 12, 288, 62, { e: 0.6 });
    S(288, 62, 288, 432);
    S(264, 432, 288, 432, { e: 0.15 });
    S(264, 432, 264, 118);
    this.gate = S(264, 118, 288, 96, { oneWay: true, nx: -0.675, ny: -0.737, e: 0.35 });
    S(12, 330, 80, 384, { e: 0.3 });
    S(264, 330, 196, 384, { e: 0.3 });
    S(34, 272, 34, 322, { e: 0.4 });
    S(34, 322, 70, 350, { e: 0.4 });
    S(70, 350, 34, 272, { e: 0.5, kick: 230, tag: 'sling' });
    S(242, 272, 242, 322, { e: 0.4 });
    S(242, 322, 206, 350, { e: 0.4 });
    S(206, 350, 242, 272, { e: 0.5, kick: 230, tag: 'sling' });
    this.bumpers = [
      { x: 98, y: 150, r: 15, flash: 0, cd: 0, col: '#43d9ff' },
      { x: 178, y: 150, r: 15, flash: 0, cd: 0, col: '#ffd36b' },
      { x: 138, y: 205, r: 15, flash: 0, cd: 0, col: '#ff5c93' },
    ];
    this.posts = [90, 126, 162, 198].map(x => ({ x, y: 48, r: 4 }));
  }
  receive() { /* 1단계는 입력이 없다 */ }
  live() { return this.winScore; }
  spawn() { this.ball = { x: 276, y: 424, vx: 0, vy: 0, r: 7, lane: true, wait: 0.55, stuck: 0 }; this.balls++; }
  drain() {
    this.ball = null; this.respawn = 3; this.mult = 1; this.drains++;
    this.fx.text(138, 360, 'OUT', '#ff7aa8', 1.1, 22);
  }
  add(p, x, y, big) {
    const v = p * this.mult; this.winScore += v;
    this.fx.text(x, y, '+' + v, big ? '#ffe066' : '#ffffff', big ? 1.1 : 0.7, big ? 18 : 11);
  }
  step(h) {
    this.clock += h;
    this.win += h;
    if (this.win >= 20) {
      this.win -= 20;
      const coins = Math.round(this.winScore);
      this.winScore = 0; this.settle = 1.6; this.settleV = coins; this.lastOut = coins;
      Pipe.newLot(this, coins);
    }
    if (this.settle > 0) this.settle -= h;
    const b0 = this.ball;
    if (!b0) { this.respawn -= h; if (this.respawn <= 0) this.spawn(); }
    else if (b0.lane) { b0.wait -= h; if (b0.wait <= 0) { b0.lane = false; b0.vx = 0; b0.vy = -(760 + this.rng() * 110); } }
    for (const f of this.fl) this.ai(f, h);

    const b = this.ball;
    if (b) {
      if (b.y > this.H + 16) this.drain();
      else {
        const sp = Math.hypot(b.vx, b.vy);
        if (!b.lane && sp < 22) {
          b.stuck += h;
          if (b.stuck > 2.2) { b.stuck = 0; b.vx += (this.rng() - 0.5) * 320; b.vy -= 240 + this.rng() * 120; this.fx.text(b.x, b.y - 14, '툭', '#ffffff', 0.8, 12); }
        } else b.stuck = 0;
        if (b.y > 30 && b.y < 64) {
          for (let i = 0; i < 3; i++) if (Math.abs(b.x - (108 + i * 36)) < 12 && this.laneCd[i] <= 0) { this.laneCd[i] = 0.5; this.hitLane(i); }
        }
        this.trail.push(b.x, b.y); if (this.trail.length > 20) this.trail.splice(0, 2);
      }

    if (this.laneFlash > 0) this.laneFlash -= h;
    if (this.tgFlash > 0) this.tgFlash -= h;

  }
  physics(h) {

      this.add(200, 150, 100, true);
      this.lanes = [0, 0, 0]; this.laneFlash = 1;
      this.fx.text(150, 124, '배수 ×' + this.mult, '#ffe066', 1.2, 18);
    }
  }
  ai(f, h) {
    if (f.hold > 0) { f.hold -= h; f.on = true; if (f.hold <= 0) { f.on = false; f.cd = 0.2; } return; }
    f.on = false;
    if (f.cd > 0) { f.cd -= h; return; }
    const b = this.ball;
    if (!b || b.lane) { f.dec = false; return; }
    const dx = Math.cos(f.rest) * f.len, dy = Math.sin(f.rest) * f.len;
    const t = ((b.x - f.px) * dx + (b.y - f.py) * dy) / (f.len * f.len);
    const tc = clamp(t, 0, 1), cx = f.px + dx * tc, cy = f.py + dy * tc;

      if (!f.miss && (t >= f.aim || (b.vy > 240 && dist < 18))) { f.hold = 0.17; f.on = true; f.dec = false; }

  draw(g) {

      this.tbl = gr;
    }
    g.fillStyle = this.tbl; g.fillRect(0, 0, W, H);
    // 20초 정산 게이지
    g.fillStyle = 'rgba(255,255,255,.09)'; g.fillRect(12, 2, 276, 5);
    g.fillStyle = '#ffd36b'; g.fillRect(12, 2, 276 * clamp(this.win / 20, 0, 1), 5);

    g.strokeStyle = 'rgba(255,92,147,.13)'; g.lineWidth = 1; g.setLineDash([3, 5]);
    g.beginPath(); g.arc(138, 180, 72, 0, TAU); g.stroke(); g.setLineDash([]);
    g.fillStyle = 'rgba(255,92,147,.1)';
    for (let i = 0; i < 3; i++) { const y = 262 + i * 16; g.beginPath(); g.moveTo(138, y); g.lineTo(130, y + 10); g.lineTo(146, y + 10); g.closePath(); g.fill(); }
    for (let i = 0; i < 3; i++) {
      g.fillStyle = (this.lanes[i] || this.laneFlash > 0) ? '#ffe066' : 'rgba(255,224,102,.18)';
      g.beginPath(); g.arc(108 + i * 36, 74, 4, 0, TAU); g.fill();
    }
    for (let i = 0; i < 3; i++) {

      g.fillRect(13, 173 + i * 26.67, 5, 22);

/* ───────── 4. 방어 포탑 (에너지 = 포탑 건설·탄약 → 처치 결정) ───────── */
const TD_PATH = [[-12, 50], [170, 50], [170, 110], [70, 110], [70, 165], [252, 165]];

  constructor(k, def) {

      const [x1, y1] = TD_PATH[i], [x2, y2] = TD_PATH[i + 1], l = Math.hypot(x2 - x1, y2 - y1);
      this.seg.push({ x1, y1, x2, y2, l, s: L }); L += l;

    this.turrets = []; this.en = []; this.shots = []; this.gems = []; this.t = 0;
    this.ammo = 0; this.ammo0 = 0; this.cr = 0; this.kills = 0; this.esc = 0; this.spawned = 0; this.boss = false; this.lv2 = false; this.endT = 0;
  }
  at(d) {

  setup(mj) {

    while (n > 1 && mj - n * 120 < 60) n--;
    this.ammo0 = this.ammo = Math.max(0, mj - n * 120);
    this.lv2 = this.ammo > 1100;
    this.turrets = (mj > 0 ? TD_SLOTS.slice(0, n) : []).map((p, i) => ({ x: p[0], y: p[1], a: -Math.PI / 2, cd: this.rng() * 0.3, b: 0, i, mf: 0 }));
    this.en = []; this.shots = []; this.gems = []; this.t = 0; this.cr = 0; this.kills = 0; this.esc = 0;
    this.spawned = 0; this.boss = false; this.endT = 0;
  }
  update(h, ph) {
    for (const tu of this.turrets) { if (tu.b < 1) tu.b = Math.min(1, tu.b + h * 2.2); if (tu.mf > 0) tu.mf -= h; }
    for (const gm of this.gems) gm.t += h * 1.6;

    if (ph !== 'run') return false;
    this.t += h;
    while (this.spawned < 18 && this.t >= 0.2 + this.spawned * 0.34) {
      this.en.push({ d: 0, sp: 64 + this.rng() * 12, hp: 4, mx: 4, rw: 4, boss: false, wob: this.rng() * TAU, x: -12, y: 50 });
      this.spawned++;

    for (const e of this.en) {

      if (!tgt) continue;

  draw(g) {

    g.strokeStyle = 'rgba(198,242,74,.05)'; g.lineWidth = 1; g.beginPath();
    for (let x = 0; x <= 240; x += 20) { g.moveTo(x, 0); g.lineTo(x, 200); }

    g.strokeStyle = '#3d3520'; g.lineWidth = 13; this.pathStroke(g);
    g.strokeStyle = 'rgba(255,230,160,.14)'; g.lineWidth = 1; g.setLineDash([4, 6]); this.pathStroke(g); g.setLineDash([]);
    g.fillStyle = 'rgba(255,90,90,.4)'; g.beginPath(); g.arc(0, 50, 11, -Math.PI / 2, Math.PI / 2); g.fill();
    g.strokeStyle = '#c6f24a'; g.lineWidth = 2; g.beginPath(); g.arc(240, 165, 10, Math.PI / 2, Math.PI * 1.5); g.stroke();

    g.strokeStyle = 'rgba(198,242,74,.25)'; g.lineWidth = 1;
    TD_SLOTS.forEach((p, i) => { if (!used[i]) { hex6(g, p[0], p[1], 8); g.stroke(); } });
    for (const e of this.en) {
      if (e.boss) {
        g.fillStyle = '#b36bff'; hex6(g, e.x, e.y, 9); g.fill();
        g.strokeStyle = '#ecd6ff'; g.lineWidth = 1.5; g.stroke();

      g.strokeStyle = '#c6f24a'; g.lineWidth = 1.5; g.stroke();

/* ───────── 5. 생명 배양기 (결정 = 씨앗 → 평균 생존 개체 = 바이오매스) ───────── */
const LIFE_SEEDS = [
  [[1, 0], [2, 0], [0, 1], [1, 1], [1, 2]],                         // R-펜토미노
  [[1, 0], [2, 1], [0, 2], [1, 2], [2, 2]],                         // 글라이더
  [[1, 0], [3, 1], [0, 2], [1, 2], [4, 2], [5, 2], [6, 2]],         // 도토리
  [[6, 0], [0, 1], [1, 1], [1, 2], [5, 2], [6, 2], [7, 2]],         // 다이하드

class Life extends Stage {
  constructor(k, def) {
    super(k, def);
    this.W = 200; this.H = 200; this.bg = '#0b0714';
    this.N = 44; const n = this.N * this.N;
    this.a = new Uint8Array(n); this.b = new Uint8Array(n); this.age = new Uint16Array(n); this.gh = new Float32Array(n);
    this.gen = 0; this.pop = 0; this.popSum = 0; this.acc = 0; this.t = 0; this.cr = 0; this.left = 0; this.init = 0;
    this.drops = []; this.hist = [];
  }
  setup(cr) {
    this.cr = Math.max(0, Math.round(cr));
    this.a.fill(0); this.b.fill(0); this.age.fill(0); this.gh.fill(0);
    this.gen = 0; this.popSum = 0; this.acc = 0; this.t = 0; this.drops = []; this.hist = [];
    this.init = Math.ceil(this.cr * 0.4);
    for (let i = 0; i < this.init; i++) this.seed(false);
    this.left = this.cr - this.init;
    let c = 0; for (let i = 0; i < this.a.length; i++) c += this.a[i];
    this.pop = c;
  }
  seed(anim) {
    const N = this.N, x0 = Math.floor(this.rng() * N), y0 = Math.floor(this.rng() * N), r = this.rng();
    let cells;
    if (r < 0.62) { cells = []; for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) if (this.rng() < 0.5) cells.push([x, y]); }
    else cells = LIFE_SEEDS[r < 0.78 ? 0 : r < 0.9 ? 1 : r < 0.96 ? 2 : 3];
    for (const p of cells) { const i = ((y0 + p[1]) % N) * N + ((x0 + p[0]) % N); this.a[i] = 1; this.age[i] = 0; }
    if (anim) this.drops.push({ x: (x0 + 2.5) * (200 / N), y: (y0 + 2.5) * (200 / N), t: 0 });
  }
  stepGen() {
    const N = this.N, a = this.a, b = this.b, age = this.age;
    let pop = 0;
    for (let y = 0; y < N; y++) {
      const ym = ((y + N - 1) % N) * N, y0 = y * N, yp = ((y + 1) % N) * N;
      for (let x = 0; x < N; x++) {
        const xm = (x + N - 1) % N, xp = (x + 1) % N;
        const n = a[ym + xm] + a[ym + x] + a[ym + xp] + a[y0 + xm] + a[y0 + xp] + a[yp + xm] + a[yp + x] + a[yp + xp];
        const i = y0 + x, alive = a[i], nv = (n === 3 || (alive && n === 2)) ? 1 : 0;

  update(h, ph) {
    const gh = this.gh;

    for (const d of this.drops) d.t += h;
    if (this.drops.length && this.drops[0].t >= 0.6) this.drops = this.drops.filter(d => d.t < 0.6);
    if (ph !== 'run') return false;
    this.t += h;
    if (this.left > 0) {      // 남은 결정을 6초에 걸쳐 조금씩 떨어뜨림
      const total = this.cr - this.init, want = Math.floor(Math.min(1, this.t / 6) * total);

  }
  result() { return Math.round(this.gen ? this.popSum / this.gen : this.pop); }

  draw(g) {

    g.fillStyle = '#120b20'; g.fillRect(0, 0, 200, 200);
    g.strokeStyle = 'rgba(197,133,255,.06)'; g.lineWidth = 1; g.beginPath();
    for (let i = 4; i < N; i += 4) { g.moveTo(i * cs, 0); g.lineTo(i * cs, 200); g.moveTo(0, i * cs); g.lineTo(200, i * cs); }

    g.fillStyle = 'rgba(197,133,255,.08)'; g.fill(P[0]);
    g.fillStyle = 'rgba(197,133,255,.16)'; g.fill(P[1]);
    g.fillStyle = 'rgba(197,133,255,.26)'; g.fill(P[2]);

      g.beginPath(); g.arc(d.x, d.y, 3 + k * 18, 0, TAU); g.stroke();
    }
  }
  hud(g, cw, ch, m) {
    if (!this.lot) return;
    const fs = this.hudFont(m);
    tag(g, 6, 6, '세대 ' + this.gen, '#ecd6ff', 'left', fs);
    tag(g, cw - 6, 6, '개체 ' + this.pop, '#c585ff', 'right', fs);
    if (this.hist.length > 2 && m > 150) {        // 개체 수 추이
      const w = Math.min(90, cw * 0.35), hh = fs * 1.8, x0 = cw - 6 - w, y0 = ch - 6 - hh;
      let mx = 1; for (const v of this.hist) if (v > mx) mx = v;

/* ───────── 8. 결정 성장 (점수 = 입자 수 → DLA 결정 → 샘플값) ───────── */
class Crystal extends Stage {
  constructor(k, def) {
    super(k, def);
    this.W = 200; this.H = 200; this.bg = '#03100d';
    this.occ = new Uint8Array(100 * 100); this.pts = new Uint8Array(2 * 520);
    this.count = 0; this.rMax = 1; this.walk = []; this.allow = 0; this.t = 0; this.N = 0; this.hue = 160; this.finT = 0;
    this.D = 0; this.newest = []; this.line = 0;
    this.attach(50, 50, 0);
  }
  attach(x, y, d) {
    this.occ[y * 100 + x] = 1;
    if (this.count < 520) { this.pts[this.count * 2] = x; this.pts[this.count * 2 + 1] = y; }
    this.count++;
    if (d > this.rMax) this.rMax = d;
  }
  spawnW() {
    const a = this.rng() * TAU, r = Math.min(this.rMax + 5, 46);
    return { x: Math.round(50 + Math.cos(a) * r), y: Math.round(50 + Math.sin(a) * r) };
  }
  setup(line) {
    this.line = Math.max(0, line);
    this.N = this.line > 0 ? clamp(Math.round(Math.sqrt(this.line) * 5), 50, 480) : 0;
    this.occ.fill(0); this.count = 0; this.rMax = 1; this.t = 0; this.allow = 0; this.finT = 0; this.D = 0; this.newest = [];
    this.hue = Math.floor(this.rng() * 360);
    this.attach(50, 50, 0);
    this.walk = []; for (let i = 0; i < 40; i++) this.walk.push(this.spawnW());
  }
  dim() { return this.count > 1 ? Math.log(this.count) / Math.log(Math.max(2, this.rMax)) : 0; }
  update(h, ph) {
    for (const q of this.newest) q.t += h;
    if (this.newest.length && this.newest[0].t >= 0.4) this.newest = this.newest.filter(q => q.t < 0.4);
    if (ph !== 'run') return false;
    this.t += h;
    if (this.N === 0) return this.t >= 1.2;
    if (this.count >= this.N) { this.finT += h; return this.finT >= 0.8; }
    if (this.t >= 14) return true;
    this.allow += (this.N / 7.5) * h;
    const occ = this.occ, W = this.walk;
    let budget = 40000;
    const rK = Math.min(this.rMax * 2 + 10, 48);
    let rK2 = rK * rK;
    outer:
    while (this.allow >= 1 && budget > 0) {
      for (let wi = 0; wi < W.length; wi++) {
        const w = W[wi], dir = (this.rng() * 4) | 0;
        if (dir === 0) w.x++; else if (dir === 1) w.x--; else if (dir === 2) w.y++; else w.y--;
        budget--;
        const dx = w.x - 50, dy = w.y - 50, d2 = dx * dx + dy * dy;
        if (d2 > rK2) { W[wi] = this.spawnW(); continue; }
        const i = w.y * 100 + w.x;
        if (occ[i]) { W[wi] = this.spawnW(); continue; }
        if (occ[i - 1] || occ[i + 1] || occ[i - 100] || occ[i + 100]) {
          this.attach(w.x, w.y, Math.sqrt(d2));
          this.newest.push({ x: w.x, y: w.y, t: 0 });
          W[wi] = this.spawnW(); this.allow -= 1;
          const nk = Math.min(this.rMax * 2 + 10, 48); rK2 = nk * nk;
          if (this.allow < 1 || this.count >= this.N) break outer;
        }
      }
    }
    this.D = this.dim();
    return false;
  }
  result() { this.D = this.dim(); return Math.round(this.count * this.D * 10) / 10; }
  live() { return Math.round(this.count * this.dim() * 10) / 10; }
  encode() {
    let s = ''; const n = Math.min(this.count, 520);
    for (let i = 0; i < n * 2; i++) s += String.fromCharCode(this.pts[i]);
    try { return btoa(s); } catch (e) { return ''; }
  }
  draw(g) {
    g.fillStyle = '#04130f'; g.fillRect(0, 0, 200, 200);
    g.strokeStyle = 'rgba(63,242,207,.16)'; g.lineWidth = 1;
    g.beginPath(); g.arc(101, 101, 97, 0, TAU); g.stroke();
    if (this.count > 1) {
      g.setLineDash([2, 4]); g.strokeStyle = 'rgba(63,242,207,.28)';
      g.beginPath(); g.arc(101, 101, this.rMax * 2 + 2, 0, TAU); g.stroke(); g.setLineDash([]);
    }
    if (this.phase === 'run' && this.count < this.N) {
      g.fillStyle = 'rgba(160,255,235,.35)';
      for (const w of this.walk) g.fillRect(w.x * 2, w.y * 2, 2, 2);
    }
    const n = Math.min(this.count, 520), pts = this.pts;
    const dimmed = this.phase === 'idle' && !this.queue.length && this.k === 7;
    g.globalCompositeOperation = 'lighter';
    for (let b = 0; b < 8; b++) {
      const i0 = Math.floor(b * n / 8), i1 = Math.floor((b + 1) * n / 8);
      if (i1 <= i0) continue;
      g.fillStyle = 'hsla(' + ((this.hue + 140 * (b + 0.5) / 8) % 360) + ',90%,60%,' + (dimmed ? 0.1 : 0.2) + ')';
      g.beginPath(); for (let i = i0; i < i1; i++) g.rect(pts[i * 2] * 2 - 1.5, pts[i * 2 + 1] * 2 - 1.5, 5, 5); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
    for (let b = 0; b < 8; b++) {
      const i0 = Math.floor(b * n / 8), i1 = Math.floor((b + 1) * n / 8);
      if (i1 <= i0) continue;
      g.fillStyle = 'hsl(' + ((this.hue + 140 * (b + 0.5) / 8) % 360) + ',90%,66%)';
      g.beginPath(); for (let i = i0; i < i1; i++) g.rect(pts[i * 2] * 2, pts[i * 2 + 1] * 2, 2, 2); g.fill();
    }
    for (const q of this.newest) { g.fillStyle = 'rgba(255,255,255,' + (1 - q.t / 0.4) + ')'; g.fillRect(q.x * 2 - 1, q.y * 2 - 1, 4, 4); }
    g.fillStyle = '#ffffff'; g.fillRect(100, 100, 2, 2);
  }
  hud(g, cw, ch, m) {
    if (!this.lot) return;
    const fs = this.hudFont(m);
    tag(g, 6, 6, '입자 ' + this.count + '/' + this.N, '#b8fff0', 'left', fs);
    tag(g, cw - 6, 6, 'D ' + this.dim().toFixed(2), '#3ff2cf', 'right', fs);
  }
}

/* 지그재그 배치: 2·4·8열 중 화면이 가장 크게 나오는 쪽, 홀수 줄은 오른쪽→왼쪽 */
function layout() {
  layoutQ = false;
  const r = grid.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  const gap = r.width < 600 ? 12 : 16;
  let best = 2, bs = -1;
  [2, 4, 8].forEach(c => {
    const rows = 8 / c, pw = (r.width - gap * (c - 1)) / c - 10, ph = (r.height - gap * (rows - 1)) / rows - 46;
    const sc = Math.min(pw, ph);
    if (sc > bs + 0.5) { bs = sc; best = c; }

  const rows = 8 / best;
  grid.style.gridGap = gap + 'px'; grid.style.gap = gap + 'px';
  grid.style.gridTemplateColumns = 'repeat(' + best + ',minmax(0,1fr))';
  grid.style.gridTemplateRows = 'repeat(' + rows + ',minmax(0,1fr))';
  stages.forEach((s, k) => {
    const row = Math.floor(k / best); let col = k % best;
    if (row % 2) col = best - 1 - col;
    s.el.style.gridRow = String(row + 1); s.el.style.gridColumn = String(col + 1);
  });
  measureAll(); drawBelts(); Mark.size();
  let nameW = 0;
  for (const s of stages) nameW = Math.max(nameW, s.el.querySelector('.nm').scrollWidth);
  const pw = stages[0].el.getBoundingClientRect().width;

}
function queueLayout() { if (!layoutQ) { layoutQ = true; requestAnimationFrame(layout); } }
function measureAll() { for (const s of stages) { const b = s.scr.getBoundingClientRect(); s.resize(b.width, b.height); } }

function drawBelts() {
  if (focusK >= 0) { belts.innerHTML = ''; return; }
  const gr = grid.getBoundingClientRect();
  let out = '';
  for (let k = 0; k < 7; k++) {
    const a = stages[k].el.getBoundingClientRect(), b = stages[k + 1].el.getBoundingClientRect();
    if (a.width < 2 || b.width < 2) continue;
    let x, y, w, h, dir;
    if (Math.abs(a.top - b.top) < 4) {
      const ltr = a.left < b.left, x1 = ltr ? a.right : b.right, x2 = ltr ? b.left : a.left;
      x = x1 - gr.left - 6; w = x2 - x1 + 12; h = 12; y = a.top - gr.top + a.height / 2 - 6; dir = ltr ? 0 : 2;
    } else {
      y = a.bottom - gr.top - 4; h = b.top - a.bottom + 8; w = 12; x = a.left - gr.left + a.width / 2 - 6; dir = 1;
    }
    const cx = x + w / 2, cy = y + h / 2;
    const d = dir === 0 ? 'M' + (cx - 2.5) + ',' + (cy - 3.5) + 'L' + (cx + 2.5) + ',' + cy + 'L' + (cx - 2.5) + ',' + (cy + 3.5) + 'Z'
      : dir === 2 ? 'M' + (cx + 2.5) + ',' + (cy - 3.5) + 'L' + (cx - 2.5) + ',' + cy + 'L' + (cx + 2.5) + ',' + (cy + 3.5) + 'Z'
      : 'M' + (cx - 3.5) + ',' + (cy - 2.5) + 'L' + cx + ',' + (cy + 2.5) + 'L' + (cx + 3.5) + ',' + (cy - 2.5) + 'Z';
    out += '<g class="belt" data-k="' + k + '" style="--c:' + DEFS[k].acc + '"><rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) +
      '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4"/><path d="' + d + '"/></g>';
  }

function beltOn(k) {

function setFocus(k) {

/* ───────── 단계 사이를 흐르는 값 표 ───────── */
function flyToken(fromEl, toEl, text, color, delay) {
  if (REDUCED || document.hidden || !document.body.animate) return;
  if (delay) { setTimeout(() => flyToken(fromEl, toEl, text, color, 0), delay / speed); return; }
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  if (a.width < 2 || b.width < 2) return;
  const t = document.createElement('div');
  t.className = 'token'; t.textContent = text; t.style.setProperty('--c', color);
  document.body.appendChild(t);
  const tw = t.offsetWidth, th = t.offsetHeight;
  const x0 = a.left + a.width / 2 - tw / 2, y0 = a.top + a.height * 0.74 - th / 2;
  const x1 = b.left + b.width / 2 - tw / 2, y1 = b.top + b.height / 2 - th / 2;
  const T = (x, y, s) => 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + s + ')';
  const dur = 1100 / Math.sqrt(speed);
  const done = () => { if (t.parentNode) t.parentNode.removeChild(t); };
  try {
    const an = t.animate([
      { transform: T(x0, y0, 0.6), opacity: 0 },
      { transform: T(x0, y0, 1.05), opacity: 1, offset: 0.18 },
      { transform: T(x1, y1, 1), opacity: 1, offset: 0.85 },
      { transform: T(x1, y1, 0.7), opacity: 0 },
    ], { duration: dur, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' });
    an.onfinish = done; an.oncancel = done;
  } catch (e) { done(); return; }
  setTimeout(done, dur + 500);
}

/* ───────── 도트 워드마크 ───────── */
const GLYPH = {
  O: ['01110', '10001', '10001', '10001', '10001', '10001', '01110'],
  C: ['01110', '10001', '10000', '10000', '10000', '10001', '01110'],
  T: ['11111', '00100', '00100', '00100', '00100', '00100', '00100'],
  A: ['01110', '10001', '10001', '11111', '10001', '10001', '10001'],
  S: ['01111', '10000', '10000', '01110', '00001', '00001', '11110'],
  D: ['11110', '10001', '10001', '10001', '10001', '10001', '11110'],
  E: ['11111', '10000', '10000', '11110', '10000', '10000', '11111'],
  ' ': ['00000', '00000', '00000', '00000', '00000', '00000', '00000'],
};
const Mark = {
  cv: $('mark'), dots: [], cols: 1, rip: -1, pitch: 2.4,
  init() {

      for (let y = 0; y < 7; y++) for (let x = 0; x < 5; x++) this.dots.push({ x: cx + x, y, on: gl[y].charAt(x) === '1' });

    if (p === this.pitch && this.cv.width) { this.draw(); return; }

    const w = this.cols * p, h = 7 * p;
    this.cv.style.width = w + 'px'; this.cv.style.height = h + 'px';
    this.cv.width = Math.round(w * DPR); this.cv.height = Math.round(h * DPR);
    this.draw();
  },
  pulse() { if (!REDUCED) this.rip = 0; },
  tick(dt) {
    if (this.rip < 0) return;

    if (this.rip > this.cols + 6) this.rip = -1;
    this.draw();
  },
  draw() {
    const g = this.cv.getContext('2d'); if (!g) return;
    const p = this.pitch, cs = getComputedStyle(document.documentElement);
    const off = (cs.getPropertyValue('--line') || '').trim() || '#365045';
    const ink = (cs.getPropertyValue('--ink') || '').trim() || '#e6efe7';
    const bg = (cs.getPropertyValue('--bg') || '').trim();
    const light = bg && parseInt(bg.slice(1, 3), 16) > 128;
    g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, this.cols * p + 2, 7 * p + 2);
    for (const d of this.dots) {
      let col, r = p * 0.27;
      if (d.on) {
        const acc = DEFS[Math.min(7, Math.floor(d.x / this.cols * 8))].acc;
        col = light ? shade(acc, 0.55) : acc; r = p * 0.43;
        if (this.rip >= 0 && Math.abs(d.x - this.rip) < 2.5) col = ink;
      } else col = off;
      g.globalAlpha = d.on ? 1 : light ? 0.4 : 0.6;
      g.fillStyle = col; g.beginPath(); g.arc(d.x * p + p / 2, d.y * p + p / 2, r, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
  },
};

/* ───────── 조작 ───────── */
const ICON_PAUSE = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="3" y="2" width="3.6" height="12" rx="1"/><rect x="9.4" y="2" width="3.6" height="12" rx="1"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4.5 2.4v11.2a.8.8 0 0 0 1.2.7l8.8-5.6a.8.8 0 0 0 0-1.4L5.7 1.7a.8.8 0 0 0-1.2.7z"/></svg>';
function syncCtrl() {
  bPause.innerHTML = paused ? ICON_PLAY : ICON_PAUSE;
  bPause.setAttribute('aria-label', paused ? '다시 시작' : '일시정지');
  bPause.title = (paused ? '다시 시작' : '일시정지') + ' (Space)';
  bPause.classList.toggle('on', paused);
  bSpeed.textContent = speed + '×';
  bSpeed.setAttribute('aria-label', '배속 ' + speed + '배');
  uiAcc = 1;
}
bPause.addEventListener('click', () => { paused = !paused; syncCtrl(); });
bSpeed.addEventListener('click', () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; Store.set(LS_SPEED, String(speed)); syncCtrl(); });

/* ───────── 샘플 기록 창 ───────── */
let shown = 60, clearArm = false, lastFocus = null;
const pad2 = n => (n < 10 ? '0' : '') + n;
function timeStr(t) { const d = new Date(t); return pad2(d.getMonth() + 1) + '.' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function timeFull(t) { const d = new Date(t); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }
function openModal() {
  lastFocus = document.activeElement; shown = 60;
  modal.hidden = false; renderModal(true); mClose.focus();
}
function closeModal() {
  modal.hidden = true; disarm();
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
bSamples.addEventListener('click', openModal);
mClose.addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

function el(tagName, cls, text) {
  const e = document.createElement(tagName);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function statBox(label, value) {
  const d = el('div', 'stat'); d.appendChild(el('span', null, label)); d.appendChild(el('b', null, value)); return d;
}
function drawThumb(cv, r) {
  const g = cv.getContext('2d'); if (!g) return;
  const W = cv.width, H = cv.height;
  g.fillStyle = '#03100d'; g.fillRect(0, 0, W, H);
  let bytes = '';
  try { bytes = r.p ? atob(r.p) : ''; } catch (e) { bytes = ''; }
  const n = bytes.length >> 1;
  if (!n) { g.fillStyle = 'hsl(' + (r.h || 160) + ',80%,60%)'; g.beginPath(); g.arc(W / 2, H / 2, W * 0.12, 0, TAU); g.fill(); return; }
  const rad = Math.max(4, r.r || 20) + 1.5, sc = (W / 2 - 3) / rad, sz = Math.max(1.5, sc);
  for (let i = 0; i < n; i++) {
    const x = bytes.charCodeAt(i * 2) - 50, y = bytes.charCodeAt(i * 2 + 1) - 50;
    g.fillStyle = 'hsl(' + ((r.h || 160) + 140 * i / n) % 360 + ',88%,62%)';
    g.fillRect(W / 2 + x * sc - sz / 2, H / 2 + y * sc - sz / 2, sz, sz);
  }
}
function rowEl(r) {
  const row = el('div', 'row'), cv = document.createElement('canvas');
  cv.width = 96; cv.height = 96; drawThumb(cv, r);
  const t1 = el('div', 't1'); t1.appendChild(el('span', 'n', '#' + r.n)); t1.appendChild(el('span', 'v', fmt1(r.v)));
  const c = r.c || {};
  const S = '\u00a0';
  const chain = '코인' + S + fmt(c.coins) + ' › RP' + S + fmt(c.rp) + ' › MJ' + S + fmt(c.mj) + ' › 결정' + S + fmt(c.cr) +
    ' › 바이오' + S + fmt(c.bio) + ' › 별조각' + S + fmt(c.star) + ' › ' + fmt(c.line) + '점 › 입자' + S + fmt(r.N) + ',' + S + 'D' + S + (+r.D || 0).toFixed(2);
  row.appendChild(cv); row.appendChild(t1); row.appendChild(el('div', 'tm', timeStr(r.t))); row.appendChild(el('div', 'ch', chain));
  return row;
}
function drawChart() {
  const w = mChart.clientWidth || 300, h = mChart.clientHeight || 110;
  mChart.width = Math.round(w * DPR); mChart.height = Math.round(h * DPR);
  const g = mChart.getContext('2d'); if (!g) return;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#050807'; g.fillRect(0, 0, w, h);
  const L = Samples.list;
  g.font = '600 11px ' + SANS; g.textBaseline = 'middle';
  if (L.length < 2) {
    g.fillStyle = 'rgba(255,255,255,.5)'; g.textAlign = 'center';
    g.fillText(L.length ? '샘플이 2개 이상 모이면 추이가 그려져요' : '샘플값 추이', w / 2, h / 2);
    return;
  }
  let mn = Infinity, mx = -Infinity, sum = 0;
  for (const s of L) { if (s.v < mn) mn = s.v; if (s.v > mx) mx = s.v; sum += s.v; }
  const avg = sum / L.length, top = mx;
  if (mx - mn < 1e-9) { mx += 1; mn -= 1; }
  const pl = 8, pr = 8, pt = 20, pb = 10;
  const X = i => pl + (w - pl - pr) * i / (L.length - 1), Y = v => pt + (h - pt - pb) * (1 - (v - mn) / (mx - mn));
  g.strokeStyle = 'rgba(255,211,107,.55)'; g.lineWidth = 1; g.setLineDash([4, 4]);
  g.beginPath(); g.moveTo(pl, Y(avg)); g.lineTo(w - pr, Y(avg)); g.stroke(); g.setLineDash([]);
  g.beginPath(); g.moveTo(X(0), Y(L[0].v));
  for (let i = 1; i < L.length; i++) g.lineTo(X(i), Y(L[i].v));
  g.strokeStyle = '#3ff2cf'; g.lineWidth = 1.6; g.stroke();
  if (L.length <= 160) for (let i = 0; i < L.length; i++) {
    g.fillStyle = 'hsl(' + ((L[i].h || 160) % 360) + ',85%,62%)';
    g.beginPath(); g.arc(X(i), Y(L[i].v), 2.4, 0, TAU); g.fill();
  }
  g.fillStyle = 'rgba(255,255,255,.65)';
  g.textAlign = 'left'; g.fillText('최고 ' + fmt1(top), pl, 10);
  g.fillStyle = 'rgba(255,211,107,.9)'; g.textAlign = 'right'; g.fillText('평균 ' + fmt1(avg), w - pr, 10);
}
function renderModal(resetScroll) {
  const L = Samples.list, n = L.length, keep = mList.scrollTop;
  mStats.innerHTML = '';
  if (n) {
    let sum = 0, mx = L[0], mn = L[0];
    for (const s of L) { sum += s.v; if (s.v > mx.v) mx = s; if (s.v < mn.v) mn = s; }
    mStats.appendChild(statBox('개수', fmt(n)));
    mStats.appendChild(statBox('평균', fmt1(sum / n)));
    mStats.appendChild(statBox('최고 #' + mx.n, fmt1(mx.v)));
    mStats.appendChild(statBox('최저 #' + mn.n, fmt1(mn.v)));
  } else ['개수', '평균', '최고', '최저'].forEach((l, i) => mStats.appendChild(statBox(l, i ? '—' : '0')));
  drawChart();
  mList.innerHTML = '';
  if (!n) {
    const e = el('div', 'empty');
    e.appendChild(document.createTextNode('아직 샘플이 없어요.'));
    e.appendChild(document.createElement('br'));
    e.appendChild(document.createTextNode('LOT 1이 8단계를 모두 지나면 첫 샘플이 여기에 쌓여요.'));
    mList.appendChild(e);
  } else {
    const frag = document.createDocumentFragment(), upto = Math.min(n, shown);
    for (let i = n - 1; i >= n - upto; i--) frag.appendChild(rowEl(L[i]));
    mList.appendChild(frag);
    if (n > upto) {
      const b = el('button', 'btn more', '더 보기 (' + fmt(n - upto) + '개 남음)'); b.type = 'button';
      b.addEventListener('click', () => { shown += 60; renderModal(false); });
      mList.appendChild(b);
    }
  }
  mList.scrollTop = resetScroll ? 0 : keep;
  mCopy.disabled = !n; mClear.disabled = !n;
}
mCopy.addEventListener('click', () => {
  const head = ['번호', '샘플값', '시각', 'LOT', '코인', 'RP', 'MJ', '결정', '바이오', '별조각', '테트리스 점수', '입자 수', '프랙탈 차원', '시드'];
  const rows = Samples.list.map(r => {
    const c = r.c || {};
    return [r.n, r.v, timeFull(r.t), r.lot, c.coins, c.rp, c.mj, c.cr, c.bio, c.star, c.line, r.N, r.D, r.seed].join('\t');
  });
  const tsv = [head.join('\t')].concat(rows).join('\n');
  const fallback = () => {
    let ta = mList.querySelector('.copybox');
    if (!ta) { ta = document.createElement('textarea'); ta.className = 'copybox'; ta.readOnly = true; mList.insertBefore(ta, mList.firstChild); }
    ta.value = tsv; mList.scrollTop = 0; ta.focus(); ta.select();
    UI.toast('자동 복사가 막혀 있어요. 선택된 표를 직접 복사하세요');
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(tsv).then(() => UI.toast('샘플 ' + fmt(Samples.list.length) + '개를 표로 복사했어요'), fallback);
  } else fallback();
});
function disarm() { clearArm = false; clearTimeout(mClear._t); mClear.classList.remove('arm'); mClear.textContent = '기록 삭제'; }
mClear.addEventListener('click', () => {
  if (!Samples.list.length) return;
  if (!clearArm) {
    clearArm = true; mClear.classList.add('arm'); mClear.textContent = '한 번 더 누르면 삭제';
    clearTimeout(mClear._t); mClear._t = setTimeout(disarm, 3000);
    return;
  }
  disarm(); Samples.clear(); UI.toast('샘플 기록을 모두 지웠어요');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'Esc') {
    if (!modal.hidden) { e.preventDefault(); closeModal(); } else if (focusK >= 0) setFocus(-1);
    return;
  }
  if ((e.key === ' ' || e.key === 'Spacebar') && modal.hidden) {
    const t = e.target;
    if (t && t.closest && t.closest('button, .panel, textarea, input')) return;
    e.preventDefault(); paused = !paused; syncCtrl();
  }
});

/* ───────── 메인 루프 (고정 1/60초 스텝, 배속·자동 일시정지) ───────── */
const STEP = 1 / 60;
let accT = 0, last = 0, hidden = !!document.hidden;
document.addEventListener('visibilitychange', () => { hidden = !!document.hidden; accT = 0; last = performance.now(); });
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (!(dt >= 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  if (!paused && !hidden) {
    accT += dt * speed;
    let n = 0;
    while (accT >= STEP && n < 24) { for (let i = 0; i < 8; i++) stages[i].step(STEP); accT -= STEP; n++; }
    if (n >= 24) accT = 0;
  }
  if (!hidden) for (let i = 0; i < 8; i++) if (focusK < 0 || focusK === i) stages[i].render();
  uiTick(dt); Mark.tick(dt);
  requestAnimationFrame(frame);
}

Samples.init();
sCount.textContent = String(Samples.list.length);
Mark.init(); syncCtrl(); setFocus(-1); layout();
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)'), f = () => Mark.draw();
  if (mq.addEventListener) mq.addEventListener('change', f); else if (mq.addListener) mq.addListener(f);
}
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
if (QS.has('debug')) window.__octo = { stages, Samples, Pipe };
})();
</script>
