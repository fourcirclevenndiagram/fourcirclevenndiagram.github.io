.practice{background:#03050ce8}.practice>div{max-width:430px;margin-block:auto}.practice-top{display:flex;align-items:center;gap:10px;margin-bottom:13px}.practice-top h2{flex:1;text-align:left;font-size:25px;color:#a9ff68;text-shadow:0 0 15px #a9ff6870}.practice p{color:#8fa3c8;font-size:13px;text-align:left;margin-bottom:15px}.game-list{display:grid;gap:9px}.game-choice{display:flex;gap:12px;align-items:center;min-height:66px;text-align:left;padding:10px 14px;border:1px solid color-mix(in srgb,var(--gc) 42%,transparent);border-radius:7px;background:color-mix(in srgb,var(--gc) 6%,#05060c)}.game-choice .num{flex:none;font-size:22px;font-weight:900;color:var(--gc);width:32px;text-align:center;text-shadow:0 0 15px var(--gc)}.game-choice strong{font-size:15px;color:#e8f2ff}.game-choice small{display:block;font-size:11px;color:var(--gc);opacity:.8;margin-top:4px}.chev{margin-left:auto;color:var(--gc)}
.pause-screen{background:#03040bbc}.pause-screen .panel{border:0;background:none;box-shadow:none}.pause-screen .panel h2{font-size:34px;color:#00e5ff;text-shadow:0 0 20px #00e5ff88}.result-ui{position:absolute;top:77%;left:50%;transform:translateX(-50%);width:min(300px,78%)}.result-ui>.primary{font-size:20px;letter-spacing:1px;color:#ffd23c;border-color:#ffd23c;background:#ffd23c14;text-shadow:0 0 16px #ffd23c88;box-shadow:0 0 14px #ffd23c14}.result-ui .secondary{font-size:12px;min-height:40px;padding:8px;background:#05060c99;border-color:#3c466755;color:#8fa3c8}.result-screen{padding:0;pointer-events:none;overflow:hidden}.result-ui{pointer-events:auto}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(100%)}

@media(orientation:landscape) and (max-height:540px){.home .btnrow{top:85%;width:290px}.home .secondary{min-height:36px;padding:5px}.topbar{bottom:auto}.intro-actions{bottom:calc(var(--safe-bottom) + 20px);left:25%;width:190px}.intro-label{top:calc(var(--safe-top) + 85px);justify-content:flex-start}.intro-label small{display:none}.game-list{grid-template-columns:1fr 1fr;gap:8px}.practice>div{max-width:710px}.game-choice{min-height:55px;padding:7px 10px;gap:8px}.game-choice strong{font-size:13px}.game-choice small{font-size:10px}.practice-top{margin-bottom:8px}.practice p{margin-bottom:10px}.overlay{padding-top:calc(var(--safe-top) + 12px);padding-bottom:calc(var(--safe-bottom) + 12px)}.panel{padding:15px 20px}.panel h2{margin:7px 0;font-size:23px}.panel p{margin:8px 0 14px;font-size:13px}.result-ui{top:73%;width:min(285px,50%)}.result-ui>.primary{min-height:38px;padding:7px;font-size:18px}.result-ui .secondary{min-height:34px;font-size:11px;padding:6px}.btnrow{margin-top:7px}}

<div id="safeAreaProbe" aria-hidden="true" style="position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)"></div>
<main id="app" aria-label="미니게임 마라톤 8">
 <header class="topbar"><div class="mark" aria-hidden="true">8</div><div class="brand"><strong>MINI MARATHON</strong><small>이상한 고양이 운동회</small></div><button class="iconbtn" id="soundBtn" aria-label="소리 켜기" title="소리 켜기">♪</button><button class="iconbtn" id="pauseBtn" aria-label="일시정지" title="일시정지">Ⅱ</button></header>
 <div class="scorebar"><div class="pips" id="pips" aria-label="7종 진행"></div><span id="scoreLabel">BEST <b id="score">00000</b></span></div>
 <div class="gamehead"><div><div class="eyebrow" id="eyebrow">SEASON 08 · SEVEN GAMES</div><div class="gamename" id="gameName">이상한 규칙, 익숙한 냥이.</div></div><div class="timer" id="timer">7<small>GAMES</small></div></div>
 <div class="track"><div id="timeFill"></div></div>
 <section class="stage" id="stage" aria-label="게임 화면">
  <canvas id="canvas" tabindex="0" aria-label="손가락 또는 마우스로 조작하는 게임 화면">이 게임은 HTML Canvas를 지원하는 브라우저에서 실행할 수 있습니다.</canvas>
  <div class="overlay home" id="homeScreen"><div class="home-title"><div class="home-badge">THE ODD LITTLE CAT GAMES</div><h1>미니게임<br>마라톤 8</h1><p>일곱 가지 이상한 규칙을 달려봐.</p></div><div class="home-bottom"><button class="primary" id="startBtn">마라톤 시작 &nbsp; →</button><div class="btnrow"><button class="secondary" id="practiceBtn">종목별 연습</button><button class="secondary" id="guideBtn">어떻게 하나요?</button></div><div class="best">7종 랜덤 순서 · 약 3분 · 최고 <b id="homeBest">0</b>점</div></div></div>
  <div class="intro-label" id="introLabel" hidden><span class="pill">움직이는 시범</span><small id="introTip">손 모양을 따라 봐.</small></div><div class="intro-actions" id="introActions" hidden><button class="primary" id="skipDemo">직접 해보기 →</button></div>
  <div class="overlay" id="modal" hidden></div><div class="countdown" id="countdown" hidden>3</div><div class="toast" id="toast" role="status" aria-live="polite"></div>
 </section>

<script>
'use strict';
/* MINI MARATHON 8 — self-contained, deterministic-time game engine. */
const $=s=>document.getElementById(s),cv=$('canvas'),ctx=cv.getContext('2d');
const VW=440,VH=500,TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const PALETTE=['#a9ff68','#62f4ff','#c58cff','#ffb347','#53e6b5','#ff668f','#7ca7ff'];
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let pixelRatio=1,view={scale:1,x:0,y:0,w:440,h:500},clock=0,fx=[],lastFrame=0,toastLeft=0;
let audioCtx=null,soundOn=false,saved={best:0,seen:[],sound:false};
try{const s=JSON.parse(localStorage.getItem('mini_marathon_8_v1')||'null');if(s&&typeof s==='object'){saved.best=Number.isFinite(s.best)?Math.max(0,s.best):0;saved.seen=Array.isArray(s.seen)?s.seen:[];saved.sound=!!s.sound;}}catch(e){}
soundOn=saved.sound;
function save(){try{localStorage.setItem('mini_marathon_8_v1',JSON.stringify(saved));}catch(e){}}
function audioUnlock(){if(!soundOn)return;try{if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A();}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});}catch(e){}}
function tone(f=650,d=.09,type='sine',volume=.07){if(!soundOn||!audioCtx||session.phase==='intro')return;try{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}
function chime(good=true){tone(good?660:200,.1,'triangle');if(good)tone(990,.18,'sine',.04);}
function updateSound(){const b=$('soundBtn');b.classList.toggle('off',!soundOn);b.textContent=soundOn?'♪':'♪̸';b.setAttribute('aria-label',soundOn?'소리 끄기':'소리 켜기');b.title=soundOn?'소리 끄기':'소리 켜기';}
function rr(x,y,w,h,r=12,fill,stroke,lw=1.5){ctx.beginPath();const k=Math.max(0,Math.min(r,w/2,h/2));ctx.moveTo(x+k,y);ctx.arcTo(x+w,y,x+w,y+h,k);ctx.arcTo(x+w,y+h,x,y+h,k);ctx.arcTo(x,y+h,x,y,k);ctx.arcTo(x,y,x+w,y,k);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function circle(x,y,r,fill,stroke,lw=2){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function line(x,y,x2,y2,col='#7088a6',lw=2,dash=[]){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);}
function text(s,x,y,size=16,col='#eaf1f7',align='center',weight=700){ctx.font=weight+' '+size+'px system-ui,-apple-system,sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(s,x,y);}
function ellipse(x,y,rx,ry,col){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill();}
function arrow(x,y,angle,col='#eefa8d',len=33){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.lineCap='round';line(-len/2,0,len/2,0,col,4);line(len/2-9,-8,len/2,0,col,4);line(len/2-9,8,len/2,0,col,4);ctx.restore();}
function cat(x,y,size=38,col="#e8a35d",action="idle",flip=false){
  const s=size*1.6,pose=action==="paw"?2:action==="walk"?1:action==="sneeze"?3:0;
  ctx.save();ctx.translate(x,y);ctx.scale(flip?-1:1,1);
  const bob=Math.sin(clock*5)*s*0.02;
  ctx.translate(0,bob);
  ctx.strokeStyle='#120d18';ctx.fillStyle=col;ctx.lineWidth=Math.max(2,s*0.06);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.ellipse(0,0,s*0.35,s*0.28,0,0,TAU);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(0,-s*0.30,s*0.26,0,TAU);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-s*0.20,-s*0.46);ctx.lineTo(-s*0.12,-s*0.72);ctx.lineTo(0,-s*0.50);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(s*0.20,-s*0.46);ctx.lineTo(s*0.12,-s*0.72);ctx.lineTo(0,-s*0.50);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#160f1d';
  ctx.beginPath();ctx.arc(-s*0.09,-s*0.32,s*0.035,0,TAU);ctx.arc(s*0.09,-s*0.32,s*0.035,0,TAU);ctx.fill();
  if(pose===1){ctx.beginPath();ctx.moveTo(-s*0.24,-s*0.02);ctx.lineTo(-s*0.48,-s*0.30);ctx.stroke();}
  if(pose===2){ctx.beginPath();ctx.moveTo(s*0.24,-s*0.02);ctx.lineTo(s*0.48,-s*0.30);ctx.stroke();}
  if(pose===3){ctx.rotate(-0.12);}
  ctx.beginPath();ctx.moveTo(s*0.30,0);ctx.quadraticCurveTo(s*0.62,-s*0.16,s*0.50,-s*0.45);ctx.stroke();
  ctx.restore();
}

function fish(x,y,s=20,col='#ffd58a'){ctx.save();ctx.translate(x,y);ctx.scale(s/20,s/20);ctx.fillStyle=col;ctx.strokeStyle='#534839';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(-22,-9);ctx.lineTo(-22,9);ctx.closePath();ctx.fill();ctx.stroke();ellipse(0,0,16,10,col);circle(7,-2,1.8,'#26333e');line(2,7,-3,2,'#a98252',1.5);ctx.restore();}
function cucumber(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.rotate(-.3);rr(-9*s,-22*s,18*s,44*s,9*s,'#85c581','#345c53',2);for(let i=0;i<4;i++)circle((i%2?3:-3)*s,(-12+i*8)*s,1.4*s,'#4e8563');ctx.restore();}
function milk(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);rr(-14,-20,28,39,4,'#e9f3f2','#7da1be',2);rr(-14,-12,28,12,2,'#9cccdf');text('M',0,8,13,'#45708c');ctx.restore();}
function cushion(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);rr(-23,-14,46,28,9,'#b9a0f2','#655c94',2);rr(-17,-9,34,18,6,null,'#e7d9ff',1);ctx.restore();}
function itemIcon(type,x,y,s=1){if(type===0)fish(x,y,20*s);else if(type===1)milk(x,y,.85*s);else cushion(x,y,s);}
function paw(x,y,s=1,col='#fff3df',alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.scale(s,s);rr(-17,3,34,33,14,col,'#3e4758',2);for(let i=0;i<4;i++)ellipse(-14+i*9,-2-Math.sin(i/3*Math.PI)*6,5.8,8,col);ellipse(0,18,9,7,'#eca6b4');ctx.restore();}
function robot(x,y){ellipse(x,y+16,27,6,'#11203355');ellipse(x,y,26,20,'#8aa4bc');ellipse(x,y-3,22,16,'#bfd0df');line(x-17,y+2,x+17,y+2,'#70899f',2);circle(x,y-7,5,'#698299');circle(x+11,y-3,2,'#ffa4b7');}
function hand(x,y,press=false){ctx.save();ctx.globalAlpha=.9;circle(x,y,press?15:12,'#ffffff2c','#fff',2);circle(x,y,4,'#fff');if(press){circle(x,y,23+Math.sin(clock*7)*3,null,'#ffffff55',1);}line(x+9,y+10,x+23,y+29,'#fff',5);ctx.restore();}
function spark(x,y,col=PALETTE[0],n=15){if(reduced)n=5;for(let i=0;i<n;i++){let a=rand(0,TAU),v=rand(30,160);fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.3,.7),max:.7,col,r:rand(2,5)});}if(fx.length>160)fx.splice(0,fx.length-160);}
function toast(s){if(session.phase==='intro')return;$('toast').textContent=s;$('toast').classList.add('show');toastLeft=1.35;}
function badge(s,x,y,col='#a9ff68'){ctx.save();ctx.shadowColor=col;ctx.shadowBlur=9;text(s,x,y,15,col);ctx.restore();}
function background(col='#7d6cff'){legacyBG(col,VW,VH);}
const META=[
 {name:'접어버려! 골목길',short:'접는 골목',en:'FOLD THE ALLEY',rule:'손잡이를 왼쪽으로 밀어 길을 접어!',sub:'고양이가 건널 때까지 접은 채로 유지',gesture:'↤',time:18,target:3},

function intro(force=true){cancelInput();const id=session.order[session.index];session.game=createGame(id,true);session.time=0;fx=[];setPhase('intro');const m=META[id];$('eyebrow').textContent=(session.practice?'PRACTICE':String(session.index+1).padStart(2,'0')+' / 07')+' · '+m.en;$('gameName').textContent=m.name;$('instruction').textContent=m.rule;$('detail').textContent=m.sub;$('gesture').textContent=m.gesture;$('counter').textContent='0 / '+m.target;$('introTip').textContent='시범 뒤에 시간이 시작돼.';$('introLabel').style.visibility='hidden';$('introActions').style.visibility='hidden';$('timer').innerHTML='DEMO<small>시범</small>';$('timer').style.fontSize='20px';$('timer').classList.remove('urgent');$('timeFill').style.width='100%';document.documentElement.style.setProperty('--accent',PALETTE[id]);renderPips();}
function beginCount(){cancelInput();$('introLabel').style.visibility='visible';$('introActions').style.visibility='visible';const id=session.order[session.index];session.game=createGame(id,false);session.time=0;setPhase('count');$('countdown').textContent='3';$('timer').style.fontSize='';$('timer').innerHTML=META[id].time.toFixed(1)+'<small>SECONDS</small>';if(!saved.seen.includes(id)){saved.seen.push(id);save();}tone(480,.07);}
function beginPlay(){setPhase('play');audioUnlock();cv.focus({preventScroll:true});}
function finish(win){if(session.phase!=='play'||session.game.demo)return;cancelInput();const g=session.game,m=g.meta;const remain=Math.max(0,m.time-session.time);session.streak=win?session.streak+1:0;let mult=1+.5*Math.min(Math.max(session.streak-1,0),4);let accuracy=clamp(50-g.mistakes*8,0,50);let points=win?Math.round((100+100*remain/m.time+accuracy)*mult):0;session.score+=points;const r={id:g.id,win,points,hits:g.hits,target:m.target,mistakes:g.mistakes,mult};session.results.push(r);session.last=r;setPhase('judge');$('score').textContent=String(session.score).padStart(6,'0');renderPips();$('counter').textContent=g.hits+' / '+m.target;let panel=document.createElement('div');panel.className='panel';panel.innerHTML='<div class="judge-symbol">'+(win?'✦':'↻')+'</div><div class="eyebrow">'+(win?'NICE LITTLE VICTORY':'NEXT TIME, LITTLE CAT')+'</div><h2>'+(win?'성공!':'조금 아쉬워!')+'</h2><p>'+(win?'+'+points+'점'+(mult>1?' · 연승 ×'+mult.toFixed(1):''):g.hits+' / '+m.target+' 완료 · 다음에는 할 수 있어.')+'</p>';$('modal').replaceChildren(panel);$('modal').hidden=false;if(win){spark(220,240,PALETTE[g.id],45);tone(784,.25);}else tone(160,.2,'triangle');}
function advance(){session.index++;if(session.index>=session.order.length)results();else intro();}
function results(){setPhase('result');session.newBest=false;if(!session.practice&&session.score>saved.best){saved.best=session.score;session.newBest=true;save();}const actions=document.createElement('div');actions.className='result-ui';const r=session.results[0];addButton(actions,session.practice?'RETRY PRACTICE':'RETRY',()=>startRun(session.practice?r.id:null),'primary');const row=document.createElement('div');row.className='btnrow';addButton(row,'종목별 연습',practiceMenu);addButton(row,'처음으로',home);actions.append(row);showModal(actions,'result-screen');$('pauseBtn').disabled=true;}

function addButton(parent,label,fn,cls='secondary'){let b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=fn;parent.append(b);return b;}
function showModal(content,cls=''){const m=$('modal');m.className='overlay '+cls;m.replaceChildren(content);m.hidden=false;setTimeout(()=>{const b=m.querySelector('button');if(b)b.focus({preventScroll:true});},10);}
function practiceMenu(){home();setPhase('menu');const root=document.createElement('div');root.style.width='100%';root.innerHTML='<div class="practice-top"><h2>종목별 연습</h2></div><p>움직이는 시범을 보고, 하나씩 익혀봐.</p>';addButton(root.firstElementChild,'닫기',home,'iconbtn');let list=document.createElement('div');list.className='game-list';META.forEach((m,i)=>{let b=document.createElement('button');b.className='game-choice';b.style.setProperty('--gc',PALETTE[i]);b.innerHTML='<span class="num">'+(i+1)+'</span><span><strong>'+m.short+'</strong><small>'+m.en+'</small></span><span class="chev">›</span>';b.onclick=()=>startRun(i);list.append(b);});root.append(list);showModal(root,'practice');}
function guide(){const panel=document.createElement('div');panel.className='panel';panel.innerHTML='<span class="pill">HOW TO MARATHON</span><h2>일곱 번의 작은 도전</h2><p>7종을 무작위 순서로 달려.<br>각 게임의 시범을 보고, 목표 수만큼 성공하면 돼.</p><p>실수해도 시간이 남으면 다시 시도해.<br>성공하면 점수, 빨리 끝내면 추가 점수!<br>연속 성공 배율은 최대 3배야.</p><p>손가락 하나 또는 마우스로 조작해.<br>화면을 벗어나면 자동으로 일시정지돼.</p>';addButton(panel,'알겠어!',home,'primary');setPhase('guide');showModal(panel);}

function resume(){session.paused=false;$('modal').hidden=true;if(session.game){session.game.safety=1.2;if([0,4].includes(session.game.id)&&session.phase==='play')toast('다시 잡을 시간!');}lastFrame=performance.now();audioUnlock();cv.focus({preventScroll:true});}
function cancelInput(){if(session.game)session.game.cancel();if(activePointer!==null){const id=activePointer;activePointer=null;try{cv.releasePointerCapture(id);}catch(e){}}}
function position(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-view.x)/view.scale,y:(e.clientY-r.top-view.y)/view.scale};}
cv.addEventListener('pointerdown',e=>{if(session.phase!=='play'||session.paused||activePointer!==null)return;e.preventDefault();const p=position(e);if(p.x<0||p.x>VW||p.y<0||p.y>VH)return;audioUnlock();activePointer=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(e){}session.game.down(p);});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==activePointer||session.phase!=='play'||session.paused)return;e.preventDefault();session.game.move(position(e));});
cv.addEventListener('pointerup',e=>{if(e.pointerId!==activePointer)return;e.preventDefault();if(session.phase==='play'&&!session.paused)session.game.up(position(e));cancelInput();});
cv.addEventListener('pointercancel',e=>{if(e.pointerId===activePointer){pause();cancelInput();}});cv.addEventListener('lostpointercapture',e=>{if(e.pointerId===activePointer){pause();cancelInput();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});window.addEventListener('blur',()=>pause());window.addEventListener('orientationchange',()=>{pause();setTimeout(resize,120);});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(session.paused)resume();else if(['play','intro','count'].includes(session.phase))pause();else home();}if(session.phase==='play'&&!session.paused&&session.game.id===1&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();session.game.inputX=clamp(session.game.inputX+(e.key==='ArrowRight'?90:-90),55,385);}});

function draw(){ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);const W=view.w,H=view.h,phase=session.phase,g=session.game;ctx.clearRect(0,0,W,H);if(phase==='result')legacyResult();else if(['home','menu','guide'].includes(phase)){titleDraw();}else{legacyBG(g?PALETTE[g.id]:'#7d6cff',W,H);if(phase==='intro'&&session.phaseTime<1.05)legacyIntro();else if(g){ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.scale,view.scale);ctx.beginPath();ctx.rect(0,0,VW,VH);ctx.clip();g.draw();ctx.restore();legacyHUD();if(phase==='play'||phase==='count'||phase==='intro')legacyFooter();if(phase==='judge')legacyJudge();}}
 if(g&&phase!=='home'&&phase!=='result'){ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.scale,view.scale);ctx.globalCompositeOperation='lighter';for(const p of fx){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.shadowColor=p.col;ctx.shadowBlur=12;circle(p.x,p.y,p.r,p.col);}ctx.restore();}
 ctx.save();ctx.fillStyle='rgba(255,255,255,.021)';for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);ctx.restore();legacyWipe();
}

function tick(dt){if(!session.paused){clock+=dt;session.phaseTime+=dt;if(session.phase==='intro'){const g=session.game;const demoOn=session.phaseTime>=1.05;$('introLabel').style.visibility=demoOn?'visible':'hidden';$('introActions').style.visibility=demoOn?'visible':'hidden';if(demoOn){g.auto(dt);g.step(dt);}if(session.phaseTime>=5.1)beginCount();}else if(session.phase==='count'){const n=3-Math.floor(session.phaseTime/.42);if(n<=0)beginPlay();else if($('countdown').textContent!==String(n)){$('countdown').textContent=n;tone(440+n*90,.07);}}else if(session.phase==='play'){const g=session.game;session.time+=dt;g.step(dt);if(session.phase==='play'&&session.time>=g.meta.time)finish(g.hits>=g.meta.target);const left=Math.max(0,g.meta.time-session.time);$('timer').innerHTML=left.toFixed(1)+'<small>SECONDS</small>';$('timer').classList.toggle('urgent',left<4);$('timeFill').style.width=(left/g.meta.time*100)+'%';$('timeFill').style.background=left<4?'#ff90af':PALETTE[g.id];$('counter').textContent=g.hits+' / '+g.meta.target;}else if(session.phase==='judge'&&session.phaseTime>1.6)advance();for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.life-=dt;if(p.life<=0){fx.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;}if(toastLeft>0){toastLeft-=dt;if(toastLeft<=0)$('toast').classList.remove('show');}}}
function frame(t){if(!lastFrame)lastFrame=t;const dt=clamp((t-lastFrame)/1000,0,.05);lastFrame=t;tick(dt);draw();requestAnimationFrame(frame);}
function syncViewport(){const v=window.visualViewport;if(!v||!v.scale||Math.abs(v.scale-1)<.02){document.documentElement.style.setProperty('--viewport-h',Math.max(100,v?v.height:window.innerHeight)+'px');}resize();}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe($('stage'));window.addEventListener('resize',syncViewport);if(window.visualViewport)window.visualViewport.addEventListener('resize',syncViewport);
/* A small local QA hook: the same production rules and pointer handlers. */
window.__MM8={meta:META,get session(){return session;},start:startRun,home,pause,resume,practice:practiceMenu,begin:beginCount,force(i){startRun(i);beginCount();beginPlay();},input(type,x,y){if(session.phase==='play'&&!session.paused)session.game[type]({x,y});},tick(dt){for(let t=0;t<dt;t+=1/60)tick(Math.min(1/60,dt-t));draw();},draw,resize,get view(){return view;}};
/* BOOT */
updateSound();home();syncViewport();requestAnimationFrame(frame);
</script>
