<body>
<div id="app">
  <header class="header">
    <div class="brand"><div class="emblem" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div><div class="eyebrow">FOUR FRONTS / AUTONOMOUS RTS</div><h1>사색의 전선</h1></div></div>

  <main class="battle-layout">
    <section class="arena" id="arena" aria-label="실시간 전장">
      <canvas id="battle" aria-label="80 곱하기 80 격자에서 네 팀이 자동으로 전투합니다. 지도 터치로 부대와 건물을 확인할 수 있습니다." tabindex="0"></canvas>
      <div class="map-label">LIVE TACTICAL MAP<span id="seedLabel"></span></div>
      <div class="map-tools"><button class="icon-btn" id="zoomOut" aria-label="지도 축소" title="축소">−</button><button class="icon-btn" id="zoomIn" aria-label="지도 확대" title="확대">+</button><button class="icon-btn" id="fitBtn" aria-label="전체 지도" title="전체 지도"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg></button></div>
      <div class="inspect" id="inspect" hidden></div><div class="map-notice" id="mapNotice" hidden></div>
    </section>
    <aside class="aside">
      <div class="aside-heading"><span>FACTION OVERVIEW</span><span id="armyTotal">총 0기</span></div>
      <div class="territory-meter" aria-label="팀별 영토 점유율" id="territoryMeter"></div>
      <div class="team-cards" id="teamCards"></div>
      <div class="war-log"><div class="log-title"><span>FIELD REPORT</span><button class="text-btn" id="logBtn">전체 기록 ↗</button></div><div class="log-items" id="logItems"></div></div>
      <div class="legend"><span>■ 보병</span><span>▲ 궁병</span><span>◆ 기병</span><span>▣ 타워</span></div>
    </aside>

function generateMap(){

function flood(gx,gy){

function rebuildHash(){for(const b of hash)b.length=0;for(const u of units)if(u.alive){const x=clamp((u.x/5)|0,0,15),y=clamp((u.y/5)|0,0,15);hash[y*16+x].push(u);}}

function thinkAI(){
 for(const t of teams){if(!t.alive)continue;if(t.rally&&time>t.rally.until)t.rally=null;

function enemyTarget(u){

function showHelp(){
 openModal('help',modalHeader('FIELD MANUAL / 001','전선을 읽는 방법')+`
 <p>빨강·파랑·노랑·초록 네 진영이 <b>완전 자동</b>으로 전투합니다. 병력을 생산하고, 땅과 타워를 확보한 뒤, 적 본진을 모두 무너뜨린 <b>마지막 한 팀</b>이 승리합니다. 시간제한은 없습니다.</p>
 <div class="rules-grid"><div class="rule-card"><span class="symbol">■</span><b>보병</b><p>튼튼한 전선의 중심.<br>기병에게 피해 ×1.55.<br>건물 공격 ×1.2.</p></div><div class="rule-card"><span class="symbol">▲</span><b>궁병</b><p>7.5칸 원거리 지원.<br>보병에게 피해 ×1.35.<br>근접 적을 피해 후퇴.</p></div><div class="rule-card"><span class="symbol">◆</span><b>기병</b><p>빠른 점령과 우회.<br>궁병에게 피해 ×1.6.<br>달린 뒤 첫 공격은 돌격.</p></div></div>
 <table class="rules-table"><thead><tr><th>병종</th><th>체력</th><th>공격력</th><th>이동/초</th><th>비용</th></tr></thead><tbody><tr><td>■ 보병</td><td>110</td><td>14</td><td>2.35칸</td><td>22 G</td></tr><tr><td>▲ 궁병</td><td>66</td><td>11</td><td>2.0칸</td><td>28 G</td></tr><tr><td>◆ 기병</td><td>150</td><td>18</td><td>3.5칸</td><td>38 G</td></tr></tbody></table>
 <h3>23개 타워 · 빼앗고, 지키고, 다시 빼앗기</h3><p>처음에는 모두 중립이며 체력은 <b>340</b>입니다. 체력을 0으로 만든 <b>마지막 공격 팀</b>이 점령합니다. 점령 직후 체력이 65%로 회복되고 2초간 보호됩니다. 점령된 타워는 <b>1.9초마다 피해 7의 총알</b>을 사거리 8.5칸 안의 적에게 발사합니다. 중립 상태에서는 사격하지 않습니다.</p>
 <h3>땅이 곧 생산력</h3><p>부대가 지나간 칸을 점령합니다. 본진과 점령한 타워도 주변 땅을 확보하고, 타워 영토는 최대 반경 7.4칸까지 서서히 넓어집니다. 영토와 타워가 많을수록 자원 수입이 늘어납니다. 수입은 초당 <b>5.6 + 영토 칸 수 × 0.0048 + 타워 수 × 1.55 G</b>. 생산은 자동이며 진영당 최대 병력은 <b>76기</b>입니다.</p>
 <h3>지형과 본진</h3><p>물과 바위는 통과할 수 없습니다. 강은 다리나 중앙 섬을 통해 건너며, 숲에서는 이동이 느려집니다. 본진 체력은 <b>2,400</b>, 방어 사격은 1.15초마다 피해 12입니다. 본진이 무너지면 해당 진영은 탈락하고 잔여 병력·영토는 사라지며 타워는 중립으로 돌아갑니다. 모든 진영의 능력치는 같습니다.</p>
 <h3>관전 중 살짝 개입하기</h3><p><b>진영 카드 → 깃발 버튼 → 지도 터치</b>로 집결 명령을 내립니다. 해당 진영의 4개 분대 중 2개 분대가 <b>25초</b> 동안 지정 지점으로 이동하며 주변 적과 싸웁니다. 나머지는 AI 판단을 유지합니다. 지도를 누르면 유닛·타워·본진 정보를 볼 수 있습니다. 확대 후에는 드래그로 이동하며, 두 손가락 확대·축소도 가능합니다.</p>
 <h3>경기 흐름과 결과</h3><p>초반에는 여러 타워로 분산해 확장하고, 중반부터 적 본진을 공략합니다. 5분을 넘기면 교착을 줄이기 위해 <b>병력 공격력</b>이 서서히 증가합니다. 승리 화면에는 순위·최대 영토·처치·타워 점령 횟수·영토 추이를 표시합니다. 자동 다음 판은 기본으로 켜져 있으며 결과 화면에서 끌 수 있습니다.</p>
 <p class="note">점수 = 최대 영토 칸 × 2 + 처치 × 12 + 타워 점령 횟수 × 100 + 본진 격파 × 700 + 생존 보너스 1,800. 최종 순위는 우승 팀 우선, 이후 점수 순입니다.<br>Space: 재생/정지 · 1/2/4: 배속 · Esc: 창 닫기/명령 취소 · 오프라인 실행 · 숨겨진 탭에서는 자동 정지.</p>
 <div class="modal-actions"><button class="ctrl-btn primary" id="helpClose">전장으로 돌아가기</button></div>`);

 try{if(kind==='shot')play(155,now,.045,.012,'triangle');else if(kind==='capture'){play(660,now,.13,.045);play(880,now+.10,.20,.035);}else if(kind==='base'){play(85,now,.4,.07,'triangle');play(63,now+.14,.6,.05,'triangle');}else if(kind==='win'){[523,659,784,1046].forEach((f,i)=>play(f,now+i*.13,.4,.04));}}catch(_){}
}
function updateSound(){const s=soundOn;$('soundBtn').innerHTML=`<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 7h3l4-3v12l-4-3H3z"/>${s?'<path d="M13 6c3 2 3 6 0 8m2-11c5 4 5 10 0 14"/>':'<path d="M13 7l5 6m0-6l-5 6"/>'}</svg>`;$('soundBtn').setAttribute('aria-pressed',String(s));$('soundBtn').setAttribute('aria-label',s?'소리 끄기':'소리 켜기');$('soundBtn').title=s?'효과음 끄기':'효과음 켜기';}
function worldPoint(clientX,clientY){const r=canvas.getBoundingClientRect(),vx=(clientX-r.left)/r.width*88,vy=(clientY-r.top)/r.height*88;return{x:(vx-44)/cam.zoom+cam.x,y:(vy-44)/cam.zoom+cam.y,vx,vy};}
function zoomTo(z,anchor=null){const before=anchor?worldPoint(anchor.x,anchor.y):null;cam.zoom=clamp(z,1,3.5);if(before){const after=worldPoint(anchor.x,anchor.y);cam.x+=before.x-after.x;cam.y+=before.y-after.y;}clampCamera();updateCommand();}
function clampCamera(){const h=40/cam.zoom;cam.x=clamp(cam.x,h,80-h);cam.y=clamp(cam.y,h,80-h);}
function mapTap(clientX,clientY){
 const p=worldPoint(clientX,clientY);if(p.vx<4||p.vx>84||p.vy<4||p.vy>84||!valid(p.x,p.y))return;
 if(commandMode&&selectedTeam>=0&&!gameOver){if(!walkable(p.x,p.y)){showToast('물과 바위가 아닌 이동 가능한 땅을 선택해 주세요.');return;}const t=teams[selectedTeam];t.rally={x:p.x,y:p.y,until:time+25};addLog('rally',selectedTeam,`${t.name}팀 2개 분대에 25초 집결 명령 (${p.x|0}, ${p.y|0}).`);aiTimer=0;commandMode=false;updateCommand();ring(p.x,p.y,t.color,4);showNotice(`${t.name}팀 절반이 집결 지점으로 이동합니다.`,3);return;}
 let e=null,best=Infinity;
 for(const v of [...bases,...towers,...units]){if(!v.alive)continue;const d=dist2(p,v),r=v.kind==='base'?4:v.kind==='tower'?2.3:1.0;if(d<r*r&&d<best){e=v;best=d;}}
 selectedEntity=e;selectUntil=time+14;updateInspect();
}
const pointers=new Map();let gesture=null;
canvas.addEventListener('pointerdown',e=>{
 if(e.button!==0&&e.pointerType==='mouse')return;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1)gesture={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y,moved:false,pinch:false};
 if(pointers.size===2){const a=[...pointers.values()];gesture={...gesture,pinch:true,moved:true,d:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y),z:cam.zoom};}
});
canvas.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId)||!gesture)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y);zoomTo(gesture.z*d/Math.max(1,gesture.d),{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2});}
 else if(pointers.size===1&&!gesture.pinch){const dx=e.clientX-gesture.sx,dy=e.clientY-gesture.sy;if(Math.hypot(dx,dy)>5)gesture.moved=true;if(gesture.moved&&cam.zoom>1){cam.x=gesture.cx-dx/cssSize*88/cam.zoom;cam.y=gesture.cy-dy/cssSize*88/cam.zoom;clampCamera();}}
});
function pointerEnd(e,cancel=false){if(!pointers.has(e.pointerId))return;const tap=gesture&&!gesture.moved&&!gesture.pinch&&!cancel;pointers.delete(e.pointerId);if(tap)mapTap(e.clientX,e.clientY);if(!pointers.size)gesture=null;}
canvas.addEventListener('pointerup',e=>pointerEnd(e));canvas.addEventListener('pointercancel',e=>pointerEnd(e,true));
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomTo(cam.zoom*(e.deltaY<0?1.14:1/1.14),{x:e.clientX,y:e.clientY});},{passive:false});
$('zoomIn').addEventListener('click',()=>zoomTo(cam.zoom*1.4));$('zoomOut').addEventListener('click',()=>zoomTo(cam.zoom/1.4));$('fitBtn').addEventListener('click',()=>{cam={x:40,y:40,zoom:1};updateCommand();});
$('pauseBtn').addEventListener('click',togglePause);for(const b of document.querySelectorAll('[data-speed]'))b.addEventListener('click',()=>setSpeed(Number(b.dataset.speed)));
$('helpBtn').addEventListener('click',showHelp);$('logBtn').addEventListener('click',showLogs);$('newBtn').addEventListener('click',showNew);
$('rallyBtn').addEventListener('click',()=>{if(gameOver){showResults();return;}if(selectedTeam<0){showToast('진영 카드에서 명령할 팀을 먼저 선택해 주세요.');return;}commandMode=!commandMode;updateCommand();});
$('soundBtn').addEventListener('click',()=>{if(!soundOn&&!initSound())return;soundOn=!soundOn;updateSound();if(soundOn)tone('capture');});$('autoNext').addEventListener('change',()=>{autoNext=$('autoNext').checked;});
$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal();});
document.addEventListener('keydown',e=>{
 if(modalType){if(e.key==='Escape'){e.preventDefault();closeModal();}if(e.key==='Tab'){const el=Array.from($('modal').querySelectorAll('button,input,[tabindex="0"]')).filter(el=>!el.disabled&&!el.hidden),a=el[0],b=el[el.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();b?.focus();}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a?.focus();}}return;}
 if(e.target instanceof HTMLInputElement)return;if(e.code==='Space'){e.preventDefault();togglePause();}if(['1','2','4'].includes(e.key))setSpeed(Number(e.key));if(e.key==='Escape'){commandMode=false;selectedEntity=null;selectedTeam=-1;updateCommand();updateUI(true);}
});
document.addEventListener('visibilitychange',()=>{hidden=document.hidden;accumulator=0;lastFrame=performance.now();});
window.addEventListener('resize',resizeCanvas);if('ResizeObserver'in window)new ResizeObserver(resizeCanvas).observe($('arena'));
function frame(now){
 const dt=lastFrame?Math.min((now-lastFrame)/1000,.10):0;lastFrame=now;visualTime=now/1000;
 if(!hidden){
  if(!paused&&!gameOver){accumulator+=dt*speed;let steps=0;while(accumulator>=STEP&&steps<16&&!gameOver){simulationStep(STEP);accumulator-=STEP;steps++;}if(steps>=16)accumulator=Math.min(accumulator,STEP);}
  if(gameOver&&autoNext&&(modalType==='result'||!modalType)){resultCountdown-=dt;if(modalType==='result')updateResultCount();if(resultCountdown<=0)reset(randomSeed());}
  uiTimer+=dt;if(uiTimer>.16){uiTimer=0;updateUI();}
  draw();renderFrames++;
 }
 requestAnimationFrame(frame);
}
// Compact, nonintrusive diagnostics for deterministic regression tests.
Object.defineProperty(window,'RTSDebug',{value:Object.freeze({
 state:()=>({seed,time,ticks,over:gameOver,winner,units:units.length,towers:towers.map(z=>({num:z.num,team:z.team,hp:z.hp,x:z.x,y:z.y})),teams:teams.map(t=>({id:t.id,alive:t.alive,hp:t.base.hp,units:t.unitCount,land:t.land,towers:t.towerCount,gold:t.gold,stats:{...t.stats}})),landTotal,passable:pass.reduce((a,b)=>a+b,0),phase,paused,speed,cam:{...cam},projectiles:projectiles.length,particles:particles.length,unwalkableUnits:units.filter(u=>!walkable(u.x,u.y)).length}),
 reset:s=>reset(s),step:n=>{for(let i=0;i<n&&!gameOver;i++)simulationStep(STEP);updateUI(true);draw();},
 validate:()=>{const errors=[];if(towers.length!==23)errors.push('tower count');if(new Set(towers.map(z=>index(z.x,z.y))).size!==23)errors.push('duplicate towers');for(const t of teams){if(t.unitCount!==units.filter(u=>u.alive&&u.team===t.id).length)errors.push('unit count '+t.id);if(t.towerCount!==towers.filter(z=>z.team===t.id).length)errors.push('tower count '+t.id);if(t.land!==owner.reduce((n,id)=>n+(id===t.id),0))errors.push('land count '+t.id);if(t.unitCount>MAX_UNITS)errors.push('cap '+t.id);}for(const u of units)if(!walkable(u.x,u.y))errors.push('unit in obstacle');return errors;}
 })});
updateSound();reset(randomSeed());requestAnimationFrame(frame);
})();
