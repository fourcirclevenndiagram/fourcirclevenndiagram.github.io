<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>MINI MARATHON: SEVEN Ⅱ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{width:100%;height:100%;background:#05060c;}
body{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#05060c;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
/* canvas는 replaced element라 width/height를 명시하지 않으면
   intrinsic 크기(=canvas.width, 즉 CSS px * DPR)로 레이아웃된다. 반드시 지정할 것. */
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;}
/* env()는 getPropertyValue로 계산값을 못 읽으므로 padding 계산값으로 실측한다 */
#sa{position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
'use strict';
/* ============ MINI MARATHON: SEVEN ============ */

/* ---------- utils ---------- */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function inRect(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function hexRGB(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function shade(h,f){const c=hexRGB(h);return 'rgb('+Math.round(c[0]*f)+','+Math.round(c[1]*f)+','+Math.round(c[2]*f)+')';}
function withA(h,a){const c=hexRGB(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}

/* ---------- canvas ---------- */
const cvs=document.getElementById('c');
const saProbe=document.getElementById('sa');
const ctx=cvs.getContext('2d');
let W=0,H=0,DPR=1,SAT=0,SAB=0,scanPat=null,rectL=0,rectT=0;
function viewSize(){
  let w=window.innerWidth||0,h=window.innerHeight||0;
  try{
    const de=document.documentElement;
    if(de&&de.clientWidth){w=Math.min(w||1e9,de.clientWidth)||w;}
    const vv=window.visualViewport;
    if(vv&&vv.width&&vv.height&&vv.scale&&Math.abs(vv.scale-1)<0.01){
      w=Math.round(vv.width);h=Math.round(vv.height);
    }
  }catch(e){}
  return {w:Math.max(1,Math.round(w)),h:Math.max(1,Math.round(h))};
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const v=viewSize();
  W=v.w;H=v.h;
  cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);
  cvs.style.width=W+'px';cvs.style.height=H+'px';
  try{
    const cs=getComputedStyle(saProbe);
    SAT=parseFloat(cs.paddingTop)||0;
    SAB=parseFloat(cs.paddingBottom)||0;
  }catch(e){SAT=0;SAB=0;}
  SAT=clamp(SAT,0,H*0.2);SAB=clamp(SAB,0,H*0.2);
  try{const r=cvs.getBoundingClientRect();rectL=r.left||0;rectT=r.top||0;}
  catch(e){rectL=0;rectT=0;}
  try{
    const pc=document.createElement('canvas');pc.width=4;pc.height=4;
    const px=pc.getContext('2d');
    px.fillStyle='rgba(255,255,255,0.028)';px.fillRect(0,0,4,1);
    scanPat=ctx.createPattern(pc,'repeat');
  }catch(e){scanPat=null;}
  initStars();
}
/* 모바일은 회전/주소창 변화 직후 값이 스테일해서 지연 재측정이 필요하다 */
let reT=null;
function reflow(){
  resize();
  if(reT)clearTimeout(reT);
  reT=setTimeout(function(){reT=null;resize();},220);
}
window.addEventListener('resize',reflow);
window.addEventListener('orientationchange',reflow);
try{
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',reflow);
    window.visualViewport.addEventListener('scroll',reflow);
  }
}catch(e){}
const HUD_H=()=>SAT+84;
const PLAY=()=>({x:0,y:HUD_H(),w:W,h:H-HUD_H()-SAB-12});

/* ---------- audio ---------- */
let AC=null;
function audioInit(){if(AC)return;try{const A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A();}catch(e){AC=null;}}
function beep(f,d,type,g,slide){
  if(!AC)return;
  try{
    const o=AC.createOscillator(),ga=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,AC.currentTime);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
    ga.gain.setValueAtTime(g||0.14,AC.currentTime);
    ga.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);
    o.connect(ga);ga.connect(AC.destination);
    o.start();o.stop(AC.currentTime+d+0.02);
  }catch(e){}
}
function sfx(name){
  if(name==='tap')beep(520,0.05,'square',0.07);
  else if(name==='tick')beep(880,0.03,'square',0.05);
  else if(name==='pulse')beep(300,0.07,'sine',0.13);
  else if(name==='good'){beep(660,0.09,'triangle',0.14);beep(990,0.14,'triangle',0.1);}
  else if(name==='win'){beep(523,0.12,'triangle',0.14);setTimeout(function(){beep(659,0.12,'triangle',0.14);},90);setTimeout(function(){beep(784,0.2,'triangle',0.16);},180);setTimeout(function(){beep(1046,0.3,'triangle',0.14);},290);}
  else if(name==='lose'){beep(180,0.3,'sawtooth',0.16,-120);setTimeout(function(){beep(120,0.4,'sawtooth',0.14,-80);},120);}
  else if(name==='flip')beep(240,0.09,'square',0.1,160);
  else if(name==='warn')beep(140,0.12,'square',0.12);
  else if(name==='rank'){beep(784,0.1,'triangle',0.14);setTimeout(function(){beep(1175,0.25,'triangle',0.16);},110);}
}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ---------- fx ---------- */
const parts=[],rings=[],pops=[];
let shakeT=0,shakeD=1,shakePow=0,flashT=0,flashD=1,flashCol='#fff',glitchT=0,glitchD=1;
function doShake(p,d){shakePow=p;shakeT=d;shakeD=d;}
function doFlash(c,d){flashCol=c;flashT=d;flashD=d;}
function doGlitch(d){glitchT=d;glitchD=d;}
function burst(x,y,col,n,sp,sz,life){
  n=n||24;sp=sp||260;sz=sz||3.4;life=life||0.7;
  for(let i=0;i<n;i++){
    const a=rnd(TAU),s=rnd(0.25,1)*sp;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.5,1)*life,max:life,sz:rnd(0.6,1.4)*sz,col:col,dr:rnd(0.86,0.97),grav:rnd(-40,160)});
  }
}
function ringFX(x,y,col,r0,r1,d,w){rings.push({x:x,y:y,col:col,r0:r0||10,r1:r1||140,d:d||0.5,t:0,w:w||4});}
function pop(t2,x,y,col,size){pops.push({txt:t2,x:x,y:y,col:col,size:size||24,t:0,d:1.0});}
function updateFX(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    const f=Math.pow(p.dr,dt*60);
    p.vx*=f;p.vy*=f;p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  for(let i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>=rings[i].d)rings.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>=pops[i].d)pops.splice(i,1);}
}
function drawFX(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    const a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz*a+0.6,0,TAU);ctx.fill();
  }
  ctx.shadowBlur=0;
  for(const r of rings){
    const t=r.t/r.d,rr2=lerp(r.r0,r.r1,easeOut(t));
    ctx.globalAlpha=(1-t)*0.9;ctx.strokeStyle=r.col;ctx.lineWidth=r.w*(1-t)+1;
    ctx.shadowColor=r.col;ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(r.x,r.y,rr2,0,TAU);ctx.stroke();
  }
  ctx.restore();ctx.globalAlpha=1;ctx.shadowBlur=0;
  for(const q of pops){
    const t=q.t/q.d;
    ctx.globalAlpha=1-easeIn(t);
    txt(q.txt,q.x,q.y-40*easeOut(t),q.size,q.col,14,'center',900);
  }
  ctx.globalAlpha=1;
}
function drawGlitch(){
  const k=glitchT/glitchD,n=6;
  for(let i=0;i<n;i++){
    const y=rnd(H),h=rnd(6,26),dx=rnd(-34,34)*k;
    try{ctx.drawImage(cvs,0,Math.floor(y*DPR),cvs.width,Math.max(1,Math.floor(h*DPR)),dx,y,W,h);}catch(e){}
  }
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.13*k;
  ctx.fillStyle='#ff004c';ctx.fillRect(rnd(-8,8),0,W,H);
  ctx.fillStyle='#00e5ff';ctx.fillRect(rnd(-8,8),rnd(-4,4),W,H);
  ctx.restore();ctx.globalAlpha=1;
}

/* ---------- text / bg ---------- */
function txt(s,x,y,size,col,glow,align,weight,baseline){
  ctx.font=(weight||800)+' '+size+'px system-ui,-apple-system,"Segoe UI",sans-serif';
  ctx.textAlign=align||'center';ctx.textBaseline=baseline||'middle';
  if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow;}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
  ctx.shadowBlur=0;
}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
let stars=[];
function initStars(){
  stars=[];
  for(let i=0;i<54;i++)stars.push({x:rnd(W),y:rnd(H),r:rnd(0.6,2.2),sp:rnd(6,26),ph:rnd(TAU)});
}
function drawBG(col,t){
  const g=ctx.createRadialGradient(W/2,H*0.32,20,W/2,H*0.55,H);
  g.addColorStop(0,shade(col,0.13));
  g.addColorStop(0.5,'#090b16');
  g.addColorStop(1,'#04050b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=0.05;ctx.strokeStyle=col;ctx.lineWidth=1;
  const gs=52,ox=(t*7)%gs,oy=(t*4)%gs;
  ctx.beginPath();
  for(let x=-gs+ox;x<W+gs;x+=gs){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(let y=-gs+oy;y<H+gs;y+=gs){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();ctx.restore();
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const s of stars){
    ctx.globalAlpha=0.35+0.35*Math.sin(t*2+s.ph);
    ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();
  }
  ctx.restore();ctx.globalAlpha=1;
}

/* ---------- state / flow ---------- */
let STATE='title',stateT=0,now=0;
let order=[],gIdx=0,results=[],streak=0,total=0,best=0,newBest=false;
let cur=null,gameT=0,lowWhole=99;
let judgeWin=false,judgeScore=0,judgeMult=1,judgeFired=false;
let rankShown=false,retryRect=null,paused=false;

const trans={active:false,t:0,inD:0.3,outD:0.3,mid:null,phase:0};
function transition(cb){trans.active=true;trans.t=0;trans.phase=0;trans.mid=cb;}
function updateTrans(dt){
  if(!trans.active)return;
  trans.t+=dt;
  if(trans.phase===0&&trans.t>=trans.inD){
    trans.phase=1;trans.t=0;
    if(trans.mid){const f=trans.mid;trans.mid=null;f();}
  }else if(trans.phase===1&&trans.t>=trans.outD){trans.active=false;}
}
function drawTrans(){
  if(!trans.active)return;
  const bars=7,bw=W/bars;
  const col=cur?cur.color:'#00e5ff';
  for(let i=0;i<bars;i++){
    let p;
    if(trans.phase===0)p=clamp(trans.t/trans.inD*1.6-i*0.09,0,1);
    else p=1-clamp(trans.t/trans.outD*1.6-i*0.09,0,1);
    if(p<=0)continue;
    const h=H*easeIO(p),down=(i%2===0);
    ctx.fillStyle='#04050b';
    ctx.fillRect(i*bw-1,down?0:H-h,bw+2,h);
    ctx.fillStyle=withA(col,0.5*p);
    ctx.fillRect(i*bw-1,down?h-3:H-h,bw+2,3);
  }
}

function setState(s){STATE=s;stateT=0;}
function startRun(){
  order=shuffle(GAMES.map(function(_,i){return i;}));
  gIdx=0;results=[];streak=0;total=0;newBest=false;
  parts.length=0;rings.length=0;pops.length=0;
  transition(beginIntro);
}
function beginIntro(){cur=GAMES[order[gIdx]];setState('intro');}
function beginPlay(){pointers.clear();cur.init();gameT=0;lowWhole=99;setState('play');}
function endGame(win){
  if(STATE!=='play')return;
  const remain=Math.max(0,cur.time-gameT);
  const acc=clamp(Math.round(cur.acc||0),0,50);
  judgeWin=win;judgeFired=false;
  if(win){
    streak++;
    judgeMult=1+0.5*Math.min(streak-1,4);
    judgeScore=Math.round((100+Math.round(remain*10)+acc)*judgeMult);
    total+=judgeScore;
    sfx('win');vib(30);
    doFlash(cur.color,0.22);doShake(7,0.35);
    burst(W/2,H*0.44,'#ffd23c',60,420,4,1);
    burst(W/2,H*0.44,cur.color,40,330,3,0.9);
    ringFX(W/2,H*0.44,'#ffd23c',10,W*0.7,0.7,6);
  }else{
    streak=0;judgeMult=1;judgeScore=0;
    sfx('lose');vib([70,40,70]);
    doGlitch(0.55);doShake(12,0.45);doFlash('#ff2050',0.15);
  }
  results.push({win:win,score:judgeScore});
  setState('judge');
}
function afterJudge(){
  gIdx++;
  if(gIdx>=order.length){
    transition(function(){
      newBest=total>best;
      if(newBest)best=total;
      rankShown=false;retryRect=null;
      setState('result');
    });
  }else transition(beginIntro);
}

/* ---------- HUD ---------- */
function drawHUD(){
  const topY=SAT+14;
  txt((gIdx+1)+' / 7',16,topY+8,15,'#9fb4d8',0,'left',800);
  if(streak>=1)txt('COMBO x'+(1+0.5*Math.min(streak,4)).toFixed(1),16,topY+30,12,'#ffd23c',8,'left',900);
  txt(String(total).padStart(6,'0'),W-16,topY+8,17,'#e8f2ff',6,'right',900);
  const r=25,cx=W/2,cy=topY+r;
  const remain=Math.max(0,cur.time-gameT),frac=clamp(remain/cur.time,0,1);
  const low=remain<=2&&remain>0;
  const col=low?'#ff3b5c':cur.color;
  ctx.save();
  ctx.globalAlpha=0.3;ctx.strokeStyle='#25304a';ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke();
  ctx.globalAlpha=1;ctx.strokeStyle=col;ctx.shadowColor=col;ctx.shadowBlur=low?16:8;
  ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+TAU*frac);ctx.stroke();
  ctx.restore();
  txt(remain.toFixed(1),cx,cy+1,14,low?'#ff5b74':'#e8f2ff',low?10:0,'center',900);
  txt(cur.name,cx,SAT+72,11,withA(cur.color,0.9),6,'center',800);
}

/* ---------- title ---------- */
function drawTitle(){
  drawBG('#00ffc8',now);
  const cy=H*0.32,s=Math.min(W*0.21,88);
  const pulse=1+Math.sin(now*2.4)*0.02;
  ctx.save();ctx.translate(W/2,cy);ctx.scale(pulse,pulse);
  txt('MINI MARATHON',0,-s*0.62,Math.min(W*0.082,32),'#a8ffe9',18,'center',900);
  ctx.globalAlpha=0.85;
  txt('SEVEN Ⅱ',3,s*0.14+2,s,'#00ffc8',26,'center',900);
  txt('SEVEN Ⅱ',-3,s*0.14-2,s,'#ff9500',26,'center',900);
  ctx.globalAlpha=1;
  txt('SEVEN Ⅱ',0,s*0.14,s,'#f5faff',8,'center',900);
  ctx.restore();
  txt('EPISODE Ⅱ · 새로운 미니게임 7종',W/2,cy+s*0.82,15,'#ffce8a',0);
  for(let i=0;i<GAMES.length;i++){
    const g=GAMES[i],x=W/2+(i-3)*34,y=cy+s*0.82+36+Math.sin(now*3+i)*3;
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=g.color;ctx.shadowColor=g.color;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(x,y,5,0,TAU);ctx.fill();ctx.restore();
  }
  ctx.globalAlpha=0.55+0.45*Math.sin(now*4);
  txt('TAP TO START',W/2,H*0.72,21,'#ffd23c',16,'center',900);
  ctx.globalAlpha=1;
  if(best>0)txt('BEST '+best,W/2,H*0.72+36,13,'#8fa3c8',0);
}

/* ---------- intro card ---------- */
function drawIntro(){
  const t=stateT/1.05;
  const bx=lerp(-W,0,easeOut(clamp(t*1.7,0,1)));
  ctx.save();ctx.translate(bx,0);
  ctx.fillStyle=withA(cur.color,0.14);
  ctx.beginPath();
  ctx.moveTo(0,H*0.31);ctx.lineTo(W,H*0.37);ctx.lineTo(W,H*0.61);ctx.lineTo(0,H*0.55);
  ctx.closePath();ctx.fill();
  ctx.restore();
  txt('GAME '+(gIdx+1),W/2,H*0.36,15,'#8fa3c8',0,'center',800);
  const nx=lerp(W*1.3,W/2,easeOut(clamp((t-0.06)*1.9,0,1)));
  txt(cur.name,nx,H*0.44,Math.min(W*0.1,40),cur.color,24,'center',900);
  ctx.globalAlpha=clamp((t-0.3)*3,0,1);
  txt(cur.desc,W/2,H*0.52,15,'#dce8ff',0,'center',700);
  ctx.globalAlpha=1;
  ctx.fillStyle=cur.color;ctx.shadowColor=cur.color;ctx.shadowBlur=12;
  ctx.fillRect(W*0.2,H*0.575,W*0.6*clamp(t,0,1),3);
  ctx.shadowBlur=0;
}

/* ---------- judge overlay ---------- */
function drawJudge(){
  cur.draw();
  ctx.fillStyle='rgba(3,4,10,0.45)';ctx.fillRect(0,0,W,H);
  const t=clamp(stateT/0.25,0,1),sc=lerp(1.6,1,easeOut(t));
  ctx.save();ctx.translate(W/2,H*0.42);ctx.scale(sc,sc);
  if(judgeWin)txt('SUCCESS!',0,0,44,'#ffd23c',26,'center',900);
  else txt('FAILED',glitchT>0?rnd(-3,3):0,0,44,'#ff3b5c',22,'center',900);
  ctx.restore();
  if(judgeWin)txt('+'+judgeScore+(judgeMult>1?'  (x'+judgeMult.toFixed(1)+')':''),W/2,H*0.42+46,20,'#fff2c8',10,'center',900);
}

/* ---------- result ---------- */
function drawResult(){
  drawBG('#ffd23c',now);
  const wins=results.reduce(function(a,r){return a+(r.win?1:0);},0);
  const rank=wins>=7?'S':wins>=6?'A':wins>=4?'B':'C';
  const rc=rank==='S'?'#ffd23c':rank==='A'?'#00e5ff':rank==='B'?'#39ff88':'#8fa3c8';
  txt('RESULT',W/2,SAT+56,20,'#8fa3c8',0);
  const iy=SAT+104,gap=Math.min(46,W/8.6);
  for(let i=0;i<results.length;i++){
    const r=results[i],g=GAMES[order[i]];
    const x=W/2+(i-3)*gap;
    const t=clamp((stateT-0.15-i*0.08)*4,0,1);
    if(t<=0||!g)continue;
    ctx.save();ctx.globalAlpha=t;
    ctx.strokeStyle=r.win?g.color:'#39415c';

/* ---------- input ---------- */
const pointers=new Map();
function onDown(p){
  if(paused){paused=false;return;}
  if(trans.active)return;
  if(STATE==='title'){sfx('tap');startRun();return;}
  if(STATE==='result'){
    if(retryRect&&inRect(p,retryRect)){
      sfx('tap');burst(p.x,p.y,'#ffd23c',16,220);startRun();
    }
    return;
  }
  if(STATE==='play'&&cur&&cur.down)cur.down(p);
}
function onMove(p){if(STATE==='play'&&!paused&&cur&&cur.move)cur.move(p);}
function onUp(p){if(STATE==='play'&&cur&&cur.up)cur.up(p);}
const px=e=>e.clientX-rectL,py=e=>e.clientY-rectT;
cvs.addEventListener('pointerdown',function(e){
  e.preventDefault();audioInit();
  const id=e.pointerId!==undefined?e.pointerId:0;
  const p={x:px(e),y:py(e),id:id};
  try{if(cvs.setPointerCapture)cvs.setPointerCapture(id);}catch(err){}
  pointers.set(id,p);onDown(p);
},{passive:false});
cvs.addEventListener('pointermove',function(e){
  e.preventDefault();
  const id=e.pointerId!==undefined?e.pointerId:0;
  if(!pointers.has(id))return;
  const p={x:px(e),y:py(e),id:id};
  pointers.set(id,p);onMove(p);
},{passive:false});
function endP(e){
  const id=e.pointerId!==undefined?e.pointerId:0;
  const p=pointers.get(id);pointers.delete(id);
  if(p)onUp(p);
}
cvs.addEventListener('pointerup',endP);
cvs.addEventListener('pointercancel',endP);
cvs.addEventListener('lostpointercapture',endP);
window.addEventListener('contextmenu',function(e){e.preventDefault();});
/* iOS: 더블탭 확대 / 스크롤 바운스 차단 */
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick'].forEach(function(t){
  window.addEventListener(t,function(e){if(e.cancelable)e.preventDefault();},{passive:false});
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&(STATE==='play'||STATE==='intro'))paused=true;
});

/* ---------- update / draw / loop ---------- */
function update(dt){
  for(const s of stars){s.y-=s.sp*dt;if(s.y<-4){s.y=H+4;s.x=rnd(W);}}
  updateFX(dt);updateTrans(dt);
  shakeT=Math.max(0,shakeT-dt);
  flashT=Math.max(0,flashT-dt);
  glitchT=Math.max(0,glitchT-dt);
  if(STATE==='intro'){
    if(stateT>=1.05&&!trans.active)beginPlay();
  }else if(STATE==='play'){
    gameT+=dt;
    const rem=cur.time-gameT;
    if(rem<3&&rem>0){const w2=Math.ceil(rem);if(w2!==lowWhole){lowWhole=w2;sfx('tick');}}
    cur.update(dt);
    if(STATE==='play'&&gameT>=cur.time)endGame(!!cur.timeoutWin);
  }else if(STATE==='judge'){
    if(stateT>=0.85&&!judgeFired){judgeFired=true;afterJudge();}
  }
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(shakeT>0){const k=shakeT/shakeD*shakePow;ctx.translate(rnd(-k,k),rnd(-k,k));}
  if(STATE==='title')drawTitle();
  else if(STATE==='intro'){drawBG(cur.color,now);drawIntro();}
  else if(STATE==='play'){drawBG(cur.color,now);cur.draw();drawHUD();}
  else if(STATE==='judge'){drawBG(cur.color,now);drawJudge();drawHUD();}
  else if(STATE==='result')drawResult();
  drawFX();
  if(flashT>0){
    ctx.globalAlpha=(flashT/flashD)*0.8;
    ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
  if(glitchT>0)drawGlitch();
  if(scanPat){ctx.fillStyle=scanPat;ctx.fillRect(0,0,W,H);}
  drawTrans();
  if(paused)drawPause();
}
let lastT=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!lastT)lastT=ts;
  let dt=(ts-lastT)/1000;lastT=ts;
  if(dt>0.05)dt=0.05;
  if(dt<0)dt=0;
  if(paused){draw();return;}
  now+=dt;stateT+=dt;
  update(dt);
  draw();
}

    const ta=this.t+rnd(0.9,1.6),d=rnd(TAU);

      const lo=Math.max(-a.w,d-b.w),hi=Math.min(a.w,d+b.w);
      return lo>hi?null:{c:a.c+(lo+hi)/2,w:(hi-lo)/2};
    };
    const r1=int2({c:this.gapC(this.rings[0]),w:this.rings[0].w},{c:this.gapC(this.rings[1]),w:this.rings[1].w});

    this.x0=(W-(cfg.c*cell+(cfg.c-1)*pad))/2;
    this.y0=P.y+P.h*0.14;
    this.hue=rndi(0,359);
    this.dh=cfg.dh*(Math.random()<0.5?1:-1);
    this.odd=rndi(0,cfg.c*cfg.r-1);
    this.reveal=0;
  },
  update(dt){this.reveal=Math.min(1,this.reveal+dt*3);},
  down(p){
    const c=Math.floor((p.x-this.x0)/(this.cell+this.pad));
    const r=Math.floor((p.y-this.y0)/(this.cell+this.pad));
    if(c<0||c>=this.cols||r<0||r>=this.rows)return;
    const lx=p.x-this.x0-c*(this.cell+this.pad),ly=p.y-this.y0-r*(this.cell+this.pad);
    if(lx>this.cell+4||ly>this.cell+4)return;
    const i=r*this.cols+c;
    const cx=this.x0+c*(this.cell+this.pad)+this.cell/2;
    const cy=this.y0+r*(this.cell+this.pad)+this.cell/2;
    if(i===this.odd){
      this.round++;
      sfx('good');vib(14);
      burst(cx,cy,'hsl('+((this.hue+this.dh+360)%360)+',95%,62%)',24,280);
      ringFX(cx,cy,this.color,8,90,0.4,4);
      if(this.round>=3){this.acc=45;endGame(true);}
      else this.newRound();
    }else{
      burst(cx,cy,'#ff3b5c',20,260);
      endGame(false);
    }
  },
  draw(){
    const P=PLAY();
    txt('하나만 달라! · ROUND '+(Math.min(this.round,2)+1)+' / 3',W/2,P.y+P.h*0.07,16,'#ffc9ef',0,'center',900);
    const h1=this.hue,h2=(this.hue+this.dh+360)%360;
    for(let r=0;r<this.rows;r++)for(let c=0;c<this.cols;c++){
      const i=r*this.cols+c;
      const x=this.x0+c*(this.cell+this.pad),y=this.y0+r*(this.cell+this.pad);
      const hh=i===this.odd?h2:h1;
      ctx.globalAlpha=this.reveal;
      ctx.fillStyle='hsl('+hh+',88%,54%)';
      rr(x,y,this.cell,this.cell,Math.min(10,this.cell*0.2));ctx.fill();
      ctx.strokeStyle='hsl('+hh+',95%,72%)';ctx.lineWidth=1.5;
      rr(x,y,this.cell,this.cell,Math.min(10,this.cell*0.2));ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
};

/* 5. COUNT PULSE */
const gCount={
  id:'count',name:'COUNT PULSE',desc:'파란 펄스가 몇 번인지 세라! (빨강은 함정)',
  color:'#b4ff3c',time:9,timeoutWin:false,
  init(){
    const P=PLAY();
    this.blueN=rndi(4,6);this.redN=rndi(4,6);
    const evs=[];
    for(let i=0;i<this.blueN;i++)evs.push({col:'#3b8cff',blue:true});
    for(let i=0;i<this.redN;i++)evs.push({col:'#ff3b5c',blue:false});
    shuffle(evs);
    let t0=0.6;
    for(const e of evs){
      e.t=t0;t0+=rnd(0.26,0.38);
      e.x=rnd(W*0.14,W*0.86);e.y=P.y+P.h*rnd(0.12,0.8);
      e.done=false;
    }
    this.evs=evs;this.answerAt=t0+0.5;
    this.phase='show';this.flash=[];
    const opts=[this.blueN];
    const cand=shuffle([this.blueN-2,this.blueN-1,this.blueN+1,this.blueN+2].filter(function(v){return v>=1;}));
    while(opts.length<4&&cand.length)opts.push(cand.pop());
    let k=2;
    while(opts.length<4)opts.push(this.blueN+(++k));
    shuffle(opts);
    this.opts=opts;this.acc=0;
  },
  buttons(){
    const P=PLAY();
    const bw=W*0.34,bh=64,gx=W*0.08,gy=18;
    const x0=W/2-bw-gx/2,y0=P.y+P.h*0.42;
    const out=[];
    for(let i=0;i<4;i++)
      out.push({x:x0+(i%2)*(bw+gx),y:y0+Math.floor(i/2)*(bh+gy),w:bw,h:bh,v:this.opts[i]});
    return out;
  },
  update(dt){
    if(this.phase!=='show')return;
    for(const e of this.evs){
      if(!e.done&&gameT>=e.t){
        e.done=true;
        this.flash.push({x:e.x,y:e.y,col:e.col,t:0});
        beep(e.blue?660:290,0.07,'sine',0.12);
        ringFX(e.x,e.y,e.col,6,70,0.4,3);
      }
    }
    for(let i=this.flash.length-1;i>=0;i--){this.flash[i].t+=dt;if(this.flash[i].t>0.5)this.flash.splice(i,1);}
    if(gameT>=this.answerAt){this.phase='answer';sfx('warn');doFlash(this.color,0.1);}
  },
  down(p){
    if(this.phase!=='answer')return;
    for(const b of this.buttons()){
      if(inRect(p,b)){
        const bx=b.x+b.w/2,by=b.y+b.h/2;
        if(b.v===this.blueN){this.acc=40;burst(bx,by,this.color,26,280);endGame(true);}
        else{burst(bx,by,'#ff3b5c',22,260);endGame(false);}
        return;
      }
    }
  },
  draw(){
    const P=PLAY();
    if(this.phase==='show'){
      txt('파란 펄스를 세라!',W/2,P.y+P.h*0.06,17,'#e4ffbe',0,'center',900);
      ctx.save();ctx.globalCompositeOperation='lighter';
      for(const f of this.flash){
        const k=f.t/0.5,r2=10+46*easeOut(k);
        ctx.globalAlpha=1-k;
        ctx.fillStyle=f.col;ctx.shadowColor=f.col;ctx.shadowBlur=22;
        ctx.beginPath();ctx.arc(f.x,f.y,12*(1-k*0.4),0,TAU);ctx.fill();
        ctx.globalAlpha=(1-k)*0.7;ctx.strokeStyle=f.col;ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(f.x,f.y,r2,0,TAU);ctx.stroke();
      }
      ctx.restore();ctx.globalAlpha=1;
    }else{
      txt('파란 펄스는 몇 번?',W/2,P.y+P.h*0.24,22,this.color,14,'center',900);
      for(const b of this.buttons()){
        ctx.fillStyle=withA(this.color,0.08);
        rr(b.x,b.y,b.w,b.h,14);ctx.fill();
        ctx.strokeStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=10;ctx.lineWidth=2;
        rr(b.x,b.y,b.w,b.h,14);ctx.stroke();ctx.shadowBlur=0;
        txt(String(b.v),b.x+b.w/2,b.y+b.h/2+1,26,'#f2ffdd',6,'center',900);
      }
    }
  }
};

/* 6. SIGNAL LOCK */
const gSignal={
  id:'signal',name:'SIGNAL LOCK',desc:'드래그로 파형을 겹쳐라 (좌우:주파수 · 상하:위상)',
  color:'#39ff88',time:8,timeoutWin:false,
  init(){
    this.ft=rnd(1.0,2.4);this.pt2=rnd(TAU);
    const off=rnd(0.7,1.15)*(Math.random()<0.5?1:-1);
    this.fp=clamp(this.ft+off,0.55,2.9);
    this.pp=((this.pt2+rnd(1.8,4.4))%TAU+TAU)%TAU;
    this.lock=0;this.NEEDL=0.7;this.err=1;this.wasL=false;
    this.lx=0;this.ly=0;this.drag=false;this.acc=0;
  },
  wrapPi(a){return ((a%TAU)+TAU+Math.PI)%TAU-Math.PI;},
  update(dt){
    const ef=Math.abs(this.fp-this.ft),ep=Math.abs(this.wrapPi(this.pp-this.pt2));
    this.err=clamp(ef/1.2*0.65+ep/Math.PI*0.35,0,1);
    const locked=ef<0.09&&ep<0.30;
    if(locked&&!this.wasL)sfx('good');
    this.wasL=locked;
    if(locked)this.lock+=dt;else this.lock=Math.max(0,this.lock-dt*2);
    if(this.lock>=this.NEEDL){this.acc=40;endGame(true);}
  },
  down(p){this.drag=true;this.lx=p.x;this.ly=p.y;},
  move(p){
    if(!this.drag){this.drag=true;this.lx=p.x;this.ly=p.y;return;}
    const dx=p.x-this.lx,dy=p.y-this.ly;
    this.lx=p.x;this.ly=p.y;
    this.fp=clamp(this.fp+dx*0.0042,0.55,2.9);
    this.pp=((this.pp+dy*0.012)%TAU+TAU)%TAU;
  },
  up(){this.drag=false;},
  draw(){
    const P=PLAY();
    const sy=P.y+P.h*0.10,sh=P.h*0.52,cy2=sy+sh/2,A=sh*0.30;
    ctx.strokeStyle=withA(this.color,0.5);ctx.lineWidth=2;
    rr(10,sy,W-20,sh,12);ctx.stroke();
    ctx.save();ctx.globalAlpha=0.12;ctx.strokeStyle=this.color;ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=10;x<=W-10;x+=(W-20)/8){ctx.moveTo(x,sy);ctx.lineTo(x,sy+sh);}
    for(let y=sy;y<=sy+sh;y+=sh/6){ctx.moveTo(10,y);ctx.lineTo(W-10,y);}
    ctx.stroke();ctx.restore();
    const self=this;
    const wave=function(f,ph,col,jit,lw,glow){
      ctx.strokeStyle=col;ctx.lineWidth=lw;
      if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow;}
      ctx.beginPath();
      for(let x=14;x<=W-14;x+=5){
        const u=(x-14)/(W-28);
        const y=cy2+A*Math.sin(u*TAU*2.2*f+ph)+(jit?rnd(-jit,jit):0);
        if(x===14)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();ctx.shadowBlur=0;
    };
    ctx.save();
    wave(this.ft,this.pt2,withA('#9fffd0',0.4),0,2,0);
    ctx.globalCompositeOperation='lighter';
    const j=this.err*7;
    if(this.err>0.3){
      wave(this.fp,this.pp,withA('#ff3b5c',0.35),j,2,0);
      wave(this.fp,this.pp,withA('#00e5ff',0.35),j,2,0);
    }
    wave(this.fp,this.pp,this.color,j*0.6,3,14);
    ctx.restore();
    const lw2=W*0.6,lx2=W/2-lw2/2,ly2=sy+sh+22;
    ctx.fillStyle='#141b2c';ctx.fillRect(lx2,ly2,lw2,6);
    const lk=clamp(this.lock/this.NEEDL,0,1);
    ctx.fillStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=10;
    ctx.fillRect(lx2,ly2,lw2*lk,6);ctx.shadowBlur=0;
    txt(this.wasL?'LOCKING…':'오차 '+Math.round(this.err*100)+'%',W/2,ly2+26,14,this.wasL?this.color:'#9fb4d8',this.wasL?10:0,'center',800);
    const fbY=P.y+P.h*0.82,fbW=W*0.66,fbX=W/2-fbW/2;
    ctx.fillStyle='#141b2c';ctx.fillRect(fbX,fbY,fbW,4);
    const fu=(this.fp-0.55)/(2.9-0.55);
    ctx.fillStyle=this.color;
    ctx.beginPath();ctx.arc(fbX+fbW*fu,fbY+2,5,0,TAU);ctx.fill();
    txt('좌우 드래그: 주파수 · 상하: 위상',W/2,P.y+P.h*0.93,13,'#7f95bb',0,'center',700);
  }
};

/* 7. SPAN */
const gSpan={
  id:'span',name:'SPAN',desc:'홀드한 만큼 다리가 자란다 — 딱 맞게 놓아라!',
  color:'#ffd23c',time:10,timeoutWin:false,
  GROW:300,
  init(){
    const P=PLAY();
    this.gy=P.y+P.h*0.62;
    this.plat=[{x:0,w:110}];
    const gaps=[rnd(78,100),rnd(110,138),rnd(140,165)];
    const ws=[72,62,52];
    for(let i=0;i<3;i++){
      const pv=this.plat[i];
      this.plat.push({x:pv.x+pv.w+gaps[i],w:ws[i]});
    }
    this.k=0;this.cam=this.edge()-90;this.camT=this.cam;
    this.len=0;this.phase='idle';this.pt=0;this.hold=false;
    this.crossed=0;this.perf=0;this.acc=0;
    this.bEdge=this.edge();this.heroX=this.edge()-16;
    this.landOK=false;this.perfHit=false;this.fy=0;this.vy=0;
  },
  edge(){return this.plat[this.k].x+this.plat[this.k].w;},
  update(dt){
    this.cam+=(this.camT-this.cam)*Math.min(1,dt*7);
    if(this.phase==='grow'){
      this.len=Math.min(this.len+this.GROW*dt,W*1.1);
      if(!this.hold)this.drop();
    }else if(this.phase==='drop'){
      this.pt+=dt;
      if(this.pt>=0.3){
        this.pt=0;
        const tip=this.edge()+this.len,nx=this.plat[this.k+1];
        this.landOK=tip>=nx.x+3&&tip<=nx.x+nx.w-3;
        this.perfHit=Math.abs(tip-(nx.x+nx.w/2))<=8;
        this.phase='walk';
        doShake(3,0.15);sfx('pulse');
      }
    }else if(this.phase==='walk'){
      this.heroX+=260*dt;
      const stopX=this.landOK?this.plat[this.k+1].x+this.plat[this.k+1].w-16:this.edge()+this.len+8;
      if(this.heroX>=stopX){
        if(this.landOK){
          this.crossed++;
          if(this.perfHit){this.perf++;pop('PERFECT!',W/2,this.gy-70,'#ffd23c',22);sfx('good');vib(20);
            burst(this.heroX-this.cam,this.gy,'#ffd23c',24,280);}
          else sfx('tick');
          if(this.crossed>=3){
            this.acc=clamp(8+this.perf*14,0,50);
            endGame(true);return;
          }
          this.k++;
          this.phase='shift';
          this.camT=this.edge()-90;
        }else{
          this.phase='fall';this.pt=0;this.fy=this.gy;this.vy=0;
          sfx('warn');doShake(8,0.3);
        }
      }
    }else if(this.phase==='shift'){
      if(Math.abs(this.cam-this.camT)<2){
        this.cam=this.camT;this.len=0;
        this.bEdge=this.edge();this.heroX=this.edge()-16;
        this.phase='idle';
      }
    }else if(this.phase==='fall'){
      this.pt+=dt;this.vy+=1800*dt;this.fy+=this.vy*dt;
      if(this.pt>=0.55)endGame(false);
    }
  },
  drop(){if(this.phase==='grow'){this.phase='drop';this.pt=0;sfx('flip');vib(10);}},
  down(){
    if(this.phase==='idle'){
      this.hold=true;this.phase='grow';this.bEdge=this.edge();
      sfx('tap');
    }
  },
  up(){this.hold=false;if(this.phase==='grow')this.drop();},
  draw(){
    const P=PLAY(),cam=this.cam;
    for(let i=0;i<this.plat.length;i++){
      const p2=this.plat[i],sx=p2.x-cam;
      if(sx>W+40||sx+p2.w<-40)continue;
      ctx.fillStyle='#0c1120';
      ctx.fillRect(sx,this.gy,p2.w,P.y+P.h-this.gy);
      ctx.strokeStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=10;ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(sx,this.gy);ctx.lineTo(sx+p2.w,this.gy);ctx.stroke();ctx.shadowBlur=0;
      if(i===this.k+1){
        const cx2=sx+p2.w/2;
        ctx.fillStyle='#ff3b5c';ctx.shadowColor='#ff3b5c';ctx.shadowBlur=8;
        ctx.fillRect(cx2-7,this.gy-2,14,4);ctx.shadowBlur=0;
      }
    }
    if(this.len>0.5){
      const bx2=this.bEdge-cam;
      let a=0;
      if(this.phase==='grow')a=-Math.PI/2;
      else if(this.phase==='drop')a=-Math.PI/2+easeIn(clamp(this.pt/0.3,0,1))*(Math.PI/2);
      else if(this.phase==='fall'&&!this.landOK)a=easeIn(clamp(this.pt/0.5,0,1))*0.9;
      ctx.save();
      ctx.strokeStyle='#ffe9b0';ctx.shadowColor=this.color;ctx.shadowBlur=12;ctx.lineWidth=6;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(bx2,this.gy);
      ctx.lineTo(bx2+Math.cos(a)*this.len,this.gy+Math.sin(a)*this.len);
      ctx.stroke();ctx.restore();
    }
    const hy=this.phase==='fall'?this.fy:this.gy;
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='#ffffff';ctx.shadowColor=this.color;ctx.shadowBlur=16;
    rr(this.heroX-cam-8,hy-18,16,16,4);ctx.fill();
    ctx.restore();
    for(let i=0;i<3;i++){
      const x=W/2+(i-1)*28,y=P.y+16;
      ctx.fillStyle=i<this.crossed?this.color:'#2a3350';
      if(i<this.crossed){ctx.shadowColor=this.color;ctx.shadowBlur=8;}
      ctx.beginPath();ctx.arc(x,y,6,0,TAU);ctx.fill();ctx.shadowBlur=0;
    }
    if(this.phase==='idle'){
      ctx.globalAlpha=0.6+0.4*Math.sin(now*5);
      txt('홀드해서 다리를 키워라',W/2,P.y+P.h*0.9,15,this.color,10,'center',900);
      ctx.globalAlpha=1;
    }
  }
};

const GAMES=[gChain,gLead,gAlign,gOdd,gCount,gSignal,gSpan];

/* ---------- debug / headless hooks ---------- */
window.__MMS={
  GAMES:GAMES,
  get state(){return STATE;},
  get results(){return results;},
  get total(){return total;},
  startRun:startRun,
  reset:function(){
    trans.active=false;trans.mid=null;paused=false;
    parts.length=0;rings.length=0;pops.length=0;pointers.clear();
    STATE='title';stateT=0;
  },
  forceGame:function(i){
    trans.active=false;trans.mid=null;judgeFired=true;paused=false;
    parts.length=0;rings.length=0;pops.length=0;pointers.clear();
    order=GAMES.map(function(_,k){return k;});
    results=[];gIdx=i;cur=GAMES[i];cur.init();
    gameT=0;lowWhole=99;STATE='play';stateT=0;
  },
  pointer:function(type,x,y,id){
    id=id===undefined?1:id;
    const p={x:x,y:y,id:id};
    if(type==='down'){pointers.set(id,p);onDown(p);}
    else if(type==='move'){pointers.set(id,p);onMove(p);}
    else{pointers.delete(id);onUp(p);}
  },
  tick:function(dt){now+=dt;stateT+=dt;update(dt);draw();},
  resize:resize
};

resize();
requestAnimationFrame(frame);
