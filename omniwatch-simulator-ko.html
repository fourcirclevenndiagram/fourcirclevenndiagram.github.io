function advanceJobs(){for(const j of S.jobs){if(S.elapsed<j.due)continue;const c=S.cases.find(c=>c.id===j.caseId);if(!c){j.done=true;continue}const root=S.issues.find(i=>i.id===c.rootId);if(j.stage===0){caseLog(c,FT[root.fault].fix,j.actor);j.stage=1;j.due=S.elapsed+5}else if(j.stage===1){S.issues.filter(i=>i.caseId===c.id&&!i.resolvedAt).forEach(i=>resolveIssue(i,j.actor));c.state='verifying';caseLog(c,'복구 후 8초간 상태 재확인 · 업무 검사 수행',j.actor);j.stage=2;j.due=S.elapsed+8}else{if(S.issues.some(i=>i.caseId===c.id&&!i.resolvedAt)){c.state='ack';caseLog(c,'재검증에서 잔여 경보 확인. 다시 대응이 필요합니다.',j.actor)}else{c.state='resolved';c.resolvedAt=Math.max(.001,S.elapsed);const affected=affectedServices(root.host),still=SERVICES.filter(s=>affected.includes(s.name)&&serviceHealth(s).impact>.1);caseLog(c,still.length?`이 장애의 복구 검증 완료. ${still.map(s=>s.name).join('·')}은 다른 장애의 영향을 받고 있습니다.`:'이 장애의 복구 검증 완료. 연결된 경보를 모두 종료했습니다.',j.actor);emit({cat:'감시운영',sev:5,message:`${c.id} 복구 검증 완료. 소요 ${duration(c.resolvedAt-c.created)}.`,caseId:c.id});}j.done=true}}S.jobs=S.jobs.filter(j=>!j.done)}
function updateMetrics(){INVENTORY.forEach((d,index)=>{if(missing(d.id))return;const m=S.metrics[d.id],issues=activeIssues(d.id);for(const key of Object.keys(METRICS)){const forced=issues.filter(i=>FT[i.fault].metric===key&&!i.measured);if(forced.length){m[key]=Math.max(...forced.map(i=>i.value??0));continue}let base=normalMetric(key,index),v=m[key]+(base-m[key])*.08;if(key==='cpu'||key==='mem')v+=random(-2,2);if(key==='latency')v+=random(-9,9);if(key==='temp')v+=random(-.12,.12);if(key==='queue')v+=random(-4,4);m[key]=clamp(v,0,key==='latency'?6000:key==='queue'?20000:key==='temp'?60:100)}m.at=S.elapsed})}
function thresholdCheck(){const map={cpu:'cpu_high',mem:'memory_high',disk:'disk_high',latency:'http_slow',temp:'temp_high'};for(const d of INVENTORY){if(missing(d.id))continue;for(const [metric,threshold] of Object.entries(S.thresholds)){if(!metricsFor(d).includes(metric)||!FT[map[metric]].types.includes(d.type))continue;const key=d.id+':'+metric,high=S.metrics[d.id][metric]>threshold;S.thresholdHold[key]=high?(S.thresholdHold[key]||0)+1:0;const issue=activeIssues(d.id).find(i=>i.fault===map[metric]);if(high&&S.thresholdHold[key]>=3&&!issue)createIssue(d.id,map[metric],null,{measured:true,value:Number(S.metrics[d.id][metric].toFixed(1))});if(issue&&issue.measured&&S.metrics[d.id][metric]<threshold*.93){resolveIssue(issue,'임계값 감시');const c=S.cases.find(c=>c.id===issue.caseId);if(c&&!['working','verifying'].includes(c.state)){c.state='verifying';S.jobs.push({caseId:c.id,stage:2,due:S.elapsed+8,actor:'임계값 감시'})}}}}}
function sample(){INVENTORY.forEach(d=>{S.history[d.id].push({...S.metrics[d.id],receivedAt:S.metrics[d.id].at,at:S.elapsed,missing:missing(d.id)});S.history[d.id]=S.history[d.id].slice(-MAX_HISTORY)});SERVICES.forEach(s=>{const h=serviceHealth(s);S.serviceHistory[s.id].push({at:S.elapsed,success:h.success*100,latency:h.latency});S.serviceHistory[s.id]=S.serviceHistory[s.id].slice(-MAX_HISTORY)})}
function tick(){if(S.paused)return;S.elapsed++;for(const [host,end] of Object.entries(S.maintenance)){if(end<=S.elapsed){delete S.maintenance[host];emit({host,cat:'감시운영',sev:5,message:`[${host}] 점검 시간이 종료되었습니다. 알림을 다시 허용합니다.`});logAudit(`${host} 점검 종료`,'감시 엔진');if(activeIssues(host).length)emit({host,cat:'감시운영',sev:3,message:`[${host}] 점검 종료 후에도 미복구 경보 ${activeIssues(host).length}건이 남아 있습니다.`,kind:'fault'})}}
 for(const p of S.pending.filter(p=>p.at<=S.elapsed)){const c=S.cases.find(c=>c.id===p.caseId);if(c&&!['working','verifying','resolved'].includes(c.state)){const i=createIssue(p.host,p.fault,c);if(i&&c.ackAt)i.ack=true}}S.pending=S.pending.filter(p=>p.at>S.elapsed);
 advanceJobs();updateMetrics();thresholdCheck();
 for(const i of activeIssues()){if(S.elapsed>=i.repeatAt){i.last=S.elapsed;i.repeatAt=S.elapsed+random(18,30);emit({host:i.host,cat:FT[i.fault].cat,sev:i.sev,object:FT[i.fault].object,message:issueMessage(i),issueId:i.id,caseId:i.caseId,kind:'repeat'})}}
 if(S.prefs.autoRecover){for(const c of activeCases())if(S.elapsed>=c.autoAt&&['new','ack'].includes(c.state))requestRecovery(c.id,'자동 복구')}
 if(S.elapsed>=S.nextFault){S.nextFault=S.elapsed+random(20,36);if(S.prefs.autoFault&&activeCases().length<6){if(rng()<.4){const candidates=SCENARIOS.filter(sc=>!activeIssues(sc.root[0]).some(i=>i.fault===sc.root[1]));if(candidates.length){startScenario(pick(candidates).id,false)}}else{const f=pick(FAULTS),targets=INVENTORY.filter(d=>f.types.includes(d.type)&&!activeIssues(d.id).length&&!inMaintenance(d.id));if(targets.length)createIssue(pick(targets).id,f.id)}}}
 if(S.elapsed>=S.nextNotice){S.nextNotice=S.elapsed+random(7,15);const n=pick(NOTICES),ds=INVENTORY.filter(d=>n.types.includes(d.type)&&!activeIssues(d.id).length&&!missing(d.id)&&hostImpact(d.id)<.1);if(ds.length){const d=pick(ds);emit({host:d.id,cat:n.cat,sev:n.sev,object:n.object,message:`[${d.id}] ${n.message}`})}}
 for(const s of SERVICES){const h=serviceHealth(s),m=S.serviceStats[s.id];m.samples++;m.success+=h.success;m.latencySum+=h.latency;if(h.impact>.1)m.badSeconds++}if(S.elapsed%5===0)sample();if(S.elapsed%60===0)pruneHistory();
}
function pruneHistory(){const retainedCases=new Set(S.cases.filter(c=>c.state!=='resolved').map(c=>c.id));S.cases.filter(c=>c.state==='resolved').slice(0,120).forEach(c=>retainedCases.add(c.id));S.cases=S.cases.filter(c=>retainedCases.has(c.id));const linkedIssues=new Set(S.events.map(e=>e.issueId).filter(Boolean));S.issues=S.issues.filter(i=>!i.resolvedAt||retainedCases.has(i.caseId)||linkedIssues.has(i.id))}
function setMaintenance(host,minutes){if(minutes>0)S.maintenance[host]=S.elapsed+minutes*60;else delete S.maintenance[host];emit({host,sev:5,cat:'감시운영',message:`[${host}] ${minutes>0?`점검 시작 · ${minutes}분 동안 경보음과 신규 경보 통지를 억제합니다. 수집은 계속합니다.`:'점검을 종료했습니다. 경보 알림을 다시 허용합니다.'}`});logAudit(`${host} 점검 ${minutes>0?minutes+'분 설정':'해제'}`);saveState();toast(minutes>0?'점검 중에도 상태·성능·이벤트는 계속 수집됩니다.':'점검을 종료했습니다.');openHost(host)}
function beep(){if(S.elapsed-lastSound<8)return;lastSound=S.elapsed;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.2);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.22)}catch(e){}}
function toast(message,error=false){const d=document.createElement('div');d.className='toast'+(error?' error':'');d.textContent=message;$('toasts').append(d);while($('toasts').children.length>3)$('toasts').firstChild.remove();setTimeout(()=>d.remove(),4700)}
function saveState(){S.savedAt=Date.now();try{localStorage.setItem(STORAGE,JSON.stringify(S));saveError=false}catch(e){saveError=true}$('saveWarning').hidden=!saveError}
function validateState(x){const fail=()=>{throw new Error('이 시뮬레이터의 유효한 기록 파일이 아닙니다.')};if(!x||x.version!==VERSION||!Number.isFinite(x.elapsed)||x.elapsed<0||!Number.isFinite(x.start)||!Number.isInteger(x.rng)||!x.rng||!Number.isFinite(x.received)||x.received<0)fail();for(const k of ['seq','issueSeq','caseSeq'])if(!Number.isInteger(x[k])||x[k]<0)fail();if(!x.prefs||![1,2,4].includes(x.prefs.speed)||['sound','dedup','autoRecover','autoFault','alerts'].some(k=>typeof x.prefs[k]!=='boolean'))fail();if(typeof x.paused!=='boolean')fail();for(const [k,min,max] of [['cpu',20,99],['mem',20,99],['disk',20,99],['latency',100,5000],['temp',20,50]])if(!Number.isFinite(x.thresholds?.[k])||x.thresholds[k]<min||x.thresholds[k]>max)fail();if(!Array.isArray(x.events)||x.events.length>MAX_EVENTS||!Array.isArray(x.issues)||x.issues.length>2000||!Array.isArray(x.cases)||x.cases.length>1000||!Array.isArray(x.audit)||x.audit.length>300||!Array.isArray(x.jobs)||!Array.isArray(x.pending)||x.jobs.length>1000||x.pending.length>1000)fail();const issueIds=new Set(x.issues.map(i=>i.id)),caseIds=new Set(x.cases.map(c=>c.id));if(issueIds.size!==x.issues.length||caseIds.size!==x.cases.length)fail();const validTime=t=>Number.isFinite(t)&&t>=0&&t<=x.elapsed+.001;for(const i of x.issues)if(!DEVICE[i.host]||!FT[i.fault]||!FT[i.fault].types.includes(DEVICE[i.host].type)||!/^AL-\d+$/.test(i.id)||!Number.isInteger(i.sev)||i.sev<0||i.sev>7||!validTime(i.created)||!Number.isFinite(i.repeatAt)||(i.resolvedAt!==null&&!validTime(i.resolvedAt))||typeof i.ack!=='boolean')fail();for(const e of x.events)if(!DEVICE[e.host]||!CATEGORIES.includes(e.cat)||!Number.isInteger(e.id)||e.id<1||e.id>x.seq||!Number.isInteger(e.sev)||e.sev<0||e.sev>7||!validTime(e.at)||typeof e.message!=='string'||e.message.length>4000||typeof e.object!=='string'||typeof e.fingerprint!=='string'||(e.issueId&&!issueIds.has(e.issueId))||!['info','fault','repeat','recovery'].includes(e.kind))fail();for(const c of x.cases){if(!/^INC-\d+$/.test(c.id)||!issueIds.has(c.rootId)||!['new','ack','working','verifying','resolved'].includes(c.state)||!validTime(c.created)||!Number.isFinite(c.autoAt)||typeof c.title!=='string'||typeof c.owner!=='string'||typeof c.note!=='string'||c.note.length>2000||!Array.isArray(c.log)||c.log.length>70)fail();if(c.log.some(l=>!validTime(l.at)||typeof l.message!=='string'||typeof l.actor!=='string'))fail()}
 for(const d of INVENTORY){const m=x.metrics?.[d.id],h=x.history?.[d.id];if(!m||!Number.isFinite(m.at)||!Array.isArray(h)||h.length>MAX_HISTORY)fail();for(const k of Object.keys(METRICS))if(!Number.isFinite(m[k])||m[k]<0||m[k]>100000)fail();for(const a of h)if(!Number.isFinite(a.at)||typeof a.missing!=='boolean'||Object.keys(METRICS).some(k=>!Number.isFinite(a[k])))fail()}
 for(const s of SERVICES){const m=x.serviceStats?.[s.id],h=x.serviceHistory?.[s.id];if(!m||!Array.isArray(h)||h.length>MAX_HISTORY||['samples','success','latencySum','badSeconds'].some(k=>!Number.isFinite(m[k])||m[k]<0)||m.success>m.samples+1e-6)fail();if(h.some(a=>!Number.isFinite(a.at)||!Number.isFinite(a.success)||!Number.isFinite(a.latency)))fail()}
 if(!x.maintenance||Object.entries(x.maintenance).some(([k,v])=>!DEVICE[k]||!Number.isFinite(v))||!x.thresholdHold||Object.values(x.thresholdHold).some(v=>!Number.isFinite(v))||!Number.isFinite(x.nextFault)||!Number.isFinite(x.nextNotice))fail();for(const j of x.jobs)if(!caseIds.has(j.caseId)||![0,1,2].includes(j.stage)||!Number.isFinite(j.due)||typeof j.actor!=='string')fail();for(const p of x.pending)if(!caseIds.has(p.caseId)||!DEVICE[p.host]||!FT[p.fault]||!Number.isFinite(p.at))fail();if(x.audit.some(a=>!validTime(a.at)||typeof a.message!=='string'||typeof a.actor!=='string'))fail();return x}
function exportFile(kind){let text,type,name;if(kind==='json'){saveState();text=JSON.stringify(S,null,2);type='application/json';name='monitoring-session.json'}else{const rows=[['이벤트번호','시뮬레이션시각','중요도','호스트','분류','대상','메시지','장애번호','알림억제','상태'],...S.events.map(e=>[e.id,new Date(S.start+e.at*1000).toISOString(),SEV[e.sev][0],e.host,e.cat,e.object,e.message,e.caseId||'',e.suppressed?'예':'아니오',eventState(e).label])];const quote=v=>'"'+String(v).replace(/^[=+\-@\t\r]/,"'$&").replace(/"/g,'""')+'"';text='\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n');type='text/csv;charset=utf-8';name='monitoring-events.csv'}const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast(kind==='json'?'세션 기록 파일을 내보냈습니다.':'보관 중인 전체 원본 이벤트를 CSV로 내보냈습니다.')}

 else if(UI.view==='summary')html=head('운영 요약','업무 상태, 감시 품질, 대응 현황을 한눈에',`<button data-action="scenario">장애 시나리오</button>`)+`<div id="content"></div>`;
 else if(UI.view==='hosts')html=head('감시 대상','21종의 장비 · 상태와 점검 시간을 함께 관리',`<span class="pill soft">${INVENTORY.length} DEVICES</span>`)+`<div class="toolbar"><label class="searchbox">${icon('search')}<input type="search" id="hostSearch" placeholder="장비명·역할·IP 검색" aria-label="장비 검색" value="${esc(UI.hostSearch)}"></label><select id="hostType" aria-label="장비 종류">${options([['all','모든 종류'],...Object.entries(TYPES).map(([k,v])=>[k,v[0]])],UI.hostType)}</select><select id="hostState" aria-label="장비 상태">${options([['all','모든 상태'],['fault','장애·주의'],['unknown','미수신'],['normal','정상'],['maintenance','점검 중']],UI.hostState)}</select><select id="hostZone" aria-label="센터">${options([['all','모든 센터'],['주센터','주센터'],['DR센터','DR센터']],UI.hostZone)}</select></div><div id="content"></div>`;
 else if(UI.view==='map')html=head('구성·영향도 맵','업무가 의존하는 장비와 현재 영향 경로',`<span class="pill info">새 화면 01</span>`)+`<div id="content"></div>`;
 else if(UI.view==='performance')html=head('성능 추이','5초 주기 수집 · 최근 10분의 시뮬레이션 시간',`<span class="pill info">새 화면 02</span>`)+`<div class="toolbar"><label for="performanceHost" class="muted">감시 대상</label><select class="grow" id="performanceHost">${options(INVENTORY.map(d=>[d.id,`${d.id} · ${d.role}`]),UI.performance)}</select><button data-action="host" data-id="${UI.performance}" id="perfDetailBtn">장비 상세</button></div><div id="content"></div>`;
 else if(UI.view==='incidents')html=head('장애 대응실','원인 경보 → 후속 증상 → 복구 → 검증',`<button class="primary" data-action="scenario">시나리오 실행</button>`)+`<div class="toolbar"><div class="filter-chips" style="margin:0">${[['open','대응 중'],['unack','미확인'],['resolved','복구 완료'],['all','전체']].map(([v,n])=>`<button data-action="case-filter" data-id="${v}" class="${UI.caseState===v?'active':''}" style="--sev:var(--teal)">${n}</button>`).join('')}</div><span class="grow"></span><button class="quiet" data-action="ack-all">미확인 일괄 확인</button></div><div id="content"></div>`;
 else html=head('운영 설정','감시 규칙, 자동 진행, 저장과 운영 기록')+`<div id="content"></div>`;
 $('view').innerHTML=html;renderContent()}
function renderContent(){const c=$('content');if(!c)return;const before=$('main').scrollTop;let html;if(UI.view==='events')html=renderEvents();else if(UI.view==='summary')html=renderSummary();else if(UI.view==='hosts')html=renderHosts();else if(UI.view==='map')html=renderMap();else if(UI.view==='performance')html=renderPerformance();else if(UI.view==='incidents')html=renderCases();else html=renderSettings();c.innerHTML=html;$('main').scrollTop=before}
function renderEvents(){const rows=eventRows(),retained=UI.freeze||S.events;return `${UI.freeze?`<div class="freeze-note">목록이 고정되었습니다. 감시와 수집은 계속 진행 중입니다. 현재 추가 수신 ${Math.max(0,S.seq-UI.freezeSeq)}건.</div>`:''}${UI.cat!=='all'||UI.host!=='all'?`<div class="flex wrap small muted">표시 범위: ${esc(UI.cat==='all'?'모든 분류':UI.cat)} / ${esc(UI.host==='all'?'모든 장비':UI.host)} <button class="quiet small" data-action="clear-filters">필터 해제</button></div>`:''}<div class="list-status"><span>${fmt(rows.length)}${S.prefs.dedup?'개 묶음':'건'} · ${S.prefs.dedup?'반복 경보 통합':'원본 수신 순서'}</span><span>원본 ${fmt(retained.length)}/${fmt(MAX_EVENTS)}건 보관</span></div>${rows.length?`<div class="panel flat event-feed"><div class="event-table-head"><span>수신 시각</span><span>중요도</span><span>발생 장비</span><span>메시지 / 감시 대상</span><span style="text-align:right">처리 상태</span></div>${rows.slice(0,UI.limit).map(eventHTML).join('')}</div>${rows.length>UI.limit?`<div class="event-footer"><button data-action="more-events">이전 기록 ${Math.min(100,rows.length-UI.limit)}건 더 보기</button></div>`:''}`:`<div class="empty"><strong>표시 조건에 맞는 이벤트가 없습니다.</strong>필터는 화면 표시에만 적용됩니다. 수집은 계속 진행됩니다.<div class="spacer"></div><button data-action="reset-event-view">전체 이벤트 보기</button></div>`}`}
function spark(values,color,max=100){if(values.length<2)return `<svg class="spark" viewBox="0 0 160 40" aria-hidden="true"><path d="M0 30H160" stroke="#314158" stroke-dasharray="3 5"/></svg>`;const pts=values.map((n,i)=>`${i/(values.length-1)*160},${36-clamp(n/max,0,1)*28}`).join(' ');return`<svg class="spark" viewBox="0 0 160 40" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.7" vector-effect="non-scaling-stroke"/></svg>`}
function servicesHTML(selectable=false){return `<div class="grid5 services">${SERVICES.map(s=>{const h=serviceHealth(s),m=S.serviceStats[s.id],pct=m.samples?m.success/m.samples*100:100;return`<button class="panel service-card ${selectable&&s.id===UI.service?'selected':''}" data-action="service" data-id="${s.id}" aria-label="${s.name} ${h.state} 구성 보기"><div class="service-title"><strong>${s.name}</strong><span class="pill" style="color:${h.color}">${h.state}</span></div><div class="service-stat">${fmt(pct,2)}<span class="small muted"> %</span></div><div class="metric-caption">누적 시험 성공률 · 목표 ${s.slo}%</div>${spark(S.serviceHistory[s.id].map(p=>p.success),h.color)}</button>`}).join('')}</div>`}
function renderSummary(){const counts={normal:0,fault:0,unknown:0};INVENTORY.forEach(d=>counts[hostStatus(d.id).level]++);const finished=S.cases.filter(c=>c.state==='resolved'),mean=finished.length?finished.reduce((n,c)=>n+c.resolvedAt-c.created,0)/finished.length:0;const suppressed=S.events.filter(e=>e.suppressed).length;const rows=eventRowsAll();const collapsed=S.events.length-rows;const latest=S.cases.slice(0,4);return servicesHTML()+`<div class="grid3"><div class="panel"><div class="kpi-name">감시 데이터 수신</div><div class="metric-value">${INVENTORY.length-counts.unknown}<span class="muted" style="font-size:17px"> / ${INVENTORY.length}</span></div><div class="bar"><i style="width:${(INVENTORY.length-counts.unknown)/INVENTORY.length*100}%"></i></div><p class="metric-caption" style="margin-top:9px">${counts.unknown?`<span style="color:var(--purple)">미수신 ${counts.unknown}대</span> · 마지막 수신값 유지`:'모든 장비에서 지표를 수신하고 있습니다.'}</p></div><div class="panel"><div class="kpi-name">평균 복구 시간</div><div class="metric-value">${finished.length?duration(mean):'—'}</div><div class="metric-caption">복구 검증까지 완료한 ${finished.length}건 기준<br>최초 발생부터 복구 검증 완료까지의 경과 시간입니다.</div></div><div class="panel"><div class="kpi-name">반복 경보 묶기 효과</div><div class="metric-value">${fmt(collapsed)}<span class="muted" style="font-size:16px">건</span></div><div class="metric-caption">보관 중인 원본 ${fmt(S.events.length)}건 → ${fmt(rows)}개 묶음<br>점검 중 수집된 원본 ${suppressed}건</div></div><div class="panel full"><div class="section-title"><h3>감시 대상 분포</h3><button class="quiet small" data-action="navigate" data-id="hosts">장비 보기</button></div><div class="distribution">${[['normal','#62dbc1'],['fault','#edd178'],['unknown','#af9adc']].map(([k,color])=>`<i style="width:${counts[k]/INVENTORY.length*100}%;background:${color}" title="${k}: ${counts[k]}"></i>`).join('')}</div><div class="legend"><span class="good">● 정상 ${counts.normal}</span><span class="warn">● 장애·주의 ${counts.fault}</span><span style="color:var(--purple)">● 미수신 ${counts.unknown}</span><span>점검 ${Object.keys(S.maintenance).length}대</span></div><div class="heat">${INVENTORY.map(d=>{const st=hostStatus(d.id);return`<button data-action="host" data-id="${d.id}" style="background:${st.color}55;border-color:${st.color}" title="${d.id} · ${st.label}" aria-label="${d.id} ${st.label}"></button>`}).join('')}</div></div></div><div class="spacer"></div><div class="grid2" style="margin-top:10px"><div class="panel"><div class="section-title"><h3>최근 장애</h3><button class="quiet small" data-action="navigate" data-id="incidents">대응실 열기</button></div>${latest.length?latest.map(c=>{const root=S.issues.find(i=>i.id===c.rootId);return`<button class="row list-link" data-action="case" data-id="${c.id}"><span class="row-main"><strong>${esc(c.title)}</strong><small>${c.id} · ${root.host} · ${time(c.created)}</small></span><span class="statuslabel" style="color:${caseColor(c)}">${caseLabel(c)}</span></button>`}).join(''):'<p class="muted">접수된 장애가 없습니다.</p>'}</div><div class="panel"><div class="section-title"><h3>업무 시험 현황</h3><span class="small muted">감시 시작 이후</span></div>${SERVICES.map(s=>{const h=serviceHealth(s),m=S.serviceStats[s.id],rate=m.samples?m.success/m.samples*100:100;return`<div class="row"><span class="row-main"><strong>${s.name}</strong><small>현재 응답 ${fmt(h.latency)}ms · 저하 ${duration(m.badSeconds)}</small></span><span class="statuslabel ${rate>=s.slo?'good':'bad'}">${rate>=s.slo?'목표 충족':'목표 미달'}</span></div>`}).join('')}<p class="metric-caption" style="margin-top:12px">매 시뮬레이션 초의 가상 시험 성공 비율을 누적합니다. 짧은 감시 구간에서는 수치 변동이 큽니다.</p></div></div>`}
function eventRowsAll(){return new Set(S.events.map(e=>e.fingerprint)).size}
function renderHosts(){const q=UI.hostSearch.toLowerCase();const ds=INVENTORY.filter(d=>{const st=hostStatus(d.id);return(UI.hostType==='all'||d.type===UI.hostType)&&(UI.hostZone==='all'||d.zone===UI.hostZone)&&(UI.hostState==='all'||(UI.hostState==='maintenance'?st.maintenance:st.level===UI.hostState))&&[d.id,d.role,d.ip,TYPES[d.type][0]].join(' ').toLowerCase().includes(q)});return`<div class="list-status"><span>${ds.length}대 표시 / 전체 ${INVENTORY.length}대</span><span>장비를 눌러 상세·점검 설정</span></div>${ds.length?`<div class="device-list">${ds.map(d=>{const st=hostStatus(d.id),m=S.metrics[d.id],keys=metricsFor(d).slice(0,3);return`<button class="device-card" data-action="host" data-id="${d.id}"><div class="device-top"><span class="device-icon">${icon(TYPES[d.type][1])}</span><span class="grow"><strong>${d.id}</strong><small>${TYPES[d.type][0]}</small></span><span class="device-status" style="color:${st.color}"><span class="dot"></span> ${st.label}</span></div><div class="mini-metrics">${keys.map(k=>`<div><span>${METRICS[k].name}</span><b style="${S.thresholds[k]&&m[k]>S.thresholds[k]?'color:var(--yellow)':''}">${missing(d.id)?'—':fmt(m[k],k==='temp'?1:0)+METRICS[k].unit}</b></div>`).join('')}</div><div class="device-footer"><span>${d.zone}${st.maintenance?' · 점검 중':''}</span><span class="ip mono">${d.ip}</span>${st.level==='unknown'?`<span>마지막 ${duration(S.elapsed-m.at)} 전</span>`:''}</div></button>`}).join('')}</div>`:'<div class="empty"><strong>조건에 맞는 장비가 없습니다.</strong>장비 종류나 검색어를 바꿔 주세요.</div>'}`}
function dependencyClosure(ids){const found=new Set();function walk(id){if(found.has(id))return;found.add(id);DEVICE[id].deps.forEach(walk)}ids.forEach(walk);return [...found]}
function renderMap(){const svc=SERVICES.find(s=>s.id===UI.service),h=serviceHealth(svc),groupList=svc.groups.map(k=>GROUPS[k]);const related=dependencyClosure(groupList.flatMap(g=>g.ids));const affected=activeIssues().filter(i=>related.includes(i.host));const width=720,height=90+groupList.length*86,serviceX=16,serviceY=height/2-34;let edges='',nodes='';groupList.forEach((g,gi)=>{const y=65+gi*86,impact=Math.min(...g.ids.map(id=>hostImpact(id)));edges+=`<path d="M176 ${serviceY+34}H216V${y}H295" class="map-links ${impact>.1?'affected':''}" marker-end="url(#arr)"/>`;nodes+=`<text x="234" y="${y-15}" fill="#9aadc5" font-size="11">${g.name}</text>`;g.ids.forEach((id,di)=>{const d=DEVICE[id],st=hostStatus(id),x=di?511:299,native=activeIssues(id),impact=hostImpact(id);if(di)edges+=`<path d="M288 ${y}V${y+37}H503V${y}" class="map-links ${impact>.1?'affected':''}"/>`;nodes+=`<g class="node" role="button" tabindex="0" data-action="host" data-id="${id}" aria-label="${id} ${st.label}"><rect x="${x}" y="${y-24}" width="194" height="52" rx="7" fill="#131f2e" stroke="${st.color}" stroke-opacity=".7"/><circle cx="${x+13}" cy="${y-5}" r="3" fill="${st.color}"/><text x="${x+23}" y="${y}" fill="#dfebfc" font-family="ui-monospace,monospace" font-size="12">${id}</text><text x="${x+12}" y="${y+17}" fill="${native.length||st.level==='unknown'?st.color:impact>.1?'#edd178':'#91a3bc'}" font-size="11">${st.level==='unknown'?'미수신':native.length?st.label:impact>.1?'상위 의존 장비의 영향':d.role.slice(0,20)}</text></g>`})});return servicesHTML(true)+`<div class="grid2"><div class="panel full"><div class="section-title"><h3>${svc.name} · 의존 경로</h3><span class="pill" style="color:${h.color}">${h.state}</span></div><p class="small muted mobile-note" style="margin-bottom:10px">지도를 좌우로 움직일 수 있습니다. 장비를 누르면 상세가 열립니다.</p><div class="map-wrap"><svg class="topology-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${svc.name} 업무의 의존 장비 지도"><defs><marker id="arr" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L6 3L0 6" fill="#69829f"/></marker></defs>${edges}<rect x="${serviceX}" y="${serviceY}" width="160" height="68" rx="10" fill="#122e2a" stroke="${h.color}"/><text x="96" y="${serviceY+29}" text-anchor="middle" fill="#e0f7ef" font-size="17" font-weight="600">${svc.name}</text><text x="96" y="${serviceY+50}" text-anchor="middle" fill="${h.color}" font-size="12">${h.state} · ${fmt(h.latency)}ms</text>${nodes}<text x="16" y="26" fill="#91a3bc" font-size="11">업무 → 의존 장비 · 같은 행의 두 장비는 대체 가능</text></svg></div><div class="legend" style="margin-top:12px"><span class="bad">━ 업무에 영향이 있는 의존 경로</span><span>━ 정상 경로</span><span style="color:var(--purple)">● 미수신</span><span>점검 중에도 영향 계산 유지</span></div></div><div class="panel"><div class="section-title"><h3>영향 원인 ${affected.length}건</h3><span class="small muted">기반 장비 포함</span></div>${affected.length?affected.map(i=>`<button class="row list-link" data-action="case" data-id="${i.caseId}"><span class="row-main"><strong>${FT[i.fault].title}</strong><small>${i.host} · ${i.caseId}</small></span>${severityPill(i.sev)}</button>`).join(''):'<p class="muted">선택한 업무의 의존 장비에서 활성 경보가 없습니다.</p>'}</div><div class="panel"><div class="section-title"><h3>기반 장비 의존 관계</h3><span class="small muted">직접 연결 기준</span></div>${related.filter(id=>DEVICE[id].deps.length).slice(0,12).map(id=>`<div class="row"><span class="row-main"><strong class="mono" style="font-size:12px">${id}</strong><small>의존 대상: ${DEVICE[id].deps.join(' · ')}</small></span><button class="quiet small" data-action="host" data-id="${id}">보기</button></div>`).join('')}<p class="metric-caption" style="margin-top:12px">코어 스위치의 두 방화벽 경로는 대체 관계입니다. 나머지 기반 장비 의존 관계는 모두 필요 조건으로 계산합니다.</p></div></div>`}
function chart(host,key){const all=S.history[host],meta=METRICS[key],max=Math.max(meta.max,...all.filter(p=>!p.missing).map(p=>p[key]*1.1)),threshold=S.thresholds[key];if(all.length<2)return '<div class="chart-empty">두 번째 측정값을 기다리는 중입니다.</div>';let segments=[],current=[];all.forEach((p,i)=>{if(p.missing){if(current.length)segments.push(current);current=[];return}current.push([i/(all.length-1)*500,130-clamp(p[key]/max,0,1)*116])});if(current.length)segments.push(current);const line=segments.map(pts=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${meta.color}" stroke-width="2" vector-effect="non-scaling-stroke"/>`).join('');return`<svg class="trend-chart" viewBox="0 0 500 146" preserveAspectRatio="none" role="img" aria-label="${meta.name} 최근 ${all.length}개 측정값. 미수신 구간은 선을 연결하지 않습니다.">${[14,72,130].map(y=>`<path d="M0 ${y}H500" stroke="#2a394b" stroke-width=".7"/>`).join('')}${threshold?`<path class="threshold-line" d="M0 ${130-threshold/max*116}H500"/>`:''}${line}<text x="1" y="10" fill="#a0afc1" font-size="10">${fmt(max)}${meta.unit}</text></svg><div class="chart-labels"><span>${time(all[0].at)}</span><span>${threshold?'임계값 '+threshold+meta.unit:''}</span><span>${time(all.at(-1).at)}</span></div>`}
function renderPerformance(){const d=DEVICE[UI.performance],m=S.metrics[d.id],st=hostStatus(d.id),keys=metricsFor(d);const ranking=INVENTORY.filter(x=>!missing(x.id)).sort((a,b)=>S.metrics[b.id].latency-S.metrics[a.id].latency).slice(0,8);return `${missing(d.id)?`<div class="note warn" style="margin-bottom:15px">${d.id}의 새 측정값을 수신하지 못하고 있습니다. 마지막 수신 ${time(m.at)} (${duration(S.elapsed-m.at)} 전). 미수신 구간은 그래프의 선을 끊어 표시합니다.</div>`:''}<div class="panel" style="margin-bottom:16px"><div class="flex between wrap"><div><strong class="mono">${d.id}</strong><p class="small muted">${d.role} · ${d.zone} · ${d.protocol}</p></div><span class="pill" style="color:${st.color}">${st.label}</span></div></div><div class="grid2">${keys.map(k=>`<div class="panel"><div class="chart-title"><h3>${METRICS[k].name}</h3><strong style="color:${METRICS[k].color}">${missing(d.id)?'—':fmt(m[k],k==='temp'?1:0)}<span class="small muted"> ${METRICS[k].unit}</span></strong></div>${chart(d.id,k)}</div>`).join('')}</div><div class="panel" style="margin-top:16px"><div class="section-title"><h3>응답 지연 상위 장비</h3><span class="small muted">미수신 대상 제외</span></div><div class="table-wrap"><table><thead><tr><th>장비</th><th>종류</th><th>응답시간</th><th>상태</th><th></th></tr></thead><tbody>${ranking.map(x=>{const st=hostStatus(x.id);return`<tr><td class="mono">${x.id}</td><td>${TYPES[x.type][0]}</td><td class="mono">${fmt(S.metrics[x.id].latency)}ms</td><td style="color:${st.color}">${st.label}</td><td><button class="quiet small" data-action="performance" data-id="${x.id}">추이</button></td></tr>`}).join('')}</tbody></table></div><p class="metric-caption" style="margin-top:12px">장비 그래프는 수집된 측정값입니다. 업무 성공률과 응답시간은 구성도의 의존 관계를 반영한 별도의 시험 값입니다.</p></div>`}
function caseLabel(c){return({new:'미확인',ack:'확인됨',working:'복구 작업 중',verifying:'복구 검증 중',resolved:'복구 완료'})[c.state]}
function caseColor(c){return c.state==='resolved'?'var(--teal)':c.state==='new'?'var(--yellow)':'var(--blue)'}
function caseProgress(c){const j=S.jobs.find(j=>j.caseId===c.id);if(!j)return'';const pct=j.stage===0?20:j.stage===1?55:85;return`<div class="case-progress"><div class="flex between small muted" style="margin-bottom:7px"><span>${j.stage===0?'사전 상태 확인':j.stage===1?'복구 조치 적용':'복구 후 검증'}</span><span>다음 단계 ${Math.max(0,Math.ceil(j.due-S.elapsed))}초</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`}
function renderCases(){let cases=S.cases.filter(c=>UI.caseState==='all'||(UI.caseState==='open'?c.state!=='resolved':UI.caseState==='unack'?c.state==='new':c.state==='resolved'));return `<div class="list-status"><span>${cases.length}건 표시 · 현재 대응 중 ${activeCases().length}건</span><span>${S.prefs.autoRecover?'자동 복구 켜짐':'자동 복구 꺼짐'}</span></div>${cases.length?`<div class="case-grid">${cases.map(c=>{const root=S.issues.find(i=>i.id===c.rootId),all=S.issues.filter(i=>i.caseId===c.id),hostSet=[...new Set(all.map(i=>i.host))],impact=[...new Set(hostSet.flatMap(affectedServices))];return `<article class="panel case" style="--sev:${c.state==='resolved'?'var(--teal)':SEV[root.sev][2]}"><div class="flex between wrap"><span class="mono small muted">${c.id}</span><span class="pill" style="color:${caseColor(c)}">${caseLabel(c)}</span></div><h3>${esc(c.title)}</h3><p class="meta">최초 원인 <b class="mono">${root.host}</b><br>${time(c.created)} · ${duration((c.resolvedAt||S.elapsed)-c.created)} 경과 · 담당 ${esc(c.owner)}</p><div class="case-tags">${impact.length?impact.map(n=>`<span>${n}</span>`).join(''):'<span>업무 직접 영향 없음</span>'}${inMaintenance(root.host)?'<span>점검 중</span>':''}<span>연결 경보 ${all.length}건</span></div><div class="small muted">${all.length>1?`원인 경보 1건에 후속 증상 ${all.length-1}건을 연결했습니다.`:FT[root.fault].detail}</div>${caseProgress(c)}<div class="case-actions"><button data-action="case" data-id="${c.id}">상세·대응 기록</button>${['new','ack'].includes(c.state)?`<button class="primary" data-action="recover-prompt" data-id="${c.id}">복구 절차</button>`:''}</div></article>`}).join('')}</div>`:`<div class="empty"><strong>${UI.caseState==='resolved'?'복구 완료 기록이 아직 없습니다.':'표시할 장애가 없습니다.'}</strong>${UI.caseState==='open'?'자동 감시를 지켜보거나 장애 시나리오를 직접 실행해 보세요.':'다른 처리 상태를 선택해 보세요.'}<div class="spacer"></div><button data-action="scenario">장애 시나리오 열기</button></div>`}`}
function switchRow(key,title,desc){return`<div class="setting-row"><label for="pref-${key}">${title}<small>${desc}</small></label><input id="pref-${key}" type="checkbox" class="switch" data-pref="${key}" ${S.prefs[key]?'checked':''}></div>`}
function renderSettings(){return`<div class="settings-grid"><div class="panel"><h3>자동 진행과 알림</h3>${switchRow('autoFault','자동 장애 발생','일상 이벤트와 간헐적 장애를 자동으로 진행')}${switchRow('autoRecover','자동 복구','발생 후 약 2~4분 사이 자동 절차 시작')}${switchRow('dedup','반복 경보 묶기','같은 경보를 한 줄로 묶고 수신 횟수 표시')}${switchRow('alerts','중대 경보 통지','긴급·경보·치명의 알림 허용 · 점검 제외')}${switchRow('sound','경보음','사용자 조작 후 활성화 · 8초 이상 간격 · 통지 허용 시 재생')}<p class="metric-caption" style="margin-top:13px">배속과 점검 시간은 시뮬레이션 시간을 기준으로 합니다. 다른 탭으로 이동하면 진행을 쉬고, 돌아오면 이어집니다.</p></div><div class="panel"><h3>자원 임계값</h3><p class="metric-caption" style="margin-top:8px">해당 지표가 있는 장비만 적용합니다. 3회 연속 초과하면 경보, 임계값의 93% 아래로 내려오면 해제합니다.</p><form id="thresholdForm"><div class="threshold-grid">${[['cpu','CPU 사용률 (%)',20,99],['mem','메모리 사용률 (%)',20,99],['disk','볼륨 사용률 (%)',20,99],['latency','웹·API 응답시간 (ms)',100,5000],['temp','환경 센서 온도 (°C)',20,50]].map(([key,label,min,max])=>`<label>${label}<input name="${key}" type="number" inputmode="numeric" min="${min}" max="${max}" step="1" value="${S.thresholds[key]}" required></label>`).join('')}</div><button class="primary" type="submit">임계값 적용</button></form><p class="metric-caption" style="margin-top:14px">장애 시나리오의 직접 경보는 임계값과 별개입니다. 예: 인증서 만료는 CPU 설정을 바꾸어도 해제되지 않습니다.</p></div><div class="panel"><h3>세션과 이벤트 기록</h3><div class="row"><span class="row-main"><strong>이 브라우저에 자동 저장</strong><small>약 15초마다 저장 · 현재 감시 ${duration(S.elapsed)}</small></span><span class="small ${saveError?'bad':'good'}">${saveError?'사용 불가':'사용 중'}</span></div><div class="row"><span class="row-main"><strong>원본 이벤트 ${fmt(S.events.length)}건 보관</strong><small>최대 ${fmt(MAX_EVENTS)}건 · CSV는 필터와 무관하게 전체 원본</small></span></div><div class="settings-buttons"><button data-action="export" data-id="csv">이벤트 CSV</button><button data-action="export" data-id="json">전체 기록 JSON</button></div><div class="settings-buttons"><button data-action="import">기록 불러오기</button><button data-action="save">지금 저장</button></div><div class="divider"></div><button class="danger" data-action="reset-prompt">시뮬레이션 새로 시작</button><p class="metric-caption" style="margin-top:12px">JSON에는 장비 상태·장애·메모·성능 이력이 포함됩니다. 파일을 다시 불러오면 이어서 볼 수 있습니다.</p></div><div class="panel"><div class="section-title"><h3>운영 감사 기록</h3><button class="quiet small" data-action="audit">전체 보기</button></div>${S.audit.slice(0,5).map(a=>`<div class="row"><span class="row-main"><strong style="font-size:13px">${esc(a.message)}</strong><small>${time(a.at)} · ${esc(a.actor)}</small></span></div>`).join('')||'<p class="muted">아직 운영 조작 기록이 없습니다.</p>'}<p class="metric-caption" style="margin-top:12px">담당자 지정, 점검, 임계값 변경, 복구 실행을 기록합니다.</p></div><details class="full"><summary>메시지·장비 도감 · ${CATEGORIES.length}개 분류 / ${FAULTS.length+NOTICES.length}개 기본 유형</summary><div><p class="small muted">아래 기본 유형 외에 장애별 반복 경보, 복구 알림, 운영 조작 기록이 생성됩니다. 중요도는 발생 조건에 따라 결정됩니다.</p><div class="catalog">${CATEGORIES.map(cat=>`<div><h3>${cat} <span class="muted small">${FAULTS.filter(f=>f.cat===cat).length+NOTICES.filter(n=>n.cat===cat).length}종</span></h3>${FAULTS.filter(f=>f.cat===cat).map(f=>`<p><span style="color:${SEV[f.sev][2]}">[${SEV[f.sev][0]}]</span> ${f.title}</p>`).join('')}${NOTICES.filter(n=>n.cat===cat).map(n=>`<p class="muted">[${SEV[n.sev][0]}] ${n.message}</p>`).join('')}</div>`).join('')}</div><div class="divider"></div><h3>감시 장비 ${Object.keys(TYPES).length}종 · ${INVENTORY.length}대</h3><p class="small muted" style="margin-top:9px">${Object.entries(TYPES).map(([k,v])=>`${v[0]} ${INVENTORY.filter(d=>d.type===k).length}대`).join(' · ')}</p></div></details><div class="full"><button class="quiet" data-action="help">원본 분석·변경 내용·사용 안내</button><span class="offline-mark" style="margin-left:12px">JP1 스타일 훈련 시뮬레이터 · v3 · 외부 연결 없음</span></div></div>`}
function openModal(title,body,footer='',wide=false,meta=null){if(!UI.modal)UI.lastFocus=document.activeElement;UI.modal=meta||{type:'generic'};$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalFooter').innerHTML=footer||'<button data-action="close">닫기</button>';$('modal').classList.toggle('wide',wide);$('modalBackdrop').hidden=false;$('app').inert=true;$('modalBody').scrollTop=0;$('modal').querySelector('.modal-close').focus()}
function closeModal(){if($('modalBackdrop').hidden)return;$('modalBackdrop').hidden=true;$('app').inert=false;UI.modal=null;const focus=UI.lastFocus;if(focus?.isConnected)focus.focus();UI.lastFocus=null;renderHeader();if(UI.view!=='settings')renderContent()}
function openEvent(id){const e=(UI.freeze||[]).find(e=>e.id===Number(id))||S.events.find(e=>e.id===Number(id));if(!e)return toast('이 이벤트는 보관 범위를 벗어났습니다.');const i=S.issues.find(i=>i.id===e.issueId),f=i?FT[i.fault]:null,c=S.cases.find(c=>c.id===e.caseId),st=eventState(e),same=(UI.freeze||S.events).filter(x=>x.fingerprint===e.fingerprint);openModal(`${SEV[e.sev][0]} · EVT-${String(e.id).padStart(5,'0')}`,`<div class="flex wrap" style="margin-bottom:17px">${severityPill(e.sev)}<span class="pill soft">${esc(e.cat)}</span><span class="pill" style="color:${st.color}">${st.label}</span>${e.suppressed?'<span class="pill info">점검 중 수집</span>':''}</div><dl class="detail-pairs"><dt>수신 시각</dt><dd class="mono">${time(e.at)}</dd><dt>발생 장비</dt><dd class="mono">${e.host} · ${DEVICE[e.host].ip}</dd><dt>장비 종류</dt><dd>${TYPES[DEVICE[e.host].type][0]} / ${DEVICE[e.host].zone}</dd><dt>감시 대상</dt><dd class="mono">${esc(e.object)}</dd><dt>연결 장애</dt><dd>${e.caseId||'—'}</dd><dt>반복 수신</dt><dd>보관 중 ${same.length}회${same.length>1?' · 최초 '+time(same.at(-1).at):''}</dd></dl><div class="note" style="margin-top:17px">${esc(e.message)}</div>${f?`<div class="spacer"></div><div class="row"><span class="row-main"><strong>권장 대응</strong><small>${f.fix}</small></span></div>`:''}${i?`<p class="small muted" style="margin-top:12px">${i.parent?'후속 증상입니다. 연결 장애의 최초 원인을 복구하면 이 경보도 함께 검증됩니다.':'장애 확인은 수신 확인입니다. 복구 절차가 완료되어야 실제 상태가 정상으로 돌아옵니다.'}</p>`:''}`,`<button data-action="host" data-id="${e.host}">장비 보기</button>${c?`<button class="primary" data-action="case" data-id="${c.id}">장애 대응 기록</button>`:''}`,false,{type:'event',id:e.id})}
function openHost(id){const d=DEVICE[id];if(!d)return;const st=hostStatus(id),m=S.metrics[id],issues=activeIssues(id),downstream=INVENTORY.filter(x=>x.deps.includes(id));const affected=SERVICES.filter(s=>dependencyClosure(s.groups.flatMap(k=>GROUPS[k].ids)).includes(id));openModal(`${id} · 장비 상세`,`<div class="flex wrap" style="margin-bottom:16px"><span class="pill" style="color:${st.color}">${st.label}</span><span class="pill soft">${TYPES[d.type][0]}</span>${st.maintenance?`<span class="pill info">점검 종료까지 ${duration(S.maintenance[id]-S.elapsed)}</span>`:''}</div><dl class="detail-pairs"><dt>역할</dt><dd>${d.role}</dd><dt>위치 / 주소</dt><dd>${d.zone} / <span class="mono">${d.ip}</span></dd><dt>수집 방식</dt><dd>${d.protocol}</dd><dt>감시 수집기</dt><dd class="mono">${d.collector||'자체 수집'}</dd><dt>마지막 수신</dt><dd>${time(m.at)} · ${duration(S.elapsed-m.at)} 전</dd><dt>직접 의존</dt><dd>${d.deps.length?d.deps.join(' · '):'없음'}</dd><dt>참조 장비</dt><dd>${downstream.length?downstream.map(x=>x.id).join(' · '):'없음'}</dd><dt>관련 업무</dt><dd>${affected.map(s=>s.name).join(' · ')||'직접 업무 의존 없음'}</dd></dl><div class="grid2" style="margin-top:18px">${metricsFor(d).map(k=>`<div class="panel"><div class="kpi-name">${METRICS[k].name}${missing(id)?' · 마지막 수신값':''}</div><div class="metric-value" style="font-size:23px">${fmt(m[k],k==='temp'?1:0)}<span class="small muted">${METRICS[k].unit}</span></div></div>`).join('')}</div><div class="section-title" style="margin-top:20px"><h3>활성 경보 ${issues.length}건</h3></div>${issues.map(i=>`<button class="row list-link" data-action="case" data-id="${i.caseId}"><span class="row-main"><strong>${FT[i.fault].title}</strong><small>${i.caseId} · ${i.ack?'확인됨':'미확인'}</small></span>${severityPill(i.sev)}</button>`).join('')||`<p class="small muted">${missing(id)?'장비 자체의 경보는 없지만 감시 경로에서 데이터를 받지 못하고 있습니다.':'장비 자체에서 활성 경보가 없습니다.'}</p>`}<div class="divider"></div><h3>점검 시간 설정</h3><p class="small muted" style="margin:8px 0 12px">점검 중에는 경보음을 억제합니다. 이벤트 수집과 장애·업무 영향 표시는 유지합니다.</p><div class="flex wrap"><button data-action="maintenance" data-id="${id}" data-minutes="5">5분 점검</button><button data-action="maintenance" data-id="${id}" data-minutes="15">15분 점검</button><button data-action="maintenance" data-id="${id}" data-minutes="30">30분 점검</button>${st.maintenance?`<button class="primary" data-action="maintenance" data-id="${id}" data-minutes="0">점검 종료</button>`:''}</div>`,`<button data-action="host-events" data-id="${id}">이벤트 보기</button><button class="primary" data-action="performance" data-id="${id}">성능 추이 보기</button>`,false,{type:'host',id})}
function openCase(id){const c=S.cases.find(c=>c.id===id);if(!c)return toast('이 장애 기록은 보관 범위를 벗어났습니다.');const root=S.issues.find(i=>i.id===c.rootId),f=FT[root.fault],issues=S.issues.filter(i=>i.caseId===id);openModal(`${id} · ${c.title}`,`<div class="flex between wrap" style="margin-bottom:17px"><div class="flex wrap">${severityPill(root.sev)}<span class="pill" style="color:${caseColor(c)}" id="caseModalStatus">${caseLabel(c)}</span></div><span class="small muted">최초 수신 ${time(c.created)}</span></div><div class="note"><strong>최초 원인 · ${root.host}</strong><p style="margin-top:6px">${f.detail}</p></div><div id="caseLiveProgress">${caseProgress(c)}</div><div class="divider"></div><form id="ownerForm" data-id="${c.id}" class="toolbar"><label for="caseOwner">담당자</label><input id="caseOwner" class="grow" name="owner" value="${esc(c.owner==='미지정'?'':c.owner)}" placeholder="예: 인프라 담당" maxlength="30" style="font-size:16px" required><button type="submit">지정·확인</button></form><div class="section-title"><h3>연결 경보 · 원인과 후속 증상</h3></div><div id="caseLinkedIssues">${caseLinkedHTML(c)}</div><div class="divider"></div><h3>복구 절차</h3><ol class="runbook"><li>최초 원인 장비의 현재 상태와 연관 경보를 확인합니다.</li><li>${f.fix}.</li><li>같은 장애의 후속 증상을 재검증하고 8초 동안 안정 상태를 확인합니다.</li><li>별도 장애가 남아 있다면 해당 업무의 저하 표시는 유지합니다.</li></ol><div class="divider"></div><form id="noteForm" data-id="${c.id}"><label for="caseNote"><strong>인계 메모</strong></label><textarea id="caseNote" name="note" placeholder="확인한 내용과 다음 담당자에게 전할 사항" maxlength="2000" style="margin:9px 0;font-size:16px">${esc(c.note)}</textarea><button type="submit">메모 저장</button></form><div class="divider"></div><div class="section-title"><h3>대응 타임라인</h3><span class="small muted">단계별 자동 기록</span></div><div id="caseTimeline">${timelineHTML(c)}</div>`,`<button data-action="ack-case" data-id="${id}" ${c.state==='resolved'?'disabled':''}>경보 확인</button><button class="primary" id="caseRecoverBtn" data-action="recover-prompt" data-id="${id}" ${['working','verifying','resolved'].includes(c.state)?'disabled':''}>복구 절차 실행</button>`,true,{type:'case',id})}
function caseLinkedHTML(c){return S.issues.filter(i=>i.caseId===c.id).map(i=>`<div class="row"><span class="row-main"><strong>${i.parent?'후속 증상':'최초 원인'} · ${FT[i.fault].title}</strong><small>${i.host} · ${i.id}</small></span><span class="small ${i.resolvedAt?'good':'warn'}">${i.resolvedAt?'복구':'미복구'}</span></div>`).join('')}
function timelineHTML(c){return`<ol class="timeline">${c.log.slice().reverse().map(l=>`<li><time>${time(l.at)} · ${esc(l.actor)}</time><p>${esc(l.message)}</p></li>`).join('')}</ol>`}
function updateModalLive(){if(UI.modal?.type==='case'){const c=S.cases.find(c=>c.id===UI.modal.id);if(!c||!$('caseModalStatus'))return;$('caseModalStatus').textContent=caseLabel(c);$('caseModalStatus').style.color=caseColor(c);$('caseLiveProgress').innerHTML=caseProgress(c);$('caseLinkedIssues').innerHTML=caseLinkedHTML(c);$('caseTimeline').innerHTML=timelineHTML(c);$('caseRecoverBtn').disabled=['working','verifying','resolved'].includes(c.state)}}
function recoveryPrompt(id){const c=S.cases.find(c=>c.id===id);if(!c)return;const root=S.issues.find(i=>i.id===c.rootId),f=FT[root.fault];openModal('복구 절차 실행',`<p><strong>${esc(c.title)}</strong>의 원인 장비 <span class="mono">${root.host}</span>에 다음 절차를 실행합니다.</p><ol class="runbook"><li>현재 상태 확인 · 3초</li><li>${f.fix} · 5초</li><li>원인·후속 증상 재검증 · 8초</li></ol><div class="note">같은 장애에 연결된 경보만 복구합니다. 별개로 발생한 장애는 해당 대응 기록에서 처리할 수 있습니다.</div>${S.paused?'<p class="warn" style="margin-top:12px">현재 일시정지 중입니다. 재개 후 절차가 진행됩니다.</p>':''}`,`<button data-action="case" data-id="${id}">상세로 돌아가기</button><button class="primary" data-action="recover" data-id="${id}">절차 실행</button>`)}
function scenarioModal(){openModal('장애 시나리오',`<p class="muted" style="margin-bottom:15px">실행하면 원인 경보부터 후속 증상까지 순서대로 발생합니다. 자동 복구를 끄면 직접 대응할 때까지 장애가 유지됩니다.</p><div class="scenario-grid">${SCENARIOS.map((s,i)=>`<button class="scenario-button" data-action="start-scenario" data-id="${s.id}"><span class="mono small info">SCENARIO ${String(i+1).padStart(2,'0')}</span><strong>${s.name}</strong><small>${s.desc}</small></button>`).join('')}</div>`,'',true)}
function filterModal(){openModal('이벤트 표시 범위',`<div class="stack"><label class="stack" style="gap:7px">메시지 분류<select id="modalCat">${options([['all','모든 분류'],...CATEGORIES.map(c=>[c,c])],UI.cat)}</select></label><label class="stack" style="gap:7px">발생 장비<select id="modalHost">${options([['all','모든 장비'],...INVENTORY.map(d=>[d.id,d.id+' · '+d.role])],UI.host)}</select></label><p class="small muted">필터는 기존 기록과 새 기록의 화면 표시에만 적용합니다. 원본 수집·통계·장애 처리에는 영향을 주지 않습니다.</p></div>`,`<button data-action="clear-filters">필터 해제</button><button class="primary" data-action="apply-filters">적용</button>`)}
function helpModal(){openModal('사용 안내 · 원본 분석',`<div class="note"><strong>열어 두면 자동으로 진행됩니다.</strong><p>가끔 장비 상태와 메시지를 살펴보고, 장애가 궁금하면 대응실에서 원인과 복구 과정을 확인해 보세요.</p></div><ol class="runbook"><li><strong>이벤트:</strong> 메시지를 눌러 해당 장비와 장애를 확인합니다. 목록 고정은 읽는 화면만 멈춥니다.</li><li><strong>요약·장비:</strong> 업무 성공률과 수집 상태를 확인하고 필요한 장비의 점검 시간을 정합니다.</li><li><strong>구성도:</strong> 업무를 선택하면 관련 장비와 의존 경로가 표시됩니다.</li><li><strong>성능:</strong> 실제 수집한 값과 임계선을 비교합니다. 수집이 끊긴 구간은 선을 연결하지 않습니다.</li><li><strong>대응실:</strong> 확인·담당자 지정·메모·복구 절차를 사용할 수 있습니다. 경보 확인만으로는 복구되지 않습니다.</li><li><strong>설정:</strong> 자동 복구와 자동 장애 발생을 끄면 수동 훈련을 할 수 있습니다.</li></ol><div class="divider"></div><h3>원본에서 확인한 점</h3><ol class="runbook"><li>실제 화면은 이벤트 목록 하나였으며, 요약·호스트·설정 메뉴에는 동작이 연결되어 있지 않았습니다.</li><li>호스트·감시 대상·메시지를 따로 추첨하여 한 이벤트 안에 다른 장비가 표시될 수 있었습니다.</li><li>중요도와 메시지도 따로 추첨하여 정상 완료 메시지가 긴급 등급으로 나타날 수 있었습니다.</li><li>중요도 필터가 수집 단계에 적용되어 숨긴 중요도의 이벤트 자체가 사라졌습니다.</li><li>일시정지 시 예약 타이머를 취소하지 않아 재개를 반복하면 이벤트 발생 예약이 겹칠 수 있었습니다.</li><li>상태·복구·기록 저장이 없었고, 상세 창을 스크롤하는 동작이 닫기 동작으로 인식될 수 있었습니다.</li></ol><h3>이번 확장</h3><p class="small muted" style="margin-top:10px">기존 메뉴 4개를 완성하고 구성도·성능 추이·장애 대응실 3개를 추가했습니다. 장비 12대에서 ${INVENTORY.length}대로, 메시지 분류 5개에서 ${CATEGORIES.length}개로 확대했습니다. 기본 메시지 ${FAULTS.length+NOTICES.length}종에 장애별 반복·복구 알림을 더했습니다.</p><p class="small muted" style="margin-top:12px">외부 폰트·이미지·라이브러리 없이 하나의 HTML로 실행합니다. 실제 장비 접속이나 운영 명령 전송은 하지 않는 독립된 훈련 시뮬레이터입니다. 인터페이스와 메시지는 JP1 제품의 공식 사양을 복제한 것이 아닙니다.</p>`,'',true)}
function resetSession(){S=initialState();seedMetrics();booted=false;emit({message:'통합감시 관리자 기동. 21종 44대의 장비와 5개 업무 감시를 시작합니다.',sev:5});for(let n=0;n<7;n++){const nt=NOTICES[n],ds=INVENTORY.filter(d=>nt.types.includes(d.type)),d=pick(ds);emit({host:d.id,cat:nt.cat,sev:nt.sev,object:nt.object,message:`[${d.id}] ${nt.message}`})}startScenario('database');sample();logAudit('새 감시 세션 시작','훈련 제어');booted=true;UI.freeze=null;UI.freezeSeq=0;UI.severity=new Set([0,1,2,3,4,5,6]);UI.search='';UI.host='all';UI.cat='all';UI.life='all';saveState()}
function updatePreference(key,value){if(!(key in S.prefs))return;S.prefs[key]=value;if(key==='sound'&&value){lastSound=-99;beep()}logAudit(`${({autoFault:'자동 장애 발생',autoRecover:'자동 복구',dedup:'반복 경보 묶기',alerts:'중대 경보 통지',sound:'경보음'})[key]} ${value?'켜기':'끄기'}`);saveState();renderHeader()}
function onAction(action,id,el){if(action==='navigate'){closeModal();navigate(id)}else if(action==='pause'){S.paused=!S.paused;renderHeader();saveState()}else if(action==='sound')updatePreference('sound',!S.prefs.sound);else if(action==='freeze'){if(UI.freeze)UI.freeze=null;else{UI.freeze=S.events.map(e=>({...e}));UI.freezeSeq=S.seq}renderView()}else if(action==='severity'){const i=Number(id);if(UI.severity.has(i))UI.severity.delete(i);else UI.severity.add(i);el.classList.toggle('active',UI.severity.has(i));el.setAttribute('aria-pressed',String(UI.severity.has(i)));renderContent()}else if(action==='event')openEvent(id);else if(action==='host')openHost(id);else if(action==='case')openCase(id);else if(action==='case-filter'){UI.caseState=id;renderView()}else if(action==='service'){UI.service=id;closeModal();navigate('map')}else if(action==='performance'){UI.performance=id;closeModal();navigate('performance')}else if(action==='host-events'){UI.host=id;UI.search='';UI.cat='all';UI.life='all';UI.severity=new Set(SEV.map((_,i)=>i));UI.freeze=null;closeModal();navigate('events')}else if(action==='scenario')scenarioModal();else if(action==='start-scenario')startScenario(id);else if(action==='recover-prompt')recoveryPrompt(id);else if(action==='recover'){requestRecovery(id);saveState();openCase(id)}else if(action==='ack-case'){ackCase(id);openCase(id)}else if(action==='ack-all'){const todo=activeCases().filter(c=>c.state==='new'&&!inMaintenance(S.issues.find(i=>i.id===c.rootId).host));if(!todo.length)return toast('확인할 미확인 장애가 없습니다.');todo.forEach(c=>ackCase(c.id));renderContent();toast(`${todo.length}건의 장애를 확인했습니다.`)}else if(action==='maintenance')setMaintenance(id,Number(el.dataset.minutes));else if(action==='event-filters')filterModal();else if(action==='apply-filters'){UI.cat=$('modalCat').value;UI.host=$('modalHost').value;closeModal();renderView()}else if(action==='clear-filters'){UI.cat='all';UI.host='all';closeModal();renderView()}else if(action==='reset-event-view'){UI.search='';UI.cat='all';UI.host='all';UI.life='all';UI.severity=new Set(SEV.map((_,i)=>i));renderView()}else if(action==='more-events'){UI.limit+=100;renderContent()}else if(action==='export')exportFile(id);else if(action==='save'){saveState();toast(saveError?'자동 저장이 불가능합니다. JSON으로 내보내 주세요.':'현재 상태를 저장했습니다.',saveError)}else if(action==='import')$('importFile').click();else if(action==='audit')openModal('운영 감사 기록',`<ol class="timeline">${S.audit.map(a=>`<li><time>${time(a.at)} · ${esc(a.actor)}</time><p>${esc(a.message)}</p></li>`).join('')||'<p class="muted">운영 기록이 없습니다.</p>'}</ol>`);else if(action==='help')helpModal();else if(action==='reset-prompt')openModal('새 감시 세션 시작',`<p>현재 브라우저에 저장된 이벤트·장애·메모·성능 이력을 초기화합니다. 보관하려면 먼저 전체 기록을 내보내 주세요.</p>`,`<button data-action="export" data-id="json">전체 기록 내보내기</button><button class="danger" data-action="reset">초기화하고 시작</button>`);else if(action==='reset'){closeModal();resetSession();navigate('events');renderHeader();toast('새 감시 세션을 시작했습니다.')}else if(action==='import-confirm'){if(!UI.importState)return;S=UI.importState;delete UI.importState;S.paused=true;UI.freeze=null;logAudit('기록 파일 불러오기 · 일시정지 상태로 복원');closeModal();saveState();renderHeader();navigate('summary');toast('기록을 복원했습니다. 재개를 누르면 이어집니다.')}else if(action==='close')closeModal()}
function wireEvents(){document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)onAction(el.dataset.action,el.dataset.id,el)});document.addEventListener('input',e=>{if(e.target.id==='eventSearch'){UI.search=e.target.value;UI.limit=100;renderContent()}if(e.target.id==='hostSearch'){UI.hostSearch=e.target.value;renderContent()}});document.addEventListener('change',e=>{const el=e.target;if(el.dataset.pref){updatePreference(el.dataset.pref,el.checked);return}const mapping={lifeFilter:'life',hostType:'hostType',hostState:'hostState',hostZone:'hostZone',performanceHost:'performance'};if(mapping[el.id]){UI[mapping[el.id]]=el.value;if(el.id==='performanceHost')$('perfDetailBtn').dataset.id=el.value;renderContent()}if(el.id==='speedSelect'){S.prefs.speed=Number(el.value);saveState()}});document.addEventListener('submit',e=>{if(e.target.id==='thresholdForm'){e.preventDefault();const fd=new FormData(e.target),values={};for(const [key,min,max] of [['cpu',20,99],['mem',20,99],['disk',20,99],['latency',100,5000],['temp',20,50]]){const value=Number(fd.get(key));if(!Number.isInteger(value)||value<min||value>max)return toast('임계값의 허용 범위를 확인해 주세요.',true);values[key]=value}S.thresholds=values;S.thresholdHold={};logAudit(`임계값 변경: CPU ${values.cpu}%, 메모리 ${values.mem}%, 볼륨 ${values.disk}%, 응답 ${values.latency}ms, 온도 ${values.temp}°C`);emit({sev:5,message:'자원 감시 임계값을 변경했습니다. 이후 수집값부터 3회 연속 초과를 평가합니다.'});saveState();toast('임계값을 적용했습니다. 앞으로 수집되는 값에 반영됩니다.')}else if(e.target.id==='ownerForm'){e.preventDefault();const owner=new FormData(e.target).get('owner').trim().slice(0,30);if(!owner)return;const c=S.cases.find(c=>c.id===e.target.dataset.id);if(!c)return;c.owner=owner;ackCase(c.id,owner);updateModalLive()}else if(e.target.id==='noteForm'){e.preventDefault();const c=S.cases.find(c=>c.id===e.target.dataset.id);if(!c)return;c.note=new FormData(e.target).get('note').slice(0,2000);caseLog(c,'인계 메모를 저장했습니다.','운영 담당자');logAudit(`${c.id} 인계 메모 저장`);saveState();toast('인계 메모를 저장했습니다.');updateModalLive()}});$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal){e.preventDefault();closeModal()}if(e.key==='Tab'&&UI.modal){const f=[...$('modal').querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea,[tabindex="0"]')].filter(el=>el.offsetParent!==null);if(!f.length)return;const first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}const n=e.target.closest('g[data-action]');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();onAction(n.dataset.action,n.dataset.id,n)}});$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>5*1024*1024)return toast('기록 파일은 5MB 이하로 선택해 주세요.',true);try{const parsed=validateState(JSON.parse(await file.text()));UI.importState=parsed;openModal('기록 불러오기',`<p>선택한 기록: <strong>${esc(file.name)}</strong></p><p class="muted" style="margin:10px 0">감시 ${duration(parsed.elapsed)} · 누적 이벤트 ${fmt(parsed.received)}건 · 장애 기록 ${parsed.cases.length}건</p><p>현재 세션을 이 기록으로 바꾸고 일시정지 상태로 복원합니다.</p>`,`<button data-action="export" data-id="json">현재 기록 내보내기</button><button class="primary" data-action="import-confirm">이 기록으로 복원</button>`)}catch(err){toast('불러올 수 없습니다. 유효한 전체 기록 JSON 파일을 선택해 주세요.',true)}});window.addEventListener('pagehide',saveState);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveState()})}
function bootstrap(){let loaded=false;try{const saved=localStorage.getItem(STORAGE);if(saved){S=validateState(JSON.parse(saved));loaded=true}}catch(e){saveError=true}if(!loaded)resetSession();booted=true;wireEvents();renderNav();renderHeader();renderView();if(loaded&&S.paused)toast('저장된 기록을 일시정지 상태로 이어서 열었습니다.');let n=0;setInterval(()=>{if(document.hidden)return;for(let i=0;i<S.prefs.speed;i++)tick();renderHeader();updateModalLive();if(!UI.modal&&UI.view!=='settings'){if(++n%2===0)renderContent()}},1000);setInterval(saveState,15000)}
bootstrap();
</script>
