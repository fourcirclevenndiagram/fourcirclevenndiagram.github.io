const stateBeforeReturn=stateText;stateText=function(o){const v=visitById(o?.guestVisit),e=S.events.find(e=>e.id===o.event);if(e?.type==='return_welcome')return'다시 만난 밤 · '+({notice:'익숙한 모습을 알아보는 중',travel:'창구까지 마중 나가는 중',recognize:'서로의 표식을 살펴보는 중',touch:'반가운 인사를 나누는 중',react:'다시 만난 기쁨을 나누는 중'}[e.phase]||'옛 친구를 기다리는 중');if(e?.type==='return_goodbye')return'작은 의자에서 인사하고 방명록에 표식을 남기는 중';if(e?.type==='return_stroll')return'옛 친구와 나란히 보관소를 둘러보는 중';if(v&&(!o.event||o.exiting))return returnPhaseLabel(v);return stateBeforeReturn(o);};
