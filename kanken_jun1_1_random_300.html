<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ff7aa2">
<title>KANKEN POP! 準1級〜1級 300</title>
<style>
:root{
  --ink:#382d4f; --sub:#746985; --paper:#fffdfd; --pink:#ff7aa2; --peach:#ffb36b;
  --mint:#58d6b5; --blue:#6fb4ff; --purple:#9d84ff; --yellow:#ffd65a;
  --shadow:0 18px 45px rgba(81,58,107,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP","Noto Sans KR",sans-serif;color:var(--ink);background:#fff6fb}
body{min-height:100svh;overflow-x:hidden}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:
 radial-gradient(circle at 10% 8%,rgba(255,214,90,.32),transparent 25%),
 radial-gradient(circle at 90% 18%,rgba(111,180,255,.28),transparent 28%),
 radial-gradient(circle at 15% 88%,rgba(88,214,181,.23),transparent 30%),
 linear-gradient(160deg,#fff8e8 0%,#fff4fa 42%,#f3f0ff 100%)}
.blob{position:absolute;border-radius:999px;filter:blur(1px);opacity:.45;animation:float 8s ease-in-out infinite}
.blob.b1{width:120px;height:120px;background:#ff9fc0;left:-38px;top:22%;animation-delay:-2s}
.blob.b2{width:90px;height:90px;background:#6fe4c4;right:-24px;top:58%;animation-delay:-5s}
.blob.b3{width:72px;height:72px;background:#9d84ff;right:8%;top:6%;animation-delay:-3s}
@keyframes float{50%{transform:translateY(18px) rotate(12deg)}}
.app{position:relative;z-index:1;min-height:100svh;max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.04em}
.logo{width:43px;height:43px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#ff7aa2,#ffb36b);color:white;box-shadow:0 8px 20px rgba(255,122,162,.32);font-size:22px;transform:rotate(-4deg)}
.brand small{display:block;font-size:10px;letter-spacing:.08em;color:var(--sub);font-weight:800;margin-top:2px}
.pill{border:0;background:rgba(255,255,255,.77);backdrop-filter:blur(10px);box-shadow:0 7px 22px rgba(80,60,110,.12);padding:9px 12px;border-radius:999px;color:var(--ink);font-weight:900;font-size:12px}
.progressCard{background:rgba(255,255,255,.70);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:12px 14px;box-shadow:0 10px 30px rgba(80,60,110,.09)}
.progressRow{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:900;color:var(--sub);margin-bottom:8px}
.track{height:10px;background:#eee8f6;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(70,40,100,.08)}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--peach),var(--yellow));border-radius:inherit;transition:width .25s ease}
.card{position:relative;flex:1;min-height:485px;background:rgba(255,255,255,.9);border:2px solid rgba(255,255,255,.95);border-radius:34px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.card:before,.card:after{content:"";position:absolute;border-radius:50%;z-index:-1;opacity:.18}
.card:before{width:170px;height:170px;background:#ff7aa2;right:-65px;top:-65px}
.card:after{width:160px;height:160px;background:#6fb4ff;left:-75px;bottom:-70px}
.ribbon{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 0}
.typeBadge{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:#fff0f5;color:#d84075;font-size:11px;font-weight:900;letter-spacing:.04em}
.phase{font-size:11px;font-weight:900;color:var(--sub);padding:7px 10px;border-radius:999px;background:#f6f2fa}
.questionZone{padding:18px 20px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:205px}
.kicker{font-size:11px;font-weight:900;letter-spacing:.16em;color:#9b8da8;margin-bottom:13px}
.question{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;font-weight:700;line-height:1.08;letter-spacing:.04em;font-size:clamp(58px,18vw,92px);text-wrap:balance;filter:none;transform:translateZ(0)}
.question.word{font-size:clamp(45px,13vw,70px)}
.question.yoji{font-size:clamp(41px,11.5vw,61px);letter-spacing:.025em}
.timerWrap{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px}
.timer{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--pink) var(--deg,360deg),#eee8f6 0);transition:background .08s linear;box-shadow:0 6px 16px rgba(92,70,120,.12)}
.timer:after{content:"";position:absolute;inset:6px;border-radius:50%;background:white}
.timer span{z-index:1;font-size:17px;font-weight:950;font-variant-numeric:tabular-nums}
.timerText{font-size:12px;font-weight:850;color:var(--sub);text-align:left;line-height:1.45}
.answer{margin:10px 14px 14px;border-radius:25px;padding:15px;background:linear-gradient(145deg,#fff8ed,#fff5fb);border:1px solid #ffe3ea;opacity:0;transform:translateY(10px) scale(.985);transition:.35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.answer.show{opacity:1;transform:none}
.yomiLabel{font-size:10px;color:#a47686;font-weight:950;letter-spacing:.14em}
.yomi{font-size:24px;font-weight:950;margin:4px 0 12px;color:#d84075;letter-spacing:.04em}
.meaning{display:grid;grid-template-columns:34px 1fr;gap:8px 9px;align-items:start;padding-top:10px;border-top:1px dashed #e7cfda}
.lang{font-size:9px;font-weight:950;letter-spacing:.08em;background:#fff;border:1px solid #eadde6;border-radius:8px;padding:4px 0;text-align:center;color:#78677b}
.meaning p{margin:0;font-size:13px;line-height:1.58;font-weight:730;color:#4d425d}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.btn{border:0;border-radius:18px;padding:13px 8px;font-weight:950;font-size:12px;box-shadow:0 9px 20px rgba(79,59,107,.12);color:var(--ink);background:rgba(255,255,255,.88)}
.btn.primary{background:linear-gradient(135deg,#ff7aa2,#ff9c83);color:white}
.btn:active{transform:translateY(1px) scale(.99)}
.footer{text-align:center;color:#9b8da8;font-size:10px;font-weight:750;line-height:1.45;padding:0 10px}
.spark{position:absolute;pointer-events:none;font-size:16px;animation:pop .7s ease-out forwards}
@keyframes pop{from{opacity:0;transform:translate(0,6px) scale(.4) rotate(0)}35%{opacity:1}to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.2) rotate(20deg)}}
@media (max-height:730px){.app{gap:9px;padding-top:10px}.card{min-height:430px}.questionZone{min-height:170px;padding-top:10px}.answer{padding:12px;margin-top:4px}.yomi{margin-bottom:8px}.meaning p{font-size:12px;line-height:1.45}.controls .btn{padding:11px 6px}}
</style>
</head>
<body>
<div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<main class="app">
  <header class="top">
    <div class="brand"><div class="logo">漢</div><div>KANKEN POP!<small>準1級〜1級 · 300 CARDS</small></div></div>
    <button class="pill" id="shuffleBtn" aria-label="シャッフル">↻ SHUFFLE</button>
  </header>

  <section class="progressCard">
    <div class="progressRow"><span id="progressText">1 / 300</span><span id="cycleText">1周目</span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </section>

  <section class="card" id="card">
    <div class="ribbon"><span class="typeBadge" id="typeBadge">◆ 一字</span><span class="phase" id="phase">問題</span></div>
    <div class="questionZone">
      <div class="kicker">HOW DO YOU READ THIS?</div>
      <div class="question" id="question">允</div>
      <div class="timerWrap">
        <div class="timer" id="timer"><span id="timerNum">6.0</span></div>
        <div class="timerText" id="timerText">よみかな公開まで<br>あと 6 秒</div>
      </div>
    </div>
    <div class="answer" id="answer" aria-live="polite">
      <div class="yomiLabel">YOMIGANA</div>
      <div class="yomi" id="yomi">いん</div>
      <div class="meaning"><span class="lang">JP</span><p id="ja"></p><span class="lang">KR</span><p id="ko"></p></div>
    </div>
  </section>

  <div class="controls">
    <button class="btn" id="pauseBtn">⏸ 一時停止</button>
    <button class="btn" id="revealBtn">👀 答えを見る</button>
    <button class="btn primary" id="nextBtn">次へ →</button>
  </div>
  <div class="footer">6秒で読み・意味を公開 → 10秒で次の問題。300問を重複なしで1周してから再シャッフルします。</div>
</main>
<script>

이나 주장이 분명함.","kind":"四字熟語"},{"q":"跼天蹐地","y":"きょくてんせきち","ja":"恐れて身を縮め、ひどく窮屈に振る舞うこと。","ko":"두려워 몸을 움츠리고 몹시 조심스럽게 행동함.","kind":"四字熟語"},{"q":"曲学阿世","y":"きょくがくあせい","ja":"真理を曲げ、世間に迎合して人気を得ようとすること。","ko":"학문적 진리를 왜곡해 세상에 영합함.","kind":"四字熟語"},{"q":"玉石混淆","y":"ぎょくせきこんこう","ja":"価値あるものと価値のないものが入り混じること。","ko":"좋은 것과 나쁜 것, 가치 있는 것과 없는 것이 뒤섞임.","kind":"四字熟語"},{"q":"金甌無欠","y":"きんおうむけつ","ja":"国家や領土が完全で、少しも欠けていないこと。","ko":"국가·영토가 완전하여 조금도 결손이 없음.","kind":"四字熟語"},{"q":"空谷跫音","y":"くうこくのきょうおん","ja":"寂しい所で人の足音を聞くような、思いがけない喜び。","ko":"적막한 곳에서 발소리를 듣듯 뜻밖에 얻는 반가운 소식·기쁨.","kind":"四字熟語"},{"q":"牽強付会","y":"けんきょうふかい","ja":"道理に合わないことを無理にこじつけること。","ko":"이치에 맞지 않는 것을 억지로 끼워 맞춤.","kind":"四字熟語"},{"q":"乾坤一擲","y":"けんこんいってき","ja":"運命をかけて、のるかそるかの大勝負をすること。","ko":"운명을 걸고 단 한 번의 큰 승부를 벌임.","kind":"四字熟語"},{"q":"捲土重来","y":"けんどちょうらい","ja":"一度敗れた者が、勢力を盛り返して再び挑戦すること。","ko":"한번 패한 뒤 세력을 회복해 다시 도전함.","kind":"四字熟語"},{"q":"膏粱子弟","y":"こうりょうしてい","ja":"富裕な家に生まれ、ぜいたくに育った子弟。","ko":"부유한 집에서 태어나 호사스럽게 자란 자제.","kind":"四字熟語"},{"q":"刻舟求剣","y":"こくしゅうきゅうけん","ja":"古い方法に固執し、状況の変化に対応できないこと。","ko":"낡은 방식에 집착해 상황 변화에 대응하지 못함.","kind":"四字熟語"},{"q":"鼓腹撃壌","y":"こふくげきじょう","ja":"太平の世を楽しみ、満ち足りて暮らすこと。","ko":"태평한 세상에서 만족하며 평화롭게 삶.","kind":"四字熟語"},{"q":"鑿壁偸光","y":"さくへきとうこう","ja":"苦しい環境でも工夫して学問に励むこと。","ko":"어려운 환경에서도 방법을 찾아 학문에 힘씀.","kind":"四字熟語"},{"q":"疾風勁草","y":"しっぷうけいそう","ja":"困難に遭って初めて、その人の強さや節操が分かること。","ko":"어려움 속에서야 그 사람의 강인함과 절개가 드러남.","kind":"四字熟語"},{"q":"櫛風沐雨","y":"しっぷうもくう","ja":"風雨にさらされながら苦労して奔走すること。","ko":"비바람을 맞으며 고생스럽게 뛰어다님.","kind":"四字熟語"},{"q":"秋霜烈日","y":"しゅうそうれつじつ","ja":"刑罰や権威などが非常に厳しいこと。","ko":"형벌·권위 등이 매우 엄격함.","kind":"四字熟語"},{"q":"寸草春暉","y":"すんそうしゅんき","ja":"親の大きな恩に、子が十分報いることは難しいというたとえ。","ko":"부모의 큰 은혜를 자식이 다 갚기 어렵다는 비유.","kind":"四字熟語"},{"q":"切歯扼腕","y":"せっしやくわん","ja":"歯ぎしりし腕を握りしめるほど、激しく悔しがること。","ko":"이를 갈고 팔을 움켜쥘 만큼 몹시 분해함.","kind":"四字熟語"},{"q":"前倨後恭","y":"ぜんきょこうきょう","ja":"初めは傲慢だった者が、後では急にへりくだること。","ko":"처음엔 오만하던 사람이 나중에는 갑자기 공손해짐.","kind":"四字熟語"},{"q":"滄海一粟","y":"そうかいのいちぞく","ja":"広大なものの中にある、非常に小さなもののたとえ。","ko":"광대한 것 속의 아주 작은 존재, 창해일속.","kind":"四字熟語"},{"q":"枕戈待旦","y":"ちんかたいたん","ja":"武器を枕にして夜明けを待つほど、常に戦いに備えること。","ko":"무기를 베고 새벽을 기다릴 만큼 늘 싸움에 대비함.","kind":"四字熟語"},{"q":"文質彬彬","y":"ぶんしつひんぴん","ja":"外面の美しさと内面の実質が、ほどよく調和していること。","ko":"겉의 문채와 속의 본질이 알맞게 조화를 이룸.","kind":"四字熟語"}];
const REVEAL_MS=6000, NEXT_MS=10000;
let deck=[], pos=0, cycle=1, started=0, paused=false, pauseAt=0, forceReveal=false, raf=0;
const $=s=>document.querySelector(s);
const el={q:$('#question'),y:$('#yomi'),ja:$('#ja'),ko:$('#ko'),ans:$('#answer'),type:$('#typeBadge'),phase:$('#phase'),timer:$('#timer'),num:$('#timerNum'),ttext:$('#timerText'),prog:$('#progressText'),fill:$('#fill'),cycle:$('#cycleText'),pause:$('#pauseBtn'),card:$('#card')};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newDeck(resetCycle=false){deck=shuffle([...Array(BANK.length).keys()]);pos=0;if(resetCycle)cycle=1;started=performance.now();forceReveal=false;render();}
function sizeClass(item){el.q.className='question '+(item.kind==='四字熟語'?'yoji':item.q.length>=2?'word':'')}
function render(){const item=BANK[deck[pos]];el.q.textContent=item.q;el.y.textContent=item.y;el.ja.textContent=item.ja;el.ko.textContent=item.ko;el.type.textContent=(item.kind==='一字'?'◆ ':item.kind==='熟語'?'✦ ':'✿ ')+item.kind;el.ans.classList.remove('show');el.phase.textContent='問題';el.prog.textContent=`${pos+1} / ${BANK.length}`;el.cycle.textContent=`${cycle}周目`;el.fill.style.width=`${((pos+1)/BANK.length)*100}%`;sizeClass(item)}
function spark(){const icons=['✦','★','✿','◆','●'];for(let i=0;i<9;i++){const s=document.createElement('i');s.className='spark';s.textContent=icons[i%icons.length];s.style.left=(45+Math.random()*10)+'%';s.style.top=(43+Math.random()*8)+'%';s.style.setProperty('--x',`${(Math.random()-.5)*180}px`);s.style.setProperty('--y',`${-35-Math.random()*100}px`);s.style.color=['#ff7aa2','#ffb36b','#58d6b5','#6fb4ff','#9d84ff'][i%5];el.card.appendChild(s);setTimeout(()=>s.remove(),750)}}
function reveal(withSpark=true){if(!el.ans.classList.contains('show')){el.ans.classList.add('show');el.phase.textContent='答え';if(withSpark)spark()}}
function next(){pos++;if(pos>=deck.length){cycle++;deck=shuffle([...Array(BANK.length).keys()]);pos=0;}started=performance.now();forceReveal=false;render()}
function loop(now){if(!paused){const elapsed=now-started;if(elapsed>=REVEAL_MS||forceReveal)reveal(elapsed>=REVEAL_MS);if(elapsed>=NEXT_MS){next();}else{const revealStage=elapsed<REVEAL_MS&&!forceReveal;let remain=revealStage?(REVEAL_MS-elapsed):(NEXT_MS-elapsed);remain=Math.max(0,remain);el.num.textContent=(remain/1000).toFixed(1);el.ttext.innerHTML=revealStage?`よみかな公開まで<br>あと ${Math.ceil(remain/1000)} 秒`:`次の問題まで<br>あと ${Math.ceil(remain/1000)} 秒`;const max=revealStage?REVEAL_MS:(NEXT_MS-REVEAL_MS);const stageElapsed=revealStage?elapsed:Math.max(0,elapsed-REVEAL_MS);const ratio=Math.max(0,1-stageElapsed/max);el.timer.style.setProperty('--deg',`${ratio*360}deg`)}}
raf=requestAnimationFrame(loop)}
el.pause.onclick=()=>{paused=!paused;if(paused){pauseAt=performance.now();el.pause.textContent='▶ 再開';el.phase.textContent='PAUSE'}else{started+=performance.now()-pauseAt;el.pause.textContent='⏸ 一時停止';el.phase.textContent=el.ans.classList.contains('show')?'答え':'問題'}};
$('#revealBtn').onclick=()=>{forceReveal=true;reveal(true)};
$('#nextBtn').onclick=()=>next();
$('#shuffleBtn').onclick=()=>{newDeck(false);spark()};
newDeck(true);raf=requestAnimationFrame(loop);
</script>
</body>
</html>
