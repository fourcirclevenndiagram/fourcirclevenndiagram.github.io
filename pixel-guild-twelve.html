.btnRow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}

/* ---- 오버레이 ---- */

<script>
'use strict';
/* ================================================================
   상수와 데이터 정의
================================================================ */
const SAVE_KEY='PGT12_SAVE', SAVE_VER=1;
const ST=['전투','방어','기동','지식','감지','행운'];
const RAR=['일반','고급','희귀','영웅','전설'];

/* ---- 결정론적 난수 생성기 ---- */
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RSEED=((Date.now()%2147483647)^0x9e3779b9)|0;
let rng=mulberry(RSEED);
const R01=()=>rng();
const RI=(a,b)=>a+Math.floor(rng()*(b-a+1));
const RP=a=>a[Math.floor(rng()*a.length)];
const pad3=n=>String(n).padStart(3,'0');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const r1=v=>Math.round(v*10)/10;
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a} // Fisher-Yates
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ---- 특수능력 데이터 (정확히 20종) ---- */
const ABIL_LIST=[
 {id:'A01',name:'선봉 본능',desc:'전투 중심 퀘스트에서 전투 기여도 증가. 첫 전투 사건에서 추가 보너스.'},
 {id:'A02',name:'철벽 수비',desc:'방어 기여도 증가. 파티가 받는 부정적 사건 피해 감소.'},
 {id:'A03',name:'매의 눈',desc:'감지 기여도 증가. 매복·함정 발견 확률 증가.'},
 {id:'A04',name:'경로 개척',desc:'기동 기여도 증가. 이동·추적 사건의 실패 페널티 감소.'},
 {id:'A05',name:'현장 응급처치',desc:'한 번의 부상 또는 큰 페널티를 완화. 치유 로그 발생.'},
 {id:'A06',name:'유물 감정',desc:'수집품 등급 판정 보너스. 첫 발견 수집품의 설명 해금.'},
 {id:'A07',name:'보급 달인',desc:'소모품 효과 증가. 일정 확률로 소모품 수량이 줄지 않음.'},
 {id:'A08',name:'조율 지휘',desc:'출동 인원이 많을수록 파티 시너지 증가. 멤버 충돌 사건 감소.'},
 {id:'A09',name:'기계 해독',desc:'공장·폐허·자동인형·기계 장치 퀘스트 보너스.'},
 {id:'A10',name:'마력 공명',desc:'마법·저주·고대 유적 퀘스트 보너스.'},
 {id:'A11',name:'독성 내성',desc:'늪지·독·포자 페널티 감소.'},

function equipBonus(mi){const b=[0,0,0,0,0,0];const s=G.mem[mi];

 return b}

function makeQuest(exclR,exclT){
 let ri,ti,guard=0;
 do{ri=RI(0,REGIONS.length-1);ti=RI(0,QTYPES.length-1);guard++}while(guard<60&&(exclR.includes(ri)||exclT.includes(ti)));
 const reg=REGIONS[ri],qt=QTYPES[ti];
 const diff=clamp(Math.round(1+R01()*R01()*9+R01()*3),1,10);
 // 가중치: 유형 기반 + 지역 지터, 합=1
 let w=qt.w.map(v=>Math.max(0,v+(R01()*.08-.04)));
 const sum=w.reduce((a,b)=>a+b,0);w=w.map(v=>v/sum);
 const focus=w.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v).filter(x=>x.v>=.12).slice(0,4).map(x=>x.i);
 const dur=RI(10,20);
 const fame=Math.min(16,Math.sqrt(G.stats.q||0)*1.6); // 길드 명성: 장비 성장과 균형
 const target=Math.round(63+diff*3.4+fame+RI(-3,3));
 const hz=shuffle(reg.hazards).slice(0,RI(1,2));
 const lootHint=[reg.lootN,CTHEMES[reg.themes[0]].name].join(' · ');
 G.qid++;
 return {id:'Q'+G.qid,title:qt.tt(reg),type:qt.name,ti,ri,diff,w,focus,hz,dur,target,battle:qt.battle,
  desc:reg.name+'에서 들어온 의뢰. '+hz[0]+'에 주의하라는 경고가 붙어 있다.',lootHint,tags:reg.tags};
}
function genCandidates(){
 const out=[],er=[],et=[];
 for(let i=0;i<3;i++){const q=makeQuest(er,et);er.push(q.ri);et.push(q.ti);out.push(q)}
 return out;
}

function abilMemberBonus(id,q){ // 개인 기여 보너스
 const t=q.tags, ty=q.type, w=q.w;
 switch(id){
  case 'A01':return (ty==='토벌'||ty==='방어'||ty==='호위')?5:0;
  case 'A02':return w[1]>=.25?4:0;
  case 'A03':return w[4]>=.2?4:0;
  case 'A04':return w[2]>=.2?4:0;
  case 'A09':return t.includes('기계')?6:0;
  case 'A10':return t.includes('마력')?6:0;
  case 'A12':return t.includes('고온')?6:0;
  case 'A13':return t.includes('한파')?6:0;
  case 'A14':return t.includes('밤')?5:0;
  case 'A15':return ty==='협상'?7:0;
  default:return 0;
 }
}
function holdersOf(party,id){return party.filter(i=>MEMBERS[i].ab.includes(id))}
function stackMul(n){return n<=0?0:n===1?1:1.5} // 중첩 상한

const recentLines=[];
function remember(s){recentLines.push(s);if(recentLines.length>24)recentLines.shift()}
function pickFresh(arr){for(let k=0;k<6;k++){const s=RP(arr);if(!recentLines.includes(s)){remember(s);return s}}const s=RP(arr);remember(s);return s}
function mQuote(mi){return pickFresh(MEMBERS[mi].quotes)}
function useCons(cid,who,why,evs,mul){ // 소모품 자동 사용
 if(!G.cons[cid]||G.cons[cid]<=0)return 0;
 const a7=mul>0?stackMul(mul):0;
 const keep=mul>0&&R01()<0.4; // A07 보급 달인: 수량 유지 확률
 if(!keep)G.cons[cid]--;
 G.stats.consUsed++;G.mem[who].rec.cons++;
 const c=CONSMAP[cid];
 (G.consLog[cid]=G.consLog[cid]||[]).unshift({t:Date.now(),txt:MEMBERS[who].name+' — '+why});
 if(G.consLog[cid].length>5)G.consLog[cid].length=5;
 evs.push({tp:'시스템',txt:MEMBERS[who].name+'이(가) 「'+c.name+'」'+(keep?'을(를) 아껴 쓰며':'을(를) 사용해')+' '+why,delta:0});
 return 1+(a7>1?0.5:0);
}

  let ab=0;for(const id of m.ab)ab+=abilMemberBonus(id,q);
  const c=s+e+ab+G.mem[i].lvl*0.5+(R01()*8-4);
  contribs.push({i,c:r1(c)});statSum+=s;eqSum+=e;abilSum+=ab;
 }

 if(hc('A08'))abil+=Math.min(8,n*0.7*stackMul(hc('A08')));

  else if(G.cons.c03>0&&R01()<.5){const eff=useCons('c03',party[RI(0,n-1)],'험로를 가볍게 넘었다.',evs,hc('A07'));evSum+=3*eff;evs[evs.length-1].delta=r1(3*eff)}
  else push('일반',RP(['좁은 산길을 따라 조심스럽게 나아간다.','바람이 방향을 바꾸며 파티를 스쳐 간다.','발밑의 흔적을 살피며 이동한다.']));

 // 첫 번째 문제: 지형 위기

 {

function rollRarity(boost){
 const r=R01()+ (boost||0);
 return r>0.99?4:r>0.95?3:r>0.85?2:r>0.6?1:0;
}
function statBon(rar,ilvl){
 const cnt=RI(1,Math.min(3,1+rar));const b={};
 const idxs=shuffle([0,1,2,3,4,5]).slice(0,cnt);
 for(const i of idxs)b[i]=RI(1,3)+rar*2+Math.floor(ilvl/3);
 return b;
}
function bonText(b){return Object.keys(b).map(k=>ST[k]+' +'+b[k]).join(' · ')}
function makeWeapon(q,rar){
 const kind=RI(0,14),ilvl=clamp(q.diff+RI(0,3)+rar*2,1,30);
 G.uid++;
 return {uid:G.uid,cat:'w',kind,name:RP(WPRE)+' '+RP(WORI)+' '+WKINDS[kind],rar,ilvl,bon:statBon(rar,ilvl),
  desc:REGIONS[q.ri].short+'에서 발견된 '+WKINDS[kind]+'. 손에 익으면 제법 쓸 만하다.',
  fromQ:q.title,t:Date.now(),owner:null,lock:false,seed:(G.uid*2654435761)>>>0};
}
function makeArmor(q,rar){
 const set=RI(0,24),ilvl=clamp(q.diff+RI(0,3)+rar*2,1,30);
 G.uid++;
 return {uid:G.uid,cat:'a',set,name:RP(WPRE)+' '+ASETS[set],rar,ilvl,bon:statBon(rar,ilvl),
  desc:ASETS[set].replace(' 세트','')+' 일습. 투구부터 장화까지 한 벌이다.',
  fromQ:q.title,t:Date.now(),owner:null,lock:false,seed:(G.uid*40503)>>>0};
}
function pickCollectible(q,rarBoost,dupBoost){
 const reg=REGIONS[q.ri];
 const th=R01()<.7?RP(reg.themes):RI(0,11);
 const band=rollRarity(rarBoost);
 const pool=COLLECT.filter(c=>c.theme===th&&c.rar===band);
 const pool2=pool.length?pool:COLLECT.filter(c=>c.theme===th);
 let c=RP(pool2);
 if(!dupBoost&&G.col[c.id]&&R01()<.5){ // 미발견 우선 약간
  const un=pool2.filter(x=>!G.col[x.id]);if(un.length)c=RP(un);
 }
 return c;
}
function genLoot(q,grade,party,extraLogs){
 const hc=id=>holdersOf(party,id).length;
 let cnt=grade==='S'?4:grade==='A'?3:grade==='B'?3:grade==='C'?2:(R01()<.5?1:0);
 let extra=0;
 if(hc('A16')&&R01()<.12*Math.min(hc('A16'),2))extra++;
 if(hc('A16')>1&&R01()<.12)extra++;
 cnt=Math.min(cnt+extra,6);
 if(extra)extraLogs.push({tp:'전리품',txt:'「보물 후각」 덕분에 전리품 자루가 더 두둑해졌다!'});
 let rarBoost=q.diff*0.008+(grade==='S'?0.06:grade==='A'?0.03:0);
 if(G.cons.c07>0&&cnt>0&&R01()<.6){
  G.cons.c07--;G.stats.consUsed++;
  (G.consLog.c07=G.consLog.c07||[]).unshift({t:Date.now(),txt:'정산 — 파티가 나눠 먹음'});
  extraLogs.push({tp:'시스템',txt:'파티가 「행운 사탕」을 나눠 먹었다. 왠지 좋은 예감이 든다.'});
  rarBoost+=0.05;
 }
 const items=[];
 for(let i=0;i<cnt;i++){
  const roll=R01();
  let colBoost=hc('A20')?0.12*stackMul(hc('A20')):0;
  if(roll<.2)items.push({it:makeWeapon(q,rollRarity(rarBoost))});
  else if(roll<.36)items.push({it:makeArmor(q,rollRarity(rarBoost))});
  else if(roll<.66-colBoost){
   const pool=CONS.filter(c=>c.id!=='c07'||R01()<.3);
   const c=RP(pool);const qty=1+(hc('A15')&&R01()<.5?1:0)+(grade==='S'?1:0);
   items.push({cons:c.id,qty:Math.min(qty,3)});
  } else {
   const c=pickCollectible(q,rarBoost+(hc('A06')?0.04*stackMul(hc('A06')):0),hc('A20')&&R01()<.3);
   items.push({col:c.id});
  }
 }
 // 복제 탐사지도
 if((q.type==='조사'||q.type==='수집')&&G.cons.c12>0&&grade!=='F'&&R01()<.55){
  G.cons.c12--;G.stats.consUsed++;
  (G.consLog.c12=G.consLog.c12||[]).unshift({t:Date.now(),txt:q.title+' — 추가 탐사'});
  extraLogs.push({tp:'시스템',txt:'「복제 탐사지도」의 표시를 따라가 수집품을 하나 더 찾아냈다!'});
  items.push({col:pickCollectible(q,rarBoost,false).id});
 }
 return items;
}

/* ---- 전리품 적용 (자동 배치 포함) ---- */
function evalItemFor(mi,it){const td=tendency(mi);let s=0;for(const k in it.bon)s+=it.bon[k]*(0.5+td[k]*3);return s+it.ilvl*0.15}
function autoEquip(it,sysLogs){
 let best=-1,bestGain=0.001;
 for(let mi=0;mi<12;mi++){
  const cur=itemByUid(it.cat==='w'?G.mem[mi].w:G.mem[mi].a);
  if(cur&&cur.lock)continue;
  const gain=evalItemFor(mi,it)-(cur?evalItemFor(mi,cur):0);
  if(gain>bestGain){bestGain=gain;best=mi}
 }
 if(best>=0){
  const slot=it.cat==='w'?'w':'a';
  const old=itemByUid(G.mem[best][slot]);
  if(old)old.owner=null;
  G.mem[best][slot]=it.uid;it.owner=best;
  sysLogs.push({tp:'시스템',txt:MEMBERS[best].name+'이(가) 「'+it.name+'」을(를) 장착했다. '+bonText(it.bon)});
  return best;
 }
 sysLogs.push({tp:'시스템',txt:'「'+it.name+'」은(는) 보관함에 정리했다.'});
 return -1;
}
function storeItem(it){
 (it.cat==='w'?G.invW:G.invA).push(it);
 trimInventory();
}
function trimInventory(){
 while(G.invW.length+G.invA.length>300){
  const all=[...G.invW,...G.invA].filter(x=>x.owner===null&&!x.lock);
  if(!all.length)break;
  all.sort((a,b)=>a.rar-b.rar||a.ilvl-b.ilvl||a.t-b.t);
  const rm=all[0];
  const arr=rm.cat==='w'?G.invW:G.invA;
  arr.splice(arr.indexOf(rm),1);
  G.stats.cleaned++;
 }
}
function applyLoot(run){
 const sys=[];
 for(const l of run.loot){
  if(l.it){
   if(l.it.cat==='w')G.stats.wGot++;else G.stats.aGot++;
   if(l.it.rar===4)G.stats.legend++;
   storeItem(l.it);
   l.eq=autoEquip(l.it,sys);
  } else if(l.cons){
   G.cons[l.cons]=Math.min(99,(G.cons[l.cons]||0)+l.qty);
  } else if(l.col){
   const c=COLBYID[l.col];
   if(!G.col[l.col]){G.col[l.col]={n:1,t:Date.now(),q:run.q.title};l.isNew=true;
    if(!G.colNew.includes(l.col))G.colNew.push(l.col);
    G.mem[run.mvp].rec.found++;
   } else G.col[l.col].n++;
   if(c.rar===4)G.stats.legend++;
  }
 }
 run.sysLogs=(run.sysLogs||[]).concat(sys);
}

function loadState(){

}

function makeGLRenderer(cv){
 const gl=cv.getContext('webgl2',{antialias:false,alpha:false});
 if(!gl)return null;
 const vsS='#version 300 es\nlayout(location=0) in vec2 aP;layout(location=1) in vec2 aT;layout(location=2) in vec4 aC;uniform vec2 uR;out vec2 vT;out vec4 vC;void main(){vec2 p=aP/uR*2.0-1.0;gl_Position=vec4(p.x,-p.y,0.,1.);vT=aT;vC=aC;}';
 const fsS='#version 300 es\nprecision mediump float;uniform sampler2D uS;in vec2 vT;in vec4 vC;out vec4 o;void main(){o=texture(uS,vT)*vC;}';
 function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x}
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vsS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fsS));gl.linkProgram(pr);

 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,AT);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
 const MAXQ=2200,buf=new Float32Array(MAXQ*6*8);let qn=0;

 }
 return {
  gl2:true,
  resize(){gl.viewport(0,0,cv.width,cv.height)},
  begin(){qn=0;const bg=hexRGB('#0a0e18');gl.clearColor(bg[0],bg[1],bg[2],1);gl.clear(gl.COLOR_BUFFER_BIT)},
  rect(x,y,w,h,hex,a){const c=hexRGB(hex);const f=FR._white;

 SCN.ents=MEMBERS.map((m,i)=>({i,x:40+((i*23)%240),y:floorY()-((i*13)%36)-4,tx:0,ty:0,st:'idle',anim:'idle',f:0,ft:0,wt:800+i*400,flip:false,anchor:-1,away:false,waveT:0}));

function freeAnchor(){

}
function entUpdate(dt){

  if(e.away)continue;
  e.ft+=dt;
  const spd=e.st==='walk'||e.st==='exit'||e.st==='enter'?0.028:0;
  if(spd>0){
   const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy);
   if(d<2){
    if(e.st==='exit'){e.away=true;continue}
    e.st='act';e.anim=['fire','table'].includes(e.actName)?'sit':(e.actName==='train'?'work':(e.actName==='alch'?'work':'idle'));
    e.wt=2500+Math.random()*5000;
   } else {e.x+=dx/d*spd*dt;e.y+=dy/d*spd*dt;e.flip=dx<0;e.anim='walk'}

let AC=null,audioReady=false;
function unlockAudio(){
 if(audioReady)return;
 try{AC=new (window.AudioContext||window.webkitAudioContext)();audioReady=true}catch(e){}
}
function beep(f,dur,type,vol,delay,slide){
 if(!audioReady||!AC||G.mute)return;
 try{
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.linearRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol||0.03,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(t);o.stop(t+dur+.02);
 }catch(e){}
}

const PHASE_LABEL={QUEST_SELECT:'퀘스트 선택 대기',PARTY_REVEAL:'멤버 소집 중',DEPART:'출동 준비',QUEST_RUNNING:'퀘스트 진행 중',QUEST_RESULT:'결과 정산',LOOT_REVEAL:'전리품 정산 중',RETURNING:'길드 귀환 중'};

 G.run=run;G.cands=null;

function emitLogs(elapsed,instant){
 const run=G.run;if(!run)return;
 while(run.emitted<run.evs.length&&run.evs[run.emitted].t<=elapsed){
  const e=run.evs[run.emitted++];
  addLog(e.tp,e.txt,instant);
  if(!instant){
   sceneReact(e.tp);
   if(e.tp==='전투')SFX.attack();
   else if(e.tp==='위기')SFX.trap();
   else if(e.tp==='특수능력')SFX.abil();
  }
 }
}
function finishRunning(){
 emitLogs(1e9,true);
 const run=G.run;
 // 통계 반영
 G.stats.q++;G.stats[run.grade]++;
 const ok=run.grade!=='F';
 for(const mi of run.party){
  const s=G.mem[mi];s.rec.go++;
  if(ok)s.rec.ok++;else s.rec.fail++;
  if(run.grade==='S')s.rec.s++;
  const c=run.contribs.find(x=>x.i===mi);
  s.rec.contrib=r1(s.rec.contrib+(c?c.c:0));
  s.exp+=run.q.diff*(run.grade==='S'?3:run.grade==='A'?2.5:run.grade==='B'?2:run.grade==='C'?1.2:0.6);
  while(s.exp>=s.lvl*10&&s.lvl<99){s.exp-=s.lvl*10;s.lvl++}
  s.recent.unshift({t:run.q.title,g:run.grade});if(s.recent.length>5)s.recent.length=5;
 }
 G.mem[run.mvp].rec.mvp++;
 applyLoot(run);
 // 기록 저장
 G.recs.unshift({t:Date.now(),title:run.q.title,type:run.q.type,ri:run.q.ri,diff:run.q.diff,dur:run.q.dur,
  party:run.party.slice(),grade:run.grade,mvp:run.mvp,bd:run.bd,
  logs:run.evs.map(e=>({tp:e.tp,txt:e.txt})).concat((run.extraLogs||[]).map(e=>({tp:e.tp,txt:e.txt}))),
  loot:run.loot.map(l=>l.it?{n:l.it.name,r:l.it.rar,c:l.it.cat}:l.cons?{n:CONSMAP[l.cons].name+' ×'+l.qty,r:0,c:'c'}:{n:COLBYID[l.col].name,r:COLBYID[l.col].rar,c:'col',isNew:l.isNew})});
 if(G.recs.length>100)G.recs.length=100;
 setPhase('QUEST_RESULT',3200);
 if(run.grade==='F')SFX.fail();else SFX.win();
 saveState();
 updateNavDots();
}

function advancePhase(){
 switch(G.phase){
  case 'QUEST_SELECT':chooseQuest(RI(0,2),true);break;
  case 'PARTY_REVEAL':beginDepart();break;
  case 'DEPART':beginRunning();break;
  case 'QUEST_RUNNING':finishRunning();break;
  case 'QUEST_RESULT':beginLoot();break;
  case 'LOOT_REVEAL':beginReturn();break;
  case 'RETURNING':startSelect();break;
  default:startSelect();
 }
}
/* ---- 백그라운드 복귀: 실제 타임스탬프 기준 복구 (현재 사이클까지만) ---- */
function fastForward(ms){
 let cycled=false,guard=0;
 while(ms>0&&guard++<12){
  if(G.phase==='QUEST_SELECT'&&cycled)break;
  if(G.remain>ms){
   G.remain-=ms;
   if(G.phase==='QUEST_RUNNING')emitLogs(G.run.q.dur*1000-G.remain,true);
   ms=0;
  } else {
   ms-=G.remain;
   if(G.phase==='RETURNING'||G.phase==='LOOT_REVEAL')cycled=true;
   hideOverlay();
   const ph=G.phase;
   if(ph==='QUEST_SELECT')chooseQuest(RI(0,2),true);
   else if(ph==='PARTY_REVEAL'){hideOverlay();setPhase('DEPART',1);sendPartyToDoor(G.run.party)}
   else if(ph==='DEPART')beginRunning();
   else if(ph==='QUEST_RUNNING')finishRunning();
   else if(ph==='QUEST_RESULT'){for(const e of G.run.extraLogs)addLog(e.tp,e.txt,true);applySilentLoot();setPhase('LOOT_REVEAL',1)}
   else if(ph==='LOOT_REVEAL')beginReturn();
   else if(ph==='RETURNING'){startSelect();cycled=true}
   else startSelect();
  }
 }
 renderProg();updateTopbar();
}
function applySilentLoot(){
 const run=G.run;
 for(const e of (run.sysLogs||[]))addLog(e.tp,e.txt,true);
}

 if(gdt>0){
  G.remain-=gdt;
  if(G.phase==='QUEST_RUNNING'&&G.run)emitLogs(G.run.q.dur*1000-G.remain);
  if(G.phase==='LOOT_REVEAL'&&G.run)lootTick(G.run.q.dur*0+((Math.max(1400,G.run.loot.length*550+900))-G.remain));
  if(G.remain<=0)advancePhase();
  entUpdate(gdt);
  guildChatter(gdt);
 }
 drawScene(now,gdt||dt*0.15);
 uiT+=dt;
 if(uiT>240){uiT=0;tickUI()}
 saveT+=dt;
 if(saveT>10000){saveT=0;saveState()}

function liveLine(){
 const ph=G.phase;
 if(ph==='QUEST_SELECT')return '퀘스트 선택 대기 · '+fmtT(G.remain)+' 남음';
 if(ph==='QUEST_RUNNING'&&G.run)return REGIONS[G.run.q.ri].short+' '+G.run.q.type+' 중 · '+fmtT(G.remain)+' 남음';
 if(ph==='LOOT_REVEAL')return '전리품 정산 중';
 if(ph==='QUEST_RESULT'&&G.run)return '결과: '+G.run.grade+'등급';
 return PHASE_LABEL[ph]||'대기';
}
function updateTopbar(){
 $('tbQ').textContent='퀘스트 '+G.stats.q+'회';
 $('tbPhase').textContent=(G.paused?'[일시정지] ':'')+(PHASE_LABEL[G.phase]||'준비');
 $('btnSnd').classList.toggle('on',!G.mute);
 $('btnPause').classList.toggle('on',G.paused);
 $('btnPause').textContent=G.paused?'재개':'정지';
 $('btnSpd').textContent='×'+G.speed;
}
function tickUI(){
 // 타이머/게이지 갱신
 const tb=$('progTbar');if(tb&&G.phase==='QUEST_SELECT')tb.style.width=(G.remain/20000*100)+'%';
 const tt=$('progTtxt');if(tt&&G.phase==='QUEST_SELECT')tt.textContent=fmtT(G.remain);
 const rb=$('runTbar');if(rb&&G.phase==='QUEST_RUNNING'&&G.run)rb.style.width=(100-G.remain/(G.run.q.dur*10))+'%';
 const rt=$('runTtxt');if(rt&&G.phase==='QUEST_RUNNING')rt.textContent=fmtT(G.remain);
 const lv=$('sheetLive');if(lv&&$('sheet').classList.contains('open'))lv.textContent=liveLine();
 if(G.phase!=='QUEST_SELECT'&&G.phase!=='QUEST_RUNNING')updateTopbar();
}

  '<div class="tbar"><i id="progTbar" style="width:100%"></i></div>'+

   const focus=q.focus.slice(0,3).map(k=>ST[k]).join('·');

    '<span class="tag">'+q.type+'</span><span class="tag">'+REGIONS[q.ri].short+'</span><span class="tag dif">난이도 '+q.diff+'</span></div>'+
    '<div class="qcMid"><b>권장 '+focus+'</b><em>⚠ '+esc(q.hz[0])+'</em><u>'+esc(q.lootHint)+'</u></div>'+
    '</button>';
  }).join('');

 }

  p.innerHTML='<div class="runBox pf"><div class="runTitle">'+esc(G.run.q.title)+'<span>소집 중...</span></div>'+
   '<div class="runSub">완전 무작위 소집 — 능력치 보정 없음</div></div>';

 else if(ph==='QUEST_RUNNING'&&G.run){
  const q=G.run.q;
  p.innerHTML='<div class="runBox pf"><div class="runTitle">'+esc(q.title)+'<span id="runTtxt">'+fmtT(G.remain)+'</span></div>'+
   '<div class="runSub">'+REGIONS[q.ri].name+' · '+q.type+' · 난이도 '+q.diff+' · 목표 '+q.target+'점</div>'+
   '<div class="tbar"><i id="runTbar" style="width:0%"></i></div>'+
   '<div class="pRow">'+G.run.party.map(mi=>'<img class="pix" alt="'+MEMBERS[mi].name+'" src="'+portraitURL(mi)+'">').join('')+'</div></div>';
 }
 else if(ph==='QUEST_RESULT'&&G.run){
  const r=G.run;
  p.innerHTML='<div class="resBox pf"><div class="gradeBig g_'+r.grade+'">'+(r.grade==='F'?'실패':r.grade)+'</div>'+
   '<div class="resInfo"><b>'+esc(r.q.title)+'</b><br>최종 <b>'+r.bd.final+'점</b> / 목표 '+r.bd.target+'점<br>MVP: <b>'+MEMBERS[r.mvp].name+'</b> (기여 '+r.contribs[0].c+')</div>'+
   '<button class="mini" id="bdBtn">상세</button></div>';

 }

 else if(ph==='RETURNING'){

 }
 else p.innerHTML='';
}

function lootItemHTML(l){
 if(l.it){
  const it=l.it;
  return '<div class="lootIt br'+it.rar+(it.rar===4?' lgd':'')+'"><img class="pix" src="'+(it.cat==='w'?weaponIconURL(it):armorIconURL(it))+'">'+
   '<div class="li"><b class="r'+it.rar+'">'+esc(it.name)+'</b>'+(it.cat==='w'?'무기':'방어구')+' · '+RAR[it.rar]+' · Lv'+it.ilvl+'<br>'+bonText(it.bon)+
   (l.eq>=0?' <span style="color:#7fd0a0">'+MEMBERS[l.eq].name+' 장착</span>':' <span style="color:#7d8ba8">보관</span>')+'</div></div>';
 }
 if(l.cons){const c=CONSMAP[l.cons];
  return '<div class="lootIt br0"><img class="pix" src="'+consIconURL(l.cons)+'"><div class="li"><b class="r1">'+c.name+' ×'+l.qty+'</b>소모품 · '+esc(c.desc)+'</div></div>';}
 const c=COLBYID[l.col];
 return '<div class="lootIt br'+c.rar+(c.rar===4?' lgd':'')+'"><img class="pix" src="'+colIconURL(c,false)+'"><div class="li"><b class="r'+c.rar+'">'+esc(c.name)+(l.isNew?'<span class="newTag">NEW!</span>':'')+'</b>수집품 · '+CTHEMES[c.theme].name+' · '+RAR[c.rar]+(l.isNew?'<br>도감에 새로 등록되었다!':'<br>중복 획득 ('+(G.col[l.col]?G.col[l.col].n:1)+'회)')+'</div></div>';
}
function lootTick(elapsed){
 const run=G.run,list=$('lootList');
 if(!list||!run)return;
 const should=Math.min(run.loot.length,Math.floor(elapsed/550)+ (G.remain<=1?99:0));
 while(run.lootShown<Math.min(run.loot.length,should)){
  const l=run.loot[run.lootShown++];
  list.insertAdjacentHTML('beforeend',lootItemHTML(l));
  const rar=l.it?l.it.rar:l.col?COLBYID[l.col].rar:0;
  if(rar>=4)SFX.loot4();else if(rar>=2)SFX.loot2();else SFX.loot0();
 }
}
function confirmBox(msg,okTxt,cb){
 const o=$('ovl');
 o.innerHTML='<div class="cfBox pf2"><p>'+msg+'</p><div class="btnRow" style="justify-content:center"><button class="btn warn" id="cfOk">'+okTxt+'</button><button class="btn" id="cfNo">취소</button></div></div>';
 o.classList.add('open');
 $('cfOk').addEventListener('click',()=>{hideOverlay();cb()});
 $('cfNo').addEventListener('click',hideOverlay);
}

let curTab=null,lootTab='w',colTab=0,lootFilter={rar:-1,sort:'new',eq:'all'};
function openSheet(tab){
 curTab=tab;
 $('sheet').classList.add('open');
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('cur',b.dataset.t===tab));
 $('sheetLive').textContent=liveLine();
 buildSheet();
}
function closeSheet(){
 $('sheet').classList.remove('open');curTab=null;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('cur'));
}
function buildSheet(){
 const T={ctrl:'관제실',mem:'멤버',loot:'전리품',col:'수집품 도감',rec:'기록'};
 $('sheetTitle').innerHTML=T[curTab]||'';
 if(curTab==='ctrl')buildCtrl();
 else if(curTab==='mem')buildMembers();
 else if(curTab==='loot')buildLoot();
 else if(curTab==='col')buildCollect();
 else if(curTab==='rec')buildRecords();
}

/* ---- 전리품 ---- */
function buildLoot(){
 const tabs=[['w','무기'],['a','방어구'],['c','소모품']];
 let html='<div class="tabRow">'+tabs.map(t=>'<button data-lt="'+t[0]+'" class="'+(lootTab===t[0]?'cur':'')+'">'+t[1]+'</button>').join('')+'</div>';
 if(lootTab!=='c'){
  html+='<div class="filterRow">'+
   '<select id="fRar"><option value="-1">희귀도 전체</option>'+RAR.map((r,i)=>'<option value="'+i+'" '+(lootFilter.rar===i?'selected':'')+'>'+r+'</option>').join('')+'</select>'+
   '<select id="fSort"><option value="new" '+(lootFilter.sort==='new'?'selected':'')+'>최신순</option><option value="rar" '+(lootFilter.sort==='rar'?'selected':'')+'>희귀도순</option><option value="lvl" '+(lootFilter.sort==='lvl'?'selected':'')+'>레벨순</option></select>'+
   '<select id="fEq"><option value="all">전체</option><option value="eq" '+(lootFilter.eq==='eq'?'selected':'')+'>장착 중</option><option value="lock" '+(lootFilter.eq==='lock'?'selected':'')+'>잠금</option><option value="free" '+(lootFilter.eq==='free'?'selected':'')+'>보관 중</option></select></div>';
  let arr=(lootTab==='w'?G.invW:G.invA).slice();
  if(lootFilter.rar>=0)arr=arr.filter(x=>x.rar===lootFilter.rar);
  if(lootFilter.eq==='eq')arr=arr.filter(x=>x.owner!==null);
  if(lootFilter.eq==='lock')arr=arr.filter(x=>x.lock);
  if(lootFilter.eq==='free')arr=arr.filter(x=>x.owner===null&&!x.lock);
  arr.sort((a,b)=>lootFilter.sort==='rar'?b.rar-a.rar||b.ilvl-a.ilvl:lootFilter.sort==='lvl'?b.ilvl-a.ilvl:b.t-a.t);
  html+='<div style="font-size:10px;color:#7d8ba8;margin-bottom:4px">'+arr.length+'개 표시 · 보관 총 '+(G.invW.length+G.invA.length)+'/300</div>';
  html+=arr.length?arr.slice(0,80).map(it=>'<button class="itRow pf br'+it.rar+'" data-it="'+it.uid+'"><img class="pix br'+it.rar+'" src="'+(it.cat==='w'?weaponIconURL(it):armorIconURL(it))+'"><span class="itInfo"><b class="r'+it.rar+'">'+esc(it.name)+'</b>Lv'+it.ilvl+' · '+bonText(it.bon)+(it.owner!==null?' · <span style="color:#7fd0a0">'+MEMBERS[it.owner].name+'</span>':'')+(it.lock?' · <span style="color:#e8a33d">잠금</span>':'')+'</span></button>').join(''):'<div class="kv"><span>보관 중인 장비가 없습니다. 퀘스트로 획득하세요.</span></div>';
 } else {
  html+=CONS.map(c=>'<button class="itRow pf br0" data-cs="'+c.id+'"><img class="pix" src="'+consIconURL(c.id)+'"><span class="itInfo"><b class="r1">'+c.name+' <span style="color:#f0e6cd">×'+(G.cons[c.id]||0)+'</span></b>'+esc(c.desc)+'</span></button>').join('');
 }
 $('sheetBody').innerHTML=html;
 $('sheetBody').querySelectorAll('[data-lt]').forEach(b=>b.addEventListener('click',()=>{SFX.tap();lootTab=b.dataset.lt;buildLoot()}));
 const fr=$('fRar');if(fr)fr.addEventListener('change',()=>{lootFilter.rar=+fr.value;buildLoot()});
 const fs=$('fSort');if(fs)fs.addEventListener('change',()=>{lootFilter.sort=fs.value;buildLoot()});
 const fe=$('fEq');if(fe)fe.addEventListener('change',()=>{lootFilter.eq=fe.value;buildLoot()});
 $('sheetBody').querySelectorAll('[data-it]').forEach(b=>b.addEventListener('click',()=>{SFX.tap();showItem(+b.dataset.it,buildLoot)}));
 $('sheetBody').querySelectorAll('[data-cs]').forEach(b=>b.addEventListener('click',()=>{SFX.tap();showCons(b.dataset.cs)}));
}
function recommendFor(it){
 let best=0,bs=-1;
 for(let i=0;i<12;i++){const v=evalItemFor(i,it);if(v>bs){bs=v;best=i}}
 return best;
}
function showItem(uid,back){
 const it=itemByUid(uid);
 if(!it){back();return}
 const rec=recommendFor(it);
 $('sheetBody').innerHTML=
  '<button class="backBtn" id="bk">← 돌아가기</button>'+
  '<div style="display:flex;gap:10px;align-items:center;margin:8px 0"><img class="pix br'+it.rar+'" style="width:56px;height:56px;border-width:2px;border-style:solid;background:#080b13" src="'+(it.cat==='w'?weaponIconURL(it):armorIconURL(it))+'">'+
  '<div style="font-size:11px;color:#9aa7c4;line-height:1.5"><b style="font-size:13px" class="r'+it.rar+'">'+esc(it.name)+'</b><br>'+(it.cat==='w'?'무기 · '+WKINDS[it.kind]:'방어구 세트')+' · '+RAR[it.rar]+' · Lv'+it.ilvl+'</div></div>'+
  '<div class="kv"><span>스탯 보너스</span><b>'+bonText(it.bon)+'</b></div>'+
  '<div class="kv"><span>설명</span><b style="font-weight:400">'+esc(it.desc)+'</b></div>'+
  '<div class="kv"><span>획득 퀘스트</span><b>'+esc(it.fromQ)+'</b></div>'+
  '<div class="kv"><span>획득 시각</span><b>'+new Date(it.t).toLocaleString('ko-KR')+'</b></div>'+
  '<div class="kv"><span>현재 착용</span><b>'+(it.owner!==null?MEMBERS[it.owner].name:'없음')+'</b></div>'+
  '<div class="kv"><span>추천 멤버</span><b style="color:#7fd0a0">'+MEMBERS[rec].name+'</b></div>'+
  '<div class="btnRow"><button class="btn" id="lk">'+(it.lock?'잠금 해제':'잠금 (자동 정리 제외)')+'</button></div>'+
  '<div class="secT">직접 장착</div><div class="pgrid" style="justify-content:flex-start">'+
  Array.from({length:12},(x,i)=>'<button data-eq="'+i+'" style="width:52px;border:2px solid '+(i===rec?'#7fd0a0':'#2c2a3a')+';background:#0e1424;padding:2px"><img class="pix" style="width:100%" src="'+portraitURL(i)+'"><span style="font-size:9px;color:#c9b98d">'+MEMBERS[i].name+'</span></button>').join('')+'</div>';
 $('bk').addEventListener('click',()=>{SFX.tap();back()});
 $('lk').addEventListener('click',()=>{SFX.tap();it.lock=!it.lock;saveState();showItem(uid,back)});
 $('sheetBody').querySelectorAll('[data-eq]').forEach(b=>b.addEventListener('click',()=>{
  SFX.pick();
  const mi=+b.dataset.eq,slot=it.cat==='w'?'w':'a';
  if(it.owner!==null)G.mem[it.owner][slot]=null;
  const old=itemByUid(G.mem[mi][slot]);if(old)old.owner=null;
  G.mem[mi][slot]=it.uid;it.owner=mi;
  addLog('시스템',MEMBERS[mi].name+'이(가) 「'+it.name+'」을(를) 장착했다. '+bonText(it.bon));
  saveState();showItem(uid,back);
 }));
}
function showCons(cid){
 const c=CONSMAP[cid],logs=G.consLog[cid]||[];
 $('sheetBody').innerHTML=
  '<button class="backBtn" id="bk">← 소모품 목록</button>'+
  '<div style="display:flex;gap:10px;align-items:center;margin:8px 0"><img class="pix" style="width:56px;height:56px;border:2px solid #2c2a3a;background:#080b13" src="'+consIconURL(cid)+'">'+
  '<div style="font-size:11px;color:#9aa7c4;line-height:1.5"><b style="font-size:13px;color:#f0e6cd">'+c.name+'</b><br>보유 ×'+(G.cons[cid]||0)+' (최대 99)</div></div>'+
  '<div class="kv"><span>효과</span><b style="font-weight:400">'+esc(c.desc)+'</b></div>'+
  '<div class="kv"><span>사용 시점</span><b style="font-weight:400">'+esc(c.use)+'</b></div>'+
  '<div class="secT">최근 사용 기록</div>'+
  (logs.length?logs.map(l=>'<div class="kv"><span>'+esc(l.txt)+'</span><b>'+new Date(l.t).toLocaleTimeString('ko-KR')+'</b></div>').join(''):'<div class="kv"><span>아직 사용 기록이 없습니다</span></div>');
 $('bk').addEventListener('click',()=>{SFX.tap();buildLoot()});
}
/* ---- 수집품 도감 ---- */
function buildCollect(){
 const found=Object.keys(G.col).length;
 // 열람한 테마의 NEW 제거
 G.colNew=G.colNew.filter(id=>COLBYID[id].theme!==colTab);
 updateNavDots();
 let html='<div style="font-size:11px;color:#c9b98d;margin-bottom:5px">전체 <b style="color:#e8a33d">'+pad3(found)+'</b> / 300</div>';
 html+='<div class="tabRowScroll">'+CTHEMES.map((t,i)=>{
  const cnt=COLLECT.filter(c=>c.theme===i&&G.col[c.id]).length;
  const hasNew=G.colNew.some(id=>COLBYID[id].theme===i);
  return '<button data-ct="'+i+'" class="'+(colTab===i?'cur':'')+'">'+t.name+' '+cnt+'/25'+(hasNew?'<i class="dot"></i>':'')+'</button>';
 }).join('')+'</div>';
 const items=COLLECT.filter(c=>c.theme===colTab);
 html+='<div class="colGrid">'+items.map(c=>{
  const f=G.col[c.id];
  return '<button class="colCell '+(f?'br'+c.rar:'unk')+'" data-cc="'+c.id+'">'+
   '<img class="pix" src="'+colIconURL(c,!f)+'">'+(f&&G.colNew.includes(c.id)?'<i class="nb"></i>':'')+'</button>';
 }).join('')+'</div><div id="colDetail" style="margin-top:8px"></div>';
 $('sheetBody').innerHTML=html;
 $('sheetBody').querySelectorAll('[data-ct]').forEach(b=>b.addEventListener('click',()=>{SFX.tap();colTab=+b.dataset.ct;buildCollect()}));
 $('sheetBody').querySelectorAll('[data-cc]').forEach(b=>b.addEventListener('click',()=>{SFX.tap();showCol(b.dataset.cc)}));
}
function showCol(id){
 const c=COLBYID[id],f=G.col[id],d=$('colDetail');
 if(!f){d.innerHTML='<div class="kv"><span>??? — 아직 발견하지 못한 수집품</span><b>'+c.id+'</b></div>';return}
 d.innerHTML='<div class="pf" style="padding:8px;display:flex;gap:10px;align-items:center">'+
  '<img class="pix br'+c.rar+'" style="width:56px;height:56px;border-width:2px;border-style:solid;background:#080b13" src="'+colIconURL(c,false)+'">'+
  '<div style="font-size:10.5px;color:#9aa7c4;line-height:1.5;flex:1"><b style="font-size:12.5px" class="r'+c.rar+'">'+esc(c.name)+'</b> <span class="badge r'+c.rar+'">'+RAR[c.rar]+'</span><br>'+
  esc(c.desc)+'<br>최초 발견: '+esc(f.q)+' · '+new Date(f.t).toLocaleDateString('ko-KR')+' · 획득 '+f.n+'회</div></div>';
}
/* ---- 기록 ---- */
function buildRecords(){
 const s=G.stats;
 const okN=s.S+s.A+s.B+s.C;
 const most=G.mem.map((m,i)=>({i,go:m.rec.go,mvp:m.rec.mvp})).sort((a,b)=>b.go-a.go);
 const least=most.slice().sort((a,b)=>a.go-b.go);
 const mvpTop=most.slice().sort((a,b)=>b.mvp-a.mvp)[0];
 const hardOk=G.recs.filter(r=>r.grade!=='F').sort((a,b)=>b.diff-a.diff)[0];
 const bigFail=G.recs.filter(r=>r.grade==='F').sort((a,b)=>(a.bd.final-a.bd.target)-(b.bd.final-b.bd.target))[0];
 $('sheetBody').innerHTML=
  '<div class="secT">길드 통계</div>'+
  '<div class="kv"><span>누적 퀘스트 / 성공률</span><b>'+s.q+'회 / '+(s.q?Math.round(okN/s.q*100):0)+'%</b></div>'+
  '<div class="kv"><span>S / A / B / C / 실패</span><b><span class="g_S" style="border:none">'+s.S+'</span> / '+s.A+' / '+s.B+' / '+s.C+' / <span style="color:#e05a5a">'+s.F+'</span></b></div>'+
  '<div class="kv"><span>최다 출동</span><b>'+MEMBERS[most[0].i].name+' ('+most[0].go+'회)</b></div>'+
  '<div class="kv"><span>최소 출동</span><b>'+MEMBERS[least[0].i].name+' ('+least[0].go+'회)</b></div>'+
  '<div class="kv"><span>최다 MVP</span><b>'+MEMBERS[mvpTop.i].name+' ('+mvpTop.mvp+'회)</b></div>'+
  '<div class="kv"><span>가장 어려웠던 성공</span><b>'+(hardOk?esc(hardOk.title)+' (난이도 '+hardOk.diff+')':'-')+'</b></div>'+
  '<div class="kv"><span>가장 뼈아픈 실패</span><b>'+(bigFail?esc(bigFail.title)+' ('+(bigFail.bd.final-bigFail.bd.target)+'점 차)':'-')+'</b></div>'+
  '<div class="kv"><span>획득 무기 / 방어구</span><b>'+s.wGot+' / '+s.aGot+'</b></div>'+
  '<div class="kv"><span>사용한 소모품</span><b>'+s.consUsed+'</b></div>'+
  '<div class="kv"><span>수집품 완성도</span><b>'+Object.keys(G.col).length+' / 300</b></div>'+
  '<div class="kv"><span>전설 획득 / 자동 정리 장비</span><b>'+s.legend+' / '+s.cleaned+'</b></div>'+
  '<div class="secT">최근 퀘스트 (최대 100)</div>'+
  (G.recs.length?G.recs.map((r,i)=>'<button class="itRow pf" data-r="'+i+'"><span class="gradeBig g_'+r.grade+'" style="width:34px;height:34px;font-size:16px;border-width:2px">'+(r.grade==='F'?'✕':r.grade)+'</span><span class="itInfo"><b style="color:#f0e6cd">'+esc(r.title)+'</b>'+REGIONS[r.ri].short+' · '+r.type+' · 난이도 '+r.diff+' · '+new Date(r.t).toLocaleTimeString('ko-KR')+'</span></button>').join(''):'<div class="kv"><span>아직 완료한 퀘스트가 없습니다</span></div>');
 $('sheetBody').querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{SFX.tap();showRecDetail(+b.dataset.r)}));
}
function showRecDetail(i){
 const r=G.recs[i];
 if(!r){buildRecords();return}
 const bd=r.bd;
 $('sheetBody').innerHTML=
  '<button class="backBtn" id="bk">← 기록 목록</button>'+
  '<div style="margin:8px 0"><b style="font-size:13px;color:#f0e6cd">'+esc(r.title)+'</b> <span class="badge g_'+r.grade+'" style="border-color:currentColor">'+(r.grade==='F'?'실패':r.grade+'등급')+'</span><br>'+
  '<span style="font-size:10.5px;color:#9aa7c4">'+REGIONS[r.ri].name+' · '+r.type+' · 난이도 '+r.diff+' · '+r.dur+'초 · '+new Date(r.t).toLocaleString('ko-KR')+'</span></div>'+
  '<div class="pRow">'+r.party.map(mi=>'<img class="pix" src="'+portraitURL(mi)+'" alt="'+MEMBERS[mi].name+'">').join('')+'</div>'+
  '<div style="font-size:10px;color:#7d8ba8;margin-top:2px">출동: '+r.party.map(mi=>MEMBERS[mi].name).join(', ')+' · MVP '+MEMBERS[r.mvp].name+'</div>'+
  '<div class="secT">점수 계산</div>'+
  '<div class="kv"><span>파티 기본 (스탯)</span><b>'+bd.stat+'</b></div>'+
  '<div class="kv"><span>장비 보너스</span><b>+'+bd.equip+'</b></div>'+
  '<div class="kv"><span>특수능력·시너지</span><b>+'+bd.abil+'</b></div>'+
  '<div class="kv"><span>인원 보너스</span><b>+'+bd.size+'</b></div>'+
  '<div class="kv"><span>사건 보너스·페널티</span><b>'+(bd.events>=0?'+':'')+bd.events+'</b></div>'+
  '<div class="kv"><span>난수</span><b>'+(bd.rand>=0?'+':'')+bd.rand+'</b></div>'+
  '<div class="kv"><span>최종 / 목표</span><b>'+bd.final+' / '+bd.target+'</b></div>'+
  '<div class="secT">퀘스트 로그</div>'+
  r.logs.map(l=>'<div class="lg t_'+l.tp+'"><img class="pix" src="'+logIconURL(l.tp)+'"><span>'+(l.tp==='대화'?l.txt:esc(l.txt))+'</span></div>').join('')+
  '<div class="secT">획득 전리품</div>'+
  (r.loot.length?r.loot.map(l=>'<div class="kv"><span class="r'+l.r+'">'+esc(l.n)+(l.isNew?'<span class="newTag">NEW</span>':'')+'</span><b>'+(l.c==='w'?'무기':l.c==='a'?'방어구':l.c==='c'?'소모품':'수집품')+'</b></div>').join(''):'<div class="kv"><span>획득한 전리품 없음</span></div>');
 $('bk').addEventListener('click',()=>{SFX.tap();buildRecords()});
}
function updateNavDots(){
 $('dotCol').classList.toggle('on',G.colNew.length>0);
}
/* ---- 토글 ---- */
function toggleSound(){unlockAudio();G.mute=!G.mute;updateTopbar();SFX.tap();saveState()}
function togglePause(){G.paused=!G.paused;updateTopbar();renderProg();SFX.tap();saveState()}
function toggleSpeed(){G.speed=G.speed===1?2:1;updateTopbar();SFX.tap();saveState()}
function toggleFold(){G.fold=!G.fold;$('logWrap').classList.toggle('fold',G.fold);$('logTgl').textContent=G.fold?'펼치기':'접기';saveState()}

/* ================================================================
   초기화 코드
================================================================ */
function boot(){
 buildAtlas();
 cvEl=$('cv');
 Rdr=makeGLRenderer(cvEl)||make2DRenderer(cvEl);
 setupCanvas();
 initEnts();
 const loaded=loadState();
 if(!loaded||!G)initState();
 // 앱 아이콘 (런타임 데이터 URL)
 try{
  const url=appIconURL();
  const l1=document.createElement('link');l1.rel='icon';l1.href=url;document.head.appendChild(l1);
  const l2=document.createElement('link');l2.rel='apple-touch-icon';l2.href=url;document.head.appendChild(l2);
 }catch(e){}
 // 입력
 $('btnSnd').addEventListener('click',toggleSound);
 $('btnPause').addEventListener('click',togglePause);
 $('btnSpd').addEventListener('click',toggleSpeed);
 $('logTgl').addEventListener('click',toggleFold);
 $('sheetX').addEventListener('click',()=>{SFX.tap();closeSheet()});
 $('sheetBk').addEventListener('click',closeSheet);
 document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{
  SFX.tap();
  if(curTab===b.dataset.t)closeSheet();else openSheet(b.dataset.t);
 }));
 const ll=$('logList');
 ll.addEventListener('scroll',()=>{logStick=ll.scrollHeight-ll.scrollTop-ll.clientHeight<40});
 document.addEventListener('pointerdown',unlockAudio,{once:true});
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(curTab==='ctrl')buildCtrl()});
 // 회전/리사이즈
 let rzT=null;
 window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{setupCanvas();initEntsKeep()},150)});
 window.addEventListener('orientationchange',()=>{setTimeout(()=>{setupCanvas();initEntsKeep()},300)});
 // 백그라운드 복귀
 let hideT=0;
 document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hideT=Date.now();saveState()}
  else if(hideT&&!G.paused){const gap=(Date.now()-hideT)*G.speed;hideT=0;lastT=0;if(gap>500)fastForward(gap)}
 });
 window.addEventListener('pagehide',saveState);
 // 상태 시작
 if(G.fold){$('logWrap').classList.add('fold');$('logTgl').textContent='펼치기'}
 $('sceneTag').textContent='길드 본부';
 if(loaded&&G.phase&&G.phase!=='BOOT'){
  addLog('시스템','저장된 원정 기록을 불러왔다. (퀘스트 '+G.stats.q+'회 진행됨)');
  const gap=G.savedAt?Date.now()-G.savedAt:0;
  if(G.phase==='QUEST_SELECT'&&G.cands&&gap<G.remain){renderProg()}
  else if(G.run&&['PARTY_REVEAL','DEPART','QUEST_RUNNING','QUEST_RESULT','LOOT_REVEAL','RETURNING'].includes(G.phase)){
   // 진행하던 사이클 정리 후 정상 복귀
   if(G.phase==='QUEST_RUNNING'){beginRunning();G.remain=Math.max(600,G.remain-gap);emitLogs(G.run.q.dur*1000-G.remain,true)}
   else startSelect();
  }
  else startSelect();
 } else {
  addLog('시스템','《픽셀 원정대: 12인의 길드》에 오신 것을 환영합니다.');
  addLog('시스템','12명의 멤버가 완전 무작위로 소집되어 퀘스트를 수행합니다. 지켜보기만 해도 게임은 계속됩니다.');
  startSelect();
 }
 updateTopbar();updateNavDots();
 requestAnimationFrame(loop);
}
function initEntsKeep(){
 const fy=floorY();
 for(const e of SCN.ents){e.y=Math.min(e.y,fy-4);e.ty=Math.min(e.ty,fy-4)}
}
if(typeof window!=='undefined'&&typeof document!=='undefined'){
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
 else boot();
} else if(typeof globalThis!=='undefined'){
 globalThis.__PG={ABIL_LIST,MEMBERS,WKINDS,ASETS,CONS,COLLECT,REGIONS,QTYPES,ANIMS,
  initState,genCandidates,rollParty,simulateQuest,genLoot,gradeFor,applyLoot,trimInventory,makeWeapon,makeArmor,
  getG:()=>G};
}
</script>
