function renderCatalog(){currentCatalog=filtered();$('filter-count').textContent=`${currentCatalog.length}개 표시`;const blind=mode==='problem'&&!revealed;$('catalog').innerHTML=currentCatalog.length?currentCatalog.map(d=>{const r=rec(d.id);return`<button class="lesson ${d.id===lesson.id?'current':''}" data-lesson="${d.id}" aria-current="${d.id===lesson.id?'true':'false'}"><span class="num">${String(d.id).padStart(2,'0')}</span><span><span class="name">${blind?'배치 찾기 '+String(d.id).padStart(2,'0'):escapeHTML(d.name)}</span><span class="sub">${d.difficulty} · ${STATE[r.status]||STATE.unseen}</span></span>${r.favorite?'<span class="star-mini" aria-label="즐겨찾기">★</span>':''}</button>`}).join(''):'<div class="empty">조건에 맞는 콘텐츠가 없습니다.<br>필터를 바꾸거나 초기화해 주세요.</div>';const known=DATA.filter(d=>rec(d.id).status==='familiar').length,seen=DATA.filter(d=>rec(d.id).status!=='unseen').length;$('global-progress').textContent=`봤음 ${seen} / 60 · 익숙 ${known}`}
function nextLesson(auto=false){const list=filtered();if(!list.length){stop();toast('현재 필터에 남은 콘텐츠가 없습니다.');return}let index=list.findIndex(x=>x.id===lesson.id),next;if($('random').checked&&list.length>1){const candidates=list.filter(x=>x.id!==lesson.id);next=candidates[Math.floor(Math.random()*candidates.length)]}else next=list[(index+1)%list.length];loadLesson(next.id,auto)}
function boardRender(animate=true){const s=snapshots[step],blind=mode==='problem'&&!revealed,show=marks&&!blind;const hi=show?(step?s.move?.highlights||[]:(track.kind==='prevention'||trackKey==='prep'?[]:lesson.highlights)):[];const king=Object.entries(s.map).find(([_,p])=>p.color===s.turn&&p.type==='k')?.[0];let legal=[];if(selected&&blind){const g=new Chess(s.fen);legal=g.moves({square:selected,verbose:true}).map(m=>m.to)}for(const cell of $$('#squares .square')){const sq=cell.dataset.square,p=s.map[sq];cell.classList.toggle('last',!!s.move&&(sq===s.move.fromSquare||sq===s.move.toSquare));cell.classList.toggle('check',s.check&&sq===king);cell.classList.toggle('focused',hi.includes(sq));cell.classList.toggle('selected',sq===selected);cell.classList.toggle('legal',legal.includes(sq));cell.setAttribute('aria-label',`${sq}${p?' '+(p.color==='w'?'백 ':'흑 ')+NAMES[p.type]:' 빈 칸'}`);cell.tabIndex=blind?0:-1}const live=new Set();$('board').classList.toggle('no-motion',!animate);for(const[sq,p]of Object.entries(s.map)){live.add(p.id);let node=boardPieces.get(p.id);if(!node){node=document.createElement('div');node.className='piece '+p.color;node.setAttribute('aria-hidden','true');node.dataset.type=p.type;node.innerHTML=pieceSVG(p.type,p.color);$('pieces').appendChild(node);boardPieces.set(p.id,node)}if(node.dataset.type!==p.type){node.innerHTML=pieceSVG(p.type,p.color);node.dataset.type=p.type}const[x,y]=squareXY(sq);node.style.transform=`translate(${x*100}%,${y*100}%)`;node.dataset.square=sq}for(const[id,node]of boardPieces)if(!live.has(id)){node.remove();boardPieces.delete(id)}let arrows=show?(step?s.move?.arrows||[]:lesson.arrows):[];if(track.kind==='prevention'&&step===0)arrows=[];if(trackKey==='prep'&&step===0)arrows=[];$('arrows').innerHTML=arrows.map(([a,b,kind])=>{const[x1,y1]=squareXY(a),[x2,y2]=squareXY(b),color=kind==='attack'?'red':'gold';return`<line x1="${x1*100+50}" y1="${y1*100+50}" x2="${x2*100+50}" y2="${y2*100+50}" stroke="${color==='red'?'#c96346':'#e7b33e'}" stroke-width="11" stroke-linecap="round" marker-end="url(#arrow-${color})"/>`}).join('');$('board').setAttribute('aria-label',`체스판, ${s.turn==='w'?'백':'흑'} 차례${s.check?', 체크':''}`);$('turn-label').innerHTML=`<span class="turn-dot ${s.turn==='b'?'black':''}"></span>${s.turn==='w'?'백':'흑'} 차례${s.mate?' · 체크메이트':s.stale?' · 스테일메이트':s.check?' · 체크':''}`;$('phase-label').textContent=blind?'첫 수 찾기':trackKey==='prep'?(step<prepCount?'준비 수순':step===prepCount?'핵심 포지션 도착':'핵심 수순'):track.kind==='prevention'?'예방 비교':track.kind==='core'?'핵심 수순':'대표 분기'}
function renderTitle(){const blind=mode==='problem'&&!revealed;$('lesson-kicker').textContent=blind?`FIND THE MOVE · ${String(lesson.id).padStart(2,'0')} / 60`:`${lesson.category} · ${CAT[lesson.category]} · ${String(lesson.id).padStart(2,'0')} / 60`;$('lesson-title').textContent=blind?'이 배치에서 첫 수를 찾아보세요':lesson.name;$('english').textContent=blind?'':lesson.english;$('lesson-meta').textContent=blind?`${lesson.difficulty} · ${lesson.learner==='w'?'백':'흑'}의 수를 찾습니다`:`${lesson.difficulty} · ${lesson.learner==='w'?'백':'흑'} 학습 · 내 수 ${lesson.ownMoves}번 / 전체 이동 ${lesson.totalMoves}회${lesson.validation.exactMate?.moves===1?' · 1수 처벌':lesson.validation.exactMate?' · '+lesson.validation.exactMate.moves+'수 메이트':''}`;const favorite=rec().favorite;$('favorite').textContent=favorite?'★':'☆';$('favorite').setAttribute('aria-pressed',String(!!favorite));$('favorite').setAttribute('aria-label',favorite?'즐겨찾기 해제':'즐겨찾기 추가');$('watch-mode').classList.toggle('active',mode==='watch');$('problem-mode').classList.toggle('active',mode==='problem')}
function resultHTML(){const s=snapshots[step],isMain=trackKey==='core'||trackKey==='prep',heading=isMain?lesson.outcome:track.kind==='prevention'?'예방 수순 확인':s.mate?'이 분기의 체크메이트':s.stale||s.repeat||s.insufficient?'이 분기의 무승부':track.kind==='mistake'?'실수 분기의 결과':'다른 응수의 결과',sign=n=>(n>0?'+':'')+n;let end=s.mate?'이 분기의 마지막 위치는 체크메이트입니다.':s.stale?'체크가 아니지만 합법수가 없어 스테일메이트, 무승부입니다.':s.repeat?'같은 위치가 세 번 나타났습니다. 실제 대국에서는 규정에 따라 무승부 청구가 필요합니다.':s.insufficient?'남은 기물로 체크메이트할 수 없어 이 구성은 무승부입니다.':'이 장면의 전술 구간이 끝났습니다. 대국 전체의 승패 확정과는 구별하세요.';let scope='';if(lesson.id===34&&trackKey==='core')scope='흑이 룩으로 되잡은 분기에서의 메이트입니다. 룩을 뒷줄에 남기는 방어는 퀸만 잃습니다.';if(lesson.id===47&&track.kind!=='prevention')scope='나이트 승격까지 성공했습니다. Rxg1이면 퀸을 잃지만 Ke1로 피하는 분기는 곧바로 퀸을 잃지 않습니다.';if(lesson.id===55&&trackKey==='core')scope='즉시 맞승격한 ...h1=Q에 대한 처벌입니다. 왕을 먼저 옮기면 이 스큐어는 피하지만 백의 퀸 승격은 이미 성공했습니다.';const delta=trackKey==='core'||trackKey==='prep'?lesson.core.material:track.material;return`<div class="resultbox"><h3>${escapeHTML(heading)}</h3><p>${end}</p>${scope?`<p>${scope}</p>`:''}<div class="stats"><div class="stat"><b>${delta.gain}</b>잡은 가치</div><div class="stat"><b>${delta.loss}</b>잃은 가치</div><div class="stat"><b>${sign(delta.delta)}</b>구간 순변화</div></div><div class="footnote">폰 1 · 나이트/비숍 3 · 룩 5 · 퀸 9. 위치 평가가 아닌 재료 계산입니다.${delta.promotion?' 승격 가치 변화 '+sign(delta.promotion)+'도 포함합니다.':''}${lesson.fromPreparationDelta!==undefined&&(trackKey==='core'||trackKey==='prep')?' 준비 수순 시작부터의 순변화: '+sign(lesson.fromPreparationDelta)+'.':''}</div><div class="memory">${escapeHTML(lesson.memory)}</div></div>`}
function sourceHTML(){const v=lesson.validation;return`<details><summary>출처 · 구성과 검증 범위</summary><p>${escapeHTML(lesson.source)} — ${escapeHTML(lesson.sourceNote)}</p><p><a href="${escapeHTML(lesson.sourceUrl)}" target="_blank" rel="noopener noreferrer">참고 자료 열기</a> (인터넷 연결 필요)</p><p>${escapeHTML(v.tool)}<br>${escapeHTML(v.scope)}</p>${v.exactMate?`<p>정확한 ${v.exactMate.moves}수 메이트 · AND/OR 방문 ${v.exactMate.nodes.toLocaleString()}회.<br>${escapeHTML(v.exactMate.method)}</p>`:''}${v.drawProof?`<p>${escapeHTML(v.drawProof)}</p>`:''}<p>첫 수 뒤 합법 응수 ${v.firstReplyCount}개 · 실제 도달 깊이 ${v.replyDepth||'종료 위치'}. 전체 시작 수 탐색의 대표 수와 학습용 수순이 다를 수 있으며 유일 정답을 주장하지 않습니다.</p><p>첫 수 제한 엔진 평가: ${escapeHTML(v.rootScore)} (학습 쪽 기준, cp 또는 메이트 표시). 수학적 승리 확정 수치가 아닙니다.</p><pre>${escapeHTML(lesson.fen)}</pre></details>`}
function explainHTML(){const s=snapshots[step],pre=trackKey==='prep'&&step<=prepCount;let content;if(step===0)content=`<div class="comment-number">${trackKey==='prep'?'어떻게 이 배치가 만들어졌을까요':track.kind==='prevention'?'실수 직전의 선택':'배치 읽기'}</div><h3>${trackKey==='prep'?'준비 수순':track.kind==='prevention'?escapeHTML(track.label):'먼저 어디를 볼까요?'}</h3><p class="comment-main">${escapeHTML(trackKey==='prep'?'준비 수순은 강제가 아닙니다. 상대가 다른 수를 고르면 핵심 배치에 도달하지 않을 수 있습니다.':track.kind==='prevention'?track.note:lesson.reading)}</p><div class="notice">${escapeHTML(track.kind==='prevention'?'비교 배치의 차례를 확인하세요. 이 수순은 해당 단기 전술의 예방을 보여주며 판 전체의 무승부나 승리를 보장하지 않습니다.':lesson.goal)}</div>`;else{const m=s.move;content=`<div class="comment-number">${pre?'준비 수순':track.kind==='core'?'핵심 수순':escapeHTML(track.label)} · 전체 이동 ${step}/${track.moves.length}</div><div class="comment-san">${m.moveNo}${m.color==='w'?'.':'…'} ${escapeHTML(m.san)}</div><div class="comment-main">${escapeHTML(m.text)}</div><p class="comment-why">${escapeHTML(m.why)}</p>${track.note?`<div class="notice">${escapeHTML(track.note)}</div>`:''}${step===prepCount&&trackKey==='prep'?'<div class="memory">여기부터 핵심 포지션입니다. 다음 수가 전술의 첫 수예요.</div>':''}`};return`<div class="kicker"><span class="badge">${lesson.nature}</span><span class="badge">${lesson.source}</span></div>${content}${step===track.moves.length?resultHTML():''}<hr class="rule"><h3>당하지 않는 방법</h3><p class="comment-why">${escapeHTML(lesson.preventionText)}</p>${lesson.preventions.length?'<button class="fullwidth" data-action="prevent">예방 수순으로 이동 →</button>':''}${sourceHTML()}`}
function notationHTML(){let rows='',prevNo=-1,row=null;const result=[];track.moves.forEach((m,i)=>{const real=snapshots[i+1].move;if(real.moveNo!==prevNo||real.color==='w'){if(row)result.push(row);row={no:real.moveNo,w:null,b:null};prevNo=real.moveNo}row[real.color]={m:real,i:i+1}});if(row)result.push(row);for(const r of result){rows+=`<span class="mn">${r.no}.</span>`;for(const c of ['w','b'])rows+=r[c]?`<button data-ply="${r[c].i}" class="${step===r[c].i?'active':''}" aria-label="${r.no}${c==='w'?' 백':' 흑'} ${escapeHTML(r[c].m.san)}로 이동">${escapeHTML(r[c].m.san)}</button>`:'<span class="blank"></span>'}return`<div class="comment-number">${escapeHTML(track.label)}</div><p class="meta">기보를 누르면 해당 이동 직후로 갑니다. +는 체크, #는 체크메이트, x는 잡기입니다.</p><button class="fullwidth ${step===0?'active':''}" data-ply="0">시작 배치</button><div class="move-list">${rows}</div><hr class="rule"><p class="footnote">K 킹 · Q 퀸 · R 룩 · B 비숍 · N 나이트. 글자 없는 수는 폰입니다. O-O는 킹 쪽 캐슬링, =N은 나이트 승격입니다.</p>`}
function linesHTML(){return`<h3>대표 수순과 방어</h3><p class="meta">분기마다 시작 배치와 기보를 새로 맞춥니다. ‘실수 분기’의 결말을 최선 방어의 결과로 읽지 마세요.</p><button class="line-btn ${trackKey==='core'?'active':''}" data-track="core">핵심 수순 <small>${escapeHTML(lesson.core.label)} · ${lesson.core.moves.map(x=>escapeHTML(x.san)).join(' ')}</small></button>${lesson.branches.map((v,i)=>`<button class="line-btn ${trackKey==='b:'+i?'active':''}" data-track="b:${i}">${v.kind==='mistake'?'실수 분기 · ':v.kind==='alternative'?'다른 정답 · ':''}${escapeHTML(v.label)}<small>${escapeHTML(v.note)}</small></button>`).join('')}${!lesson.branches.length?'<p class="notice">추가한 대표 방어 분기가 없습니다. 합법 응수가 하나뿐인 장면에는 다른 방어를 만들지 않았습니다.</p>':''}<hr class="rule"><h3>예방 수순</h3>${lesson.preventions.map((v,i)=>`<button class="line-btn ${trackKey==='p:'+i?'active':''}" data-track="p:${i}">${escapeHTML(v.label)}<small>${escapeHTML(v.note)}</small></button>`).join('')}${!lesson.preventions.length?`<p class="comment-why">${escapeHTML(lesson.preventionText)}</p><p class="footnote">이 항목에는 재생할 별도 예방 배치를 수록하지 않았습니다. 없는 탈출 수를 만들지 않습니다.</p>`:''}${sourceHTML()}`}
function recordsHTML(){const r=rec();return`<h3>이 배치의 학습 기록</h3><label class="meta" for="record-status">직접 학습 상태를 정하세요.</label><select id="record-status" class="recordselect">${Object.entries(STATE).map(([k,v])=>`<option value="${k}" ${r.status===k?'selected':''}>${v}</option>`).join('')}</select><button class="fullwidth" data-action="favorite">${r.favorite?'★ 즐겨찾기에 저장됨':'☆ 즐겨찾기 추가'}</button><div class="record-line"><span>관전 완료</span><b>${r.views||0}회</b></div><div class="record-line"><span>직접 첫 수 정답</span><b>${r.correct||0}회</b></div><p class="notice">자동 재생·정답 보기는 정답 횟수로 세지 않습니다. 찾아보기 모드에서 직접 검증된 첫 수를 둔 경우에만 별도로 기록합니다.</p><p class="footnote">${storageOK?'이 브라우저에 기록을 저장합니다. 다른 기기와 자동 동기화되지는 않습니다.':'현재 저장소를 사용할 수 없어 이번 실행 중에만 기록을 유지합니다. 모든 학습 기능은 계속 사용할 수 있습니다.'}</p>`}
function hint1(){const g=new Chess(lesson.fen);const k=g.board().flat().find(p=>p&&p.type==='k'&&p.color!==lesson.learner);const category=lesson.category;if(category==='A')return`${k?.square||''} 상대 왕의 퇴로와 자기 기물에 막힌 칸을 세어 보세요.`;if(category==='F')return lesson.id<=56?'양쪽 폰의 승격 칸과 왕이 놓인 줄·대각선을 확인하세요.':'현재 체크를 없애는 방법과, 내 왕에게 남아 있는 합법수를 확인하세요.';return`${k?.square||''} 상대 왕 주변의 체크 칸, 큰 기물의 수비 관계, 가려진 공격선을 살펴보세요.`}
function problemHTML(){const first=lesson.core.moves[0];return`<div class="comment-number">첫 수 찾기 · 답을 보지 않고 배치 읽기</div><h3>${lesson.learner==='w'?'백':'흑'}이 둘 차례입니다.</h3><p class="comment-why">말을 누른 다음 목적지를 누르세요. 준비된 첫 수를 찾는 연습입니다. 원하는 때 언제든 다음 콘텐츠나 관전 모드로 넘어갈 수 있어요.</p>${feedback?`<div class="feedback ${feedbackGood?'good':''}" role="status">${escapeHTML(feedback)}</div>`:''}${hints>=1?`<div class="hint"><b>힌트 1</b><br>${escapeHTML(hint1())}</div>`:''}${hints>=2?`<div class="hint"><b>힌트 2</b><br>사용할 기물은 ${NAMES[first.piece.toLowerCase()]}입니다. 체크·잡기·위협 순서로 후보를 살펴보세요.</div>`:''}${hints>=3?`<div class="hint"><b>힌트 3</b><br>${escapeHTML(first.san)} · ${first.fromSquare} → ${first.toSquare}${first.promotion?' · '+NAMES[first.promotion]+' 승격':''}</div>`:''}<div class="problem-buttons"><button data-action="hint" ${hints>=3?'disabled':''}>${hints>=3?'힌트를 모두 확인했어요':'힌트 '+(hints+1)+' 보기'}</button><button class="primary" data-action="reveal">정답 보기 · 전체 수순 재생</button><button data-action="next-problem">다음 콘텐츠 →</button></div><p class="footnote" style="margin-top:18px">합법적이지만 데이터에 없는 수는 ‘준비된 해설에 없는 수’라고 안내합니다. 기기 안에 분석 엔진은 포함하지 않았습니다.</p>`}
function renderPanel(){const blind=mode==='problem'&&!revealed;const cap=$('mobile-caption');if(cap){const m=snapshots[step]?.move;cap.innerHTML=blind?'말을 선택한 뒤 목적지를 누르세요. 힌트와 정답 보기는 아래 패널에 있습니다.':`<span><strong>${m?escapeHTML(m.san):'배치 읽기'}</strong>${escapeHTML(m?m.why:track.kind==='prevention'?track.note:trackKey==='prep'?'이 준비 수순은 강제가 아닙니다. 어떻게 핵심 배치가 만들어지는지 살펴보세요.':lesson.reading.split('. ')[0]+'.')}</span>`;}$$('.tabs button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.disabled=blind&&b.dataset.tab!=='explain'});$('panel').innerHTML=blind?problemHTML():tab==='notation'?notationHTML():tab==='lines'?linesHTML():tab==='record'?recordsHTML():explainHTML()}
function renderControls(){const blind=mode==='problem'&&!revealed;$('slider').max=track.moves.length;$('slider').value=step;$('slider').disabled=blind;$('step-count').textContent=blind?'답 숨김':`${step} / ${track.moves.length}`;for(const id of ['first','prev'])$(id).disabled=blind||step===0;for(const id of ['next','last'])$(id).disabled=blind||step===track.moves.length;$('play').disabled=blind;$('core').disabled=blind;$('preparation').disabled=blind||!lesson.preparation;$('preparation').title=lesson.preparation?'준비 수순과 핵심 수순을 이어 봅니다.':'별도의 준비 수순이 없는 교육용 구성입니다.';$('defenses').disabled=blind||!lesson.branches.length;$('prevention').disabled=blind||!lesson.preventions.length;$('show-marks').disabled=blind;updatePlayButton()}
function renderAll(){renderTitle();boardRender(false);renderControls();renderPanel();renderCatalog()}
function go(n,fromTimer=false){if(!fromTimer)stop();if(mode==='problem'&&!revealed)return;const previous=step;step=Math.max(0,Math.min(snapshots.length-1,Number(n)));selected=null;boardRender(Math.abs(step-previous)===1);renderControls();renderPanel();if(step===track.moves.length&&(trackKey==='core'||trackKey==='prep')&&renderEndKey!==trackKey){renderEndKey=trackKey;const r=rec();if(r.status==='unseen')r.status='seen';if(mode==='watch')r.views=(r.views||0)+1;persist();renderCatalog()}if(step===0)renderEndKey=''}
function switchMode(next){stop();mode=next;revealed=next==='watch';hints=0;feedback='';feedbackGood=false;answerRecorded=false;tab='explain';selectTrack('core',false);renderCatalog()}
function reveal(){revealed=true;feedback='';tab='explain';selectTrack('core',true);renderCatalog()}
function tryMove(from,to,promotion){const g=new Chess(lesson.fen);let m;try{m=g.move({from,to,promotion})}catch(_){feedback='이 배치에서는 둘 수 없는 수입니다. 이동 규칙과 현재 체크를 확인해 주세요.';feedbackGood=false;selected=null;boardRender(false);renderPanel();return}const uci=m.from+m.to+(m.promotion||'');let answer=lesson.accepted.includes(uci)||(lesson.validation.exactMate?.moves===1&&g.isCheckmate());if(answer){if(!answerRecorded){rec().correct=(rec().correct||0)+1;answerRecorded=true;persist()}revealed=true;feedback='';selected=null;let alt=lesson.branches.findIndex(v=>v.kind==='alternative'&&v.moves[0].uci===uci);if(uci!==lesson.core.moves[0].uci&&alt>=0){selectTrack('b:'+alt,false);go(1)}else if(uci===lesson.core.moves[0].uci){selectTrack('core',false);go(1)}else{stop();const values={p:1,n:3,b:3,r:5,q:9,k:0},gain=values[m.captured]||0,promotion=m.promotion?values[m.promotion]-1:0;track={...lesson.core,material:{gain,loss:0,promotion,delta:gain+promotion},label:'다른 1수 메이트',moves:[{...lesson.core.moves[0],uci,san:m.san,fromSquare:from,toSquare:to,piece:m.piece,capture:m.captured||null,promotion:m.promotion||null,check:true,mate:true,text:`${NAMES[m.piece]} ${from} → ${to}. 체크메이트입니다.`,why:'합법수 처리로 직접 체크메이트를 확인한 다른 정답입니다.',arrows:[[from,to,'move']],highlights:[from,to]}]};snapshots=buildTrack(track);trackKey='alternate-mate';step=1;renderAll()}toast('정답! 직접 찾은 첫 수로 기록했어요.');renderCatalog();return}const known=lesson.branches.find(v=>v.kind==='mistake'&&v.moves[0].uci===uci&&v.moves[0].uci!==lesson.core.moves[0].uci);feedback=known?`검증한 반박이 있는 수입니다. ${known.note}`:'합법적인 수입니다. 다만 준비된 해설에 없는 수라서 정답·오답을 판정하지 않습니다. 다른 후보를 찾거나 정답 수순과 비교해 보세요.';feedbackGood=false;selected=null;boardRender(false);renderPanel()}
function onSquare(sq){if(mode!=='problem'||revealed)return;const g=new Chess(lesson.fen),p=g.get(sq);if(selected){const from=selected,choices=g.moves({square:from,verbose:true}).filter(m=>m.to===sq);if(choices.length){if(choices.some(m=>m.promotion)){pendingPromotion={from,to:sq};$('promotion-options').innerHTML=['q','r','b','n'].map(t=>`<button data-promote="${t}"><span class="piece ${lesson.learner}">${pieceSVG(t,lesson.learner)}</span><span>${NAMES[t]}</span></button>`).join('');$('promotion-dialog').showModal()}else tryMove(from,sq);return}}if(p&&p.color===lesson.learner){selected=selected===sq?null:sq;boardRender(false)}else{selected=null;boardRender(false)}}
function showLines(prevention=false){if(mode==='problem'&&!revealed)return;stop();tab='lines';renderPanel();if(prevention&&lesson.preventions.length){selectTrack('p:0');tab='explain';renderPanel()}if(matchMedia('(max-width:740px)').matches)$('panel').scrollIntoView({behavior:'smooth',block:'start'})}
function openLibrary(){lastFocused=document.activeElement;document.body.classList.add('list-open');$('library').setAttribute('role','dialog');$('library').setAttribute('aria-modal','true');$('close-list').focus()}
function closeLibrary(){document.body.classList.remove('list-open');$('library').removeAttribute('role');$('library').removeAttribute('aria-modal');if(lastFocused){lastFocused.focus();lastFocused=null}}
function showInfo(){const main=DATA.reduce((n,d)=>n+d.core.moves.length,0),branches=DATA.reduce((n,d)=>n+d.branches.length,0),pre=DATA.reduce((n,d)=>n+d.preventions.length,0),mate=DATA.filter(d=>d.validation.exactMate).length,all=DATA.reduce((n,d)=>n+d.core.moves.length+d.branches.reduce((a,v)=>a+v.moves.length,0)+d.preventions.reduce((a,v)=>a+v.moves.length,0)+(d.preparation?.moves.length||0),0);$('info-body').innerHTML=`<p><b>관전 모드</b>로 시작합니다. 자동 재생을 끄고 이전·다음·슬라이더·기보로 한 이동씩 살펴볼 수 있습니다. 기본 속도는 이동당 2초이며 핵심 수와 마지막 결과에서는 더 머뭅니다.</p><p><b>찾아보기 모드</b>는 첫 수 찾기입니다. 기물을 누르고 목적지를 누르세요. 정답 보기는 언제든 가능합니다. 아직 검증하지 않은 합법수는 오답으로 세지 않습니다.</p><table><tr><th>수록</th><td>6묶음 × 10개 = 60개</td></tr><tr><th>본선</th><td>${main}회 이동</td></tr><tr><th>대표 분기</th><td>${branches}개</td></tr><tr><th>예방 비교</th><td>${pre}개</td></tr><tr><th>전체 수록 수순</th><td>${all}회 이동 · 준비 수순 포함</td></tr><tr><th>정확한 메이트 증명</th><td>${mate}개 항목 · 전체 합법 응수 AND/OR 탐색</td></tr><tr><th>무승부 검증</th><td>59번: 세 잡기 모두 스테일메이트<br>60번: 상대 응수 유일성 및 3회 동일 위치 확인</td></tr></table><p><b>검증 도구</b>: python-chess, Stockfish.js 17.1 lite single, 실행 화면의 chess.js 1.4.0. 모든 본선·분기·예방·준비 수순의 합법성, SAN, 차례, 종료 판정과 재료 변화를 검사했습니다.</p><p>핵심 첫 수를 깊이 18로 분석하고, 그 직후의 모든 합법 응수를 MultiPV 깊이 12로 탐색했습니다. 수록 분기·예방 첫 수는 깊이 14로 분석했습니다. 이 범위의 엔진 탐색은 무제한 수학적 승리 증명이 아닙니다. 정확한 메이트 증명을 수행한 항목에만 ‘강제 메이트’를 표시합니다.</p><p><b>읽을 때의 기준</b>: 3수 메이트는 공격하는 쪽의 세 번째 수까지입니다. 5회의 전체 이동일 수 있습니다. 순이득은 해당 구간의 재료 변화이며 게임 승리를 보장하지 않습니다. 실제 왕만 남거나 기물이 부족하면 무승부임을 별도로 표시합니다.</p><p>이 파일은 <b>교육용 구성 50개 + 알려진 트랩 재현 10개</b>입니다. 실전 선수·대회 정보는 붙이지 않았습니다. Lichess CSV를 가져오지 않았으며 퍼즐 레이팅을 Chess.com 대국 레이팅으로 환산하지 않았습니다. 기초·보통·도전은 편집상의 난이도입니다.</p><p>일부 교육용 수순은 유일한 최선수가 아니며, 패턴의 작동을 보여주는 수입니다. 1수 대표 모양은 ‘1수 처벌’로 구분했습니다. 이미 패턴이 완성된 구성에는 가짜 탈출 수를 넣지 않았습니다.</p><p>외부 이미지·글꼴·CDN·실시간 엔진이 없습니다. 파일을 내려받아 브라우저에서 열면 오프라인으로 재생할 수 있습니다. 외부 출처 링크만 인터넷 연결이 필요합니다. 기록은 브라우저별로 저장됩니다.</p><p class="footnote">chess.js 1.4.0 · BSD-2-Clause 라이선스 고지는 파일 안에 포함되어 있습니다. SVG 체스말은 이 페이지를 위해 직접 그렸습니다.</p>`;$('info-dialog').showModal()}
$('catalog').addEventListener('click',e=>{const b=e.target.closest('[data-lesson]');if(b)loadLesson(b.dataset.lesson,mode==='watch')});$('squares').addEventListener('click',e=>{const b=e.target.closest('[data-square]');if(b)onSquare(b.dataset.square)});
$('first').onclick=()=>go(0);$('prev').onclick=()=>go(step-1);$('next').onclick=()=>go(step+1);$('last').onclick=()=>go(track.moves.length);$('play').onclick=play;$('slider').oninput=e=>go(Number(e.target.value));$('speed').onchange=e=>{speed=Number(e.target.value);persist();if(playing)schedule()};$('repeat').onchange=()=>{if($('repeat').checked)$('continuous').checked=false};$('continuous').onchange=()=>{if($('continuous').checked)$('repeat').checked=false};$('flip').onclick=()=>{flipped=!flipped;initSquares();boardRender(false);persist()};$('show-marks').onchange=e=>{marks=e.target.checked;boardRender(false);persist()};$('next-lesson').onclick=()=>nextLesson(playing||mode==='watch');$('favorite').onclick=()=>{rec().favorite=!rec().favorite;persist();renderTitle();renderCatalog();if(tab==='record')renderPanel()};$('core').onclick=()=>selectTrack('core');$('preparation').onclick=()=>selectTrack('prep');$('defenses').onclick=()=>showLines();$('prevention').onclick=()=>showLines(true);$('watch-mode').onclick=()=>switchMode('watch');$('problem-mode').onclick=()=>switchMode('problem');$('open-list').onclick=openLibrary;$('close-list').onclick=closeLibrary;$('backdrop').onclick=closeLibrary;$('about').onclick=showInfo;
for(const id of ['search','category','difficulty','turn','goal-filter','status-filter','sort'])$(id).addEventListener(id==='search'?'input':'change',renderCatalog);$('reset-filters').onclick=()=>{for(const id of ['search','category','difficulty','turn','goal-filter','status-filter'])$(id).value='';$('sort').value='recommend';renderCatalog()};$$('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderPanel()});$$('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('promotion-options').onclick=e=>{const b=e.target.closest('[data-promote]');if(b&&pendingPromotion){const {from,to}=pendingPromotion;pendingPromotion=null;$('promotion-dialog').close();tryMove(from,to,b.dataset.promote)}};
$('panel').addEventListener('click',e=>{const p=e.target.closest('[data-ply]');if(p){go(Number(p.dataset.ply));return}const t=e.target.closest('[data-track]');if(t){selectTrack(t.dataset.track);tab='explain';renderPanel();return}const a=e.target.closest('[data-action]')?.dataset.action;if(a==='hint'){hints=Math.min(3,hints+1);renderPanel()}if(a==='reveal')reveal();if(a==='next-problem')nextLesson(false);if(a==='prevent')showLines(true);if(a==='favorite')$('favorite').click()});$('panel').addEventListener('change',e=>{if(e.target.id==='record-status'){rec().status=e.target.value;persist();renderCatalog()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLibrary();if(document.body.classList.contains('list-open')&&e.key==='Tab'){const els=Array.from($('library').querySelectorAll('button,input,select')).filter(x=>x.offsetParent!==null&&!x.disabled);if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}return}if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||document.querySelector('dialog[open]'))return;if(e.key==='ArrowRight'){e.preventDefault();if(mode==='watch'||revealed)go(step+1)}if(e.key==='ArrowLeft'){e.preventDefault();if(mode==='watch'||revealed)go(step-1)}if(e.code==='Space'&&!e.target.closest('button')){e.preventDefault();play()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)stop()});window.addEventListener('pagehide',()=>{stop();persist()});matchMedia('(min-width:991px)').addEventListener('change',e=>{if(e.matches)closeLibrary()});
