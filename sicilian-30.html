<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시실리안 디펜스 명국 30선</title>
<style>
:root{
  --t1:#b3261e;--t2:#c2410c;--t3:#9a6700;
  --bg:#dde4d9;--panel:#eef2eb;--panel2:#e3e9df;--ink:#16302a;--muted:#546a60;--line:#bfcbbb;
  --brass:#8a6519;--brass-soft:rgba(138,101,25,.14);--sel:#cddac7;--shadow:rgba(20,40,30,.22);
  --sqL:#e8cc9f;--sqL2:#ddbd8e;--sqD:#a5714a;--sqD2:#93603b;--frame:#4b2f1b;
  --hl:rgba(236,186,70,.5);--coordL:#93603b;--coordD:#f0d9b3;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Noto Serif KR","Nanum Myeongjo",AppleMyungjo,Georgia,serif;
  --sans:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d2a22;--panel:#12362b;--panel2:#0f3026;--ink:#ebe5d2;--muted:#9fb3a8;--line:#244a3d;
  --brass:#d3a74e;--brass-soft:rgba(211,167,78,.14);--sel:#1b4638;--shadow:rgba(0,0,0,.45);--frame:#2c1a0e;--t1:#ff8a80;--t2:#fdae6b;--t3:#f5cf5b;color-scheme:dark;}}
:root[data-theme="dark"]{
  --t1:#ff8a80;--t2:#fdae6b;--t3:#f5cf5b;
  --bg:#0d2a22;--panel:#12362b;--panel2:#0f3026;--ink:#ebe5d2;--muted:#9fb3a8;--line:#244a3d;
  --brass:#d3a74e;--brass-soft:rgba(211,167,78,.14);--sel:#1b4638;--shadow:rgba(0,0,0,.45);--frame:#2c1a0e;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
svg{display:block}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top" "stage" "moves";
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);overflow:hidden}

/* header */
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);min-width:0}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--brass-soft)}
.icon-btn svg{width:22px;height:22px}
.listbtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 8px;border-radius:10px;border:1px solid var(--line);flex:none;font-size:14px}
.listbtn svg{width:20px;height:20px}
.listbtn:hover{background:var(--brass-soft)}
.gtitle{flex:1;min-width:0}
.gtitle b{display:block;font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtitle span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnav{display:flex;gap:2px;flex:none}

/* stage */
.stage{grid-area:stage;display:flex;flex-direction:column;align-items:center;padding:6px 12px 4px;min-width:0}
.col{width:max(calc(var(--bs,320px) + 30px),min(100%,420px));max-width:100%;display:flex;flex-direction:column}
.board-wrap{align-self:center}
.strip{display:flex;align-items:center;gap:10px;height:42px;padding:0 4px}
.swatch{width:14px;height:14px;border-radius:50%;flex:none;border:1.5px solid #3b2a1a}
.swatch.w{background:linear-gradient(135deg,#fffdf5,#dcc7a0)}
.swatch.b{background:linear-gradient(135deg,#5a5048,#110e0c);border-color:#0b0907}
.pname{min-width:0;flex:1;display:flex;align-items:baseline;gap:8px;overflow:hidden}
.pname b{font-family:var(--serif);font-weight:600;font-size:16px;white-space:nowrap}
.pname small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caps{display:flex;align-items:center;flex:none;max-width:52%;overflow:hidden;min-height:24px;padding:2px 8px 2px 6px;border-radius:999px;background:linear-gradient(140deg,var(--sqL),var(--sqL2));box-shadow:inset 0 0 0 1px rgba(75,47,27,.25)}
.caps:empty{visibility:hidden}
.caps svg{width:19px;height:19px;margin-left:-6px}
.caps svg:first-child{margin-left:0}
.caps em{font-style:normal;font-size:12px;font-weight:700;color:#5a3a20;margin-left:5px;font-variant-numeric:tabular-nums}
.badge{flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;visibility:hidden}
.badge.win{visibility:visible;background:var(--brass);color:var(--bg)}
.badge.loss{visibility:visible;border:1px solid var(--line);color:var(--muted)}

.board-wrap{position:relative;padding:7px;border-radius:8px;background:var(--frame);box-shadow:0 0 0 1px var(--brass),0 12px 28px var(--shadow)}
.board{position:relative;width:var(--bs,320px);height:var(--bs,320px);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:2px;overflow:hidden;touch-action:manipulation}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(97deg,rgba(60,30,10,.035) 0 1px,transparent 1px 5px),repeating-linear-gradient(83deg,rgba(255,240,210,.03) 0 2px,transparent 2px 9px)}
.sq{position:relative}
.sq.l{background:linear-gradient(140deg,var(--sqL),var(--sqL2))}
.sq.d{background:linear-gradient(140deg,var(--sqD),var(--sqD2))}
.sq.lm::before{content:"";position:absolute;inset:0;background:var(--hl)}
.sq.chk::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(205,48,32,.92) 0,rgba(205,48,32,.55) 38%,rgba(205,48,32,0) 72%)}
.co{position:absolute;font-size:max(9px,calc(var(--bs,320px)/42));font-weight:700;line-height:1;z-index:2;pointer-events:none}
.co.r{left:3%;top:4%}.co.f{right:5%;bottom:4%}
.sq.l .co{color:var(--coordL)}.sq.d .co{color:var(--coordD)}
.pieces{position:absolute;inset:0;pointer-events:none;z-index:3}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform var(--mt,240ms) cubic-bezier(.25,.8,.25,1),opacity 180ms ease;will-change:transform}
.pc svg{width:100%;height:100%;transform:scale(.9);transform-origin:50% 60%}
.pc.gone{opacity:0}
.pc.lift{z-index:2}
.board.instant .pc{transition:none}

.banner{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);z-index:5;min-width:min(260px,80%);text-align:center;
  background:var(--panel);color:var(--ink);border:1px solid var(--brass);border-radius:14px;padding:16px 18px 14px;box-shadow:0 14px 36px var(--shadow)}
.banner[hidden]{display:none}
.banner strong{display:block;font-family:var(--serif);font-size:21px;font-weight:600}
.banner .sc{display:block;font-size:14px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.banner .cd{display:block;font-size:13px;margin-top:10px;color:var(--muted)}
.banner .row{display:flex;gap:8px;justify-content:center;margin-top:12px}
.pill{height:36px;padding:0 16px;white-space:nowrap;border-radius:999px;border:1px solid var(--line);font-size:14px}
.pill.main{background:var(--brass);border-color:var(--brass);color:var(--bg);font-weight:600}

.scrub{display:flex;align-items:center;gap:10px;height:30px;padding:0 4px}
.scrub input{flex:1;accent-color:var(--brass);height:24px;margin:0}
.scrub span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:4px;height:54px;padding:0 0 4px}
.ctrl .grp{display:flex;align-items:center;gap:2px}
.play{width:52px;height:44px;border-radius:12px;background:var(--brass);color:var(--bg);display:grid;place-items:center}
.play svg{width:24px;height:24px}
.speed{min-width:44px;height:40px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.toggle[aria-pressed="true"]{background:var(--brass-soft);color:var(--brass)}

/* eval bar */
.board-wrap{display:flex;gap:6px}
.evbar{width:10px;border-radius:3px;overflow:hidden;background:#1d1713;position:relative;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.evbar i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(90deg,#fffdf5,#e3d3b0);transition:height 380ms ease}
.evbar.flip i{bottom:auto;top:0}
.evbar b{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(210,166,77,.8)}
/* commentary */
.note{flex:none;padding:10px 16px 10px;border-bottom:1px solid var(--line);height:152px;overflow-y:auto;overscroll-behavior:contain}
@media (max-height:700px){.note{height:106px;padding:7px 14px}.note p{font-size:13.5px;line-height:1.5;margin-top:2px}.strip{height:36px}.ctrl{height:48px}}
.nhead{display:flex;align-items:center;gap:8px;min-height:24px}
.nhead b{font-family:var(--serif);font-weight:600;font-size:16px;display:flex;align-items:center;gap:1px;font-variant-numeric:tabular-nums}
.nhead b svg{width:17px;height:17px;margin-bottom:2px}
.nhead{--figd:var(--panel)}
.tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;color:var(--panel)}
.tag[hidden]{display:none}
.tag.t1{background:var(--t1)}.tag.t2{background:var(--t2)}.tag.t3{background:var(--t3)}
.evc{margin-left:auto;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding:1px 8px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.note p{margin:4px 0 0;font-size:14.5px;line-height:1.6;max-width:64ch}
.pv{margin-top:4px;font-size:12.5px;color:var(--muted)}
.pv[hidden]{display:none}
.graph{flex:none;height:52px;margin:0 16px 4px;position:relative;cursor:pointer;touch-action:none}
.graph svg{width:100%;height:100%}
.mv sup{font-size:11px;font-weight:700;margin-left:1px;vertical-align:4px}
.mv sup.t1{color:var(--t1)}.mv sup.t2{color:var(--t2)}.mv sup.t3{color:var(--t3)}
.mv.cur sup{color:inherit}
.credit{font-size:11.5px;color:var(--muted);padding:8px 16px 12px;border-top:1px solid var(--line);margin:0}
/* moves */
.moves{grid-area:moves;display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line);background:var(--panel)}
.opening{padding:8px 16px 6px}
.opening,.graph{display:none}
.opening b{font-family:var(--serif);font-weight:600;font-size:16px}
.opening span{display:block;font-size:12.5px;color:var(--muted)}
.sheet{flex:1;overflow-y:auto;padding:6px 8px 14px;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));align-content:start;column-gap:6px}
.mr{display:grid;grid-template-columns:34px 1fr 1fr;align-items:center;height:30px}
.mr i{font-style:normal;color:var(--muted);font-size:12.5px;text-align:right;padding-right:8px;font-variant-numeric:tabular-nums}
.mv{height:26px;border-radius:6px;padding:0 6px;text-align:left;display:flex;align-items:center;gap:1px;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mv svg{width:16px;height:16px;flex:none;margin:0 1px 2px 0}
.mv{--figd:var(--panel)}
.mv:hover{--figd:var(--panel)}
.mv:hover{background:var(--brass-soft)}
.mv.cur{background:var(--brass);color:var(--bg);--figd:var(--brass)}
.mv.res{color:var(--muted);pointer-events:none}

/* game list */
.list{position:fixed;z-index:20;top:0;bottom:0;left:0;width:min(400px,90vw);background:var(--panel);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);
  transform:translateX(-102%);transition:transform 260ms cubic-bezier(.3,.7,.2,1);box-shadow:0 0 40px var(--shadow);visibility:hidden}
.list.open{transform:none;visibility:visible}
.scrim{position:fixed;inset:0;z-index:19;background:rgba(8,20,16,.45);opacity:0;pointer-events:none;transition:opacity 200ms}
.scrim.open{opacity:1;pointer-events:auto}
.lhead{display:flex;align-items:center;gap:8px;padding:12px 10px 8px 16px}
.lhead h1{flex:1;margin:0;font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.2}
.lhead p{margin:2px 0 0;font-size:12.5px;color:var(--muted);font-family:var(--sans);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 10px;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip em{font-style:normal;opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}
.gl{list-style:none;margin:0;padding:0 8px 16px;overflow-y:auto;flex:1;overscroll-behavior:contain;border-top:1px solid var(--line)}
.gi{display:grid;grid-template-columns:30px 1fr auto;column-gap:8px;width:100%;text-align:left;padding:10px 8px;border-radius:10px;align-items:start}
.gi:hover{background:var(--brass-soft)}
.gi[aria-current="true"]{background:var(--sel)}
.gi .n{font-size:12px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums;text-align:right}
.gi .pl{font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.3}
.gi .ev{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.gi .op{display:block;font-size:12.5px;margin-top:1px}
.gi .rs{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:2px;white-space:nowrap}
.gi .wc{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brass);margin-right:6px;vertical-align:2px}
.legend{font-size:12px;color:var(--muted);padding:0 16px 10px;display:flex;align-items:center;gap:6px}
.legend .wc{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brass)}

/* landscape: board left, moves right */
@media (min-aspect-ratio:11/10) and (min-width:700px){
  .app{grid-template-columns:auto minmax(260px,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "stage moves"}
  .stage{justify-content:center;padding:6px 16px}
  .moves{border-top:0;border-left:1px solid var(--line)}
  .opening,.graph{display:block}
  .note{height:auto;min-height:150px;max-height:42%}
}
/* wide: list always visible */
@media (min-aspect-ratio:11/10) and (min-width:1180px){
  .app{grid-template-columns:330px minmax(0,1fr) minmax(300px,380px);grid-template-areas:"list top top" "list stage moves"}
  .list{position:static;grid-area:list;transform:none;visibility:visible;width:auto;box-shadow:none;border-right:1px solid var(--line);padding:0;z-index:auto}
  .scrim,.listbtn,.lclose{display:none!important}
  .sheet{grid-template-columns:1fr}
}
@media (min-aspect-ratio:11/10) and (min-width:700px) and (max-height:520px){.stage{justify-content:flex-start;overflow-y:auto}}
@media (max-width:380px){.icon-btn{width:36px}.play{width:48px}.ctrl .grp{gap:0}}
@media (prefers-reduced-motion:reduce){.pc,.list,.scrim{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf5"/><stop offset=".55" stop-color="#f1e6cc"/><stop offset="1" stop-color="#d7c198"/></linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5d534a"/><stop offset=".45" stop-color="#2a241f"/><stop offset="1" stop-color="#100d0b"/></linearGradient>
  </defs>
  <g id="symbols"></g>
</svg>

<div class="app" id="app">
  <header class="top">
    <button class="listbtn" id="listBtn" aria-label="경기 목록 열기" title="경기 목록 열기" aria-controls="list" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>목록
    </button>
    <div class="gtitle"><b id="tPlayers"></b><span id="tEvent"></span></div>
    <div class="gnav">
      <button class="icon-btn" id="prevGame" aria-label="이전 경기" title="이전 경기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6l-6 6 6 6M18 6l-6 6 6 6"/></svg></button>
      <button class="icon-btn" id="nextGame" aria-label="다음 경기" title="다음 경기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l6 6-6 6M12 6l6 6-6 6"/></svg></button>
    </div>
  </header>

  <div class="scrim" id="scrim"></div>
  <aside class="list" id="list" aria-label="경기 목록">
    <div class="lhead">
      <h1>시실리안 디펜스 명국 30선<p>1950년부터 2022년까지, 세계선수권과 후보자전의 승부국</p></h1>
      <button class="icon-btn lclose" id="listClose" aria-label="목록 닫기" title="목록 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="오프닝으로 거르기"></div>
    <div class="legend"><span class="wc"></span>세계선수권 경기</div>
    <ul class="gl" id="gl"></ul>
    <p class="credit">수마다 붙는 해설과 평가는 Stockfish 16 엔진 분석과 기보 통계로 자동 생성했어요. 평가는 백 기준이며, 사람이 쓴 주석과 다를 수 있어요.</p>
  </aside>

  <main class="stage" id="stage">
    <div class="col">
      <div class="strip" id="stripTop"></div>
      <div class="board-wrap">
        <div class="evbar" id="evbar" aria-hidden="true"><i id="evfill" style="height:50%"></i><b></b></div>
        <div class="board" id="board" role="img" aria-label="체스판"></div>
        <div class="banner" id="banner" hidden>
          <strong id="bWho"></strong><span class="sc" id="bScore"></span>
          <span class="cd" id="bCount"></span>
          <div class="row"><button class="pill" id="bStay">여기서 멈춤</button><button class="pill main" id="bNext">다음 경기</button></div>
        </div>
      </div>
      <div class="strip" id="stripBot"></div>
      <div class="scrub"><input type="range" id="scrub" min="0" max="1" value="0" aria-label="수순 이동"><span id="plyInfo"></span></div>
      <div class="ctrl">
        <div class="grp">
          <button class="icon-btn" id="bFirst" aria-label="처음으로" title="처음으로"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="2.4" height="14" rx="1"/><path d="M19 5.5v13L9 12z"/></svg></button>
          <button class="icon-btn" id="bPrev" aria-label="이전 수" title="이전 수"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 5.5v13L7 12z"/></svg></button>
          <button class="play" id="bPlay" aria-label="재생" title="재생"><svg viewBox="0 0 24 24" fill="currentColor" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
          <button class="icon-btn" id="bNextMv" aria-label="다음 수" title="다음 수"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5.5v13L17 12z"/></svg></button>
          <button class="icon-btn" id="bLast" aria-label="마지막으로" title="마지막으로"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5.5v13L15 12z"/><rect x="16.6" y="5" width="2.4" height="14" rx="1"/></svg></button>

<script>
const VAL={p:1,n:3,b:3,r:5,q:9,k:0};
function sqi(s){return (s.charCodeAt(0)-97)+(s.charCodeAt(1)-49)*8;}
function startBoard(){
  const b=new Array(64).fill(null),back='rnbqkbnr';let id=0;
  for(let f=0;f<8;f++){b[f]={id:id++,c:'w',t:back[f]};b[8+f]={id:id++,c:'w',t:'p'};b[48+f]={id:id++,c:'b',t:'p'};b[56+f]={id:id++,c:'b',t:back[f]};}
  return b;
}
function buildGame(g){
  const sans=g.san.split(' '),ucis=g.uci.split(' ');
  if(sans.length!==ucis.length)throw new Error('len '+g.id);
  let b=startBoard();const states=[b],moves=[];
  for(let i=0;i<ucis.length;i++){
    const u=ucis[i],from=sqi(u.slice(0,2)),to=sqi(u.slice(2,4)),pr=u[4];
    const nb=b.slice(),pc=nb[from];
    if(!pc)throw new Error('empty from '+g.id+' ply '+i+' '+u);
    if((pc.c==='w')!==(i%2===0))throw new Error('turn '+g.id+' ply '+i);
    let cap=nb[to],capSq=to;
    if(cap&&cap.c===pc.c)throw new Error('self capture '+g.id+' '+i);
    let rook=null;
    if(pc.t==='k'&&Math.abs(to%8-from%8)===2){
      const r=from-from%8;
      if(to%8===6){nb[r+5]=nb[r+7];nb[r+7]=null;rook=[r+7,r+5];}else{nb[r+3]=nb[r];nb[r]=null;rook=[r,r+3];}
    }
    if(pc.t==='p'&&to%8!==from%8&&!cap){capSq=from-from%8+to%8;cap=nb[capSq];nb[capSq]=null;}
    nb[to]=pr?{id:pc.id,c:pc.c,t:pr}:pc;nb[from]=null;
    moves.push({from,to,san:sans[i],c:pc.c,cap:cap?cap.t:null,check:/[+#]$/.test(sans[i]),mate:/#$/.test(sans[i]),rook});
    b=nb;states.push(b);
  }
  return{states,moves};
}
function boardFen(b){
  let out=[];for(let r=7;r>=0;r--){let s='',e=0;for(let f=0;f<8;f++){const p=b[r*8+f];if(!p){e++;continue;}if(e){s+=e;e=0;}s+=p.c==='w'?p.t.toUpperCase():p.t;}if(e)s+=e;out.push(s);}return out.join('/');
}

function pieceSVG(color,type){

function figSVG(type){

  }

}

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const FAM=[['all','전체'],['najdorf','나이돌프'],['dragon','드래곤'],['sveshnikov','스베시니코프'],['schev','셰브닝겐·클래시컬'],['other','기타']];
const SPEEDS=[0.5,1,2,4];
const store={get(k,d){try{const v=localStorage.getItem('sic30.'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('sic30.'+k,JSON.stringify(v));}catch(e){}}};

// symbols
let sym='';
for(const c of 'wb')for(const t of 'kqrbnp')sym+=`<symbol id="${c}${t}" viewBox="0 0 100 100">${pieceSVG(c,t)}</symbol>`;
for(const t of 'kqrbnp')sym+=`<symbol id="f${t}" viewBox="0 0 100 100">${figSVG(t)}</symbol>`;
$('symbols').innerHTML=sym;
const icon=(c,t)=>`<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#${c}${t}"/></svg>`;
const NT=()=>NOTES[GAMES[S.gi].id];
const TAGN={'??':['큰 실수','t1'],'?':['실수','t2'],'?!':['부정확','t3']};
function jo(w,a,b){const c=w.charCodeAt(w.length-1);return w+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b);}
function wpE(e,ply){
  if(e===null){const mv=S.G.moves[ply-1];return mv&&mv.c==='w'?100:0;}
  if(typeof e==='string')return e[0]==='-'?0:100;
  return 50+50*(2/(1+Math.exp(-0.00368208*e))-1);
}
function fmtE(e){if(e===null)return '메이트';if(typeof e==='string')return e[0]==='-'?'흑 M'+e.slice(2):'백 M'+e.slice(1);const v=e/100;return (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1);}
function evAt(ply){const n=NT();return ply===0?n.e0:n.m[ply-1].e;}

const S={gi:store.get('game',0),ply:0,G:null,flip:false,playing:false,speed:store.get('speed',1),auto:store.get('auto',true),filter:'all',timer:0,cd:0,cdTimer:0};
if(!(S.gi>=0&&S.gi<GAMES.length))S.gi=0;
if(!SPEEDS.includes(S.speed))S.speed=1;

const board=$('board');
let sqEls=[],pcLayer,pcEls={};

function buildBoard(){
  board.innerHTML='';sqEls=new Array(64);
  for(let row=0;row<8;row++)for(let col=0;col<8;col++){
    const f=S.flip?7-col:col,r=S.flip?row:7-row,i=r*8+f;
    const d=document.createElement('div');
    d.className='sq '+((f+r)%2===0?'d':'l');
    if(col===0)d.innerHTML+=`<span class="co r">${r+1}</span>`;
    if(row===7)d.innerHTML+=`<span class="co f">${'abcdefgh'[f]}</span>`;
    board.appendChild(d);sqEls[i]=d;
  }
  pcLayer=document.createElement('div');pcLayer.className='pieces';board.appendChild(pcLayer);
  pcEls={};
}
function pos(i){const f=i%8,r=(i-f)/8;const x=S.flip?7-f:f,y=S.flip?r:7-r;return `translate(${x*100}%,${y*100}%)`;}

function loadGame(idx,keepPlay){
  clearTimeout(S.timer);hideBanner();
  S.gi=(idx+GAMES.length)%GAMES.length;store.set('game',S.gi);
  const g=GAMES[S.gi];S.G=buildGame(g);S.ply=0;
  board.classList.add('instant');
  buildBoard();
  renderMeta();renderSheet();renderList();renderGraph();
  render();
  requestAnimationFrame(()=>requestAnimationFrame(()=>board.classList.remove('instant')));
  if(keepPlay&&S.playing)schedule();else setPlaying(false);
}

function renderMeta(){
  const g=GAMES[S.gi];
  $('tPlayers').textContent=`${g.w} 대 ${g.b}`;
  $('tEvent').textContent=`${g.year}년 ${g.ev}`;
  $('opKo').textContent=g.fam;
  $('opEn').textContent=(g.var?`${g.op}: ${g.var}`:g.op)+`, ${g.eco}`;
  document.title=`${g.w} 대 ${g.b} (${g.year}) | 시실리안 디펜스 명국 30선`;
  $('scrub').max=S.G.moves.length;
}
function stripHTML(side){
  const g=GAMES[S.gi],w=side==='w';
  return `<span class="swatch ${side}"></span><div class="pname"><b>${w?g.w:g.b}</b><small>${w?g.we:g.be}</small></div><div class="caps" data-caps="${side}"></div><span class="badge" data-badge="${side}"></span>`;
}
function figSan(m){
  const s=m.san;let h='';
  let rest=s;
  if(/^[KQRBN]/.test(s)){h+=icon('f',s[0].toLowerCase());rest=s.slice(1);}
  rest=rest.replace(/=([QRBN])/,(_,p)=>'='+'\u0000'+p);
  const parts=rest.split('\u0000');
  h+=esc(parts[0]);
  if(parts[1]){h+=icon('f',parts[1][0].toLowerCase())+esc(parts[1].slice(1));}
  return h;
}
function tagSup(i){const t=NT().m[i].t;return t?`<sup class="${TAGN[t][1]}">${t}</sup>`:'';}
function esc(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function renderSheet(){
  const mv=S.G.moves,g=GAMES[S.gi];let h='';
  for(let i=0;i<mv.length;i+=2){
    h+=`<div class="mr"><i>${i/2+1}</i><button class="mv" data-p="${i+1}">${figSan(mv[i])}${tagSup(i)}</button>`;
    if(mv[i+1])h+=`<button class="mv" data-p="${i+2}">${figSan(mv[i+1])}${tagSup(i+1)}</button>`;
    else h+=`<span class="mv res">${g.res}</span>`;
    h+='</div>';
  }
  if(mv.length%2===0)h+=`<div class="mr"><i></i><span class="mv res">${g.res}</span><span></span></div>`;
  $('sheet').innerHTML=h;$('sheet').scrollTop=0;
}
function captured(ply){
  const by={w:[],b:[]};
  for(let i=0;i<ply;i++){const m=S.G.moves[i];if(m.cap)by[m.c].push(m.cap);}
  const order='qrbnp';
  for(const k in by)by[k].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  return by;
}
function material(st){let w=0,b=0;for(const p of st)if(p){if(p.c==='w')w+=VAL[p.t];else b+=VAL[p.t];}return w-b;}

function render(){
  const st=S.G.states[S.ply],m=S.G.moves[S.ply-1],prev=S.G.states[S.ply-1];
  // pieces
  const seen=new Set();
  for(let i=0;i<64;i++){
    const p=st[i];if(!p)continue;seen.add(p.id);
    let el=pcEls[p.id];
    if(!el){el=document.createElement('div');el.className='pc';el.innerHTML=icon(p.c,p.t);el._k=p.c+p.t;pcLayer.appendChild(el);pcEls[p.id]=el;}
    if(el._k!==p.c+p.t){el.querySelector('use').setAttribute('href','#'+p.c+p.t);el._k=p.c+p.t;}
    el.style.transform=pos(i);el._sq=i;el.classList.remove('gone');
    el.classList.toggle('lift',!!m&&i===m.to);
  }
  for(const id in pcEls)if(!seen.has(+id))pcEls[id].classList.add('gone');
  // highlights
  for(const e of sqEls)e.classList.remove('lm','chk');
  if(m){sqEls[m.from].classList.add('lm');sqEls[m.to].classList.add('lm');
    if(m.check){const kc=m.c==='w'?'b':'w';const k=st.findIndex(p=>p&&p.t==='k'&&p.c===kc);if(k>=0)sqEls[k].classList.add('chk');}}
  // strips (top = far side)
  const topSide=S.flip?'w':'b',botSide=S.flip?'b':'w';
  $('stripTop').innerHTML=stripHTML(topSide);$('stripBot').innerHTML=stripHTML(botSide);
  const cap=captured(S.ply),diff=material(st);
  for(const side of ['w','b']){
    const box=document.querySelector(`[data-caps="${side}"]`);const opp=side==='w'?'b':'w';
    let h=cap[side].map(t=>icon(opp,t)).join('');
    const adv=side==='w'?diff:-diff;if(adv>0)h+=`<em>+${adv}</em>`;
    box.innerHTML=h;
  }
  const end=S.ply===S.G.moves.length,g=GAMES[S.gi];
  for(const side of ['w','b']){
    const bd=document.querySelector(`[data-badge="${side}"]`);
    const won=(g.res==='1-0'&&side==='w')||(g.res==='0-1'&&side==='b');
    bd.className='badge'+(end?(won?' win':' loss'):'');bd.textContent=end?(won?'승':'패'):'';
  }
  // sheet
  const cur=$('sheet').querySelector('.cur');if(cur)cur.classList.remove('cur');
  if(S.ply>0){const b=$('sheet').querySelector(`[data-p="${S.ply}"]`);if(b){b.classList.add('cur');keepVisible(b);}}
  // scrub + info
  $('scrub').value=S.ply;
  const n=S.G.moves.length;
  $('plyInfo').textContent=`${S.ply} / ${n}`;
  renderNote();
  board.setAttribute('aria-label',m?`${Math.ceil(S.ply/2)}번째 수 ${m.c==='w'?'백':'흑'} ${m.san}`:'시작 배치');
}
function renderNote(){
  const g=GAMES[S.gi],N=NT(),k=S.ply;
  const e=evAt(k),w=wpE(e,k);
  $('evfill').style.height=w.toFixed(1)+'%';
  $('evbar').classList.toggle('flip',S.flip);
  $('nEval').textContent=fmtE(e);
  if(k===0){
    $('nMove').textContent='시작 배치';$('nTag').hidden=true;
    $('nText').textContent=`${g.year}년 ${g.ev}, 백 ${jo(g.w,'과','와')} 흑 ${g.b}의 대국이에요. 오프닝은 ${g.fam} 계열이에요. 재생하면 한 수마다 해설이 붙어요.`;
    $('nPv').hidden=false;$('nPv').textContent='엔진 예상 수순: '+N.p0;
  }else{
    const m=S.G.moves[k-1],d=N.m[k-1];
    $('nMove').innerHTML=`${Math.ceil(k/2)}${m.c==='w'?'.':'…'} `+figSan(m);
    if(d.t){$('nTag').hidden=false;$('nTag').textContent=TAGN[d.t][0]+' '+d.t;$('nTag').className='tag '+TAGN[d.t][1];}else $('nTag').hidden=true;
    $('nText').textContent=d.c;
    if(d.p&&k<S.G.moves.length){$('nPv').hidden=false;$('nPv').textContent='엔진 예상 수순: '+d.p;}else $('nPv').hidden=true;
  }
  $('note').scrollTop=0;
  const cur=$('graph').querySelector('.cur');
  if(cur){const x=k;cur.setAttribute('x1',x);cur.setAttribute('x2',x);}
}
function renderGraph(){
  const n=S.G.moves.length;let pts=[];
  for(let k=0;k<=n;k++)pts.push([k,100-wpE(evAt(k),k)]);
  let area=`M0,100 `+pts.map(p=>`L${p[0]},${p[1].toFixed(1)}`).join(' ')+` L${n},100 Z`;
  let marks='';const N=NT();
  N.m.forEach((d,i)=>{if(d.t){marks+=`<line x1="${i+1}" x2="${i+1}" y1="0" y2="100" stroke="var(--${TAGN[d.t][1]})" stroke-width="2" vector-effect="non-scaling-stroke" opacity=".9"/>`;}});
  $('graph').innerHTML=`<svg viewBox="0 0 ${Math.max(1,n)} 100" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="0" width="${n}" height="100" fill="#2a211b"/><path d="${area}" fill="#efe5cc"/><line x1="0" x2="${n}" y1="50" y2="50" stroke="#c9a14a" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".7"/>${marks}<line class="cur" x1="0" x2="0" y1="0" y2="100" stroke="#c9a14a" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function keepVisible(el){
  const box=$('sheet'),r=el.getBoundingClientRect(),br=box.getBoundingClientRect();
  if(r.top<br.top+4||r.bottom>br.bottom-4){box.scrollTop+=(r.top-br.top)-box.clientHeight/2+r.height/2;}
}

function go(p,opts){
  const n=S.G.moves.length;p=Math.max(0,Math.min(n,p));
  if(p===S.ply)return;
  const far=Math.abs(p-S.ply)>1;
  if(far&&opts&&opts.instant)board.classList.add('instant');
  S.ply=p;render();
  if(far&&opts&&opts.instant)requestAnimationFrame(()=>requestAnimationFrame(()=>board.classList.remove('instant')));
  if(p<n)hideBanner();
}
function readTime(){if(S.ply===0)return 2200;const d=NT().m[S.ply-1];if(!d||!d.k)return 0;return Math.max(900,Math.min(4200,d.c.length*30));}
function delay(){return (1150+readTime())/S.speed;}
function setMT(){board.style.setProperty('--mt',Math.round(Math.min(280,1150/S.speed*.55))+'ms');}
function setPlaying(v){
  S.playing=v;
  $('bPlay').setAttribute('aria-label',v?'일시정지':'재생');$('bPlay').title=v?'일시정지':'재생';
  $('playIco').innerHTML=v?'<rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/>':'<path d="M8 5v14l11-7z"/>';
  clearTimeout(S.timer);
  if(v)schedule();
}
function schedule(){
  clearTimeout(S.timer);
  S.timer=setTimeout(step,delay());
}
function step(){
  if(!S.playing)return;
  if(S.ply<S.G.moves.length){go(S.ply+1);if(S.ply<S.G.moves.length)schedule();else finish();}
  else finish();
}
function finish(){
  setPlaying(false);showBanner();
}
function showBanner(){
  const g=GAMES[S.gi],last=S.G.moves[S.G.moves.length-1];
  const winner=g.res==='1-0'?g.w:g.b;
  $('bWho').textContent=`${winner} 승리`;
  $('bScore').textContent=`${g.res}${last.mate?', 체크메이트':''}, ${Math.ceil(S.G.moves.length/2)}수`;
  $('banner').hidden=false;
  clearInterval(S.cdTimer);
  if(S.auto){
    S.cd=6;tick();S.cdTimer=setInterval(tick,1000);
  }else $('bCount').textContent='';
}
function tick(){
  S.cd--;
  if(S.cd<=0){clearInterval(S.cdTimer);S.playing=true;loadGame(S.gi+1,true);setPlaying(true);return;}
  $('bCount').textContent=`${S.cd}초 뒤 다음 경기가 시작돼요`;
}
function hideBanner(){clearInterval(S.cdTimer);$('banner').hidden=true;}

// list
function renderChips(){
  $('chips').innerHTML=FAM.map(([k,l])=>{const c=k==='all'?GAMES.length:GAMES.filter(g=>g.fk===k).length;return `<button class="chip" data-f="${k}" aria-pressed="${S.filter===k}">${l}<em>${c}</em></button>`;}).join('');
}
function renderList(){
  const items=GAMES.map((g,i)=>({g,i})).filter(x=>S.filter==='all'||x.g.fk===S.filter);
  $('gl').innerHTML=items.map(({g,i})=>`<li><button class="gi" data-i="${i}" aria-current="${i===S.gi}"><span class="n">${g.id}</span><span><span class="pl">${g.w} 대 ${g.b}</span><span class="ev">${g.kind==='wc'?'<span class="wc" aria-label="세계선수권"></span>':''}${g.year}년 ${g.ev}</span><span class="op">${g.fam}${g.lv?`, ${g.lv}`:''}</span></span><span class="rs">${g.res}</span></button></li>`).join('');
}
function openList(v){
  $('list').classList.toggle('open',v);$('scrim').classList.toggle('open',v);$('listBtn').setAttribute('aria-expanded',v);
  if(v){const c=$('gl').querySelector('[aria-current="true"]');if(c)c.scrollIntoView({block:'center'});}
}

// layout: size the board to fit
function layout(){
  const app=$('app'),W=app.clientWidth,H=app.clientHeight;
  const topH=document.querySelector('.top').offsetHeight;
  const q=s=>document.querySelector(s).offsetHeight;
  const chrome=q('#stripTop')+q('#stripBot')+q('.scrub')+q('.ctrl')+14+12;
  const EVW=16;
  const land=matchMedia('(min-aspect-ratio:11/10) and (min-width:700px)').matches;
  const wide=matchMedia('(min-aspect-ratio:11/10) and (min-width:1180px)').matches;
  let bs;
  if(land){
    const side=wide?330+300:260;
    bs=Math.min(H-topH-chrome,W-side-32-14-EVW,760);
  }else{
    const minMoves=q('#note')+(H<700?30:64);
    bs=Math.min(W-24-14-EVW,H-topH-chrome-minMoves,640);
  }
  bs=Math.max(land&&H<520?160:200,Math.floor(bs/8)*8);
  document.documentElement.style.setProperty('--bs',bs+'px');
}

// events
$('bPlay').onclick=()=>{if(S.ply>=S.G.moves.length){go(0,{instant:true});}setPlaying(!S.playing);};
$('bPrev').onclick=()=>{setPlaying(false);go(S.ply-1);};
$('bNextMv').onclick=()=>{setPlaying(false);go(S.ply+1);if(S.ply===S.G.moves.length)showBannerNoAuto();};
$('bFirst').onclick=()=>{setPlaying(false);go(0,{instant:true});};
$('bLast').onclick=()=>{setPlaying(false);go(S.G.moves.length,{instant:true});showBannerNoAuto();};
function showBannerNoAuto(){const a=S.auto;S.auto=false;showBanner();S.auto=a;}
$('bSpeed').onclick=()=>{S.speed=SPEEDS[(SPEEDS.indexOf(S.speed)+1)%SPEEDS.length];store.set('speed',S.speed);$('bSpeed').textContent=S.speed+'×';setMT();if(S.playing)schedule();};
$('bFlip').onclick=()=>{S.flip=!S.flip;board.classList.add('instant');buildBoard();render();requestAnimationFrame(()=>requestAnimationFrame(()=>board.classList.remove('instant')));};
$('bAuto').onclick=()=>{S.auto=!S.auto;store.set('auto',S.auto);$('bAuto').setAttribute('aria-pressed',S.auto);if(!$('banner').hidden&&!S.auto){clearInterval(S.cdTimer);$('bCount').textContent='';}};
$('scrub').oninput=e=>{setPlaying(false);go(+e.target.value,{instant:true});};
$('sheet').onclick=e=>{const b=e.target.closest('.mv[data-p]');if(!b)return;setPlaying(false);go(+b.dataset.p,{instant:Math.abs(+b.dataset.p-S.ply)>1});};
function graphPick(e){const r=$('graph').getBoundingClientRect();const n=S.G.moves.length;const p=Math.round((e.clientX-r.left)/r.width*n);setPlaying(false);go(p,{instant:true});}
$('graph').addEventListener('pointerdown',e=>{graphPick(e);$('graph').setPointerCapture(e.pointerId);});
$('graph').addEventListener('pointermove',e=>{if(e.buttons)graphPick(e);});
$('prevGame').onclick=()=>loadGame(S.gi-1);
$('nextGame').onclick=()=>loadGame(S.gi+1);
$('bStay').onclick=()=>{hideBanner();};
$('bNext').onclick=()=>{S.playing=true;loadGame(S.gi+1,true);setPlaying(true);};
$('banner').addEventListener('click',e=>e.stopPropagation());
$('listBtn').onclick=()=>openList(true);
$('listClose').onclick=()=>openList(false);
$('scrim').onclick=()=>openList(false);
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;S.filter=b.dataset.f;renderChips();renderList();};
$('gl').onclick=e=>{const b=e.target.closest('.gi');if(!b)return;loadGame(+b.dataset.i);openList(false);setPlaying(true);};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.key!=='Escape')return;
  if(e.key==='Escape'){openList(false);return;}
  if(e.key==='ArrowRight'){e.preventDefault();$('bNextMv').click();}
  else if(e.key==='ArrowLeft'){e.preventDefault();$('bPrev').click();}
  else if(e.key===' '&&!e.target.closest('button')){e.preventDefault();$('bPlay').click();}
  else if(e.key==='Home'){e.preventDefault();$('bFirst').click();}
  else if(e.key==='End'){e.preventDefault();$('bLast').click();}
  else if(e.key==='ArrowUp'&&e.altKey){loadGame(S.gi-1);}
  else if(e.key==='ArrowDown'&&e.altKey){loadGame(S.gi+1);}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.playing){setPlaying(false);}if(document.hidden)hideBannerPause();});
function hideBannerPause(){if(!$('banner').hidden&&S.auto){clearInterval(S.cdTimer);$('bCount').textContent='';}}
window.addEventListener('resize',layout);
if(window.visualViewport)visualViewport.addEventListener('resize',layout);

// init
$('bSpeed').textContent=S.speed+'×';$('bAuto').setAttribute('aria-pressed',S.auto);
setMT();renderChips();layout();loadGame(S.gi);setPlaying(true);
window.__sic={S,go,loadGame,GAMES};
})();
</script>
</body>
</html>
