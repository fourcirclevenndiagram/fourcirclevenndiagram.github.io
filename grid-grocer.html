function pick(arr){ // 같은 문장 연속 반복 방지

  if(arr.length===1) return arr[0];

const G=0,RD=1,SW=2,WT=3,DT=4,FL=5,MF=6,PT=7,PZ=8,CR=9,SD=10;

const B=new Uint8Array(W*H),O=new Uint8Array(W*H),OV=new Uint8Array(W*H),walk=new Uint8Array(W*H),cost=new Uint8Array(W*H);
const idx=(x,y)=>y*W+x, inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
function setB(x,y,v,vv){if(!inb(x,y))return;B[idx(x,y)]=v;if(vv!==undefined)OV[idx(x,y)]=vv;}
function setO(x,y,v,vv){if(!inb(x,y))return;O[idx(x,y)]=v;OV[idx(x,y)]=vv||0;}
const houses=[],lamps=[],benches=[],windows=[],spawnPts=[];

function house(x,y,col){
  for(let i=0;i<5;i++){setO(x+i,y,O_ROOF,col);setO(x+i,y+1,O_EAVE,col);setO(x+i,y+2,O_WALL,col);setO(x+i,y+3,O_WALL,col);}
  setO(x+1,y+2,O_WIN,col);setO(x+3,y+2,O_WIN,col);setO(x+2,y+3,O_DOOR,col);setO(x+4,y+3,O_WIN,col);
  windows.push([x+1,y+2],[x+3,y+2],[x+4,y+3]);
  const h={x,y,door:[x+2,y+3],front:[x+2,y+4],col,home:false};houses.push(h);return h;
}
function connectFront(h){
  setB(h.front[0],h.front[1],DT,0);
  for(let y=h.front[1]+1;y<H;y++){const b=B[idx(h.front[0],y)];if(b!==G)break;setB(h.front[0],y,PT,0);}
}
function scatter(bx,by,n,obj,vmax){
  for(let i=0;i<n;i++){const x=bx+((mapRng()*16)|0),y=by+((mapRng()*16)|0);if(B[idx(x,y)]===G&&O[idx(x,y)]===0)setO(x,y,obj,(mapRng()*vmax)|0);}
}
function resBlock(bx,by,opt){
  const hs=[[bx+1,by+1],[bx+9,by+1],[bx+1,by+9],[bx+9,by+9]];
  const made=hs.map(h=>house(h[0],h[1],(mapRng()*4)|0));
  if(opt&&opt.home)made[0].home=true;
  for(let x=bx;x<bx+16;x++)setB(x,by+6,PT,0);
  for(let y=by;y<by+16;y++)if(O[idx(bx+7,y)]===0)setB(bx+7,y,PT,0);
  made.forEach(connectFront);
  scatter(bx,by,9,O_TREE,3);scatter(bx,by,7,O_FLOWER,4);scatter(bx,by,3,O_BUSH,1);
}

  [x0+1,x0+2,x0+4,x0+5].forEach(x=>setO(x,y0+3,O_WIN,5));setO(x0+3,y0+4,O_DOOR,5);setO(x0+1,y0+4,O_WIN,5);setO(x0+5,y0+4,O_WIN,5);
  windows.push([x0+1,y0+3],[x0+5,y0+3]);
  for(let y=y0+5;y<=y0+8;y++)for(let x=x0-1;x<=x0+7;x++)setB(x,y,PZ,(x+y)&1);

  setO(x0-1,y0+5,O_SIGN,0);

function genMap(){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)setB(x,y,G,(mapRng()*6)|0);
  for(let y=0;y<H;y++){for(let x=0;x<=4;x++)setB(x,y,WT,(mapRng()*3)|0);setB(5,y,SD,0);}
  ROADS.forEach(r=>{for(let i=0;i<W;i++){setB(i,r,RD,1);setB(i,r+1,RD,2);}});
  ROADS.forEach(r=>{for(let i=0;i<H;i++){if(B[idx(r,i)]!==RD)setB(r,i,RD,3);else setB(r,i,RD,5);if(B[idx(r+1,i)]!==RD)setB(r+1,i,RD,4);else setB(r+1,i,RD,5);}});
  ROADS.forEach(r=>{for(let i=0;i<W;i++){if(B[idx(i,r-1)]!==RD)setB(i,r-1,SW,0);if(B[idx(i,r+2)]!==RD)setB(i,r+2,SW,0);if(B[idx(r-1,i)]!==RD)setB(r-1,i,SW,0);if(B[idx(r+2,i)]!==RD)setB(r+2,i,SW,0);}});
  ROADS.forEach(r=>ROADS.forEach(c=>{setB(c-1,r,CR,1);setB(c-1,r+1,CR,1);setB(c+2,r,CR,1);setB(c+2,r+1,CR,1);setB(c,r-1,CR,2);setB(c+1,r-1,CR,2);setB(c,r+2,CR,2);setB(c+1,r+2,CR,2);}));
  ROADS.forEach(r=>{for(let x=0;x<=5;x++){OV[idx(x,r)]=6;OV[idx(x,r+1)]=7;OV[idx(x,r-1)]=1;OV[idx(x,r+2)]=1;}});
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const edge=y<=8||y>=73||x>=73||(x>=6&&x<=8);if(edge&&B[idx(x,y)]===G&&mapRng()<0.5)setO(x,y,O_TREE,(mapRng()*3)|0);}
  marketBlock(13,13);resBlock(33,13);parkBlock(53,13);
  resBlock(13,33,{home:true});shopBlock(33,33);cafeBlock(53,33);
  resBlock(13,53);resBlock(33,53);resBlock(53,53);
  // 걷기 가능 여부
  const BLK=new Set([O_TREE,O_WALL,O_ROOF,O_DOOR,O_WIN,O_COUNTER,O_CRATE,O_LAMP,O_FENCE,O_STALL,O_BUSH,O_SHELF,O_FOUNTAIN,O_TABLE,O_EAVE,O_ROCK,O_SIGN,O_SWIN]);
  const WB=new Set([G,RD,SW,DT,FL,MF,PT,PZ,CR,SD]);
  for(let i=0;i<W*H;i++){walk[i]=(WB.has(B[i])&&!BLK.has(O[i]))?1:0;cost[i]=B[i]===RD?4:(B[i]===G||B[i]===SD)?2:1;}
  for(let y=38;y<=42;y++)walk[idx(46,y)]=2;
  [44,45,46].forEach(x=>walk[idx(x,37)]=2);
  walk[idx(HOME.door[0],HOME.door[1])]=2;
  ROADS.forEach(r=>spawnPts.push([0,r-1],[0,r+2],[W-1,r-1],[W-1,r+2],[r-1,0],[r+2,0],[r-1,H-1],[r+2,H-1]));
}

// ===================== 길찾기 (A*) =====================
function astar(sx,sy,tx,ty,staff){
  if(!inb(tx,ty)||!inb(sx,sy))return null;
  const N=W*H,S=idx(sx,sy),T_=idx(tx,ty);
  if(S===T_)return [];
  const g=new Float32Array(N).fill(1e9),par=new Int32Array(N).fill(-1),closed=new Uint8Array(N);
  const hf=[],hn=[];
  const push=(f,n)=>{hf.push(f);hn.push(n);let i=hf.length-1;while(i>0){const p=(i-1)>>1;if(hf[p]<=hf[i])break;[hf[p],hf[i]]=[hf[i],hf[p]];[hn[p],hn[i]]=[hn[i],hn[p]];i=p;}};
  const pop=()=>{const n=hn[0];const lf=hf.pop(),ln=hn.pop();if(hf.length){hf[0]=lf;hn[0]=ln;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<hf.length&&hf[l]<hf[m])m=l;if(r<hf.length&&hf[r]<hf[m])m=r;if(m===i)break;[hf[m],hf[i]]=[hf[i],hf[m]];[hn[m],hn[i]]=[hn[i],hn[m]];i=m;}}return n;};
  g[S]=0;push(Math.abs(sx-tx)+Math.abs(sy-ty),S);
  let it=0,found=false;
  while(hf.length){
    const n=pop();if(closed[n])continue;closed[n]=1;
    if(n===T_){found=true;break;}
    if(++it>12000)break;
    const x=n%W,y=(n/W)|0;
    for(let d=0;d<4;d++){
      const nx=x+(d===0?1:d===1?-1:0),ny=y+(d===2?1:d===3?-1:0);
      if(!inb(nx,ny))continue;const m=idx(nx,ny);
      if(m!==T_){const wv=walk[m];if(wv===0||(wv===2&&!staff))continue;}
      if(closed[m])continue;
      const c=g[n]+cost[m];
      if(c<g[m]){g[m]=c;par[m]=n;push(c+Math.abs(nx-tx)+Math.abs(ny-ty),m);}
    }
  }
  if(!found)return null;
  const path=[];let c=T_;while(c!==S){path.push([c%W,(c/W)|0]);c=par[c];if(c<0)return null;}
  path.reverse();return path;
}

// ===================== 엔티티 =====================
const npcs=[],cars=[];
let emp,vendor;
const cam={x:0,y:0,follow:true};
const T={min:8*60+50,day:1,speed:1,paused:false,hidden:false};
const WX={type:'sunny',temp:23,name:'맑음'};
const stats={dayRev:0,dayCust:0,totRev:0,totCust:0,lost:0,deliv:0,visits:{},sold:new Array(25).fill(0)};
const shop={open:false,away:false,queue:[],serving:null,back:new Array(25).fill(10),orders:[],orderTimes:[],lunched:false};
const EMP_IN_SHOP=new Set(['prep','idle','toCounter','serve','restock','closing']);
const CAR_COLS=['#d84a3a','#3a6ad8','#e8e8e8','#2a2a2a','#e8b83c','#6aa84a','#9a6ad0','#f0f0f0'];

function makeNPC(type,tx,ty,role){return {type,name:type.n,x:tx*TS+TS/2,y:ty*TS+TS/2,spd:type.spd*(0.9+R()*0.2),dir:0,anim:0,path:[],onArrive:null,state:role,role,timer:0,talkT:5+R()*8,wants:[],cart:[],waitT:0,bubble:null,staff:false,sc:type.sc||1,legs:0,inShop:false,seat:null,stuck:0,moving:false,atPos:false,qi:null,target:null,exit:null};}
function tileOf(e){return [Math.floor(e.x/TS),Math.floor(e.y/TS)];}
function goTo(e,tx,ty,cb){
  const [cx,cy]=tileOf(e);
  const p=astar(cx,cy,tx,ty,e.staff);
  if(!p){
    if(e.isEmp){e.x=tx*TS+TS/2;e.y=ty*TS+TS/2;e.path=[];e.onArrive=null;if(cb)cb(true);return true;}
    e.path=[];e.onArrive=null;if(cb)cb(false);return false;
  }
  e.path=p;e.onArrive=cb;e.tgt=[tx,ty];
  if(!p.length){e.onArrive=null;if(cb)cb(true);}
  return true;
}
function stepMove(e,dt){
  if(!e.path||!e.path.length){e.moving=false;return;}
  const [tx,ty]=e.path[0];const px=tx*TS+TS/2,py=ty*TS+TS/2;
  const dx=px-e.x,dy=py-e.y;const d=Math.hypot(dx,dy);const sp=e.spd*TS*dt;
  if(d<=sp){e.x=px;e.y=py;e.path.shift();if(!e.path.length){e.moving=false;const cb=e.onArrive;e.onArrive=null;if(cb)cb(true);}}
  else{e.x+=dx/d*sp;e.y+=dy/d*sp;e.moving=true;e.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?3:2):(dy>0?0:1);e.anim+=dt*9;}
}
function inView(e){return e.x>cam.x-24&&e.x<cam.x+VW+24&&e.y>cam.y-24&&e.y<cam.y+VW+40;}
function insideShop(e){const [x,y]=tileOf(e);const r=SHOP.inner;return x>=r[0]&&x<=r[2]&&y>=r[1]&&y<=r[3];}
function fmt(t,v){return t.replace(/\{f\}/g,v.f||'').replace(/\{n\}/g,v.n||'').replace(/\{p\}/g,v.p||'').replace(/\{s\}/g,SHOP_NAME);}
function won(n){return n.toLocaleString('ko-KR')+'원';}
function timeStr(){const h=Math.floor(T.min/60)%24,m=Math.floor(T.min%60);return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;}
function say(e,text,kind){
  if(!text)return;text=text.replace(/\{s\}/g,SHOP_NAME);
  e.bubble={text,ttl:2.4+text.length*0.07};
  if(e.isEmp||e.isVendor||inView(e))addLog(e.name,text,kind||(e.isEmp?'emp':e.isVendor?'vendor':'cust'));
}
function removeNPC(c){
  const i=npcs.indexOf(c);if(i>=0)npcs.splice(i,1);
  const q=shop.queue.indexOf(c);if(q>=0){shop.queue.splice(q,1);requeue();}
  if(shop.serving===c)shop.serving=null;
}
function pickType(){
  const h=T.min/60;let tot=0;const ws=CT.map(t=>{const w=(h>=t.hours[0]&&h<t.hours[1]+1)?3:1;tot+=w;return w;});
  let r=R()*tot;for(let i=0;i<CT.length;i++){r-=ws[i];if(r<=0)return CT[i];}return CT[CT.length-1];
}

// ===================== 손님 =====================
function spawnShopper(){
  const type=pickType();const fromHome=R()<0.5;const hs=houses.filter(h=>!h.home);
  const sp=fromHome?RP(hs).front:RP(spawnPts);
  const c=makeNPC(type,sp[0],sp[1],'shopper');c.state='toShop';c.exit=fromHome?sp:RP(spawnPts);
  if(!goTo(c,SHOP.door[0],SHOP.door[1],()=>enterShop(c)))return;
  npcs.push(c);
}
function enterShop(c){
  if(!shop.open||shop.away){say(c,pick(DLG.amb.closed));leaveShop(c);return;}
  c.inShop=true;stats.visits[c.type.id]=(stats.visits[c.type.id]||0)+1;
  if(emp.state==='idle'&&!emp.path.length&&emp.lineT<=6){say(emp,pick(DLG.emp.greet));emp.lineT=8;}
  const pool=[...c.type.likes];
  if(WX.temp>=28)pool.push('watermelon','chamoe','melon');
  if(WX.temp<=12)pool.push('tangerine','persimmon','pear');
  const n=R()<0.35?2:1;c.wants=[];
  for(let i=0;i<n;i++){let id;if(R()<0.7&&pool.length)id=pool.splice(RI(0,pool.length-1),1)[0];else id=RP(FRUITS).id;if(!c.wants.includes(FI[id]))c.wants.push(FI[id]);}
  browseNext(c);
}
function browseNext(c){
  if(!c.wants.length){
    if(c.cart.length)joinQueue(c);
    else{say(c,pick(DLG.cust[c.type.id].leave));stats.lost++;leaveShop(c);}
    return;
  }
  const fi=c.wants.shift();const cr=SHOP.crates[fi];c.target=cr;c.state='toCrate';
  const ok=goTo(c,cr.aisle[0],cr.aisle[1],()=>{
    c.state='browse';c.dir=1;c.timer=(c.type.slow?5:2.2)+R()*2.5;
    say(c,R()<0.5?pick(DLG.cust[c.type.id].browse):pick(DLG.fruit[FRUITS[fi].id].comment));
  });
  if(!ok)leaveShop(c);
}
function finishBrowse(c){
  const cr=c.target;const f=FRUITS[cr.fi];
  if(cr.stock>0){const n=Math.min(cr.stock,RI(c.type.buy[0],c.type.buy[1]));cr.stock-=n;c.cart.push({fi:cr.fi,n});}
  else{
    say(c,fmt(pick(DLG.cust[c.type.id].soldout),{f:f.n}));
    if(emp.state==='idle'&&emp.lineT<=3){say(emp,fmt(pick(DLG.emp.soldout),{f:f.n}));emp.lineT=7;}
    if(!c.wants.length&&!c.cart.length&&R()<0.6)c.wants.push(RI(0,24));
  }
  browseNext(c);
}
function joinQueue(c){
  if(shop.queue.length>=SHOP.qpos.length){say(c,pick(DLG.cust[c.type.id].wait));stats.lost++;returnCart(c);leaveShop(c);return;}
  shop.queue.push(c);c.waitT=0;c.qi=null;c.atPos=false;c.state='toQueue';requeue();
}
function requeue(){
  shop.queue.forEach((c,i)=>{
    const p=SHOP.qpos[i];
    if(!c.qi||c.qi[0]!==p[0]||c.qi[1]!==p[1]){
      c.qi=p;c.atPos=false;c.state='toQueue';
      goTo(c,p[0],p[1],()=>{c.atPos=true;c.state='queue';c.dir=3;});
    }
  });
}
function returnCart(c){c.cart.forEach(x=>{SHOP.crates[x.fi].stock+=x.n;});c.cart=[];}
function giveUp(c){say(c,pick(DLG.cust[c.type.id].wait));stats.lost++;returnCart(c);leaveShop(c);}
function leaveShop(c){
  c.inShop=false;c.state='leave';
  const q=shop.queue.indexOf(c);if(q>=0){shop.queue.splice(q,1);requeue();}
  const ex=c.exit||RP(spawnPts);
  if(!goTo(c,ex[0],ex[1],()=>removeNPC(c)))removeNPC(c);
}
function spawnWanderer(opt){
  const type=pickType();const sp=RP(spawnPts);
  const c=makeNPC(type,sp[0],sp[1],'walker');c.legs=RI(2,4);
  if(opt&&opt.closed){
    c.legs=1;c.state='stroll';
    if(!goTo(c,SHOP.front[0],SHOP.front[1],()=>{say(c,pick(DLG.amb.closed));c.state='pause';c.timer=2;}))return;
  }else nextStroll(c);
  npcs.push(c);
}
function nextStroll(c){
  c.legs--;
  if(c.legs<=0){
    const ex=R()<0.5?RP(houses).front:RP(spawnPts);c.state='leave';
    if(!goTo(c,ex[0],ex[1],()=>removeNPC(c)))removeNPC(c);
    return;
  }
  const r=R();let d,kind;
  if(r<0.3){d=RP(benches);kind='bench';}
  else if(r<0.5){d=[RI(14,27),RP([16,17,18,20,21,22])];kind='market';}
  else if(r<0.7){d=[RI(54,67),RP([14,15,26,27])];kind='park';}
  else if(r<0.85){d=[RI(34,47),RI(45,48)];kind='plaza';}
  else{d=RP(spawnPts);kind='edge';}
  c.state='stroll';
  if(!goTo(c,d[0],d[1],()=>{
    if(kind==='bench'){c.state='sit';c.seat=[d[0],d[1]];c.timer=8+R()*12;c.dir=0;}
    else{c.state='pause';c.timer=1.5+R()*2;}
  }))removeNPC(c);
}
function ambientLine(c){
  const [tx,ty]=tileOf(c);const h=T.min/60;const pools=[];
  if(WX.type==='rain')pools.push(DLG.amb.rain,DLG.amb.rain);else if(WX.type==='cloudy')pools.push(DLG.amb.cloudy);else pools.push(DLG.amb.sunny);
  pools.push(h<11?DLG.amb.morning:h<15?DLG.amb.noon:h<20?DLG.amb.evening:DLG.amb.night);
  if(tx>=53&&tx<=68&&ty>=13&&ty<=28)pools.push(DLG.amb.park,DLG.amb.park);
  else if(tx>=13&&tx<=28&&ty>=13&&ty<=28)pools.push(DLG.amb.market,DLG.amb.market);
  else if(tx>=33&&tx<=48&&ty>=44&&ty<=49)pools.push(DLG.amb.plaza,DLG.amb.plaza);
  else{const b=B[idx(tx,ty)];if(b===SW||b===CR||b===RD)pools.push(DLG.amb.road);}
  pools.push(DLG.cust[c.type.id].stroll,DLG.cust[c.type.id].stroll);
  say(c,pick(RP(pools)));
}
function npcUpdate(c,dt){
  stepMove(c,dt);c.talkT-=dt;
  switch(c.state){
    case 'browse':c.timer-=dt;if(c.timer<=0)finishBrowse(c);break;
    case 'toQueue':case 'queue':c.waitT+=dt;if(c.waitT>c.type.pat||(shop.away&&c.waitT>c.type.pat*0.5))giveUp(c);break;
    case 'stroll':if(c.talkT<=0){ambientLine(c);c.talkT=9+R()*10;}break;
    case 'sit':c.timer-=dt;if(c.talkT<=0){ambientLine(c);c.talkT=9+R()*10;}if(c.timer<=0){c.seat=null;nextStroll(c);}break;
    case 'pause':c.timer-=dt;if(c.timer<=0)nextStroll(c);break;
  }
  if(!c.path.length&&(c.state==='toShop'||c.state==='toCrate'||c.state==='leave'||c.state==='stroll')){c.stuck+=dt;if(c.stuck>4)removeNPC(c);}else c.stuck=0;
}

// ===================== 직원 =====================
function restockAll(){SHOP.crates.forEach(c=>{const take=Math.min(8-c.stock,shop.back[c.fi]);c.stock+=take;shop.back[c.fi]-=take;});}
function insideCount(){return npcs.filter(c=>c.role==='shopper'&&c.inShop).length;}
function idlePool(){
  const r=R();
  if(WX.type==='rain'&&r<0.35)return DLG.emp.rain;
  if(WX.type==='cloudy'&&r<0.2)return DLG.emp.cloudy;
  if(WX.temp>=28&&r<0.4)return DLG.emp.hot;
  if(WX.temp<=12&&r<0.4)return DLG.emp.cold;
  if(shop.queue.length>=3&&r<0.6)return DLG.emp.busy;
  return DLG.emp.idle;
}
function openShop(){shop.open=true;emp.state='idle';emp.idleT=0;emp.lineT=8;say(emp,pick(DLG.emp.open));addLog('','영업 시작 (09:00 ~ 20:00)','sys');}
function closeShop(){
  shop.open=false;emp.state='closing';emp.timer=7;emp.lineT=0.3;
  npcs.slice().forEach(c=>{if(c.role==='shopper'&&c.inShop&&c.state!=='leave'){say(c,pick(DLG.cust[c.type.id].leave));returnCart(c);leaveShop(c);}});
  shop.queue.length=0;
  addLog('',`마감 — 오늘 매출 ${won(stats.dayRev)}, 손님 ${stats.dayCust}명, 배달 ${stats.deliv}건`,'sys');
}
function idleDecide(dt){
  const e=emp;const h=T.min/60;
  if(T.min>=20*60){closeShop();return;}
  const q=shop.queue;
  if(q.length&&q[0].state==='queue'&&q[0].atPos){
    e.state='toCounter';
    goTo(e,SHOP.counter[0],SHOP.counter[1],()=>{e.dir=2;const c=q[0];if(c&&c.atPos)startServe(q.shift());else{e.state='idle';e.idleT=0.3;}});
    return;
  }
  if(shop.orders.length&&!q.length){
    const o=shop.orders.shift();e.order=o;e.state='deliverPack';e.timer=99;
    goTo(e,SHOP.storage[0],SHOP.storage[1],()=>{e.dir=1;e.timer=2.2;e.carry=o.fi;say(e,pick(DLG.emp.deliverPack));});
    return;
  }
  if(h>=13&&h<14.5&&!shop.lunched&&!q.length&&!insideCount()){
    shop.lunched=true;const near=benches.filter(b=>Math.abs(b[0]-SHOP.door[0])+Math.abs(b[1]-SHOP.door[1])<=24);const spot=RP(near.length?near:benches);e.state='lunchGo';say(e,pick(DLG.emp.lunchGo));
    goTo(e,spot[0],spot[1],()=>{e.state='lunch';e.timer=15+R()*4;e.seat=[spot[0],spot[1]];e.dir=0;e.lineT=1;});
    return;
  }
  const low=SHOP.crates.find(c=>c.stock<=2&&shop.back[c.fi]>0);
  if(low&&!q.length){
    e.state='restock';e.rs=low;
    goTo(e,SHOP.storage[0],SHOP.storage[1],()=>{e.dir=1;e.carry=low.fi;
      goTo(e,low.aisle[0],low.aisle[1],()=>{e.dir=1;const take=Math.min(8-low.stock,shop.back[low.fi]);low.stock+=take;shop.back[low.fi]-=take;e.carry=null;
        say(e,fmt(pick(DLG.emp.restock),{f:FRUITS[low.fi].n}));e.state='idle';e.idleT=1.2;e.rs=null;});});
    return;
  }

  if(e.lineT<=0){say(e,pick(idlePool()));e.lineT=9+R()*7;}

function startServe(c){
  shop.serving=c;c.state='served';c.dir=3;emp.dir=2;requeue();
  const it=c.cart[0];const f=FRUITS[it.fi];const total=c.cart.reduce((s,x)=>s+x.n*FRUITS[x.fi].p,0);
  const v={f:f.n,n:it.n+f.u,p:won(total)};const t=DLG.cust[c.type.id];
  const st=[[c,pick(t.greet)],[c,R()<0.5?pick(t.ask):pick(DLG.fruit[f.id].comment)],[emp,pick(DLG.fruit[f.id].pitch)]];
  if(R()<0.3)st.splice(1,0,[emp,pick(DLG.emp.greet)]);
  if(R()<0.35){const qa=pick(DLG.qa);st.push([c,qa[0]],[emp,qa[1]]);}
  st.push([c,pick(t.buy)],[emp,pick(DLG.emp.sell),'sale'],[c,pick(t.leave),'go'],[emp,pick(DLG.emp.thanks)]);
  emp.script={st,i:0,t:0.4,v,c,items:c.cart.slice(),total,onDone:null};
  emp.state='serve';
}
function runScript(dt){
  const s=emp.script;if(!s){emp.state='idle';return;}
  s.t-=dt;if(s.t>0)return;
  if(s.i>=s.st.length){scriptDone(s);return;}
  const [who,text,tag]=s.st[s.i++];const tx=fmt(text,s.v);
  say(who,tx);s.t=0.8+tx.length*0.032;
  if(tag==='sale')doSale(s);
  if(tag==='go')leaveShop(s.c);
}
function scriptDone(s){
  emp.script=null;
  if(s.onDone){s.onDone();return;}
  shop.serving=null;emp.state='idle';emp.idleT=0.3;
}
function doSale(s){
  stats.dayRev+=s.total;stats.totRev+=s.total;stats.dayCust++;stats.totCust++;
  s.items.forEach(x=>{stats.sold[x.fi]+=x.n;});
  const desc=s.items.map(x=>`${FRUITS[x.fi].n} ${x.n}${FRUITS[x.fi].u}`).join(', ');
  addLog('',`🧾 ${s.deliv?'배달 ':''}${desc} = ${won(s.total)}`,'sys');
}
function startHandover(o){
  const e=emp;e.state='deliverGive';e.dir=1;e.onBike=false;e.x+=12;
  const res=makeNPC(o.type,o.house.door[0],o.house.door[1],'resident');res.dir=0;res.state='resident';res.x-=8;res.y+=14;npcs.push(res);
  const f=FRUITS[o.fi];const total=o.n*f.p;const v={f:f.n,n:o.n+f.u,p:won(total)};const t=DLG.cust[o.type.id];
  const st=[[e,pick(DLG.emp.deliverGive)],[res,pick(DLG.amb.house)],[res,pick(t.deliver)],[e,pick(DLG.emp.thanks),'sale']];
  shop.back[o.fi]=Math.max(0,shop.back[o.fi]-o.n);

    goTo(e,SHOP.counter[0],SHOP.counter[1],()=>{e.state='idle';e.dir=2;e.idleT=0.3;e.onBike=false;e.spd=EMP_TYPE.spd;});
  }};

function empUpdate(dt){
  const e=emp;stepMove(e,dt);e.lineT-=dt;
  switch(e.state){
    case 'sleep':
      if(T.min>=6*60+30&&T.min<12*60){e.hidden=false;e.state='wake';e.timer=2.5;say(e,pick(DLG.emp.wake));}
      break;
    case 'wake':
      e.timer-=dt;
      if(e.timer<=0){e.state='toMarket';e.lineT=3;goTo(e,MARKET.buy[0],MARKET.buy[1],()=>{e.state='market';e.timer=9;e.mk=0;e.dir=1;e.lineT=0.5;});}
      break;
    case 'toMarket':
      if(e.lineT<=0){say(e,pick(DLG.emp.marketGo));e.lineT=7;}
      break;
    case 'market':
      e.timer-=dt;
      if(e.lineT<=0){if(e.mk%2===0)say(vendor,pick(DLG.vendor));else say(e,pick(DLG.emp.marketBuy));e.mk++;e.lineT=1.9;}
      if(e.timer<=0){
        for(let i=0;i<25;i++)shop.back[i]=12;
        addLog('','도매시장에서 과일 25종 매입 완료','sys');
        say(e,pick(DLG.emp.marketBack));e.state='toShop';e.lineT=6;e.carry=RI(0,24);
        goTo(e,SHOP.storage[0],SHOP.storage[1],()=>{e.state='prep';e.dir=1;e.carry=null;e.lineT=1;restockAll();addLog('','진열대 25칸 채움','sys');});
      }
      break;
    case 'toShop':
      if(e.lineT<=0&&R()<0.5){say(e,pick(DLG.emp.marketBack));e.lineT=8;}
      break;
    case 'prep':
      if(e.lineT<=0){say(e,pick(DLG.emp.prep));e.lineT=5+R()*3;}
      if(T.min>=9*60&&T.min<20*60)openShop();
      break;
    case 'idle':idleDecide(dt);break;
    case 'serve':case 'deliverGive':runScript(dt);break;
    case 'deliverPack':
      if(!e.path.length){e.timer-=dt;if(e.timer<=0){const o=e.order;e.state='deliverGo';e.lineT=2.5;e.onBike=true;e.spd=7.2;say(e,pick(DLG.emp.away));
        goTo(e,o.house.front[0],o.house.front[1],()=>startHandover(o));}}
      break;
    case 'deliverGo':
      if(e.lineT<=0&&R()<0.5){say(e,pick(DLG.emp.deliverGo));e.lineT=6;}
      break;
    case 'deliverBack':
      if(e.lineT<=0&&R()<0.4){say(e,pick(DLG.emp.deliverBack));e.lineT=7;}
      break;
    case 'lunch':
      e.timer-=dt;
      if(e.lineT<=0){say(e,pick(DLG.emp.lunch));e.lineT=5+R()*3;}
      if(e.timer<=0){e.seat=null;e.state='lunchBack';say(e,pick(DLG.emp.lunchBack));goTo(e,SHOP.counter[0],SHOP.counter[1],()=>{e.state='idle';e.dir=2;e.idleT=0.3;});}
      break;
    case 'closing':
      e.timer-=dt;
      if(e.lineT<=0){say(e,pick(DLG.emp.close));e.lineT=3;}
      if(e.timer<=0){e.state='homeGo';e.lineT=4;goTo(e,HOME.front[0],HOME.front[1],()=>{e.state='home';e.timer=4;e.dir=1;say(e,pick(DLG.emp.home));});}
      break;
    case 'homeGo':
      if(e.lineT<=0&&R()<0.5){say(e,pick(DLG.emp.homeGo));e.lineT=6;}
      break;
    case 'home':
      e.timer-=dt;
      if(e.timer<=0){e.state='sleep';e.hidden=true;e.bubble=null;e.x=HOME.door[0]*TS+TS/2;e.y=HOME.door[1]*TS+TS/2;addLog('','직원이 잠들었습니다. 아침까지 시간이 빨리 흐릅니다','sys');}
      break;
  }
}

// ===================== 배달 주문 / 날씨 / 차 =====================
function planOrders(){shop.orderTimes=[];const n=RI(1,3);for(let i=0;i<n;i++)shop.orderTimes.push(RI(9*60+40,18*60));shop.orderTimes.sort((a,b)=>a-b);}
function checkOrders(){
  while(shop.orderTimes.length&&T.min>=shop.orderTimes[0]){
    shop.orderTimes.shift();if(!shop.open)continue;
    const hs=houses.filter(h=>!h.home);const house=RP(hs);const type=pickType();const fi=FI[RP(type.likes)];const n=RI(1,3);
    shop.orders.push({house,type,fi,n});
    addLog('',`📦 배달 주문 — ${type.n}: ${FRUITS[fi].n} ${n}${FRUITS[fi].u}`,'sys');
  }
}
function rollWeather(){
  const r=R();WX.type=r<0.55?'sunny':r<0.8?'cloudy':'rain';
  WX.name={sunny:'맑음',cloudy:'흐림',rain:'비'}[WX.type];
  WX.temp=RI(9,32);if(WX.type==='rain')WX.temp=Math.min(WX.temp,26);
}
function newDay(){
  T.day++;stats.dayRev=0;stats.dayCust=0;stats.deliv=0;shop.lunched=false;rollWeather();planOrders();
  addLog('',`${T.day}일차 — ${WX.name}, ${WX.temp}℃`,'sys');
}
function spawnCar(){
  const r=RP(ROADS);const horiz=R()<0.5;const pos=R()<0.5;const spd=(4.5+R()*3)*TS;const col=RP(CAR_COLS);
  if(horiz){const lane=pos?r+1:r;cars.push({h:true,x:(pos?-1:W)*TS,y:lane*TS+TS/2,vx:pos?1:-1,vy:0,spd,col});}
  else{const lane=pos?r:r+1;cars.push({h:false,x:lane*TS+TS/2,y:(pos?-1:H)*TS,vx:0,vy:pos?1:-1,spd,col});}
}
function carsUpdate(dt){
  for(let i=cars.length-1;i>=0;i--){
    const c=cars[i];let sp=c.spd;
    for(const o of cars){if(o===c||o.h!==c.h)continue;
      if(c.h){if(o.y===c.y&&Math.sign(o.x-c.x)===c.vx&&Math.abs(o.x-c.x)<2.6*TS)sp=Math.min(sp,o.spd*0.85);}
      else{if(o.x===c.x&&Math.sign(o.y-c.y)===c.vy&&Math.abs(o.y-c.y)<2.6*TS)sp=Math.min(sp,o.spd*0.85);}
    }
    c.x+=c.vx*sp*dt;c.y+=c.vy*sp*dt;
    if(c.x<-2*TS||c.x>(W+2)*TS||c.y<-2*TS||c.y>(H+2)*TS)cars.splice(i,1);
  }
}
function spawnLogic(dt){
  const h=T.min/60;
  if(shop.open&&!shop.away&&emp.state!=='closing'){
    let rate=(h<11)?2.8:(h<12.8)?3.8:(h<14)?(shop.lunched?3.2:0):(h<17)?2.8:4;if(WX.type==='rain')rate*=0.6;
    let inside=0,enroute=0;for(const c of npcs)if(c.role==='shopper'){if(c.inShop)inside++;else if(c.state==='toShop')enroute++;}
    if(shop.queue.length<4&&inside<6&&enroute<5&&R()<(rate/60/MIN_SEC)*dt)spawnShopper();
  }
  if(!shop.open&&((h>=7.5&&h<9)||(h>=20&&h<21.5))&&R()<dt*0.025)spawnWanderer({closed:true});
  const target=(h>=7&&h<21)?(WX.type==='rain'?5:9):3;
  const walkers=npcs.filter(c=>c.role==='walker').length;
  if(walkers<target&&R()<dt*0.5)spawnWanderer();
  if(cars.length<7&&R()<dt*0.35)spawnCar();
}

// ===================== 메인 스텝 =====================
function step(dt){
  T.min+=dt/MIN_SEC;if(T.min>=1440){T.min-=1440;newDay();}
  checkOrders();
  empUpdate(dt);
  shop.away=!EMP_IN_SHOP.has(emp.state);
  for(let i=npcs.length-1;i>=0;i--){const c=npcs[i];if(c.isVendor||c.state==='resident')continue;npcUpdate(c,dt);}
  carsUpdate(dt);spawnLogic(dt);
  if(emp.bubble){emp.bubble.ttl-=dt;if(emp.bubble.ttl<=0)emp.bubble=null;}
  for(const c of npcs){if(c.bubble){c.bubble.ttl-=dt;if(c.bubble.ttl<=0)c.bubble=null;}}
  if(cam.follow){const tx=Math.max(0,Math.min(W*TS-VW,emp.x-VW/2)),ty=Math.max(0,Math.min(H*TS-VW,emp.y-VW/2));
  const k=Math.min(1,dt*5);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;}
}
function update(dtReal){
  const mult=T.speed*(emp.state==='sleep'?8:1);const dt=dtReal*mult;
  const steps=Math.ceil(dt/0.05);const sdt=dt/steps;
  for(let i=0;i<steps;i++)step(sdt);
}
function initWorld(){
  genMap();
  emp=Object.assign(makeNPC(EMP_TYPE,SHOP.storage[0],SHOP.storage[1],'prep'),{isEmp:true,staff:true,name:'직원',script:null,idleT:0,lineT:2,hidden:false,carry:null,order:null,rs:null,mk:0});
  emp.dir=1;emp.spd=EMP_TYPE.spd;emp.onBike=false;
  vendor=makeNPC(VENDOR_TYPE,MARKET.vendor[0],MARKET.vendor[1],'vendor');vendor.isVendor=true;vendor.dir=0;npcs.push(vendor);
  restockAll();rollWeather();planOrders();
  cam.x=Math.max(0,Math.min(W*TS-VW,emp.x-VW/2));cam.y=Math.max(0,Math.min(H*TS-VW,emp.y-VW/2));
  for(let i=0;i<4;i++)spawnWanderer();
  for(let i=0;i<4;i++){spawnCar();const c=cars[cars.length-1];if(c.h)c.x=RI(5,W-5)*TS;else c.y=RI(5,H-5)*TS;}
}

function wrapText(g,t,maxW){
  const lines=[];let cur='';
  for(const ch of t){const test=cur+ch;if(g.measureText(test).width>maxW&&cur){lines.push(cur);cur=ch;}else cur=test;}
  if(cur)lines.push(cur);return lines;
}
function drawBubble(g,e){

  roundRect(g,bx,by,w,h,5);g.fill();g.stroke();

  g.beginPath();g.moveTo(tx-4,by+h);g.lineTo(tx,by+h+5);g.lineTo(tx+4,by+h);g.closePath();g.fill();g.stroke();
  g.fillStyle=e.isEmp?'#eefbe8':e.isVendor?'#fff3e0':'#fffdf5';g.fillRect(tx-3,by+h-1,6,2);

  const box=$('modalBox');box.innerHTML='';
  const h2=document.createElement('h2');h2.textContent='도감';box.appendChild(h2);
  const cnt=document.createElement('div');cnt.className='cnt';cnt.textContent=`대사 ${LINE_TOTAL.toLocaleString('ko-KR')}개 (직원 ${LINE_COUNTS.emp}, 손님 ${LINE_COUNTS.cust}, 과일 ${LINE_COUNTS.fruit}, 행인 ${LINE_COUNTS.amb}, 문답 ${LINE_COUNTS.qa}, 상인 ${LINE_COUNTS.vendor}) / 누적 매출 ${won(stats.totRev)}, 누적 손님 ${stats.totCust}명, 놓친 손님 ${stats.lost}명`;box.appendChild(cnt);
  const h3a=document.createElement('h3');h3a.textContent='과일 25종';box.appendChild(h3a);
  const ga=document.createElement('div');ga.className='grid';
  FRUITS.forEach((f,i)=>{const it=document.createElement('div');it.className='it';const c=document.createElement('canvas');c.width=28;c.height=28;drawFruit(c.getContext('2d'),f,14,15,9);it.appendChild(c);const d=document.createElement('div');d.innerHTML=`${f.n}<small>${won(f.p)}/${f.u}, 판매 ${stats.sold[i]}${f.u}</small>`;it.appendChild(d);ga.appendChild(it);});
  box.appendChild(ga);
  const h3b=document.createElement('h3');h3b.textContent='손님 28종';box.appendChild(h3b);
  const gb=document.createElement('div');gb.className='grid';
  CT.forEach(t=>{const it=document.createElement('div');it.className='it';const c=document.createElement('canvas');c.width=34;c.height=44;drawChar(c.getContext('2d'),{type:t,x:17,y:42,dir:0,moving:false,anim:0,sc:t.sc||1,book:true});it.appendChild(c);const d=document.createElement('div');d.innerHTML=`${t.n}<small>방문 ${stats.visits[t.id]||0}회, 좋아하는 과일: ${t.likes.slice(0,2).map(id=>FRUITS[FI[id]].n).join(', ')}</small>`;it.appendChild(d);gb.appendChild(it);});
  box.appendChild(gb);
  const bt=document.createElement('button');bt.textContent='닫기';bt.onclick=()=>$('modal').classList.remove('on');box.appendChild(bt);
  $('modal').classList.add('on');
}
function setupUI(){
  $('hSign').firstChild.textContent=SHOP_NAME;
  $('hMeta').textContent=`과일 ${FRUITS.length}종, 손님 ${CT.length}종, 대사 ${LINE_TOTAL.toLocaleString('ko-KR')}개`;
  $('bPause').onclick=()=>{T.paused=!T.paused;$('paused').classList.toggle('on',T.paused);$('bPause').textContent=T.paused?'▶':'⏸';};
  document.querySelectorAll('.spd').forEach(b=>b.onclick=()=>{T.speed=+b.dataset.s;document.querySelectorAll('.spd').forEach(x=>x.classList.toggle('on',x===b));});
  $('bLog').onclick=()=>{logEl.classList.toggle('off');$('bLog').classList.toggle('on',!logEl.classList.contains('off'));};$('bLog').classList.add('on');
  $('bMini').onclick=()=>{miniCv.classList.toggle('off');$('bMini').classList.toggle('on',!miniCv.classList.contains('off'));};$('bMini').classList.add('on');
  $('bBook').onclick=openBook;
  $('bCam').onclick=()=>setFollow(!cam.follow);
  let drag=null;
  cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect();const k=VW/r.width;const dx=(e.clientX-drag.x)*k,dy=(e.clientY-drag.y)*k;
    if(drag.moved||Math.abs(dx)+Math.abs(dy)>4){drag.moved=true;setFollow(false);cam.x=clampX(cam.x-dx);cam.y=clampY(cam.y-dy);drag.x=e.clientX;drag.y=e.clientY;}});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>{drag=null;}));
  miniCv.addEventListener('pointerdown',e=>{e.stopPropagation();const r=miniCv.getBoundingClientRect();const tx=(e.clientX-r.left)/r.width*W,ty=(e.clientY-r.top)/r.height*H;setFollow(false);cam.x=clampX(tx*TS-VW/2);cam.y=clampY(ty*TS-VW/2);});
  $('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('on');};
  document.addEventListener('visibilitychange',()=>{T.hidden=document.hidden;last=performance.now();});
  document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('bPause').click();return;}
    if(KEYMAP[e.code]!==undefined){keys.add(KEYMAP[e.code]);e.preventDefault();}
    if(e.code==='KeyF')setFollow(true);});
  document.addEventListener('keyup',e=>{if(KEYMAP[e.code]!==undefined)keys.delete(KEYMAP[e.code]);});
}
const clampX=x=>Math.max(0,Math.min(W*TS-VW,x)),clampY=y=>Math.max(0,Math.min(H*TS-VW,y));
const KEYMAP={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',KeyA:'l',KeyD:'r',KeyW:'u',KeyS:'d'};
const keys=new Set();
function setFollow(f){cam.follow=f;$('bCam').textContent=f?'📍 추적':'🖐 자유';$('bCam').classList.toggle('on',f);$('camHint').classList.toggle('on',!f);}
function panKeys(dt){if(!keys.size)return;setFollow(false);const v=260*dt;if(keys.has('l'))cam.x=clampX(cam.x-v);if(keys.has('r'))cam.x=clampX(cam.x+v);if(keys.has('u'))cam.y=clampY(cam.y-v);if(keys.has('d'))cam.y=clampY(cam.y+v);}
let last=performance.now(),hudT=1,shelfT=1;
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>0.1)dt=0.1;if(dt<0)dt=0;
  if(!T.paused&&!T.hidden)update(dt);
  panKeys(dt);
  render(now);
  hudT+=dt;if(hudT>0.25){hudT=0;updateHUD();}
  shelfT+=dt;if(shelfT>0.5){shelfT=0;drawShelf();}
  requestAnimationFrame(frame);
}
function init(){
  initWorld();buildMini();setupUI();
  addLog('',`${T.day}일차 — ${WX.name}, ${WX.temp}℃. ${SHOP_NAME} 개점 준비 중`,'sys');
  addLog('','화면을 드래그하거나 지도를 누르면 자유 시점, 📍 버튼(또는 F키)으로 직원 추적 복귀','sys');
  updateHUD();drawShelf();
  requestAnimationFrame(frame);
}
init();
</script>
</body>
