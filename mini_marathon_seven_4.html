<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>MINI MARATHON: SEVEN Ⅳ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{width:100%;height:100%;background:#05060c;}
body{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#05060c;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
/* canvas는 replaced element라 width/height를 명시하지 않으면
   intrinsic 크기(=canvas.width, 즉 CSS px * DPR)로 레이아웃된다. 반드시 지정할 것. */
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;}
/* env()는 getPropertyValue로 계산값을 못 읽으므로 padding 계산값으로 실측한다 */
#sa{position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
'use strict';
/* ============ MINI MARATHON: SEVEN ============ */

/* ---------- utils ---------- */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function inRect(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function hexRGB(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function shade(h,f){const c=hexRGB(h);return 'rgb('+Math.round(c[0]*f)+','+Math.round(c[1]*f)+','+Math.round(c[2]*f)+')';}
function withA(h,a){const c=hexRGB(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}

/* ---------- canvas ---------- */
const cvs=document.getElementById('c');
const saProbe=document.getElementById('sa');
const ctx=cvs.getContext('2d');
let W=0,H=0,DPR=1,SAT=0,SAB=0,scanPat=null,rectL=0,rectT=0;
function viewSize(){
  let w=window.innerWidth||0,h=window.innerHeight||0;
  try{
    const de=document.documentElement;
    if(de&&de.clientWidth){w=Math.min(w||1e9,de.clientWidth)||w;}
    const vv=window.visualViewport;
    if(vv&&vv.width&&vv.height&&vv.scale&&Math.abs(vv.scale-1)<0.01){
      w=Math.round(vv.width);h=Math.round(vv.height);
    }
  }catch(e){}
  return {w:Math.max(1,Math.round(w)),h:Math.max(1,Math.round(h))};
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const v=viewSize();
  W=v.w;H=v.h;
  cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);
  cvs.style.width=W+'px';cvs.style.height=H+'px';
  try{
    const cs=getComputedStyle(saProbe);
    SAT=parseFloat(cs.paddingTop)||0;
    SAB=parseFloat(cs.paddingBottom)||0;
  }catch(e){SAT=0;SAB=0;}
  SAT=clamp(SAT,0,H*0.2);SAB=clamp(SAB,0,H*0.2);
  try{const r=cvs.getBoundingClientRect();rectL=r.left||0;rectT=r.top||0;}
  catch(e){rectL=0;rectT=0;}
  try{
    const pc=document.createElement('canvas');pc.width=4;pc.height=4;
    const px=pc.getContext('2d');
    px.fillStyle='rgba(255,255,255,0.028)';px.fillRect(0,0,4,1);
    scanPat=ctx.createPattern(pc,'repeat');
  }catch(e){scanPat=null;}
  initStars();
}
/* 모바일은 회전/주소창 변화 직후 값이 스테일해서 지연 재측정이 필요하다 */
let reT=null;
function reflow(){
  resize();
  if(reT)clearTimeout(reT);
  reT=setTimeout(function(){reT=null;resize();},220);
}
window.addEventListener('resize',reflow);
window.addEventListener('orientationchange',reflow);
try{
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',reflow);
    window.visualViewport.addEventListener('scroll',reflow);
  }
}catch(e){}
const HUD_H=()=>SAT+84;
const PLAY=()=>({x:0,y:HUD_H(),w:W,h:H-HUD_H()-SAB-12});

/* ---------- audio ---------- */
let AC=null;
function audioInit(){if(AC)return;try{const A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A();}catch(e){AC=null;}}
function beep(f,d,type,g,slide){
  if(!AC)return;
  try{
    const o=AC.createOscillator(),ga=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,AC.currentTime);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
    ga.gain.setValueAtTime(g||0.14,AC.currentTime);
    ga.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);
    o.connect(ga);ga.connect(AC.destination);
    o.start();o.stop(AC.currentTime+d+0.02);
  }catch(e){}
}
function sfx(name){
  if(name==='tap')beep(520,0.05,'square',0.07);
  else if(name==='tick')beep(880,0.03,'square',0.05);
  else if(name==='pulse')beep(300,0.07,'sine',0.13);
  else if(name==='good'){beep(660,0.09,'triangle',0.14);beep(990,0.14,'triangle',0.1);}
  else if(name==='win'){beep(523,0.12,'triangle',0.14);setTimeout(function(){beep(659,0.12,'triangle',0.14);},90);setTimeout(function(){beep(784,0.2,'triangle',0.16);},180);setTimeout(function(){beep(1046,0.3,'triangle',0.14);},290);}
  else if(name==='lose'){beep(180,0.3,'sawtooth',0.16,-120);setTimeout(function(){beep(120,0.4,'sawtooth',0.14,-80);},120);}
  else if(name==='flip')beep(240,0.09,'square',0.1,160);
  else if(name==='warn')beep(140,0.12,'square',0.12);
  else if(name==='rank'){beep(784,0.1,'triangle',0.14);setTimeout(function(){beep(1175,0.25,'triangle',0.16);},110);}
}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ---------- fx ---------- */
const parts=[],rings=[],pops=[];
let shakeT=0,shakeD=1,shakePow=0,flashT=0,flashD=1,flashCol='#fff',glitchT=0,glitchD=1;
function doShake(p,d){shakePow=p;shakeT=d;shakeD=d;}
function doFlash(c,d){flashCol=c;flashT=d;flashD=d;}
function doGlitch(d){glitchT=d;glitchD=d;}
function burst(x,y,col,n,sp,sz,life){
  n=n||24;sp=sp||260;sz=sz||3.4;life=life||0.7;
  for(let i=0;i<n;i++){
    const a=rnd(TAU),s=rnd(0.25,1)*sp;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.5,1)*life,max:life,sz:rnd(0.6,1.4)*sz,col:col,dr:rnd(0.86,0.97),grav:rnd(-40,160)});
  }
}
function ringFX(x,y,col,r0,r1,d,w){rings.push({x:x,y:y,col:col,r0:r0||10,r1:r1||140,d:d||0.5,t:0,w:w||4});}
function pop(t2,x,y,col,size){pops.push({txt:t2,x:x,y:y,col:col,size:size||24,t:0,d:1.0});}
function updateFX(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    const f=Math.pow(p.dr,dt*60);
    p.vx*=f;p.vy*=f;p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  for(let i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>=rings[i].d)rings.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>=pops[i].d)pops.splice(i,1);}
}
function drawFX(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    const a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz*a+0.6,0,TAU);ctx.fill();
  }
  ctx.shadowBlur=0;
  for(const r of rings){
    const t=r.t/r.d,rr2=lerp(r.r0,r.r1,easeOut(t));
    ctx.globalAlpha=(1-t)*0.9;ctx.strokeStyle=r.col;ctx.lineWidth=r.w*(1-t)+1;
    ctx.shadowColor=r.col;ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(r.x,r.y,rr2,0,TAU);ctx.stroke();
  }
  ctx.restore();ctx.globalAlpha=1;ctx.shadowBlur=0;
  for(const q of pops){
    const t=q.t/q.d;
    ctx.globalAlpha=1-easeIn(t);
    txt(q.txt,q.x,q.y-40*easeOut(t),q.size,q.col,14,'center',900);
  }
  ctx.globalAlpha=1;
}
function drawGlitch(){
  const k=glitchT/glitchD,n=6;
  for(let i=0;i<n;i++){
    const y=rnd(H),h=rnd(6,26),dx=rnd(-34,34)*k;
    try{ctx.drawImage(cvs,0,Math.floor(y*DPR),cvs.width,Math.max(1,Math.floor(h*DPR)),dx,y,W,h);}catch(e){}
  }
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.13*k;
  ctx.fillStyle='#ff004c';ctx.fillRect(rnd(-8,8),0,W,H);
  ctx.fillStyle='#00e5ff';ctx.fillRect(rnd(-8,8),rnd(-4,4),W,H);
  ctx.restore();ctx.globalAlpha=1;
}

/* ---------- text / bg ---------- */
function txt(s,x,y,size,col,glow,align,weight,baseline){
  ctx.font=(weight||800)+' '+size+'px system-ui,-apple-system,"Segoe UI",sans-serif';
  ctx.textAlign=align||'center';ctx.textBaseline=baseline||'middle';
  if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow;}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
  ctx.shadowBlur=0;
}
function fitLines(s,size,maxW){
  ctx.font='700 '+size+'px system-ui,-apple-system,"Segoe UI",sans-serif';
  if(ctx.measureText(s).width<=maxW)return [s];
  const words=s.split(' ');let a='',b='';
  for(let i=0;i<words.length;i++){
    const cand=a?a+' '+words[i]:words[i];
    if(b===''&&ctx.measureText(cand).width<=maxW)a=cand;
    else b=b?b+' '+words[i]:words[i];
  }
  if(!a){a=s;b='';}
  return b?[a,b]:[a];
}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
let stars=[];
function initStars(){
  stars=[];
  for(let i=0;i<54;i++)stars.push({x:rnd(W),y:rnd(H),r:rnd(0.6,2.2),sp:rnd(6,26),ph:rnd(TAU)});
}
function drawBG(col,t){
  const g=ctx.createRadialGradient(W/2,H*0.32,20,W/2,H*0.55,H);
  g.addColorStop(0,shade(col,0.13));
  g.addColorStop(0.5,'#090b16');
  g.addColorStop(1,'#04050b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=0.05;ctx.strokeStyle=col;ctx.lineWidth=1;
  const gs=52,ox=(t*7)%gs,oy=(t*4)%gs;
  ctx.beginPath();
  for(let x=-gs+ox;x<W+gs;x+=gs){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(let y=-gs+oy;y<H+gs;y+=gs){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();ctx.restore();
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const s of stars){
    ctx.globalAlpha=0.35+0.35*Math.sin(t*2+s.ph);
    ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();
  }
  ctx.restore();ctx.globalAlpha=1;
}

/* ---------- state / flow ---------- */
let STATE='title',stateT=0,now=0;
let order=[],gIdx=0,results=[],streak=0,total=0,best=0,newBest=false;
try{best=parseInt(localStorage.getItem('mm7_4_best')||'0',10)||0;}catch(e){best=0;}
let cur=null,gameT=0,lowWhole=99;
let judgeWin=false,judgeScore=0,judgeMult=1,judgeFired=false;
let rankShown=false,retryRect=null,paused=false;

const trans={active:false,t:0,inD:0.3,outD:0.3,mid:null,phase:0};
function transition(cb){trans.active=true;trans.t=0;trans.phase=0;trans.mid=cb;}
function updateTrans(dt){
  if(!trans.active)return;
  trans.t+=dt;
  if(trans.phase===0&&trans.t>=trans.inD){
    trans.phase=1;trans.t=0;
    if(trans.mid){const f=trans.mid;trans.mid=null;f();}
  }else if(trans.phase===1&&trans.t>=trans.outD){trans.active=false;}
}
function drawTrans(){
  if(!trans.active)return;
  const bars=7,bw=W/bars;
  const col=cur?cur.color:'#00e5ff';
  for(let i=0;i<bars;i++){
    let p;
    if(trans.phase===0)p=clamp(trans.t/trans.inD*1.6-i*0.09,0,1);
    else p=1-clamp(trans.t/trans.outD*1.6-i*0.09,0,1);
    if(p<=0)continue;
    const h=H*easeIO(p),down=(i%2===0);
    ctx.fillStyle='#04050b';
    ctx.fillRect(i*bw-1,down?0:H-h,bw+2,h);
    ctx.fillStyle=withA(col,0.5*p);
    ctx.fillRect(i*bw-1,down?h-3:H-h,bw+2,3);
  }
}

function setState(s){STATE=s;stateT=0;}
function startRun(){
  order=shuffle(GAMES.map(function(_,i){return i;}));
  gIdx=0;results=[];streak=0;total=0;newBest=false;
  parts.length=0;rings.length=0;pops.length=0;
  transition(beginIntro);
}
function beginIntro(){cur=GAMES[order[gIdx]];setState('intro');}
function beginPlay(){pointers.clear();cur.init();gameT=0;lowWhole=99;setState('play');}
function endGame(win){
  if(STATE!=='play')return;
  const remain=Math.max(0,cur.time-gameT);
  const acc=clamp(Math.round(cur.acc||0),0,50);
  judgeWin=win;judgeFired=false;
  if(win){
    streak++;
    judgeMult=1+0.5*Math.min(streak-1,4);
    judgeScore=Math.round((100+Math.round(remain*10)+acc)*judgeMult);
    total+=judgeScore;
    sfx('win');vib(30);
    doFlash(cur.color,0.22);doShake(7,0.35);
    burst(W/2,H*0.44,'#ffd23c',60,420,4,1);
    burst(W/2,H*0.44,cur.color,40,330,3,0.9);
    ringFX(W/2,H*0.44,'#ffd23c',10,W*0.7,0.7,6);
  }else{
    streak=0;judgeMult=1;judgeScore=0;
    sfx('lose');vib([70,40,70]);
    doGlitch(0.55);doShake(12,0.45);doFlash('#ff2050',0.15);
  }
  results.push({win:win,score:judgeScore});
  setState('judge');
}
function afterJudge(){
  gIdx++;
  if(gIdx>=order.length){
    transition(function(){
      newBest=total>best;
      if(newBest){best=total;try{localStorage.setItem('mm7_4_best',String(best));}catch(e){}}
      rankShown=false;retryRect=null;
      setState('result');
    });
  }else transition(beginIntro);
}

/* ---------- HUD ---------- */
function drawHUD(){
  const topY=SAT+14;
  txt((gIdx+1)+' / 7',16,topY+8,15,'#9fb4d8',0,'left',800);
  if(streak>=1)txt('COMBO x'+(1+0.5*Math.min(streak,4)).toFixed(1),16,topY+30,12,'#ffd23c',8,'left',900);
  txt(String(total).padStart(6,'0'),W-16,topY+8,17,'#e8f2ff',6,'right',900);
  const r=25,cx=W/2,cy=topY+r;
  const remain=Math.max(0,cur.time-gameT),frac=clamp(remain/cur.time,0,1);
  const low=remain<=2&&remain>0;
  const col=low?'#ff3b5c':cur.color;
  ctx.save();
  ctx.globalAlpha=0.3;ctx.strokeStyle='#25304a';ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke();
  ctx.globalAlpha=1;ctx.strokeStyle=col;ctx.shadowColor=col;ctx.shadowBlur=low?16:8;
  ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+TAU*frac);ctx.stroke();
  ctx.restore();
  txt(remain.toFixed(1),cx,cy+1,14,low?'#ff5b74':'#e8f2ff',low?10:0,'center',900);
  txt(cur.name,cx,SAT+72,11,withA(cur.color,0.9),6,'center',800);
}

/* ---------- title ---------- */
function drawTitle(){
  drawBG('#ff9d2e',now);
  const cy=H*0.32,s=Math.min(W*0.21,88);
  const pulse=1+Math.sin(now*2.4)*0.02;
  ctx.save();ctx.translate(W/2,cy);ctx.scale(pulse,pulse);
  txt('MINI MARATHON',0,-s*0.62,Math.min(W*0.082,32),'#ffe3bd',18,'center',900);
  ctx.globalAlpha=0.85;
  txt('SEVEN Ⅳ',3,s*0.14+2,s,'#ff5a2e',26,'center',900);
  txt('SEVEN Ⅳ',-3,s*0.14-2,s,'#ffd23c',26,'center',900);
  ctx.globalAlpha=1;
  txt('SEVEN Ⅳ',0,s*0.14,s,'#f5faff',8,'center',900);
  ctx.restore();
  txt('EPISODE Ⅳ · 새로운 미니게임 7종',W/2,cy+s*0.82,15,'#ffce8a',0);
  for(let i=0;i<GAMES.length;i++){
    const g=GAMES[i],x=W/2+(i-3)*34,y=cy+s*0.82+36+Math.sin(now*3+i)*3;
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=g.color;ctx.shadowColor=g.color;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(x,y,5,0,TAU);ctx.fill();ctx.restore();
  }
  ctx.globalAlpha=0.55+0.45*Math.sin(now*4);
  txt('TAP TO START',W/2,H*0.72,21,'#ffd23c',16,'center',900);
  ctx.globalAlpha=1;
  if(best>0)txt('BEST '+best,W/2,H*0.72+36,13,'#8fa3c8',0);
}

/* ---------- intro card ---------- */
function drawIntro(){
  const t=stateT/1.05;
  const bx=lerp(-W,0,easeOut(clamp(t*1.7,0,1)));
  ctx.save();ctx.translate(bx,0);
  ctx.fillStyle=withA(cur.color,0.14);
  ctx.beginPath();
  ctx.moveTo(0,H*0.31);ctx.lineTo(W,H*0.37);ctx.lineTo(W,H*0.61);ctx.lineTo(0,H*0.55);
  ctx.closePath();ctx.fill();
  ctx.restore();
  txt('GAME '+(gIdx+1),W/2,H*0.36,15,'#8fa3c8',0,'center',800);
  const nx=lerp(W*1.3,W/2,easeOut(clamp((t-0.06)*1.9,0,1)));
  txt(cur.name,nx,H*0.44,Math.min(W*0.1,40),cur.color,24,'center',900);
  ctx.globalAlpha=clamp((t-0.3)*3,0,1);
  const dl=fitLines(cur.desc,15,W*0.88);
  for(let i=0;i<dl.length;i++)
    txt(dl[i],W/2,H*0.52+(i-(dl.length-1)/2)*20,15,'#dce8ff',0,'center',700);
  ctx.globalAlpha=1;
  ctx.fillStyle=cur.color;ctx.shadowColor=cur.color;ctx.shadowBlur=12;
  ctx.fillRect(W*0.2,H*0.575,W*0.6*clamp(t,0,1),3);
  ctx.shadowBlur=0;
}

/* ---------- judge overlay ---------- */
function drawJudge(){
  cur.draw();
  ctx.fillStyle='rgba(3,4,10,0.45)';ctx.fillRect(0,0,W,H);
  const t=clamp(stateT/0.25,0,1),sc=lerp(1.6,1,easeOut(t));
  ctx.save();ctx.translate(W/2,H*0.42);ctx.scale(sc,sc);
  if(judgeWin)txt('SUCCESS!',0,0,44,'#ffd23c',26,'center',900);
  else txt('FAILED',glitchT>0?rnd(-3,3):0,0,44,'#ff3b5c',22,'center',900);
  ctx.restore();
  if(judgeWin)txt('+'+judgeScore+(judgeMult>1?'  (x'+judgeMult.toFixed(1)+')':''),W/2,H*0.42+46,20,'#fff2c8',10,'center',900);
}

/* ---------- input ---------- */
const pointers=new Map();
function onDown(p){
  if(paused){paused=false;return;}
  if(trans.active)return;
  if(STATE==='title'){sfx('tap');startRun();return;}
  if(STATE==='result'){
    if(retryRect&&inRect(p,retryRect)){
      sfx('tap');burst(p.x,p.y,'#ffd23c',16,220);startRun();
    }
    return;
  }
  if(STATE==='play'&&cur&&cur.down)cur.down(p);
}
function onMove(p){if(STATE==='play'&&!paused&&cur&&cur.move)cur.move(p);}
function onUp(p){if(STATE==='play'&&cur&&cur.up)cur.up(p);}
const px=e=>e.clientX-rectL,py=e=>e.clientY-rectT;
cvs.addEventListener('pointerdown',function(e){
  e.preventDefault();audioInit();
  const id=e.pointerId!==undefined?e.pointerId:0;
  const p={x:px(e),y:py(e),id:id};
  try{if(cvs.setPointerCapture)cvs.setPointerCapture(id);}catch(err){}
  pointers.set(id,p);onDown(p);
},{passive:false});
cvs.addEventListener('pointermove',function(e){
  e.preventDefault();
  const id=e.pointerId!==undefined?e.pointerId:0;
  if(!pointers.has(id))return;
  const p={x:px(e),y:py(e),id:id};
  pointers.set(id,p);onMove(p);
},{passive:false});
function endP(e){
  const id=e.pointerId!==undefined?e.pointerId:0;
  const p=pointers.get(id);pointers.delete(id);
  if(p)onUp(p);
}
cvs.addEventListener('pointerup',endP);
cvs.addEventListener('pointercancel',endP);
cvs.addEventListener('lostpointercapture',endP);
window.addEventListener('contextmenu',function(e){e.preventDefault();});
/* iOS: 더블탭 확대 / 스크롤 바운스 차단 */
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick'].forEach(function(t){
  window.addEventListener(t,function(e){if(e.cancelable)e.preventDefault();},{passive:false});
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&(STATE==='play'||STATE==='intro'))paused=true;
});

/* ---------- update / draw / loop ---------- */
function update(dt){
  for(const s of stars){s.y-=s.sp*dt;if(s.y<-4){s.y=H+4;s.x=rnd(W);}}
  updateFX(dt);updateTrans(dt);
  shakeT=Math.max(0,shakeT-dt);
  flashT=Math.max(0,flashT-dt);
  glitchT=Math.max(0,glitchT-dt);
  if(STATE==='intro'){
    if(stateT>=1.05&&!trans.active)beginPlay();
  }else if(STATE==='play'){
    gameT+=dt;
    const rem=cur.time-gameT;
    if(rem<3&&rem>0){const w2=Math.ceil(rem);if(w2!==lowWhole){lowWhole=w2;sfx('tick');}}
    cur.update(dt);
    if(STATE==='play'&&gameT>=cur.time)endGame(!!cur.timeoutWin);
  }else if(STATE==='judge'){
    if(stateT>=0.85&&!judgeFired){judgeFired=true;afterJudge();}
  }
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(shakeT>0){const k=shakeT/shakeD*shakePow;ctx.translate(rnd(-k,k),rnd(-k,k));}
  if(STATE==='title')drawTitle();
  else if(STATE==='intro'){drawBG(cur.color,now);drawIntro();}
  else if(STATE==='play'){drawBG(cur.color,now);cur.draw();drawHUD();}
  else if(STATE==='judge'){drawBG(cur.color,now);drawJudge();drawHUD();}
  else if(STATE==='result')drawResult();
  drawFX();
  if(flashT>0){
    ctx.globalAlpha=(flashT/flashD)*0.8;
    ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
  if(glitchT>0)drawGlitch();
  if(scanPat){ctx.fillStyle=scanPat;ctx.fillRect(0,0,W,H);}
  drawTrans();
  if(paused)drawPause();
}
let lastT=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!lastT)lastT=ts;
  let dt=(ts-lastT)/1000;lastT=ts;
  if(dt>0.05)dt=0.05;
  if(dt<0)dt=0;
  if(paused){draw();return;}
  now+=dt;stateT+=dt;
  update(dt);
  draw();
}

/* 공용 소도구 */
function _ccw(a,b,c){return (c.y-a.y)*(b.x-a.x)-(b.y-a.y)*(c.x-a.x);}
function _segX(a,b,c,d){
  const d1=_ccw(c,d,a),d2=_ccw(c,d,b),d3=_ccw(a,b,c),d4=_ccw(a,b,d);
  return ((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0));
}
/* 픽셀아트용: 두꺼운 검은 외곽선 박스 */
function pxBox(x,y,w,h,col,ow){
  x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);ow=ow||3;
  ctx.fillStyle='#0b0805';ctx.fillRect(x-ow,y-ow,w+ow*2,h+ow*2);
  ctx.fillStyle=col;ctx.fillRect(x,y,w,h);
}

/* 1. LAG DRIVE — 0.3초 지연 커서로 링 유지 */
const gLag={
  id:'lag',name:'LAG DRIVE',desc:'커서가 0.3초 늦게 따라온다 — 미리 움직여 링 안에 유지!',
  color:'#ff9d2e',time:9,timeoutWin:true,LAG:0.30,ALLOW:1.5,
  init(){
    const P=PLAY();
    this.acc=0;this.timeoutWin=true;
    this.touch=false;
    this.fx=W/2;this.fy=P.y+P.h*0.5;
    this.cx=this.fx;this.cy=this.fy;
    this.buf=[{t:-1,x:this.fx,y:this.fy},{t:0,x:this.fx,y:this.fy}];
    this.offT=0;this.onT=0;this.totT=0.0001;
    this.pha=rnd(TAU);this.phb=rnd(TAU);
    this.R=Math.min(W,P.h)*0.11+22;
    this.warm=1.0;this.trail=[];this.bump=0;
  },
  guide(t){
    const P=PLAY();
    return{
      x:W/2+Math.sin(t*1.15+this.pha)*W*0.30+Math.sin(t*2.35+this.phb)*W*0.055,
      y:P.y+P.h*(0.5+Math.sin(t*0.95+this.phb)*0.28)
    };
  },
  update(dt){
    this.warm=Math.max(0,this.warm-dt);
    this.bump=Math.max(0,this.bump-dt);
    this.buf.push({t:gameT,x:this.fx,y:this.fy});
    const tgt=gameT-this.LAG;
    while(this.buf.length>2&&this.buf[1].t<=tgt)this.buf.shift();
    let sx=this.buf[0].x,sy=this.buf[0].y;
    if(this.buf.length>=2){
      const a=this.buf[0],b=this.buf[1];
      const k=clamp((tgt-a.t)/Math.max(1e-4,b.t-a.t),0,1);
      sx=lerp(a.x,b.x,k);sy=lerp(a.y,b.y,k);
    }
    this.cx=sx;this.cy=sy;
    this.trail.push({x:this.cx,y:this.cy});
    if(this.trail.length>18)this.trail.shift();
    if(this.warm<=0){
      const g=this.guide(gameT);
      const on=this.touch&&dist(this.cx,this.cy,g.x,g.y)<=this.R;
      this.totT+=dt;
      if(on)this.onT+=dt;
      else{
        this.offT+=dt;
        if(this.bump<=0){this.bump=0.34;sfx('warn');vib(12);}
        if(this.offT>=this.ALLOW){
          doShake(11,0.4);doFlash('#ff3b5c',0.15);
          endGame(false);return;
        }
      }
      this.acc=clamp(Math.round(this.onT/this.totT*50),0,50);
    }
  },
  down(p){this.touch=true;this.fx=p.x;this.fy=p.y;},
  move(p){this.fx=p.x;this.fy=p.y;},
  up(){this.touch=false;},
  draw(){
    const P=PLAY(),g=this.guide(gameT);
    const on=this.touch&&dist(this.cx,this.cy,g.x,g.y)<=this.R;
    /* 미래 경로 고스트 */
    ctx.save();ctx.globalAlpha=0.16;ctx.strokeStyle=this.color;ctx.lineWidth=2;
    ctx.setLineDash([4,7]);ctx.beginPath();
    for(let i=0;i<=12;i++){
      const q=this.guide(gameT+i*0.06);
      if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y);
    }
    ctx.stroke();ctx.setLineDash([]);ctx.restore();
    /* 타깃 링 */
    ctx.save();ctx.globalAlpha=0.4;
    ctx.strokeStyle=on?'#7dffb0':this.color;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(g.x,g.y,this.R,0,TAU);ctx.stroke();
    ctx.restore();
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='#fff';ctx.shadowColor=this.color;ctx.shadowBlur=20;
    ctx.beginPath();ctx.arc(g.x,g.y,8+Math.sin(now*7)*1.2,0,TAU);ctx.fill();
    /* 지연 커서 트레일 */
    for(let i=0;i<this.trail.length;i++){
      const q=this.trail[i],a=i/this.trail.length;
      ctx.globalAlpha=a*0.35;ctx.fillStyle=this.color;
      ctx.beginPath();ctx.arc(q.x,q.y,6*a,0,TAU);ctx.fill();
    }
    ctx.globalAlpha=1;
    if(this.touch){
      ctx.globalAlpha=0.2;ctx.strokeStyle='#8fa3c8';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(this.fx,this.fy,13,0,TAU);ctx.stroke();
      ctx.globalAlpha=0.13;
      ctx.beginPath();ctx.moveTo(this.fx,this.fy);ctx.lineTo(this.cx,this.cy);ctx.stroke();
      ctx.globalAlpha=1;
      ctx.fillStyle=on?'#a8ffd2':this.color;ctx.shadowColor=this.color;ctx.shadowBlur=18;
      ctx.beginPath();ctx.arc(this.cx,this.cy,11,0,TAU);ctx.fill();
    }
    ctx.restore();ctx.shadowBlur=0;
    /* 이탈 허용 게이지 */
    const bw=Math.min(W*0.5,210),bx=W/2-bw/2,by=P.y+20;
    const left=clamp(1-this.offT/this.ALLOW,0,1);
    ctx.fillStyle='rgba(255,255,255,0.10)';rr(bx,by,bw,7,4);ctx.fill();
    ctx.fillStyle=left>0.4?this.color:'#ff3b5c';
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=left>0.4?0:10;
    rr(bx,by,bw*left,7,4);ctx.fill();ctx.shadowBlur=0;
    txt('SIGNAL',W/2,by-11,10,'#8fa3c8',0,'center',800);
    if(!this.touch){
      ctx.globalAlpha=0.6+0.4*Math.sin(now*5);
      txt(this.warm>0?'화면을 드래그!':'놓치면 신호가 끊긴다!',W/2,P.y+P.h-26,16,this.color,10,'center',900);
      ctx.globalAlpha=1;
    }
  }
};

/* 2. KEYTURN — 열쇠를 돌려 홈에 정렬 */
const gTurn={
  id:'turn',name:'KEYTURN',desc:'열쇠를 돌려 홈에 맞춰라 — 자물쇠 3개 전부 열기',
  color:'#8ad7ff',time:9,timeoutWin:false,
  TOLS:[0.26,0.21,0.17],HOLD:0.3,
  init(){
    this.acc=0;this.timeoutWin=false;
    this.round=0;this.solved=0;this.swap=0;this.flash=0;
    this.drag=false;this.lastA=0;this.spin=0;
    this.newLock();
  },
  newLock(){
    this.tol=this.TOLS[this.round]||0.17;
    this.target=rnd(TAU);
    this.ang=this.target+(Math.random()<0.5?-1:1)*rnd(1.0,2.5);
    this.hold=0;this.locked=false;
  },
  geo(){const P=PLAY();return{x:W/2,y:P.y+P.h*0.45,r:Math.min(W*0.30,P.h*0.24)};},
  diff(){
    let d=(this.ang-this.target)%TAU;
    while(d>Math.PI)d-=TAU;
    while(d<-Math.PI)d+=TAU;
    return d;
  },
  update(dt){
    this.flash=Math.max(0,this.flash-dt);
    if(this.swap>0){
      this.swap-=dt;
      if(this.swap<=0){
        if(this.round>=3){this.acc=50;endGame(true);return;}
        this.newLock();
      }
      return;
    }
    if(this.locked)return;
    const d=Math.abs(this.diff());
    if(d<=this.tol){
      this.hold+=dt;
      if(this.hold>=this.HOLD){
        this.locked=true;this.round++;this.solved++;
        const G=this.geo();
        sfx('good');vib(20);doFlash(this.color,0.13);doShake(6,0.22);
        burst(G.x,G.y,this.color,34,330,3.4,0.7);
        ringFX(G.x,G.y,'#ffd23c',G.r*0.5,G.r*2.1,0.55,5);

        this.flash=0.45;this.swap=0.5;
      }
    }else this.hold=Math.max(0,this.hold-dt*1.7);
  },
  aOf(p){const G=this.geo();return Math.atan2(p.y-G.y,p.x-G.x);},
  down(p){
    if(this.locked||this.swap>0)return;
    this.drag=true;this.lastA=this.aOf(p);
  },
  move(p){
    if(!this.drag||this.locked||this.swap>0)return;
    const a=this.aOf(p);
    let d=a-this.lastA;
    while(d>Math.PI)d-=TAU;
    while(d<-Math.PI)d+=TAU;
    this.ang+=d;this.spin=d;this.lastA=a;
  },
  up(){this.drag=false;},
  drawKey(G,ang,col,glow){
    ctx.save();ctx.translate(G.x,G.y);ctx.rotate(ang);
    ctx.strokeStyle=col;ctx.fillStyle=col;
    if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow;}
    ctx.lineWidth=8;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-G.r*0.30,0);ctx.lineTo(G.r*0.86,0);ctx.stroke();

    ctx.beginPath();ctx.moveTo(G.r*0.52,0);ctx.lineTo(G.r*0.52,-G.r*0.26);ctx.stroke();
    ctx.beginPath();ctx.moveTo(G.r*0.74,0);ctx.lineTo(G.r*0.74,-G.r*0.17);ctx.stroke();
    /* 손잡이 */
    ctx.lineWidth=6;

  draw(){

    ctx.beginPath();ctx.arc(G.x,G.y,G.r*1.15,0,TAU);ctx.stroke();
    ctx.strokeStyle=withA('#9fb4d8',0.18);ctx.lineWidth=1;
    for(let i=0;i<24;i++){
      const a=i*TAU/24;
      ctx.beginPath();
      ctx.moveTo(G.x+Math.cos(a)*G.r*1.15,G.y+Math.sin(a)*G.r*1.15);
      ctx.lineTo(G.x+Math.cos(a)*G.r*1.26,G.y+Math.sin(a)*G.r*1.26);
      ctx.stroke();
    }
    /* 목표 홈(슬롯) */
    const zc=this.locked?'#7dffb0':(near?'#ffd23c':this.color);
    ctx.globalAlpha=0.9;
    ctx.strokeStyle=zc;ctx.lineWidth=4;ctx.shadowColor=zc;ctx.shadowBlur=near?16:8;
    ctx.beginPath();
    ctx.arc(G.x,G.y,G.r*1.05,this.target-this.tol,this.target+this.tol);ctx.stroke();
    ctx.shadowBlur=0;
    /* 홈 안쪽 채움 */
    ctx.globalAlpha=0.14;ctx.fillStyle=zc;
    ctx.beginPath();ctx.moveTo(G.x,G.y);
    ctx.arc(G.x,G.y,G.r*1.05,this.target-this.tol,this.target+this.tol);
    ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;ctx.restore();
    /* 열쇠 */
    this.drawKey(G,this.ang,this.locked?'#7dffb0':(near?'#ffd23c':'#e8f2ff'),near?18:8);
    /* 홀드 진행 링 */
    if(this.hold>0&&!this.locked){
      ctx.save();
      ctx.strokeStyle='#ffd23c';ctx.lineWidth=5;ctx.lineCap='round';
      ctx.shadowColor='#ffd23c';ctx.shadowBlur=12;
      ctx.beginPath();

    this.tR=Math.min(W*0.155,86);

    this.ty=P.y+P.h*0.30;
    this.samples=[];
    this.reset();
  },
  reset(){
    const P=PLAY();
    this.px=W/2;this.py=P.y+P.h-78;
    this.vx=0;this.vy=0;this.rolling=false;this.trail=[];
  },
  finish(){
    this.acc=this.hits>=3?50:this.hits*20;
    endGame(this.hits>=2);
  },
  judge(){
    const d=dist(this.px,this.py,this.tx,this.ty);
    const ok=d<=this.tR-6;
    this.left--;
    if(ok){
      this.hits++;
      burst(this.px,this.py,'#ffd23c',40,330,3.6,0.8);
      ringFX(this.tx,this.ty,this.color,this.tR*0.4,this.tR*2.2,0.6,5);
      sfx('good');vib(20);this.msg='IN! '+this.hits+'/2';this.msgT=0.7;
      doFlash(this.color,0.1);
    }else{
      burst(this.px,this.py,'#ff5b74',16,180,2.6,0.5);
      sfx('warn');vib(30);doShake(5,0.2);
      this.msg=d>this.tR?(this.py<this.ty?'너무 셌다':'모자란다'):'아깝다';
      this.msgT=0.7;
    }
    if(this.hits>=2){this.wait=0.42;this.done=true;return;}
    if(this.left<=0){this.wait=0.42;this.done=true;return;}
    this.wait=0.42;
  },
  update(dt){
    this.msgT=Math.max(0,this.msgT-dt);
    if(this.wait>0){
      this.wait-=dt;
      if(this.wait<=0){
        if(this.done){this.finish();return;}
        this.reset();
      }
      return;
    }
    if(!this.rolling)return;
    const P=PLAY();
    const f=Math.exp(-this.FRIC*dt);
    this.vx*=f;this.vy*=f;
    this.px+=this.vx*dt;this.py+=this.vy*dt;
    const pad=16;
    if(this.px<pad){this.px=pad;this.vx=-this.vx*0.55;}
    if(this.px>W-pad){this.px=W-pad;this.vx=-this.vx*0.55;}
    if(this.py<P.y+pad){this.py=P.y+pad;this.vy=-this.vy*0.55;}
    if(this.py>P.y+P.h-pad){this.py=P.y+P.h-pad;this.vy=-this.vy*0.55;}
    this.trail.push({x:this.px,y:this.py});
    if(this.trail.length>22)this.trail.shift();
    if(Math.hypot(this.vx,this.vy)<this.STOP){
      this.vx=0;this.vy=0;this.rolling=false;this.judge();
    }
  },
  down(p){if(this.wait<=0&&!this.rolling)this.samples=[{t:now,x:p.x,y:p.y}];},
  move(p){
    if(this.rolling||this.wait>0)return;
    this.samples.push({t:now,x:p.x,y:p.y});
    if(this.samples.length>10)this.samples.shift();
  },
  up(p){
    if(this.rolling||this.wait>0||this.samples.length<2)return;
    const s=this.samples,b=s[s.length-1];
    let a=s[0];
    for(let i=s.length-1;i>=0;i--){
      if(b.t-s[i].t<=0.12)a=s[i];else break;
    }
    const dtv=Math.max(0.016,b.t-a.t);
    let vx=(b.x-a.x)/dtv,vy=(b.y-a.y)/dtv;
    const sp=Math.hypot(vx,vy);
    /* 손떨림/짧은 탭은 발사로 치지 않는다 */
    if(sp<200||Math.hypot(b.x-a.x,b.y-a.y)<14){this.samples=[];return;}
    const cap=Math.min(sp,2400)/sp;
    this.vx=vx*cap;this.vy=vy*cap;
    this.rolling=true;this.samples=[];
    sfx('tap');vib(10);
    burst(this.px,this.py,this.color,12,140,2.2,0.35);
  },
  draw(){
    const P=PLAY();
    /* 목표 링 */
    ctx.save();
    ctx.globalAlpha=0.16;ctx.fillStyle=this.color;
    ctx.beginPath();ctx.arc(this.tx,this.ty,this.tR,0,TAU);ctx.fill();
    ctx.globalAlpha=0.9;ctx.strokeStyle=this.color;ctx.lineWidth=3;
    ctx.shadowColor=this.color;ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(this.tx,this.ty,this.tR,0,TAU);ctx.stroke();
    ctx.globalAlpha=0.4;ctx.lineWidth=1.5;ctx.setLineDash([5,7]);
    ctx.beginPath();ctx.arc(this.tx,this.ty,this.tR*0.45,0,TAU);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();ctx.shadowBlur=0;
    /* 트레일 */
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=0;i<this.trail.length;i++){
      const q=this.trail[i],a=i/this.trail.length;
      ctx.globalAlpha=a*0.32;ctx.fillStyle=this.color;
      ctx.beginPath();ctx.arc(q.x,q.y,9*a,0,TAU);ctx.fill();
    }
    ctx.restore();ctx.globalAlpha=1;
    /* 퍽 */
    ctx.save();
    ctx.fillStyle='#f5faff';ctx.shadowColor=this.color;ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(this.px,this.py,13,0,TAU);ctx.fill();
    ctx.fillStyle=this.color;
    ctx.beginPath();ctx.arc(this.px,this.py,6,0,TAU);ctx.fill();
    ctx.restore();ctx.shadowBlur=0;
    /* 남은 발 */
    for(let i=0;i<3;i++){
      const x=W/2+(i-1)*24,y=P.y+22;
      ctx.fillStyle=i<this.left?this.color:'#2a3350';
      ctx.beginPath();ctx.arc(x,y,6,0,TAU);ctx.fill();
    }
    txt('IN '+this.hits+' / 2',W/2,P.y+44,12,'#9fb4d8',0,'center',800);
    if(this.msgT>0){
      ctx.globalAlpha=clamp(this.msgT/0.7,0,1);
      txt(this.msg,W/2,this.ty,20,'#ffd23c',12,'center',900);
      ctx.globalAlpha=1;
    }
    if(!this.rolling&&this.wait<=0&&this.left===3){
      ctx.globalAlpha=0.6+0.4*Math.sin(now*5);
      txt('위로 튕겨! (세기 조절)',W/2,P.y+P.h-26,15,this.color,10,'center',900);
      ctx.globalAlpha=1;
    }
  }
};

/* 4. TUNNEL — 가림막 뒤 위치 예측 */
const gTunnel={
  id:'tunnel',name:'TUNNEL',desc:'가림막 뒤로 사라진 빛이 골라인에 닿는 순간 탭! (3회 중 2회)',
  color:'#b47cff',time:9,timeoutWin:false,
  init(){

  newRun(){

  },
  hidden(){return this.x>this.c0&&this.x<this.c1;},
  resolve(ok){
    this.round++;
    if(ok)this.hits++;
    this.reveal=0.72;this.wait=0.72;this.res=ok?'HIT':'MISS';

      burst(this.goal,this.y,'#ffd23c',38,320,3.5,0.75);

  update(dt){
    if(this.wait>0){
      this.reveal=Math.max(0,this.reveal-dt);

        if(this.round>=3){this.acc=this.hits*15;endGame(false);return;}
        this.newRun();
      }
      return;
    }
    this.x+=this.dir*this.sp*dt;
    const past=this.dir>0?this.x>this.c1+18:this.x<this.c0-18;
    if(past&&!this.tapped)this.resolve(false);
  },
  down(){

  draw(){

    ctx.beginPath();ctx.moveTo(0,ty);ctx.lineTo(W,ty);ctx.stroke();

    /* 빛(가림막 밖에서만) */
    if(!this.hidden()||this.reveal>0){
      ctx.save();ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=this.hidden()?clamp(this.reveal/0.72,0,1):1;
      ctx.fillStyle='#fff';ctx.shadowColor=this.color;ctx.shadowBlur=24;
      ctx.beginPath();ctx.arc(this.x,ty,11,0,TAU);ctx.fill();
      ctx.globalAlpha*=0.4;ctx.fillStyle=this.color;

        ctx.beginPath();ctx.arc(this.x-this.dir*i*11,ty,9-i*1.6,0,TAU);ctx.fill();
      }
      ctx.restore();ctx.globalAlpha=1;ctx.shadowBlur=0;
    }
    /* 가림막 */
    ctx.save();
    const cw=this.c1-this.c0;
    ctx.fillStyle='#0a0c16';
    ctx.fillRect(this.c0,P.y+P.h*0.14,cw,P.h*0.66);
    ctx.globalAlpha=0.5;ctx.strokeStyle=withA(this.color,0.5);ctx.lineWidth=2;
    ctx.strokeRect(this.c0,P.y+P.h*0.14,cw,P.h*0.66);
    ctx.globalAlpha=0.10;ctx.strokeStyle=this.color;ctx.lineWidth=1;
    for(let x=this.c0+8;x<this.c1;x+=14){
      ctx.beginPath();ctx.moveTo(x,P.y+P.h*0.14);ctx.lineTo(x,P.y+P.h*0.80);ctx.stroke();
    }
    ctx.restore();ctx.globalAlpha=1;
    /* 골라인 */
    ctx.save();
    ctx.strokeStyle='#ffd23c';ctx.lineWidth=3;ctx.shadowColor='#ffd23c';ctx.shadowBlur=14;
    ctx.beginPath();ctx.moveTo(this.goal,ty-40);ctx.lineTo(this.goal,ty+40);ctx.stroke();
    ctx.restore();ctx.shadowBlur=0;
    txt('▼',this.goal,ty-52,14,'#ffd23c',8,'center',900);
    /* 결과 */
    if(this.reveal>0){
      ctx.globalAlpha=clamp(this.reveal/0.72,0,1);
      txt(this.res,this.goal,ty+64,20,this.res==='HIT'?'#7dffb0':'#ff5b74',10,'center',900);
      ctx.globalAlpha=1;
    }
    /* 진행 */
    for(let i=0;i<3;i++){
      const x=W/2+(i-1)*24,y=P.y+22;
      ctx.fillStyle=i<this.hits?this.color:'#2a3350';
      ctx.beginPath();ctx.arc(x,y,6,0,TAU);ctx.fill();
    }
    txt('HIT '+this.hits+' / 2',W/2,P.y+44,12,'#9fb4d8',0,'center',800);
    if(this.round===0&&!this.tapped){
      ctx.globalAlpha=0.6+0.4*Math.sin(now*5);
      txt('보이지 않아도 계속 달린다',W/2,P.y+P.h-26,15,this.color,10,'center',900);
      ctx.globalAlpha=1;
    }
  }
};

/* 6. ONE STROKE — 한 붓 그리기 */
const gStroke={
  id:'stroke',name:'ONE STROKE',desc:'떼지 말고 7개 점을 모두 잇기 — 지나온 선과 교차 금지!',
  color:'#00e5ff',time:10,timeoutWin:false,
  N:7,
  init(){
    const P=PLAY();
    this.acc=0;this.timeoutWin=false;
    this.pts=[];
    const x0=W*0.14,x1=W*0.86;
    const y0=P.y+78,y1=P.y+P.h-96;
    const minD=Math.min(W*0.17,66);
    for(let i=0;i<this.N;i++){
      const slot=(i+0.5)/this.N;
      let px2=0,py2=0,tries=0;
      do{
        px2=lerp(x0,x1,clamp(slot+rnd(-0.05,0.05),0,1));
        py2=rnd(y0,y1);tries++;
      }while(tries<50&&this.pts.some(function(q){return dist(q.x,q.y,px2,py2)<minD;}));
      this.pts.push({x:px2,y:py2,on:false});
    }
    this.segs=[];this.chain=[];this.drawing=false;
    this.fx=W/2;this.fy=P.y+P.h*0.5;
    this.bad=0;this.cross=0;this.resets=0;
    this.R=Math.min(W*0.085,36);
  },
  update(dt){this.bad=Math.max(0,this.bad-dt);},
  tryTake(i){
    const p=this.pts[i];
    if(p.on)return;
    if(this.chain.length>0){
      const a=this.pts[this.chain[this.chain.length-1]];
      for(let s=0;s<this.segs.length-1;s++){
        if(_segX(a,p,this.segs[s].a,this.segs[s].b)){
          if(this.bad<=0){
            this.bad=0.4;this.cross++;
            sfx('warn');vib(25);doShake(5,0.2);
            pop('교차!',p.x,p.y-26,'#ff5b74',18);
          }
          return;
        }
      }
      this.segs.push({a:a,b:p});
    }
    p.on=true;this.chain.push(i);
    sfx('tick');vib(8);
    burst(p.x,p.y,this.color,12,150,2.4,0.4);
    ringFX(p.x,p.y,this.color,6,42,0.4,3);
    if(this.chain.length>=this.N){
      this.acc=clamp(50-this.cross*6-this.resets*9,0,50);
      sfx('good');doFlash(this.color,0.14);
      endGame(true);
    }
  },
  probe(p){
    this.fx=p.x;this.fy=p.y;
    for(let i=0;i<this.pts.length;i++){
      const q=this.pts[i];
      if(!q.on&&dist(p.x,p.y,q.x,q.y)<=this.R){this.tryTake(i);break;}
    }
  },
  down(p){this.drawing=true;this.probe(p);},
  move(p){if(this.drawing)this.probe(p);},
  up(){
    this.drawing=false;
    if(this.chain.length>0&&this.chain.length<this.N){
      this.resets++;
      for(const q of this.pts)q.on=false;
      this.segs=[];this.chain=[];
      sfx('flip');vib(20);
      pop('다시!',W/2,PLAY().y+PLAY().h*0.5,'#ff5b74',22);
    }
  },
  draw(){
    const P=PLAY();
    /* 그린 선 */
    ctx.save();
    ctx.strokeStyle=this.color;ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.shadowColor=this.color;ctx.shadowBlur=12;
    ctx.beginPath();
    for(let i=0;i<this.chain.length;i++){
      const q=this.pts[this.chain[i]];
      if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y);
    }
    ctx.stroke();
    /* 손가락까지 미리보기 */
    if(this.drawing&&this.chain.length>0){
      const a=this.pts[this.chain[this.chain.length-1]];
      ctx.globalAlpha=0.35;ctx.setLineDash([5,7]);ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(this.fx,this.fy);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    ctx.restore();ctx.shadowBlur=0;
    /* 점 */
    for(let i=0;i<this.pts.length;i++){
      const q=this.pts[i];
      const isLast=this.chain.length&&this.chain[this.chain.length-1]===i;
      ctx.save();
      if(q.on){
        ctx.fillStyle=isLast?'#ffd23c':this.color;
        ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=isLast?18:10;
        ctx.beginPath();ctx.arc(q.x,q.y,isLast?11:8,0,TAU);ctx.fill();
      }else{
        ctx.strokeStyle=this.color;ctx.lineWidth=2.5;
        ctx.globalAlpha=0.85;
        ctx.beginPath();ctx.arc(q.x,q.y,9,0,TAU);ctx.stroke();
        ctx.globalAlpha=0.25;ctx.fillStyle=this.color;
        ctx.beginPath();ctx.arc(q.x,q.y,9,0,TAU);ctx.fill();
      }
      ctx.restore();ctx.shadowBlur=0;
    }
    if(this.bad>0){
      ctx.save();ctx.globalAlpha=this.bad/0.4*0.18;
      ctx.fillStyle='#ff3b5c';ctx.fillRect(0,P.y,W,P.h);ctx.restore();
    }
    txt(this.chain.length+' / '+this.N,W/2,P.y+22,15,'#dce8ff',0,'center',900);
    if(this.chain.length===0){
      ctx.globalAlpha=0.6+0.4*Math.sin(now*5);
      txt('점을 훑어라 — 떼면 처음부터',W/2,P.y+P.h-26,15,this.color,10,'center',900);
      ctx.globalAlpha=1;
    }
  }
};

/* 7. FORGE — 대장간 두드리기 (16bit 픽셀아트) */
const gForge={
  id:'forge',name:'FORGE',desc:'두드려! 커서가 초록 존에 든 순간 탭 — PERFECT 2회로 승리',
  color:'#ff5a2e',time:5,timeoutWin:false,
  SPD:1.0,PW:0.075,GW:0.17,COOL:0.5,NEED:2,
  init(){
    this.acc=0;this.timeoutWin=false;
    this.perfect=0;this.good=0;this.miss=0;
    this.k=rnd(0.2,0.8);this.dir=Math.random()<0.5?1:-1;
    this.zone=rnd(0.22,0.78);
    this.cool=0;this.swing=0;this.heat=1;
    this.fbT=0;this.fbType='';this.fbK=0;
    this.sparks=[];
  },
  newZone(){
    let z;
    do{z=rnd(0.20,0.80);}while(Math.abs(z-this.zone)<0.16);
    this.zone=z;
  },
  update(dt){
    this.cool=Math.max(0,this.cool-dt);
    this.swing=Math.max(0,this.swing-dt);
    this.fbT=Math.max(0,this.fbT-dt);
    this.heat=clamp(this.heat-dt*0.06,0.25,1.6);
    this.k+=this.dir*this.SPD*2*dt;
    if(this.k>1){this.k=1-(this.k-1);this.dir=-1;}
    if(this.k<0){this.k=-this.k;this.dir=1;}
    for(let i=this.sparks.length-1;i>=0;i--){
      const s=this.sparks[i];
      s.life-=dt;
      if(s.life<=0){this.sparks.splice(i,1);continue;}
      s.vy+=520*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    }
  },
  spark(x,y,n,col,pow){
    for(let i=0;i<n;i++){
      const a=-Math.PI/2+rnd(-1.1,1.1);
      const s=rnd(0.4,1)*pow;
      this.sparks.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.25,0.6),col:col});
    }
  },
  bar(){
    const P=PLAY();
    const bw=Math.min(W*0.84,330),bh=30;
    return{x:W/2-bw/2,y:P.y+P.h-bh-42,w:bw,h:bh};
  },
  anvil(){
    const P=PLAY();
    return{x:W/2,y:P.y+P.h*0.50,u:Math.max(3,Math.round(Math.min(W,P.h)/52))};
  },
  down(){
    if(this.cool>0)return;
    this.cool=this.COOL;this.swing=0.26;
    const A=this.anvil();
    const d=Math.abs(this.k-this.zone);
    let kind;
    if(d<=this.PW)kind='perfect';
    else if(d<=this.GW)kind='good';
    else kind='miss';
    this.fbT=0.55;this.fbType=kind;this.fbK=this.k;
    if(kind==='perfect'){
      this.perfect++;this.heat=Math.min(1.6,this.heat+0.45);
      beep(180,0.09,'square',0.18,-90);
      beep(1180,0.16,'triangle',0.13,420);
      vib(35);doShake(9,0.32);doFlash('#ffd23c',0.16);
      burst(A.x,A.y-A.u*3,'#ffd23c',44,380,3.8,0.8);
      ringFX(A.x,A.y-A.u*3,'#ffd23c',10,W*0.55,0.55,6);
      this.spark(A.x,A.y-A.u*3,26,'#ffe9a8',560);
      pop('PERFECT!',A.x,A.y-A.u*10,'#ffd23c',24);
      if(this.perfect>=this.NEED){
        this.acc=clamp(this.perfect*20+this.good*6,0,50);
        endGame(true);return;
      }
    }else if(kind==='good'){
      this.good++;this.heat=Math.min(1.6,this.heat+0.16);
      beep(200,0.08,'square',0.15,-70);
      vib(18);doShake(4,0.18);
      this.spark(A.x,A.y-A.u*3,12,'#ff9d2e',360);
      pop('GOOD',A.x,A.y-A.u*10,'#ff9d2e',20);
    }else{
      this.miss++;this.heat=Math.max(0.25,this.heat-0.3);
      beep(90,0.26,'sawtooth',0.16,-40);
      vib(30);doShake(6,0.2);
      pop('MISS',A.x,A.y-A.u*10,'#7b8497',18);
    }
    this.newZone();
  },
  drawAnvil(){
    const A=this.anvil(),u=A.u;
    const sw=this.swing>0?easeOut(1-this.swing/0.26):1;
    /* 바닥 그림자 */
    ctx.save();ctx.globalAlpha=0.35;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(A.x,A.y+u*7.2,u*11,u*2.2,0,0,TAU);ctx.fill();ctx.restore();
    /* 모루 */
    pxBox(A.x-u*4,A.y+u*3,u*8,u*4,'#3a4152');            /* 받침 */
    pxBox(A.x-u*2.2,A.y+u*0.5,u*4.4,u*2.6,'#4a5265');    /* 허리 */
    pxBox(A.x-u*8,A.y-u*2,u*16,u*3,'#5b6478');           /* 상판 */
    pxBox(A.x+u*7,A.y-u*1.4,u*3.4,u*1.8,'#5b6478');      /* 뿔 */
    pxBox(A.x-u*8,A.y-u*2,u*16,u*0.9,'#79839a');         /* 하이라이트 */
    /* 달궈진 검 */
    const h=clamp(this.heat,0,1.6);
    const core=h>1.1?'#fff6d0':h>0.75?'#ffd23c':h>0.45?'#ff7a1e':'#8c3a20';
    const edge=h>0.75?'#ff9d2e':'#6b2c18';
    pxBox(A.x-u*7,A.y-u*3.6,u*13,u*1.7,edge);
    pxBox(A.x-u*7,A.y-u*3.2,u*13,u*0.9,core);
    pxBox(A.x+u*5.8,A.y-u*4.0,u*1.6,u*2.5,'#6a5030');    /* 손잡이 */
    if(h>0.7){
      ctx.save();ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=clamp((h-0.7)*0.7,0,0.5);
      ctx.fillStyle=core;ctx.shadowColor=core;ctx.shadowBlur=22;
      ctx.fillRect(A.x-u*7,A.y-u*3.6,u*13,u*1.7);
      ctx.restore();ctx.shadowBlur=0;
    }
    /* 망치(피벗 회전) */
    const rest=-1.05,hit=0.22;
    const ang=this.swing>0?lerp(rest,hit,sw):lerp(hit,rest,clamp(this.cool/this.COOL,0,1));
    ctx.save();
    ctx.translate(A.x+u*7.5,A.y-u*7);
    ctx.rotate(ang);
    pxBox(0,-u*0.5,u*7,u*1.1,'#8a6a3c');                 /* 자루 */
    pxBox(u*6.2,-u*2.1,u*3.4,u*4.2,'#7d879b');           /* 머리 */
    pxBox(u*6.2,-u*2.1,u*3.4,u*1.1,'#a5aec0');
    ctx.restore();
  },
  drawBar(){
    const B=this.bar();
    /* 프레임 */
    pxBox(B.x,B.y,B.w,B.h,'#1a1008',4);
    ctx.fillStyle='#3a2416';
    ctx.fillRect(Math.round(B.x),Math.round(B.y),Math.round(B.w),4);
    ctx.fillRect(Math.round(B.x),Math.round(B.y+B.h-4),Math.round(B.w),4);
    const iy=B.y+4,ih=B.h-8;
    /* GOOD / PERFECT 존 */
    const gx=B.x+B.w*clamp(this.zone-this.GW,0,1);
    const gw=B.w*(Math.min(1,this.zone+this.GW)-Math.max(0,this.zone-this.GW));
    ctx.fillStyle='#c58b1a';ctx.fillRect(Math.round(gx),Math.round(iy),Math.round(gw),Math.round(ih));
    ctx.fillStyle='#ffd23c';ctx.fillRect(Math.round(gx),Math.round(iy),Math.round(gw),3);
    const px2=B.x+B.w*clamp(this.zone-this.PW,0,1);
    const pw=B.w*(Math.min(1,this.zone+this.PW)-Math.max(0,this.zone-this.PW));
    ctx.fillStyle='#1f7a3d';ctx.fillRect(Math.round(px2),Math.round(iy),Math.round(pw),Math.round(ih));
    ctx.fillStyle='#39ff88';ctx.fillRect(Math.round(px2),Math.round(iy),Math.round(pw),3);
    /* 쿨다운(재장전) */
    if(this.cool>0){
      const k=1-this.cool/this.COOL;
      ctx.save();ctx.globalAlpha=0.55;
      ctx.fillStyle='#05060c';
      ctx.fillRect(Math.round(B.x+B.w*k),Math.round(iy),Math.round(B.w*(1-k)),Math.round(ih));
      ctx.restore();
      ctx.fillStyle='#ff5a2e';
      ctx.fillRect(Math.round(B.x),Math.round(B.y+B.h+5),Math.round(B.w*k),4);
      txt('RELOAD',W/2,B.y+B.h+22,10,'#c98a6a',0,'center',800);
    }else{
      ctx.fillStyle='#39ff88';
      ctx.fillRect(Math.round(B.x),Math.round(B.y+B.h+5),Math.round(B.w),4);
      ctx.globalAlpha=0.6+0.4*Math.sin(now*7);
      txt('READY',W/2,B.y+B.h+22,10,'#7dffb0',0,'center',800);
      ctx.globalAlpha=1;
    }
    /* 커서 */
    const cx=B.x+B.w*this.k;
    pxBox(cx-3,B.y-5,6,B.h+10,this.cool>0?'#8a8f9c':'#ffffff',3);
    /* 마지막 판정 위치 */
    if(this.fbT>0){
      const fx=B.x+B.w*this.fbK;
      ctx.save();ctx.globalAlpha=clamp(this.fbT/0.55,0,1);
      const c=this.fbType==='perfect'?'#39ff88':this.fbType==='good'?'#ffd23c':'#ff5b74';
      ctx.fillStyle=c;ctx.fillRect(Math.round(fx-1),Math.round(B.y-14),3,10);
      ctx.restore();
    }
  },
  draw(){
    const P=PLAY();
    /* 대장간 배경 */
    ctx.save();
    ctx.fillStyle='#140d0a';ctx.fillRect(0,P.y,W,P.h);
    const fy=P.y+P.h*0.62;
    ctx.fillStyle='#241713';ctx.fillRect(0,fy,W,P.y+P.h-fy);
    ctx.fillStyle='#1b100d';
    for(let x=0;x<W;x+=40)ctx.fillRect(x,fy,20,P.y+P.h-fy);
    /* 화로 불빛 */
    const gl=ctx.createRadialGradient(W*0.5,fy-20,10,W*0.5,fy-20,W*0.75);
    gl.addColorStop(0,'rgba(255,110,30,'+(0.16+0.05*Math.sin(now*5)).toFixed(3)+')');
    gl.addColorStop(1,'rgba(255,110,30,0)');
    ctx.fillStyle=gl;ctx.fillRect(0,P.y,W,P.h);
    ctx.restore();
    this.drawAnvil();
    /* 픽셀 불티 */
    ctx.save();
    for(const s of this.sparks){
      ctx.globalAlpha=clamp(s.life*2.2,0,1);
      ctx.fillStyle=s.col;
      ctx.fillRect(Math.round(s.x),Math.round(s.y),3,3);
    }
    ctx.restore();ctx.globalAlpha=1;
    this.drawBar();
    /* PERFECT 카운터 */
    const P2=PLAY();
    for(let i=0;i<this.NEED;i++){
      const x=W/2+(i-(this.NEED-1)/2)*26,y=P2.y+22;
      pxBox(x-8,y-8,16,16,i<this.perfect?'#39ff88':'#2a2018',3);
      if(i<this.perfect){
        ctx.fillStyle='#0b0805';ctx.fillRect(Math.round(x-3),Math.round(y-3),6,6);
      }
    }
    txt('PERFECT '+Math.min(this.perfect,this.NEED)+' / '+this.NEED,W/2,P2.y+46,12,'#ffb98a',0,'center',800);
    if(this.perfect===0&&this.good===0&&this.miss===0){
      ctx.globalAlpha=0.6+0.4*Math.sin(now*6);
      txt('두드려!',W/2,P2.y+P2.h*0.20,26,'#ffd23c',14,'center',900);
      ctx.globalAlpha=1;
    }
  }
};

/* ---------- debug / headless hooks ---------- */
window.__MMS={
  GAMES:GAMES,
  get state(){return STATE;},
  get results(){return results;},
  get total(){return total;},
  startRun:startRun,
  reset:function(){
    trans.active=false;trans.mid=null;paused=false;
    parts.length=0;rings.length=0;pops.length=0;pointers.clear();
    STATE='title';stateT=0;
  },
  forceGame:function(i){
    trans.active=false;trans.mid=null;judgeFired=true;paused=false;
    parts.length=0;rings.length=0;pops.length=0;pointers.clear();
    order=GAMES.map(function(_,k){return k;});
    results=[];gIdx=i;cur=GAMES[i];cur.init();
    gameT=0;lowWhole=99;STATE='play';stateT=0;
  },
  pointer:function(type,x,y,id){
    id=id===undefined?1:id;
    const p={x:x,y:y,id:id};
    if(type==='down'){pointers.set(id,p);onDown(p);}
    else if(type==='move'){pointers.set(id,p);onMove(p);}
    else{pointers.delete(id);onUp(p);}
  },
  tick:function(dt){now+=dt;stateT+=dt;update(dt);draw();},
  resize:resize
};

/* ---------- boot ---------- */
resize();
requestAnimationFrame(frame);
