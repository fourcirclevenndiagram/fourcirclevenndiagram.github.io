function nextTerm(){const r=G.school.report,gradIds=new Set(r.graduates.map(x=>x.id));G.students=G.students.filter(s=>!gradIds.has(s.id));for(const a of G.students)a.year++;const target=+G.config.students,seeded=new Seeded(G.school.seed+'-'+G.school.year+'-'+G.school.term+'-NEW'),newcomers=[];while(G.students.length<target){const n=makeStudent(G.nextId+G.students.length,seeded);n.year=1;n.age=11+seeded.int(2);n.goal='새 학교에 적응';n.activity='입학 안내를 따라 이동';if(G.alumni.length&&seeded.next()<.18){const ancestor=seeded.pick(G.alumni);n.name=n.name.split(' ')[0]+' '+ancestor.name.split(' ').slice(-1)[0];n.secret=`유명 졸업생 ${ancestor.name}의 후배 친족이라는 사실을 부담스러워한다`}newcomers.push(n);G.students.push(n)}if(r.graduates.length&&newcomers.length){const heir=seeded.pick(newcomers),legacy=seeded.pick(r.graduates),item=legacy.items?.[0]||'낡은 마법 도구';heir.items.push(item);remember(heir,null,'유산 계승',12,`${legacy.name}이 남긴 ${item}을 물려받음`,.9)}initRelations(seeded);const hall=roomByKey('hall');G.props.push({kind:'portrait',x:hall.x+1.5+(G.alumni.length%6),y:hall.y+1.4,roomId:hall.id,variant:G.alumni.length%4});G.school.term++;if(G.school.term>2){G.school.term=1;G.school.year++;if(rnum()<.3&&G.alumni.length){const alum=pick(G.alumni,rnum),idx=G.staff.findIndex(a=>a.role.includes('교수')&&a.role!=='교장');if(idx>=0){const old=G.staff[idx],p=randomSpot(roomByKey('faculty'));G.staff[idx]={...old,id:'T'+G.nextId++,name:alum.name,role:`${MAGIC[alum.primary]} 특별 교수`,x:p.x,y:p.y,px:p.x,py:p.y,primary:alum.primary,skills:alum.skills.slice(),traits:alum.traits.slice(),activity:'졸업생 교수로 첫 출근',path:[],pathIndex:0,pathPending:false};logImportant(`${old.name} 교수가 은퇴하고 졸업생 ${alum.name}이(가) 후임 교수로 모교에 돌아왔다.`,hall.id,[alum.id])}}}G.school.week=1;G.school.day=1;G.school.minute=350;G.school.scores=[0,0,0,0];G.school.termState='running';G.school.report=null;G.milestones={};G.stats.biggest=null;G.events=[];G.hazards={};G.favorites=G.favorites.filter(id=>entityById(id)||G.alumni.some(a=>a.id===id));renderer?.buildWorld();closePanel();saveGame();notify('새 학기가 시작되었습니다.','good')}

function snapshot(){return{version:SAVE_VERSION,savedAt:Date.now(),config:G.config,school:G.school,rngState:G.rngState,nextId:G.nextId,students:G.students,staff:G.staff,events:G.events,hazards:G.hazards,logs:G.logs,alumni:G.alumni,favorites:G.favorites,milestones:G.milestones,simSeconds:G.simSeconds,tick:G.tick,stats:G.stats,settings:G.settings,rooms:G.rooms.filter(r=>r.discovered).map(r=>r.key)}}

function restoreSnapshot(s){if(!s||!s.config||!Array.isArray(s.students))throw new Error('올바른 학교 저장 파일이 아닙니다.');createState({...defaultConfig(),...s.config});Object.assign(G.school,s.school||{});G.rngState=s.rngState||G.rngState;G.nextId=s.nextId||G.nextId;G.students=s.students;G.staff=s.staff||G.staff;G.events=s.events||[];G.hazards=s.hazards||{};G.logs=s.logs||[];G.alumni=s.alumni||[];G.favorites=s.favorites||[];G.milestones=s.milestones||{};G.simSeconds=s.simSeconds||0;G.tick=s.tick||0;G.stats=s.stats||G.stats;G.settings={...G.settings,...s.settings};for(const a of allAgents()){a.path=[];a.pathIndex=0;a.pathPending=false;a.px=a.x;a.py=a.y;a.nextThink=.2+rnum()}for(const k of s.rooms||[])discoverRoom(roomByKey(k),null,false);G.preview=false;G.paused=false;G.speed=1;renderer?.buildWorld();saveSettings();startPlay()}

class AudioEngine{
 constructor(){this.ctx=null;this.nextNote=0;this.mode='calm'}
 start(){if(this.ctx){this.ctx.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC;this.master=this.ctx.createGain();this.music=this.ctx.createGain();this.sfx=this.ctx.createGain();this.music.connect(this.master);this.sfx.connect(this.master);this.master.connect(this.ctx.destination);this.apply()}
 apply(){if(!this.ctx||!G)return;const s=G.settings;this.master.gain.value=s.mute?0:s.master;this.music.gain.value=s.music;this.sfx.gain.value=s.sfx}
 tone(freq,dur=.25,type='sine',vol=.06,when=0,dest=this.sfx){if(!this.ctx)return;const t=this.ctx.currentTime+when,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.03)}
 noise(dur=.25,vol=.08,filter=1200){if(!this.ctx)return;const n=this.ctx.sampleRate*dur,b=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const src=this.ctx.createBufferSource(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();f.type='lowpass';f.frequency.value=filter;g.gain.value=vol;src.buffer=b;src.connect(f);f.connect(g);g.connect(this.sfx);src.start()}
 play(name){if(!this.ctx||G.settings.mute)return;const map={bell:[523,.7,'sine'],footstep:[110,.08,'triangle'],door:[160,.15,'square'],book:[260,.08,'triangle'],wand:[740,.13,'sine'],fire:[180,.2,'sawtooth'],water:[440,.25,'sine'],wind:[330,.25,'triangle'],ice:[1046,.24,'sine'],lightning:[90,.14,'square'],heal:[660,.42,'sine'],shield:[390,.32,'triangle'],illusion:[880,.3,'sine'],summon:[147,.55,'sawtooth'],potion:[510,.22,'sine'],light:[980,.25,'sine'],shadow:[82,.5,'sine'],portal:[220,.55,'sine'],time:[720,.48,'triangle'],plant:[310,.24,'triangle'],explosion:[72,.42,'sawtooth'],alarm:[196,.8,'square'],ghost:[132,.65,'sine'],glass:[1350,.22,'sine'],slime:[92,.28,'sine'],chatter:[310,.18,'triangle'],dining:[880,.1,'sine'],rain:[260,.35,'triangle'],cricket:[3800,.08,'sine']},v=map[name];if(['explosion','alarm','glass','rain'].includes(name))this.noise(name==='rain'?.8:.35,name==='rain'?.025:.12,name==='glass'?4200:name==='alarm'?1800:name==='rain'?3000:700);if(v){this.tone(...v,.065);if(name==='bell')this.tone(784,.8,'sine',.035,.16);if(name==='chatter')this.tone(370,.15,'triangle',.025,.06)}if(name==='festival'||name==='graduation'){[523,659,784,1046].forEach((f,i)=>this.tone(f,.8,'sine',.055,i*.12))}}
 tick(){if(!this.ctx||this.ctx.state!=='running'||G.settings.mute)return;const now=this.ctx.currentTime;if(now<this.nextNote)return;const active=G.events.some(e=>e.state==='active'&&e.severity>=4),exam=G.school.week===5||G.school.week===10,night=nightFactor()>.4;this.mode=active?'danger':exam?'exam':night?'night':G.school.period.includes('수업')?'class':'calm';const chords={calm:[220,277,330,440],class:[196,247,294,392],night:[146,220,277,330],exam:[185,233,277,370],danger:[110,138,164,220]},ch=chords[this.mode];ch.forEach((f,i)=>this.tone(f*(i===3?2:1),2.8,i%2?'sine':'triangle',this.mode==='danger'?.018:.012,i*.08,this.music));if(G.school.weather===2)this.noise(1.1,.012,3200);if(night&&Math.random()<.6)this.tone(3600+Math.random()*700,.07,'sine',.009,.4,this.sfx);if(G.school.period.includes('식사')&&Math.random()<.55)this.play('dining');this.nextNote=now+(this.mode==='danger'?1.8:3.1)}
}

function renderStudents(sort='favorite',query=''){const body=$('#panelBody');$('#panelTitle').textContent='학생 목록';const arr=G.students.slice().filter(a=>a.name.includes(query));const sorts={name:(a,b)=>a.name.localeCompare(b.name),year:(a,b)=>a.year-b.year,house:(a,b)=>a.house-b.house,grade:(a,b)=>b.grade-a.grade,mana:(a,b)=>b.mana-a.mana,emotion:(a,b)=>a.emotion.localeCompare(b.emotion),injury:(a,b)=>(a.injury==='없음')-(b.injury==='없음'),popular:(a,b)=>b.reputation-a.reputation,incidents:(a,b)=>b.incidents-a.incidents,favorite:(a,b)=>Number(G.favorites.includes(b.id))-Number(G.favorites.includes(a.id))};arr.sort(sorts[sort]||sorts.favorite);body.innerHTML=`<div class="searchSort"><input id="studentSearch" placeholder="이름 검색" value="${esc(query)}"><select id="studentSort"><option value="favorite">즐겨찾기</option><option value="name">이름</option><option value="year">학년</option><option value="house">기숙단</option><option value="grade">성적</option><option value="mana">마나</option><option value="emotion">감정</option><option value="injury">부상</option><option value="popular">인기</option><option value="incidents">사건 관여</option></select></div><div class="card" style="padding:0">${arr.map(a=>`<div class="studentRow" data-id="${a.id}"><span class="avatar" style="border-color:${HOUSES[a.house].colors[0]}">${HOUSES[a.house].sigil}</span><div class="rowMain"><strong>${esc(a.name)} · ${a.year}학년</strong><small>${esc(a.activity)} · ${esc(a.emotion)}${a.injury!=='없음'?' · '+esc(a.injury):''}</small></div><button class="starBtn ${G.favorites.includes(a.id)?'on':''}" data-star="${a.id}" aria-label="즐겨찾기">★</button></div>`).join('')}</div>`;$('#studentSort').value=sort;$('#studentSort').onchange=e=>renderStudents(e.target.value,$('#studentSearch').value);$('#studentSearch').oninput=e=>renderStudents($('#studentSort').value,e.target.value);$$('.studentRow').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-star]'))return;renderStudent(x.dataset.id)});$$('[data-star]').forEach(x=>x.onclick=()=>tog async function installApp(){if(matchMedia('(display-mode: standalone)').matches||navigator.standalone){notify('이미 홈 화면 앱으로 실행 중입니다.','good');return}if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#installBtn').style.display='none';return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);notify(ios?'Safari 공유 버튼에서 “홈 화면에 추가”를 선택하세요.':'브라우저 메뉴의 “앱 설치” 또는 “홈 화면에 추가”를 선택하세요.')}
function setupPWA(){window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installBtn').style.display='block'});window.addEventListener('appinstalled',()=>{$('#installBtn').style.display='none';notify('ARCANA ACADEMY가 설치되었습니다.','good')});if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)$('#installBtn').style.display='none';if(!(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))return;let refreshing=false;navigator.serviceWorker?.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}});navigator.serviceWorker?.register('./sw.js').then(reg=>{if(reg.waiting)$('#updateBanner').classList.remove('hidden');reg.addEventListener('updatefound',()=>{const w=reg.installing;w?.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)$('#updateBanner').classList.remove('hidden')})});$('#reloadUpdate').onclick=()=>reg.waiting?.postMessage({type:'SKIP_WAITING'})}).catch(()=>{})}
function setupButtons(){document.addEventListener('pointerdown',()=>audio.start(),{once:true});$('#startNewBtn').onclick=openSetup;$('#newSchoolBtn').onclick=openSetup;$$('.setupClose').forEach(x=>x.onclick=closeSetup);$('#randomSeed').onclick=()=>$('#cfgSeed').value='ARCANA-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36).toUpperCase();$('#createSchoolBtn').onclick=createConfiguredSchool;$('#continueBtn').onclick=async()=>{try{const s=await loadGame();if(s)restoreSnapshot(s);else notify('이어갈 학교가 없습니다.')}catch(e){notify('저장 데이터를 읽지 못했습니다.','danger')}};$$('[data-start-panel]').forEach(x=>x.onclick=()=>openPanel(x.dataset.startPanel));$('#installBtn').onclick=installApp;$('#pauseBtn').onclick=()=>{G.paused=!G.paused;playSound('bell');updateHUD()};$$('.speedBtn').forEach(x=>x.onclick=()=>{G.speed=+x.dataset.speed;G.paused=false;updateHUD()});$('#directorBtn').onclick=()=>{G.director.enabled=!G.director.enabled;camera.followId=null;G.director.current=null;showDirectorReason(G.director.enabled?'자동 디렉터가 중요한 장면을 찾습니다.':'자동 디렉터를 껐습니다.');updateHUD()};$$('[data-panel]').forEach(x=>x.onclick=()=>openPanel(x.dataset.panel));$('#panelClose').onclick=closePanel;$('#panel').onclick=e=>{if(e.target===$('#panel'))closePanel()};$('#newSetup').onclick=e=>{if(e.target===$('#newSetup'))closeSetup()};$('#importFile').onchange=async e=>{try{const text=await e.target.files[0].text(),s=JSON.parse(text);restoreSnapshot(s);notify('학교 저장 데이터를 불러왔습니다.','good')}catch{notify('올바른 저장 파일이 아닙니다.','danger')}e.target.value=''};$('#reloadUpdate').onclick=()=>location.reload()}
function autoQuality(dt){if(!G||G.quality.mode!=='auto')return;G.quality.timer=(G.quality.timer||0)+dt;if(G.quality.timer<5)return;G.quality.timer=0;const old=G.quality.level;if(fps<27&&old>0)G.quality.level--;else if(fps>56&&old<2)G.quality.high=(G.quality.high||0)+1;else G.quality.high=0;if(G.quality.high>=2){G.quality.level++;G.quality.high=0}if(old!==G.quality.level){renderer?.resize();notify(`자동 그래픽 품질: ${['낮음','보통','높음'][G.quality.level]}`)}}
let renderFailed=false;
function frame(now){const dt=Math.min(.1,Math.max(0,(now-lastFrame)/1000));lastFrame=now;frameCount++;fpsClock+=dt;if(fpsClock>=1){fps=lerp(fps,frameCount/fpsClock,.35);frameCount=0;fpsClock=0}if(G&&!G.paused&&!document.hidden){accumulator+=dt*(mode==='title'?.55:(G.speed||1));let loops=0;while(accumulator>=TICK&&loops<16){simulate(TICK);accumulator-=TICK;loops++}if(loops===16)accumulator=Math.min(accumulator,TICK*4)}updateDirector(dt);try{renderer?.render(clamp(accumulator/TICK,0,1),dt)}catch(e){if(!renderFailed){renderFailed=true;console.warn('WebGL renderer switched to safe renderer:',e);renderer=new CanvasFallback($('#world'));notify('안전 그래픽 모드로 전환했습니다.')}}uiClock+=dt;saveClock+=dt;if(uiClock>.25){uiClock=0;updateHUD()}if(saveClock>25){saveClock=0;saveGame()}audio.tick();autoQuality(dt);requestAnimationFrame(frame)}
async function boot(){audio=new AudioEngine();createState(defaultConfig(),true);G.speed=1;G.paused=false;try{renderer=new GLRenderer($('#world'))}catch(e){console.warn('WebGL2 initialization failed:',e);renderer=new CanvasFallback($('#world'))}setupInput();setupButtons();setupPWA();saveSettings();try{const has=localStorage.getItem('arcana-has-save')==='1'||await loadGame();$('#continueBtn').disabled=!has}catch{}updateHUD();requestAnimationFrame(t=>{lastFrame=t;requestAnimationFrame(frame)})}
document.addEventListener('visibilitychange',()=>{lastFrame=performance.now();if(document.hidden)saveGame()});window.addEventListener('pagehide',()=>saveGame());boot();
</script>
