<style>

#top{border:1px solid #1d2c44;background:linear-gradient(180deg,#0a1426ee,#070d18ee);min-height:47px;padding:5px 7px;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:2px 7px;align-items:center;box-shadow:0 0 22px #0008}

<body>
<main id="app">
  <header id="top" aria-label="경기 상태">
    <div id="brand">LATENT QUARTET</div><div id="roundMeta">R-001 · SEED ----</div><div id="timer">60.0</div>

  <aside id="drawer" aria-label="공개 분석 기록">

  </aside>
</main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), mod=(n,m)=>((n%m)+m)%m;
const deep=o=>JSON.parse(JSON.stringify(o));
const hash32=(...xs)=>{let h=2166136261>>>0;for(const x of xs){const s=String(x);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}}return h>>>0};
const mulberry32=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
const pick=(r,a)=>a[(r()*a.length)|0], ri=(r,n)=>Math.floor(r()*n), fmt=n=>Number(n).toFixed(2);
const PUZZLES=[
 {id:'lattice',name:'CAUSAL LATTICE',ko:'지연 인과 격자'},
 {id:'spectral',name:'SPECTRAL LOCK',ko:'위상 공명 금고'},
 {id:'vault',name:'NONCOMMUTATIVE VAULT',ko:'비가환 순열 금고'}
];
const TEAMS=[
 {id:'bayes',short:'C',name:'CYAN / BAYES',color:'#32e6d1',cursor:'lens',border:'dots'},
 {id:'tree',short:'M',name:'MAGENTA / TREE',color:'#ff4fbd',cursor:'tri',border:'teeth'},
 {id:'evolve',short:'A',name:'AMBER / EVOLVE',color:'#ffad37',cursor:'diamond',border:'diamonds'},
 {id:'logic',short:'L',name:'LIME / LOGIC',color:'#a8f05a',cursor:'cross',border:'circuit'}
];
class SafeStore{constructor(){this.ok=true;try{localStorage.setItem('__lq_t','1');localStorage.removeItem('__lq_t')}catch(e){this.ok=false}}get(k,d){if(!this.ok)return d;try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}}set(k,v){if(this.ok)try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}del(k){if(this.ok)try{localStorage.removeItem(k)}catch(e){}}}
const store=new SafeStore();
const defaultLeague=()=>({games:0,wins:[0,0,0,0],byPuzzle:Array.from({length:4},()=>[[],[],[]]),recent:[],cycle:[],cycleCurrent:[0,0,0,0],cycleCount:0});
let league=store.get('latentQuartetLeague',defaultLeague());
if(!league||!Array.isArray(league.wins))league=defaultLeague();
let settings=store.get('latentQuartetSettings',{speed:1,sound:false,sessionSeed:null,round:0});
if(!settings.sessionSeed){let x=(Date.now()^performance.now()*1000)>>>0;try{crypto.getRandomValues(new Uint32Array(1)).forEach(v=>x^=v)}catch(e){}settings.sessionSeed=x>>>0}

class PuzzleEnvironment{
 constructor(seed){this.seed=seed>>>0;this.rng=mulberry32(this.seed);this.tick=0;this.actionCount=0;this.resets=0;this.history=[];this.eventId=0;this.lastEvent=null;this.solvedAt=null;this.bestClose=0;this.instability=0;this.invalid=0;this.repeats=0;this.lastActionKey='';this.repeatRun=0;this.effects=[]}
 log(e){e.id=++this.eventId;this.lastEvent=e;this.history.push(e);if(this.history.length>40)this.history.shift()}
 noteAction(a){const k=JSON.stringify(a);if(k===this.lastActionKey)this.repeatRun++;else this.repeatRun=0;if(this.repeatRun>2)this.repeats++;this.lastActionKey=k;this.actionCount++}
 publicHistory(){return deep(this.history)}
 track(close,time){if(close+0.04<this.bestClose)this.instability+=this.bestClose-close;this.bestClose=Math.max(this.bestClose,close);if(this.solved()&&this.solvedAt==null)this.solvedAt=time}
}

function makeInvertibleMatrix(r){
 let A=Array.from({length:16},(_,i)=>Array.from({length:16},(_,j)=>i===j?1:0));
 for(let k=0;k<28;k++){let a=ri(r,16),b=ri(r,16);if(a===b)b=(b+1)%16;const q=r()<.5?1:2;for(let j=0;j<16;j++)A[a][j]=mod(A[a][j]+q*A[b][j],3);if(r()<.15)[A[a],A[b]]=[A[b],A[a]]}
 return A;
}
function matVec(A,x){return A.map(row=>row.reduce((s,v,j)=>s+v*x[j],0)%3)}
function gf3Solve(cols,res){
 const ids=[];cols.forEach((c,i)=>{if(c)ids.push(i)});if(!ids.length)return null;
 const m=16,n=ids.length,M=Array.from({length:m},(_,i)=>[...ids.map(j=>mod(cols[j][i],3)),mod(res[i],3)]);let row=0,piv=[];
 for(let c=0;c<n&&row<m;c++){let p=row;while(p<m&&M[p][c]===0)p++;if(p===m)continue;[M[p],M[row]]=[M[row],M[p]];if(M[row][c]===2)for(let j=c;j<=n;j++)M[row][j]=mod(M[row][j]*2,3);for(let i=0;i<m;i++)if(i!==row&&M[i][c]){const q=M[i][c];for(let j=c;j<=n;j++)M[i][j]=mod(M[i][j]-q*M[row][j],3)}piv.push([row,c]);row++}
 for(let i=row;i<m;i++)if(M[i].slice(0,n).every(v=>v===0)&&M[i][n])return null;
 const x=Array(n).fill(0);for(let i=piv.length-1;i>=0;i--){const [rr,c]=piv[i];x[c]=M[rr][n]}
 const full=Array(16).fill(0);ids.forEach((id,i)=>full[id]=x[i]);
 const chk=Array(16).fill(0);ids.forEach((id,j)=>{for(let i=0;i<16;i++)chk[i]=mod(chk[i]+cols[id][i]*full[id],3)});return chk.every((v,i)=>v===mod(res[i],3))?full:null;
}
class LatticeEnv extends PuzzleEnvironment{
 #A;#D;#solution;
 constructor(seed){super(seed);const r=this.rng;this.#A=makeInvertibleMatrix(r);this.#D=Array.from({length:16},(_,i)=>Array.from({length:16},(_,j)=>this.#A[i][j]?1+ri(r,3):0));this.initial=Array.from({length:16},()=>ri(r,3));let cost=5+ri(r,10),x=Array(16).fill(0);while(cost>0){const i=ri(r,16);if(x[i]<2){x[i]++;cost--}}this.#solution=x;const d=matVec(this.#A,x);this.target=this.initial.map((v,i)=>mod(v+d[i],3));this.state=[...this.initial];this.pending=[];this.pendingTxn=null;this.baseline=x.reduce((a,b)=>a+b,0)}
 getPublicObservation(){const diff=this.state.map((v,i)=>mod(this.target[i]-v,3));return deep({type:'lattice',tick:this.tick,state:this.state,target:this.target,pending:this.pending.length,residual:diff.filter(Boolean).length,residualVector:diff,recentDelta:this.lastEvent?.delta||Array(16).fill(0),lastEvent:this.lastEvent,solved:this.solved(),close:this.closeness()})}
 getPublicHistory(){return this.publicHistory()}
 ready(){return !this.pendingTxn}
 advance(time){this.tick++;if(!this.pending.length)return null;const due=this.pending.filter(p=>p.due<=this.tick);this.pending=this.pending.filter(p=>p.due>this.tick);for(const p of due){this.state[p.node]=mod(this.state[p.node]+p.val,3);this.effects.push({kind:'pulse',from:this.pendingTxn.action.index,to:p.node,life:1})}if(!this.pending.length&&this.pendingTxn){const t=this.pendingTxn,after=[...this.state],delta=after.map((v,i)=>mod(v-t.before[i],3));let acc=0;if(t.prediction?.delta)acc=1-delta.filter((v,i)=>v!==mod(t.prediction.delta[i]||0,3)).length/16;const e={type:'press',time:t.time,action:t.action,before:t.before,after,delta,predicted:t.prediction?.delta||null,accuracy:clamp(acc)};this.pendingTxn=null;this.log(e);this.track(this.closeness(),time);return e}return null}
 applyPublicAction(a,pred,time){if(a.type==='reset'){const before=[...this.state];this.state=[...this.initial];this.pending=[];this.pendingTxn=null;this.resets++;this.noteAction(a);const e={type:'reset',time,action:a,before,after:[...this.state],delta:this.state.map((v,i)=>mod(v-before[i],3)),predicted:null,accuracy:1};this.log(e);return e}if(!this.ready()||a.type!=='press'||a.index<0||a.index>15){this.invalid++;return null}this.noteAction(a);const before=[...this.state];this.pendingTxn={action:deep(a),prediction:deep(pred),before,time};for(let node=0;node<16;node++)if(this.#A[node][a.index])this.pending.push({node,val:this.#A[node][a.index],due:this.tick+this.#D[node][a.index]});return null}
 applyVirtualPublicAction(a,pred,time){if(a.type!=='press'||!pred?.delta)return null;const actual=this.#A.map(row=>row[a.index]),accuracy=1-actual.filter((v,i)=>v!==mod(pred.delta[i]||0,3)).length/16,e={type:'virtual',time,action:deep(a),predicted:deep(pred.delta),actual,accuracy:clamp(accuracy),sandbox:true};this.log(e);return e}
 closeness(){return 1-this.state.filter((v,i)=>v!==this.target[i]).length/16}
 solved(){return this.state.every((v,i)=>v===this.target[i])&&!this.pendingTxn}
 validateModel(m){let ok=0,total=256;for(let j=0;j<16;j++)for(let i=0;i<16;i++)if(m?.cols?.[j]&&mod(m.cols[j][i],3)===this.#A[i][j])ok++;return 100*ok/total}
 discovery(m){return 100*(m?.cols?.filter(Boolean).length||0)/16}
 baselineActions(){return this.baseline}
}

const cis=a=>[Math.cos(a),Math.sin(a)];
const cdiv=(z,w)=>{const d=w[0]*w[0]+w[1]*w[1]||1e-9;return[(z[0]*w[0]+z[1]*w[1])/d,(z[1]*w[0]-z[0]*w[1])/d]}, crot=(z,a)=>[z[0]*Math.cos(a)-z[1]*Math.sin(a),z[0]*Math.sin(a)+z[1]*Math.cos(a)];
function harmonicDelta(h,from,to){if(!h?.v)return null;return h.v.map(z=>{const a=crot(z,from*Math.PI/4),b=crot(z,to*Math.PI/4);return[b[0]-a[0],b[1]-a[1]]})}
class SpectralEnv extends PuzzleEnvironment{
 #coef;#off;#pairs;#targetPhases;
 constructor(seed){super(seed);const r=this.rng;this.#coef=Array.from({length:4},()=>Array.from({length:10},()=>ri(r,5)-2));for(let j=0;j<10;j++)if(this.#coef.every(row=>row[j]===0))this.#coef[ri(r,4)][j]=r()<.5?-1:1;this.#off=Array.from({length:4},()=>r()*Math.PI*2);this.#pairs=Array.from({length:4},()=>{let a=ri(r,10),b=ri(r,10);if(a===b)b=(b+1)%10;return[a,b,(r()<.5?-1:1)*(.025+r()*.035)]});this.initial=Array.from({length:10},()=>ri(r,8));this.phases=[...this.initial];let target,path,pathCost,tries=0,monotone=false,targetSp;do{target=[...this.initial];path=[];pathCost=5+ri(r,3);const ids=randPerm(r,10).slice(0,pathCost);for(const i of ids){const dir=r()<.5?-1:1;path.push({i,dir});target[i]=mod(target[i]+dir,8)}targetSp=this.compute(target);let cur=[...this.initial],prev=this.energyTo(cur,targetSp);monotone=true;for(const a of path){cur[a.i]=mod(cur[a.i]+a.dir,8);const e=this.energyTo(cur,targetSp);if(e>=prev-.001)monotone=false;prev=e}}while(++tries<64&&(!monotone||this.energyForTargets(target)<.15));this.baseline=pathCost;this.#targetPhases=target;this.targetSpectrum=targetSp;this.targetParity=target.reduce((a,b)=>a+b,0)&1;this.inversionsLeft=2;this.initialInv=2}

function drawLattice(rt,r,o){const ox=r.x+r.w*.13,oy=r.y+r.h*.25,size=Math.min(r.w*.52,r.h*.59),cell=size/4,t=rt.team;for(let i=0;i<16;i++){const x=ox+(i%4)*cell,y=oy+Math.floor(i/4)*cell,v=o.state[i];ctx.fillStyle=['#0d1828','#293b57','#d4e0ee'][v];ctx.globalAlpha=.78;ctx.fillRect(x+2,y+2,cell-4,cell-4);ctx.globalAlpha=1;ctx.strokeStyle=t.color;ctx.globalAlpha=.16+.18*(v/2);ctx.strokeRect(x+2.5,y+2.5,cell-5,cell-5);ctx.globalAlpha=1;text(['○','⌁','◈'][v],x+cell/2,y+cell/2,Math.max(8,cell*.34),v===2?'#07101b':'#b4c5d9','center')}

function drawVault(rt,r,o){const cx=r.x+r.w*.48,cy=r.y+r.h*.53,rad=Math.min(r.w*.30,r.h*.31),t=rt.team,ev=o.lastEvent;if(ev?.type==='lever'&&simTime-ev.time<1.3){ctx.save();ctx.globalAlpha=.25*clamp(1-(simTime-ev.time)/1.3);for(let p=0;p<12;p++){const id=ev.before.tokens[p].id,q=ev.after.tokens.findIndex(x=>x.id===id);if(p===q)continue;const a=-Math.PI/2+p*Math.PI*2/12,b=-Math.PI/2+q*Math.PI*2/12,x1=cx+Math.cos(a)*rad,y1=cy+Math.sin(a)*rad,x2=cx+Math.cos(b)*rad,y2=cy+Math.sin(b)*rad;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.strokeStyle=t.color;ctx.lineWidth=.7;ctx.stroke()}ctx.restore()}ctx.strokeStyle='#263a55';ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.stroke();drawTokenRing(o.tokens,cx,cy,rad,false,t.color);const tr=Math.min(r.w*.10,r.h*.12);drawTokenRing(o.targetTokens,r.x+r.w-tr-9,r.y+31,tr,true,'#8ba0b9');text('TARGET',r.x+r.w-tr-9,r.y+17,6,'#71849d','center');for(let i=0;i<6;i++){const an=Math.PI+i*Math.PI*2/6,x=cx+Math.cos(an)*(rad+16),y=cy+Math.sin(an)*(rad+12);text(String.fromCharCode(65+i),x,y,7,'#9badc1','center')}for(let b=0;b<3;b++){ctx.fillStyle=(o.mode>>b)&1?t.color:'#17263a';ctx.fillRect(r.x+8+b*10,r.y+24,6,6)}const seq=rt.env.history.filter(x=>x.type==='lever').slice(-5).map(x=>String.fromCharCode(65+x.action.index)).join('›');text(seq||'—',r.x+8,r.y+r.h-10,7,'#7f92aa');text(`M${o.mode}→${o.targetMode} · sim ${Math.round(o.close*100)}%`,r.x+r.w-7,r.y+r.h-10,7,t.color,'right')}

function loop(now){if(!loop.last)loop.last=now;const rawDt=Math.max(0,(now-loop.last)/1000),dt=Math.min(.1,rawDt);loop.last=now;if(!paused){if(phase==='play'){accumulator+=dt*speed;const step=1/12;while(accumulator>=step){simTime+=step;for(const rt of runtimes)rt.step(step,simTime);accumulator-=step;if(simTime>=60){beginResults();break}}}else{resultTime+=rawDt;$('#resTimer').textContent=Math.max(0,10-resultTime).toFixed(1);const ranks=[...document.querySelectorAll('.rank')],ag=$('#aggregate');if(resultTime<2){const k=1-(1-resultTime/2)**3;ag.style.visibility='visible';ag.textContent='AGGREGATING · '+roundScores.map(r=>`${r.team.short}${String(Math.round(r.total*k)).padStart(3,'0')}`).join(' ')}else{ag.style.visibility='hidden';ranks.forEach((x,i)=>{if(resultTime>2+i*.45)x.classList.add('reveal')})}if(resultTime>=7){const n=Math.max(0,Math.ceil(10-resultTime));if(n!==lastCountdown&&n>0){lastCountdown=n;audio.beep('count')}}$('#nextLine').textContent=resultTime<7?`NEXT · ${PUZZLES[(puzzleIndex+1)%3].name}`:`${PUZZLES[(puzzleIndex+1)%3].name} · T-${Math.max(0,Math.ceil(10-resultTime))}`;if(resultTime>=10)createRound()}}draw();if(now-lastUi>140){lastUi=now;updateHeader();updateCards();updateTrace()}requestAnimationFrame(loop)}

canvas.addEventListener('pointerup',e=>{if(phase!=='play')return;if(focus>=0){focus=-1;$('#focusHint').textContent='TAP: FOCUS'}else{const b=canvas.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;focus=(x>b.width/2?1:0)+(y>b.height/2?2:0);$('#focusHint').textContent='TAP: QUARTET'}}, {passive:true});
$('#pauseBtn').onclick=()=>{paused=!paused;autoPaused=false;$('#pauseBtn').textContent=paused?'RESUME':'PAUSE';$('#pauseBtn').classList.toggle('on',paused);loop.last=performance.now()};
$('#speedBtn').onclick=()=>{const a=[.5,1,2,4];speed=a[(a.indexOf(speed)+1)%a.length];settings.speed=speed;store.set('latentQuartetSettings',settings);$('#speedBtn').textContent=`SPEED ${speed}×`};$('#speedBtn').textContent=`SPEED ${speed}×`;
$('#soundBtn').onclick=()=>{if(!audio.on){audio.enable();settings.sound=true;$('#soundBtn').textContent='SOUND ON';$('#soundBtn').classList.add('on');audio.beep('ok')}else{audio.on=false;settings.sound=false;$('#soundBtn').textContent='SOUND OFF';$('#soundBtn').classList.remove('on')}store.set('latentQuartetSettings',settings)};
$('#traceBtn').onclick=()=>{$('#drawer').classList.add('open');updateTrace()};$('#closeTrace').onclick=()=>{$('#drawer').classList.remove('open');$('#fallback').style.display='none'};
$('#traceTabs').innerHTML=TEAMS.map((t,i)=>`<button class="traceTab ${i===0?'on':''}" style="--tc:${t.color}" data-i="${i}">${t.short} ${t.id.toUpperCase()}</button>`).join('');$('#traceTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;traceTeam=+b.dataset.i;document.querySelectorAll('.traceTab').forEach((x,i)=>x.classList.toggle('on',i===traceTeam));updateTrace()};
$('#copyBtn').onclick=async()=>{const s=makePublicJSON();try{if(!navigator.clipboard)throw 0;await navigator.clipboard.writeText(s);$('#copyBtn').textContent='COPIED';setTimeout(()=>$('#copyBtn').textContent='COPY PUBLIC STATE',1000)}catch(e){const ta=$('#fallback');ta.value=s;ta.style.display='block';ta.focus();ta.select()}};$('#hideFallback').onclick=()=>{$('#fallback').style.display='none'};
let holdStart=0,holdRAF=0;const rb=$('#resetBtn');function stopHold(){holdStart=0;cancelAnimationFrame(holdRAF);rb.style.setProperty('--hold',0)}function holdTick(){if(!holdStart)return;const p=clamp((performance.now()-holdStart)/1600);rb.style.setProperty('--hold',p);if(p>=1){league=defaultLeague();round=0;settings.round=0;store.del('latentQuartetLeague');store.set('latentQuartetSettings',settings);stopHold();showBanner('LEAGUE RESET','누적 기록을 초기화했습니다');createRound()}else holdRAF=requestAnimationFrame(holdTick)}rb.addEventListener('pointerdown',e=>{e.preventDefault();holdStart=performance.now();holdTick()});['pointerup','pointercancel','pointerleave'].forEach(x=>rb.addEventListener(x,stopHold));
document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true;autoPaused=true;$('#pauseBtn').textContent='RESUME';$('#pauseBtn').classList.add('on')}loop.last=performance.now()});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
createRound();requestAnimationFrame(loop);
})();
</script>
</body>
