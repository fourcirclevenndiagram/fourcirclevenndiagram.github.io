<dialog id="resetDialog"><h2>새로운 전투를 시작할까요?</h2><p>현재 전투를 끝내고 네 팀을 다시 배치합니다. 타워 87개가 모두 중립으로 돌아가며, 개조 성능도 새로 결정됩니다.</p><div class="dialog-actions"><button id="cancelReset">계속 관전</button><button id="confirmReset" class="primary">새 전투 시작</button></div></dialog>

<script>
(()=>{
'use strict';
// Simulation uses a fixed step, bounded armies and a spatial hash. No network or dependencies.
const N=180,CELLS=N*N,STEP=1/20,LIMIT=15*60,CAP=360,WAVE=20,WORK=12;
const TEAM=[{name:'빨강',color:'#ff6b6b',rgb:[255,107,107],symbol:'R'},{name:'파랑',color:'#60a5ff',rgb:[96,165,255],symbol:'B'},{name:'노랑',color:'#f4ce58',rgb:[244,206,88],symbol:'Y'},{name:'초록',color:'#5ad6a1',rgb:[90,214,161],symbol:'G'}];
const TYPES=[{name:'보병',hp:108,speed:2.65,range:1.15,damage:10,rate:.95,paint:1.7,icon:'●',role:'근접 전투 · 안정적인 점령'},{name:'궁병',hp:65,speed:2.35,range:6.5,damage:8,rate:1.35,paint:1.2,icon:'▲',role:'원거리 사격 · 보병 뒤에서 지원'},{name:'기병',hp:145,speed:4.15,range:1.35,damage:14,rate:1.3,paint:2,icon:'◆',role:'빠른 진격 · 넓은 영토 확보'},{name:'건설병',hp:78,speed:2.6,range:1.1,damage:4,rate:1.65,paint:1.3,icon:'▣',role:'타워 개조 · 비전투 중 거점 수리'}];
const TIER_COLOR={S:'#ffe084',A:'#d6a3ff',B:'#7ecaff',C:'#a6dab4',D:'#b2bec8'};
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const canvas=$('#field'),ctx=canvas.getContext('2d',{alpha:false}),mini=$('#mini'),mctx=mini.getContext('2d',{alpha:false});
const ground=document.createElement('canvas');ground.width=ground.height=N;const gctx=ground.getContext('2d'),gdata=gctx.createImageData(N,N);
const ui={panel:$('#panel'),clock:$('#clock'),badge:$('#mapBadge')};
let sim,seed=0,rng,uid=0,paused=false,speed=1,tab='overview',selected=null,labels=true,follow=false,toastTimer=0,uiDirty=true,groundDirty=true,uiTime=0,last=0,acc=0,lastGround=0;
let view={w:1,h:1,dpr:1,fit:1,zoom:1,x:90,y:90},cameraTarget=null,drag=null,pinching=false,pointers=new Map(),suppressTap=false;
const HASH=8,HC=Math.ceil(N/HASH),buckets=Array.from({length:HC*HC},()=>[]);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const pad=n=>String(n).padStart(2,'0');
const clock=t=>pad(Math.floor(t/60))+':'+pad(Math.floor(t%60));const pct=n=>(100*n/CELLS).toFixed(1);const color=t=>t<0?'#a9b6b9':TEAM[t].color;
function makeRng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function random(a,b){return a+rng()*(b-a)}function integer(a,b){return Math.floor(random(a,b+1))}
function log(message,kind='event'){sim.logs.unshift({t:sim.time,message,kind});if(sim.logs.length>120)sim.logs.pop();uiDirty=true}
function teamName(t){return '<strong style="color:'+color(t)+'">'+(t<0?'중립':TEAM[t].name+'팀')+'</strong>'}
function grade(sum){return sum>=17?'S':sum>=13?'A':sum>=9?'B':sum>=5?'C':'D'}
function createBuilding(x,y,owner,id,base=false){return {kind:base?'base':'tower',id,x,y,r:base?3.2:1.65,owner,hp:base?3200:360,maxHp:base?3200:360,dead:false,pending:0,damage:new Float64Array(4),lastHit:-99,shot:random(.3,2.4),aim:0,production:base?[5,3,2,1]:null,tier:null,cycle:base?10:WAVE,queue:[0,0,0,0],queueIndex:0,spawnClock:0,worker:null,progress:0,claimClock:random(0,1),builtAt:0,kills:0,captures:0};}
function start(newSeed){seed=(newSeed??((Date.now()^Math.floor(Math.random()*1e9))>>>0))>>>0;rng=makeRng(seed);uid=0;
sim={time:0,tick:0,units:[],unitMap:new Map(),towers:[],bases:[],teams:TEAM.map(()=>({alive:true,count:0,types:[0,0,0,0],land:0,towers:0,factories:0,kills:0,lost:0,produced:0,peak:0,landAtLoss:0})),owner:new Int8Array(CELLS).fill(-1),shade:new Uint8Array(CELLS),effects:[],logs:[],captures:0,renovations:0,shots:0,finished:false,winners:[],hotspot:null,commit:Array.from({length:4},()=>new Int16Array(91)),globalPulse:0};
for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=(Math.sin(x*.078+Math.cos(y*.085))*Math.cos(y*.071)+Math.sin((x+y)*.035))*.5;sim.shade[y*N+x]=Math.round(10+v*4+random(0,4));}
const corners=[[10,10],[170,10],[170,170],[10,170]];corners.forEach((p,t)=>sim.bases.push(createBuilding(p[0],p[1],t,87+t,true)));
const pos=[15,32,49,66,81];let quarter=[];for(let a=0;a<5;a++)for(let b=0;b<5;b++){if((a===0&&b===0)||(a===4&&b===4)||(a===0&&b===4)||(a===4&&b===0))continue;quarter.push([pos[a]+random(-2.1,2.1),pos[b]+random(-2.1,2.1)]);}
for(let q=0;q<4;q++)for(const p of quarter){let x=p[0],y=p[1];for(let r=0;r<q;r++){const nx=N-y;y=x;x=nx}sim.towers.push(createBuilding(x,y,-1,sim.towers.length));}
for(const p of [[90,82],[81,97],[99,97]])sim.towers.push(createBuilding(p[0],p[1],-1,sim.towers.length));
sim.buildings=[...sim.towers,...sim.bases];
sim.bases.forEach((b,t)=>{claim(b.x,b.y,10,t);[14,10,6,4].forEach((count,type)=>{for(let i=0;i<count;i++)spawn(t,type,b,true)})});
for(let i=0;i<CELLS;i++)paintPixel(i);groundDirty=true;updateCounts();log('네 진영 출격. 중립 타워 <strong>87개</strong>가 점령을 기다립니다.');paused=false;selected=null;cameraTarget=null;follow=false;acc=0;tab='overview';view.zoom=1;view.x=view.y=90;
$('#resetDialog').close();$('#resultDialog').close();$('#pauseBtn').textContent='Ⅱ 정지';$('#pauseBtn').setAttribute('aria-pressed','false');$('#followBtn').setAttribute('aria-pressed','false');$('#liveState').textContent='AUTO RTS';switchTab('overview');updateUI();render();
}
function paintPixel(i){const k=i*4,sh=sim.shade[i],o=sim.owner[i],v=[13+sh,25+sh,27+sh];if(o>=0){const tc=TEAM[o].rgb;gdata.data[k]=v[0]*.63+tc[0]*.37;gdata.data[k+1]=v[1]*.63+tc[1]*.37;gdata.data[k+2]=v[2]*.63+tc[2]*.37}else{gdata.data[k]=v[0];gdata.data[k+1]=v[1];gdata.data[k+2]=v[2]}gdata.data[k+3]=255;groundDirty=true}
function setLand(i,t){const old=sim.owner[i];if(old===t)return;if(old>=0)sim.teams[old].land--;sim.owner[i]=t;if(t>=0)sim.teams[t].land++;paintPixel(i)}
function claim(x,y,r,t,neutralOnly=false){if(t<0||!sim.teams[t].alive)return;const x0=Math.max(0,Math.floor(x-r)),x1=Math.min(N-1,Math.ceil(x+r)),y0=Math.max(0,Math.floor(y-r)),y1=Math.min(N-1,Math.ceil(y+r)),rr=r*r;for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){if((xx+.5-x)**2+(yy+.5-y)**2>rr)continue;const i=yy*N+xx;if(!neutralOnly||sim.owner[i]<0||sim.owner[i]===t)setLand(i,t)}}
function spawn(team,type,b,initial=false){const tm=sim.teams[team];if(!tm.alive||tm.count>=CAP)return false;const stats=TYPES[type],a=random(0,Math.PI*2),r=random(b.r+1,b.r+(initial?5:2.5));const u={kind:'unit',id:++uid,team,type,x:clamp(b.x+Math.cos(a)*r,1,179),y:clamp(b.y+Math.sin(a)*r,1,179),hp:stats.hp,maxHp:stats.hp,pending:0,lastAttacker:-1,dead:false,inside:false,goal:null,enemy:null,think:random(0,.6),order:random(0,1),attack:random(0,1),job:null,jobCheck:type===3?random(3,12):99,paint:random(0,.4),offsetX:random(-1,1),offsetY:random(-1,1),angle:a,flash:0,kills:0,repair:null};sim.units.push(u);sim.unitMap.set(u.id,u);tm.count++;tm.types[type]++;tm.produced++;tm.peak=Math.max(tm.peak,tm.count);return true}
function pushEffect(e){if(sim.effects.length<440)sim.effects.push(e)}
function flashRing(x,y,t,kind='capture'){pushEffect({kind,x,y,color:color(t),life:0,max:kind==='capture'?1.7:1.1})}
function hashBuild(){for(const b of buckets)b.length=0;for(const u of sim.units)if(!u.dead&&!u.inside)buckets[Math.min(HC-1,(u.y/HASH)|0)*HC+Math.min(HC-1,(u.x/HASH)|0)].push(u)}
function nearestEnemy(x,y,team,range){const x0=Math.max(0,Math.floor((x-range)/HASH)),x1=Math.min(HC-1,Math.floor((x+range)/HASH)),y0=Math.max(0,Math.floor((y-range)/HASH)),y1=Math.min(HC-1,Math.floor((y+range)/HASH));let best=null,dd=range*range;for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++)for(const u of buckets[yy*HC+xx]){if(u.team===team||u.dead||u.inside)continue;const d=(u.x-x)**2+(u.y-y)**2;if(d<dd){dd=d;best=u}}return best}
function chooseGoal(u){let best=null,value=1e9;const orders=sim.commit[u.team];for(const b of sim.buildings){if(b.dead||b.owner===u.team)continue;if(b.kind==='base'&&!sim.teams[b.owner].alive)continue;const d=dist(u,b),crowd=orders[b.id];let score=d+(b.owner<0?-4:5)+Math.max(0,crowd-7)*1.6;if(b.kind==='base')score+=sim.time<90?50:(sim.teams[b.owner].towers<=3?-18:15);score+=((u.id*13+b.id*29)%19)*.42;if(score<value){value=score;best=b}}
if(u.goal)orders[u.goal.id]=Math.max(0,orders[u.goal.id]-1);u.goal=best;if(best)orders[best.id]++;u.order=random(2.8,5.5);return best}
function assignJob(u){u.jobCheck=random(7,17);if(u.type!==3||u.dead||u.job)return;let best=null,value=1e9;for(const b of sim.towers){if(b.owner!==u.team||b.production||b.worker!==null)continue;const d=dist(u,b);if(d<value){value=d;best=b}}
if(best){best.worker=u.id;u.job=best;u.enemy=null;u.repair=null;u.order=0}}
function releaseJob(u,damaged=false){const b=u.job;if(b&&b.worker===u.id){b.worker=null;b.progress=0}if(u.inside&&b){const a=random(0,6.28);u.x=clamp(b.x+Math.cos(a)*3,1,179);u.y=clamp(b.y+Math.sin(a)*3,1,179);if(damaged)u.hp=Math.max(1,u.hp*.65)}u.inside=false;u.job=null;u.jobCheck=random(5,12)}
function finishUpgrade(b,u){let batch;do{batch=Array.from({length:4},()=>integer(0,5))}while(batch.every(n=>n===0));b.production=batch;b.tier=grade(batch.reduce((a,c)=>a+c,0));b.cycle=WAVE;b.queue=[0,0,0,0];b.builtAt=sim.time;sim.renovations++;releaseJob(u);flashRing(b.x,b.y,b.owner,'upgrade');log(teamName(b.owner)+' <strong>#'+pad(b.id+1)+'</strong> 개조 완료 · <strong style="color:'+TIER_COLOR[b.tier]+'">'+b.tier+'등급</strong> · '+batch.join('/')+'명', 'upgrade');}
function damageUnit(u,amount,by){if(u.dead||u.inside)return;u.pending+=amount;u.lastAttacker=by;u.flash=.15}
function damageBuilding(b,amount,by){if(b.dead||b.owner===by)return;b.pending+=amount;b.damage[by]+=amount;b.lastHit=sim.time}
function shoot(u,v,building=false){const st=TYPES[u.type];u.attack=st.rate*random(.92,1.08);u.angle=Math.atan2(v.y-u.y,v.x-u.x);if(building)damageBuilding(v,st.damage,u.team);else damageUnit(v,st.damage,u.team);if(u.type===1)pushEffect({kind:'arrow',x:u.x,y:u.y,tx:v.x,ty:v.y,color:color(u.team),life:0,max:.28});else pushEffect({kind:'slash',x:v.x,y:v.y,color:color(u.team),life:0,max:.16});if(!building||v.owner>=0)sim.hotspot={x:(u.x+v.x)/2,y:(u.y+v.y)/2,time:sim.time};}
function move(u,tx,ty,dt){let dx=tx-u.x,dy=ty-u.y,len=Math.hypot(dx,dy);if(len<.08)return;dx/=len;dy/=len;const bx=Math.min(HC-1,(u.x/HASH)|0),by=Math.min(HC-1,(u.y/HASH)|0);let rx=0,ry=0,n=0;for(let yy=Math.max(0,by-1);yy<=Math.min(HC-1,by+1);yy++)for(let xx=Math.max(0,bx-1);xx<=Math.min(HC-1,bx+1);xx++)for(const o of buckets[yy*HC+xx]){if(o===u||o.dead||o.inside)continue;const ax=u.x-o.x,ay=u.y-o.y,ds=ax*ax+ay*ay;if(ds>.001&&ds<.72){const d=Math.sqrt(ds),f=(.85-d)*.62;rx+=ax/d*f;ry+=ay/d*f;if(++n>=6)break}}
const step=Math.min(len,TYPES[u.type].speed*dt);u.x=clamp(u.x+dx*step+rx*dt,0.5,N-.5);u.y=clamp(u.y+dy*step+ry*dt,.5,N-.5);u.angle=Math.atan2(dy,dx)}
function updateUnit(u,dt){if(u.dead)return;u.attack-=dt;u.flash=Math.max(0,u.flash-dt);u.jobCheck-=dt;u.think-=dt;u.order-=dt;u.paint-=dt;
if(u.job&&(u.job.owner!==u.team||u.job.production||u.job.worker!==u.id))releaseJob(u,true);
if(u.job){const b=u.job;if(u.inside){b.progress+=dt;if(b.progress>=WORK)finishUpgrade(b,u);return}if(dist(u,b)<2.1){u.inside=true;u.x=b.x;u.y=b.y;b.progress=0;return}move(u,b.x,b.y,dt);if(u.paint<=0){claim(u.x,u.y,1.2,u.team);u.paint=.5}return}
if(u.type===3&&u.jobCheck<=0){assignJob(u);if(u.job)return}
if(u.think<=0){u.enemy=nearestEnemy(u.x,u.y,u.team,u.type===1?8.7:7.3);u.think=random(.35,.8);if(u.type===3){u.repair=null;if(!u.enemy){let near=7;for(const b of sim.buildings){if(b.owner===u.team&&!b.dead&&b.hp<b.maxHp*.93&&sim.time-b.lastHit>3){const d=dist(u,b);if(d<near){near=d;u.repair=b}}}}}}
if(u.enemy&&(u.enemy.dead||u.enemy.inside||dist(u,u.enemy)>12))u.enemy=null;
if(u.enemy){const d=dist(u,u.enemy);if(d<=TYPES[u.type].range+.3){if(u.attack<=0)shoot(u,u.enemy)}else move(u,u.enemy.x+u.offsetX*.25,u.enemy.y+u.offsetY*.25,dt)}
else if(u.type===3&&u.repair&&!u.repair.dead&&u.repair.owner===u.team&&u.repair.hp<u.repair.maxHp&&sim.time-u.repair.lastHit>3){if(dist(u,u.repair)>2.5)move(u,u.repair.x,u.repair.y,dt);else{u.repair.hp=Math.min(u.repair.maxHp,u.repair.hp+9*dt);if(u.attack<=0){pushEffect({kind:'repair',x:u.repair.x,y:u.repair.y,color:'#d7e9b4',life:0,max:.6});u.attack=1}}}
else{let goal=u.goal;if(!goal||goal.dead||goal.owner===u.team||u.order<=0)goal=chooseGoal(u);if(goal){const d=dist(u,goal);if(d<=TYPES[u.type].range+goal.r){if(u.attack<=0)shoot(u,goal,true)}else move(u,goal.x+u.offsetX*goal.r*.5,goal.y+u.offsetY*goal.r*.5,dt)}}
if(u.paint<=0){claim(u.x,u.y,TYPES[u.type].paint,u.team);u.paint=.48}}
function updateBuilding(b,dt){if(b.dead)return;if(b.owner<0){for(let t=0;t<4;t++)b.damage[t]*=.999;return}const t=b.owner;b.shot-=dt;b.claimClock-=dt;
if(b.shot<=0){const target=nearestEnemy(b.x,b.y,t,b.kind==='base'?13:9);if(target){const dmg=b.kind==='base'?17:4;damageUnit(target,dmg,t);b.aim=Math.atan2(target.y-b.y,target.x-b.x);pushEffect({kind:'bullet',x:b.x,y:b.y,tx:target.x,ty:target.y,color:b.kind==='base'?'#fff4ba':'#c9d5bb',life:0,max:.18});sim.shots++;b.shot=b.kind==='base'?1.1:2.4}else b.shot=.55}
if(b.claimClock<=0){b.claimClock=.8;const radius=b.kind==='base'?13:Math.min(12,5+(sim.time-b.builtAt)/8);for(let i=0;i<9;i++){const a=random(0,Math.PI*2),r=Math.sqrt(rng())*radius;claim(b.x+Math.cos(a)*r,b.y+Math.sin(a)*r,1.6,t,true)}claim(b.x,b.y,b.r+.8,t)}
if(sim.time-b.lastHit>10)b.hp=Math.min(b.maxHp,b.hp+(b.kind==='base'?2:1.2)*dt);
for(let k=0;k<4;k++)b.damage[k]*=.999;
if(!b.production)return;let pending=b.queue.reduce((a,c)=>a+c,0);if(pending===0){b.cycle-=dt;if(b.cycle<=0){b.queue=b.production.slice();pending=b.queue.reduce((a,c)=>a+c,0);b.queueIndex=integer(0,3)}}
if(pending>0){b.spawnClock-=dt;if(b.spawnClock<=0){b.spawnClock=.18;let attempts=0,done=0;while(done<3&&attempts<8&&sim.teams[t].count<CAP){const type=b.queueIndex++%4;attempts++;if(b.queue[type]>0&&spawn(t,type,b)){b.queue[type]--;done++}}if(b.queue.every(n=>n===0)){b.cycle=b.kind==='base'?12:WAVE;flashRing(b.x,b.y,t,'spawn')}}}}
function kill(u){if(u.dead)return;releaseJob(u);u.dead=true;const tm=sim.teams[u.team];tm.count--;tm.types[u.type]--;tm.lost++;if(u.lastAttacker>=0&&u.lastAttacker!==u.team)sim.teams[u.lastAttacker].kills++;sim.unitMap.delete(u.id);pushEffect({kind:'death',x:u.x,y:u.y,color:color(u.team),life:0,max:.5})}
function capture(b,t){const old=b.owner;if(b.worker!==null){const worker=sim.unitMap.get(b.worker);if(worker)releaseJob(worker,true);b.worker=null;b.progress=0}b.owner=t;b.hp=b.maxHp*.72;b.pending=0;b.damage.fill(0);b.queue=[0,0,0,0];b.cycle=WAVE;b.shot=1.3;b.builtAt=sim.time;b.captures++;sim.captures++;claim(b.x,b.y,5,t);flashRing(b.x,b.y,t);log(teamName(t)+' <strong>#'+pad(b.id+1)+'</strong> '+(old<0?'점령':'탈환')+(b.tier?' · '+b.tier+'등급 생산시설 확보':''),'capture');uiDirty=true}
function eliminate(t){const tm=sim.teams[t];if(!tm.alive)return;tm.landAtLoss=tm.land;tm.alive=false;const b=sim.bases[t];b.dead=true;b.hp=0;b.pending=0;for(const u of sim.units)if(u.team===t)kill(u);for(const tower of sim.towers)if(tower.owner===t){if(tower.worker!==null){const worker=sim.unitMap.get(tower.worker);if(worker)releaseJob(worker)}tower.worker=null;tower.progress=0;tower.owner=-1;tower.hp=tower.maxHp;tower.pending=0;tower.damage.fill(0);tower.queue=[0,0,0,0];tower.cycle=WAVE}for(let i=0;i<CELLS;i++)if(sim.owner[i]===t)setLand(i,-1);flashRing(b.x,b.y,t);log(teamName(t)+' <strong>본진 함락 · 탈락</strong>. 잔여 타워는 중립화됩니다.','elimination');toast(TEAM[t].name+'팀 본진 함락');}
function resolveDamage(){for(const u of sim.units){if(u.dead||u.pending===0)continue;u.hp-=u.pending;u.pending=0;if(u.hp<=0)kill(u)}const fallen=[];for(const b of sim.buildings){if(b.dead||b.pending===0)continue;b.hp-=b.pending;b.pending=0;if(b.hp<=0){if(b.kind==='base')fallen.push(b.owner);else{let best=-1,max=-1;for(let t=0;t<4;t++)if(t!==b.owner&&sim.teams[t].alive&&b.damage[t]>max){best=t;max=b.damage[t]}if(best>=0)capture(b,best)}}}for(const t of fallen)eliminate(t);sim.units=sim.units.filter(u=>!u.dead)}
function updateCounts(){for(const tm of sim.teams){tm.towers=0;tm.factories=0}for(const b of sim.towers)if(b.owner>=0){sim.teams[b.owner].towers++;if(b.production)sim.teams[b.owner].factories++}}
function ranking(){return [0,1,2,3].sort((a,b)=>Number(sim.teams[b].alive)-Number(sim.teams[a].alive)||sim.teams[b].land-sim.teams[a].land||sim.teams[b].towers-sim.teams[a].towers||sim.bases[b].hp-sim.bases[a].hp||sim.teams[b].count-sim.teams[a].count)}
function sameScore(a,b){return sim.teams[a].alive===sim.teams[b].alive&&sim.teams[a].land===sim.teams[b].land&&sim.teams[a].towers===sim.teams[b].towers&&Math.round(sim.bases[a].hp)===Math.round(sim.bases[b].hp)&&sim.teams[a].count===sim.teams[b].count}
function finish(reason){if(sim.finished)return;sim.finished=true;paused=true;follow=false;const order=ranking(),alive=order.filter(t=>sim.teams[t].alive);sim.winners=alive.length===1?alive:alive.length===0?[]:order.filter(t=>sameScore(t,order[0]));const text=sim.winners.length===0?'동시 함락 · 무승부':sim.winners.map(t=>TEAM[t].name+'팀').join(' · ')+(sim.winners.length>1?' 공동 승리':' 승리');$('#resultTitle').textContent=text;$('#resultTitle').style.color=sim.winners.length===1?color(sim.winners[0]):'#e8efdf';$('#resultReason').textContent=reason==='base'?'본진 생존전 종료. 마지막까지 살아남은 진영이 전장을 차지했습니다.':'15분 영토전 종료. 생존 진영의 점령한 칸 수를 먼저 비교했습니다.';if(!alive.length)$('#resultReason').textContent='마지막 본진들이 같은 순간에 무너졌습니다.';$('#resultRanks').innerHTML=order.map((t,i)=>'<div class="result-rank"><span class="dim">'+(i+1)+'</span>'+teamName(t)+'<strong class="mono">'+pct(sim.teams[t].land)+'%</strong><span class="dim">타워 '+sim.teams[t].towers+'</span></div>').join('');$('#resultSub').textContent=clock(sim.time)+' 진행 · 개조 '+sim.renovations+'회 · 누적 전사 '+sim.teams.reduce((a,t)=>a+t.lost,0)+'명';log('<strong>'+text+'</strong> · 전투 종료','result');$('#pauseBtn').textContent='결과 보기';$('#pauseBtn').setAttribute('aria-pressed','true');$('#followBtn').setAttribute('aria-pressed','false');$('#liveState').textContent='FINISHED';$('#resultDialog').showModal();uiDirty=true}
function step(dt=STEP){if(sim.finished)return;sim.tick++;sim.time=sim.tick*STEP;for(const e of sim.effects)e.life+=dt;sim.effects=sim.effects.filter(e=>e.life<e.max);hashBuild();if(sim.tick%40===0){for(const a of sim.commit)a.fill(0);for(const u of sim.units)if(u.goal&&!u.dead)sim.commit[u.team][u.goal.id]++}
for(const b of sim.buildings)updateBuilding(b,dt);const n=sim.units.length;for(let i=0;i<n;i++)updateUnit(sim.units[i],dt);resolveDamage();if(sim.tick%10===0){updateCounts();if(sim.teams.filter(t=>t.alive).length<=1)finish('base');else if(sim.time>=LIMIT)finish('time')}}
function screen(x,y){const s=view.fit*view.zoom;return{x:(x-view.x)*s+view.w/2,y:(y-view.y)*s+view.h/2}}

ctx.save();ctx.translate(p.x,p.y);const c=color(b.owner);if(b.dead){ctx.strokeStyle='#67747d';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-r,-r);ctx.lineTo(r,r);ctx.moveTo(-r,r);ctx.lineTo(r,-r);ctx.stroke();ctx.restore();return}
if(b.kind==='base'){ctx.fillStyle=c+'24';ctx.fillRect(-r-4,-r-4,r*2+8,r*2+8);ctx.strokeStyle=c;ctx.lineWidth=2;ctx.strokeRect(-r-3,-r-3,r*2+6,r*2+6);ctx.fillStyle='#0c1b24';ctx.fillRect(-r,-r,r*2,r*2);ctx.fillStyle=c;ctx.fillRect(-r*.7,-r*.7,r*1.4,r*1.4);ctx.fillStyle='#13212b';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold '+Math.max(10,r)+'px sans-serif';ctx.fillText(TEAM[b.owner].symbol,0,0)}

function drawUnit(u,s){if(u.inside||u.dead)return;const p=screen(u.x,u.y);if(p.x< -8||p.x>view.w+8||p.y< -8||p.y>view.h+8)return;const r=Math.max(1.2,s*(u.type===2?.52:.4));ctx.fillStyle=u.flash>0?'#fff6d9':color(u.team);ctx.save();ctx.translate(p.x,p.y);if(u.type===0){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill()}else if(u.type===1){ctx.rotate(u.angle+Math.PI/2);ctx.beginPath();ctx.moveTo(0,-r*1.45);ctx.lineTo(r,r);ctx.lineTo(-r,r);ctx.closePath();ctx.fill()}else if(u.type===2){ctx.rotate(u.angle);ctx.beginPath();ctx.moveTo(r*1.5,0);ctx.lineTo(-r*.7,-r);ctx.lineTo(-r*.25,0);ctx.lineTo(-r*.7,r);ctx.closePath();ctx.fill()}else{ctx.fillRect(-r,-r,2*r,2*r);if(s>4){ctx.fillStyle='#14212b';ctx.fillRect(-r*.3,-r*.3,r*.6,r*.6)}}if(view.zoom>3.3&&u.hp<u.maxHp*.8){ctx.fillStyle='#071018';ctx.fillRect(-3,-r-4,6,1.5);ctx.fillStyle=color(u.team);ctx.fillRect(-3,-r-4,6*Math.max(0,u.hp/u.maxHp),1.5)}ctx.restore()}
function drawEffect(e,s){const k=e.life/e.max,p=screen(e.x,e.y);ctx.globalAlpha=1-k;ctx.strokeStyle=e.color;ctx.fillStyle=e.color;ctx.lineWidth=1.5;

else if(e.kind==='capture'||e.kind==='upgrade'){const r=(2+k*8)*s;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.stroke()}

function inspect(){const b=selectedObject();if(!selected)return '<div class="eyebrow">거점 정찰</div><h2>어디를 살펴볼까요?</h2><div class="empty">전장의 타워나 본진을 누르면<br>체력 · 소유 진영 · 생산량이 나타납니다.<br><br>확대하면 개별 병력도 선택할 수 있어요.</div><div class="hint-box">오른쪽 + / − 또는 두 손가락으로 확대하세요. 드래그해서 전장을 이동할 수 있습니다.</div>';
if(!b)return '<h2>전사한 병력</h2><div class="empty">선택한 병력이 전투에서 전사했습니다.<br>다른 병력이나 거점을 선택하세요.</div>';
if(b.kind==='cell'){const x=clamp(Math.floor(b.x),0,179),y=clamp(Math.floor(b.y),0,179),o=sim.owner[y*N+x];return '<div class="eyebrow">격자 정보</div><h2>('+x+', '+y+')</h2><div class="owner" style="color:'+color(o)+'">'+(o<0?'미점령 지역':TEAM[o].name+'팀 영토')+'</div><p class="inspect-note">병력의 이동과 거점 주변 확장으로 소유 진영이 바뀝니다. 모든 지형을 통과할 수 있습니다.</p>'}
if(b.kind==='unit'){const st=TYPES[b.type];let status=b.inside?'타워 내부에서 개조 중':b.job?'타워 #'+pad(b.job.id+1)+' 개조하러 이동':b.enemy?'적 병력과 교전 중':b.repair?'거점 수리 중':b.goal?(b.goal.kind==='base'?'적 본진':'타워 #'+pad(b.goal.id+1))+' 진격':'진격 준비';return '<div class="eyebrow">병력 #'+b.id+'</div><h2>'+st.icon+' '+TEAM[b.team].name+'팀 '+st.name+'</h2><div class="owner" style="color:'+color(b.team)+'">'+st.role+'</div>'+healthBar(b.hp,b.maxHp)+'<div class="attribute"><span>현재 행동</span><strong>'+status+'</strong></div><div class="attribute"><span>공격력 / 공격 간격</span><strong>'+st.damage+' / '+st.rate+'초</strong></div><div class="attribute"><span>사거리 / 이동 속도</span><strong>'+st.range+'칸 / '+st.speed+'칸·초</strong></div><button class="focus-button" data-action="focus">이 병력 위치 보기</button>'}
const base=b.kind==='base',sum=b.production?b.production.reduce((a,c)=>a+c,0):0,queue=b.queue.reduce((a,c)=>a+c,0);let html='<div class="eyebrow">'+(base?'HEADQUARTERS':'TOWER '+pad(b.id+1))+' · '+Math.floor(b.x)+', '+Math.floor(b.y)+'</div><div class="inspect-title"><h2>'+(base?TEAM[b.owner].name+'팀 본진':'타워 #'+pad(b.id+1))+'</h2>'+(b.tier?'<span class="tier" style="color:'+TIER_COLOR[b.tier]+'">'+b.tier+'</span>':'')+'</div><div class="owner" style="color:'+color(b.owner)+'">'+(b.dead?'함락됨':b.owner<0?'중립 · 점령 대기':TEAM[b.owner].name+'팀 소유')+'</div>'+healthBar(b.hp,b.maxHp);
html+='<div class="attribute"><span>방어 사격</span><strong>'+(b.dead?'작동 중지':b.owner<0?'점령 후 활성화':(base?'피해 17 · 1.1초마다':'피해 4 · 2.4초마다'))+'</strong></div><div class="attribute"><span>사거리</span><strong>'+(base?'13':'9')+'칸</strong></div>';
if(b.production){html+='<div class="section-title">회당 생산량 <span class="dim">· 총 '+sum+'명</span></div><div class="production">'+b.production.map((n,i)=>'<div class="'+(n===0?'zero':'')+'"><span>'+TYPES[i].name+'</span><b>'+n+'</b></div>').join('')+'</div><div class="progress-text"><span>'+(b.owner<0||b.dead?'생산 정지':queue?'증원 출격 '+queue+'명 대기':'다음 증원까지')+'</span><strong class="mono">'+(b.owner<0||b.dead?'—':queue?(sim.teams[b.owner].count>=CAP?'병력 정원 도달':'출격 중'):Math.ceil(Math.max(0,b.cycle))+'초')+'</strong></div><div class="progress"><span style="width:'+(b.owner<0||b.dead?0:queue?100:100*(1-b.cycle/(base?12:WAVE)))+'%"></span></div><p class="inspect-note">'+(base?'기본 증원은 12초 주기입니다. 본진이 무너지면 해당 팀이 탈락합니다.':'증원 주기 20초. 점령한 팀이 생산 성능을 그대로 이어받습니다. 정원 '+CAP+'명 초과분은 자리가 생길 때 출격합니다.')+'</p>'}
else if(b.worker!==null){html+='<div class="section-title">건설병 개조 임무</div><div class="progress-text"><span>'+(b.progress>0?'타워 내부에서 작업 중':'건설병이 이동 중')+'</span><strong class="mono">'+(b.progress>0?Math.floor(b.progress/WORK*100)+'%':'도착 대기')+'</strong></div><div class="progress"><span style="width:'+b.progress/WORK*100+'%"></span></div><p class="inspect-note">도착 후 12초 작업. 완료 시 병종별 0~5명 생산 능력을 추첨합니다.</p>'}
else html+='<div class="hint-box">'+(b.owner<0?'체력을 0으로 만들면 점령합니다. 점령 후 건설병이 찾아와 생산 타워로 개조합니다.':'아직 생산시설이 없습니다. 건설병이 7~17초 간격으로 미개조 타워를 찾아 임무를 배정받습니다.')+'</div>';
return html+'<button class="focus-button" data-action="focus">이 거점 확대해서 보기</button>'}
function towerList(){const f=$('#teamFilter').value,sort=$('#towerSort').value;let list=sim.towers.filter(b=>f==='all'||b.owner===Number(f));if(sort==='tier')list.sort((a,b)=>(b.production?b.production.reduce((x,y)=>x+y,0):-1)-(a.production?a.production.reduce((x,y)=>x+y,0):-1)||a.id-b.id);else if(sort==='work')list.sort((a,b)=>Number(b.worker!==null)-Number(a.worker!==null)||a.id-b.id);return '<div class="panel-title-row"><h2>거점 목록</h2><span>'+list.length+'개</span></div>'+list.map(b=>'<button class="tower-item" data-tower="'+b.id+'"><span class="name" style="color:'+color(b.owner)+'">#'+pad(b.id+1)+' · '+(b.owner<0?'중립':TEAM[b.owner].name+'팀')+'</span><span class="meta">'+(b.production?b.production.join(' / ')+'명 · '+(b.owner<0?'생산 정지':b.queue.some(n=>n>0)?'증원 대기':Math.ceil(Math.max(0,b.cycle))+'초 후'):b.worker!==null?b.progress>0?'개조 중 '+Math.floor(b.progress/WORK*100)+'%':'건설병 이동 중':'미개조 · 내구도 '+Math.ceil(b.hp))+'</span><span class="tier" style="color:'+(b.tier?TIER_COLOR[b.tier]:'#58707e')+'">'+(b.tier||'—')+'</span></button>').join('')+(list.length?'':'<div class="empty">해당하는 타워가 없습니다.</div>')}
const helpHTML='<div class="help"><h3>전투의 흐름</h3><ol><li>네 팀이 각 본진에서 자동으로 출격합니다.</li><li>병력이 지나간 땅과 거점 주변이 팀 색으로 물듭니다.</li><li>중립·적 타워의 체력 360을 깎으면 점령합니다. 여러 팀이 공격하면 최근 누적 피해 기여가 가장 큰 팀이 차지합니다.</li><li>점령 타워는 피해 4의 총을 2.4초마다 쏩니다. 사거리는 9칸입니다.</li><li>건설병은 7~17초 간격으로 임무를 찾습니다. 타워에 들어가 12초간 개조하고 다시 나옵니다.</li></ol><h3>무작위 생산 능력과 등급</h3><p>개조 시 보병·궁병·기병·건설병을 각각 0~5명으로 독립 추첨합니다. 모두 0이면 다시 추첨합니다. <b>4종 생산량의 합계</b>로 등급이 정해집니다.</p><table><tr><th>등급</th><th>S</th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td>회당 합계</td><td>17~20</td><td>13~16</td><td>9~12</td><td>5~8</td><td>1~4</td></tr></table><p>개조 타워는 20초 주기로 증원합니다. 개조 성능과 등급은 탈환되어도 유지되며 새 소유 진영을 생산합니다. 재점령 시 생산 주기가 다시 시작됩니다.</p><p>팀당 정원은 360명입니다. 초과한 증원은 해당 타워에서 대기하며, 자리가 생기면 출격합니다. 대기 중에는 다음 생산 주기가 진행되지 않습니다.</p><h3>병종</h3><table><tr><th>병종</th><th>체력</th><th>공격</th><th>사거리</th></tr><tr><td>● 보병</td><td>108</td><td>10</td><td>1.15</td></tr><tr><td>▲ 궁병</td><td>65</td><td>8</td><td>6.5</td></tr><tr><td>◆ 기병</td><td>145</td><td>14</td><td>1.35</td></tr><tr><td>▣ 건설병</td><td>78</td><td>4</td><td>1.1</td></tr></table><p>기병이 가장 빠릅니다. 건설병은 개조할 타워가 없으면 전투와 영토 확보에 참여하고, 가까운 아군 거점을 비전투 중 수리합니다. 타워 개조 중에는 내부에 있어 공격받지 않습니다. 작업 중 타워가 빼앗기면 개조는 취소되고 부상을 입은 채 나옵니다.</p><h3>승리 조건</h3><p>본진 체력은 3,200입니다. 본진이 함락되면 그 팀의 병력이 사라지고 영토·타워는 중립으로 돌아갑니다. <b>마지막 본진이 살아남은 팀이 즉시 승리</b>합니다.</p><p>15분까지 여러 팀이 살아남으면 <b>영토 칸 수 → 점령 타워 수 → 본진 체력 → 병력 수</b> 순으로 비교합니다. 완전히 같으면 공동 승리입니다.</p><h3>관전 조작</h3><p>화면 드래그: 지도 이동<br>두 손가락 / 휠 / + −: 확대·축소<br>타워·본진·병력 누르기: 상세 정보<br>팀 카드 누르기: 해당 본진 확대<br>교전 추적: 전투 지역 자동 따라가기<br>스페이스: 정지 / 재생 · 1/2/4/8: 속도<br>F: 전체 지도 · Esc: 선택 해제</p><p>모든 지형은 통과할 수 있습니다. 지도는 180×180칸이며 타워 87개와 본진 4개는 별개입니다. 화면을 떠난 동안에는 전투가 진행되지 않습니다.</p></div>';
function renderPanel(){const scroll=ui.panel.scrollTop;ui.panel.innerHTML=tab==='overview'?overview():tab==='inspect'?inspect():tab==='towers'?towerList():tab==='logs'?'<div class="panel-title-row"><h2>전투 기록</h2><span>최근 120건</span></div>'+eventHTML(sim.logs):helpHTML;ui.panel.scrollTop=scroll}
function switchTab(t){tab=t;$$('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===t);b.setAttribute('aria-current',b.dataset.tab===t?'page':'false')});$('#listFilter').hidden=t!=='towers';ui.panel.scrollTop=0;renderPanel()}
function select(obj){selected={kind:obj.kind,id:obj.id,x:obj.x,y:obj.y};switchTab('inspect');uiDirty=true}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function pause(){if(sim.finished){$('#resultDialog').showModal();return}paused=!paused;acc=0;$('#pauseBtn').textContent=paused?'▶ 재생':'Ⅱ 정지';$('#pauseBtn').setAttribute('aria-pressed',String(paused));$('#liveState').textContent=paused?'PAUSED':'AUTO RTS';updateUI()}
function setSpeed(s){speed=s;$$('[data-speed]').forEach(b=>{const on=Number(b.dataset.speed)===s;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))})}
$('#pauseBtn').addEventListener('click',pause);$$('[data-speed]').forEach(b=>b.addEventListener('click',()=>setSpeed(Number(b.dataset.speed))));$$('[data-tab]').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
$('#labelsBtn').addEventListener('click',()=>{labels=!labels;$('#labelsBtn').setAttribute('aria-pressed',String(labels))});$('#followBtn').addEventListener('click',()=>{follow=!follow;if(follow){view.zoom=Math.max(2.5,view.zoom);toast('교전 지역을 따라갑니다. 드래그하면 해제됩니다.')}else cameraTarget=null;$('#followBtn').setAttribute('aria-pressed',String(follow));updateUI()});
$('#zoomIn').addEventListener('click',()=>zoomBy(1.5));$('#zoomOut').addEventListener('click',()=>zoomBy(1/1.5));$('#fitMap').addEventListener('click',()=>{focus(90,90,1);updateUI()});$('#helpTop').addEventListener('click',()=>switchTab('help'));
$('#newGame').addEventListener('click',()=>$('#resetDialog').showModal());$('#cancelReset').addEventListener('click',()=>$('#resetDialog').close());$('#confirmReset').addEventListener('click',()=>start());$('#playAgain').addEventListener('click',()=>start());$('#closeResult').addEventListener('click',()=>$('#resultDialog').close());
$('#teamCards').addEventListener('click',e=>{const b=e.target.closest('[data-team]');if(b){const base=sim.bases[Number(b.dataset.team)];select(base);focus(base.x,base.y,2.7)}});
$('#teamFilter').addEventListener('change',renderPanel);$('#towerSort').addEventListener('change',renderPanel);
ui.panel.addEventListener('click',e=>{const tower=e.target.closest('[data-tower]'),action=e.target.closest('[data-action]');if(tower){const b=sim.towers[Number(tower.dataset.tower)];select(b);focus(b.x,b.y,3.2)}if(action){if(action.dataset.action==='help')switchTab('help');else{const b=selectedObject();if(b)focus(b.x,b.y,3.2)}}});
function pointerPos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;const p=pointerPos(e);pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);suppressTap=false;if(pointers.size===1){drag={startX:p.x,startY:p.y,lastX:p.x,lastY:p.y,moved:false};pinching=false}else{pinching=true;suppressTap=true;const v=[...pointers.values()];drag={distance:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),midX:(v[0].x+v[1].x)/2,midY:(v[0].y+v[1].y)/2,moved:true}}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=pointerPos(e);pointers.set(e.pointerId,p);if(pointers.size>=2){const v=[...pointers.values()],d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),mx=(v[0].x+v[1].x)/2,my=(v[0].y+v[1].y)/2;if(drag&&drag.distance){zoomBy(d/drag.distance,mx,my);view.x-=(mx-drag.midX)/(view.fit*view.zoom);view.y-=(my-drag.midY)/(view.fit*view.zoom);keepCamera()}drag={distance:d,midX:mx,midY:my,moved:true};pinching=true;suppressTap=true;return}if(!drag||pinching)return;const dx=p.x-drag.lastX,dy=p.y-drag.lastY;if(Math.hypot(p.x-drag.startX,p.y-drag.startY)>5)drag.moved=true;if(drag.moved){view.x-=dx/(view.fit*view.zoom);view.y-=dy/(view.fit*view.zoom);keepCamera();follow=false;cameraTarget=null;$('#followBtn').setAttribute('aria-pressed','false');canvas.classList.add('dragging')}drag.lastX=p.x;drag.lastY=p.y});
function pointerEnd(e){const p=pointerPos(e),tap=e.type==='pointerup'&&pointers.size===1&&drag&&!drag.moved&&!pinching&&!suppressTap;pointers.delete(e.pointerId);if(tap){const s=view.fit*view.zoom;let best=null,bd=Infinity;for(const b of sim.buildings){const q=screen(b.x,b.y),d=Math.hypot(q.x-p.x,q.y-p.y);if(d<Math.max(b.kind==='base'?18:13,b.r*s+7)&&d<bd){best=b;bd=d}}if(!best){for(const u of sim.units){if(u.inside||u.dead)continue;const q=screen(u.x,u.y),d=Math.hypot(q.x-p.x,q.y-p.y);if(d<9&&d<bd){best=u;bd=d}}}if(best)select(best);else{const w=world(p.x,p.y);if(w.x>=0&&w.x<N&&w.y>=0&&w.y<N)select({kind:'cell',x:w.x,y:w.y})}}
if(pointers.size===0){drag=null;pinching=false;suppressTap=false;canvas.classList.remove('dragging')}else{pinching=true;suppressTap=true}if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId)}
canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',pointerEnd);canvas.addEventListener('wheel',e=>{e.preventDefault();const p=pointerPos(e);zoomBy(Math.exp(-e.deltaY*.0014),p.x,p.y)},{passive:false});
mini.addEventListener('pointerdown',e=>{const r=mini.getBoundingClientRect();focus((e.clientX-r.left)/r.width*N,(e.clientY-r.top)/r.height*N,view.zoom)});
window.addEventListener('keydown',e=>{if(e.target.matches('input,select,button')||$('#resetDialog').open||$('#resultDialog').open)return;if(e.code==='Space'){e.preventDefault();pause()}else if(['1','2','4','8'].includes(e.key))setSpeed(Number(e.key));else if(e.key.toLowerCase()==='f')focus(90,90,1);else if(e.key==='Escape'){selected=null;switchTab('overview')}else if(e.key==='+'||e.key==='=')zoomBy(1.5);else if(e.key==='-')zoomBy(1/1.5)});
document.addEventListener('visibilitychange',()=>{last=0;acc=0});new ResizeObserver(resize).observe($('#canvasWrap'));
function loop(now){requestAnimationFrame(loop);if(document.hidden){last=now;return}const elapsed=last?Math.min((now-last)/1000,.12):0;last=now;if(!paused&&!$('#resetDialog').open){acc+=elapsed*speed;let steps=0;while(acc>=STEP&&steps<20&&!sim.finished){step();acc-=STEP;steps++}if(steps>=20)acc=Math.min(acc,STEP)}
if(follow&&!paused){const hot=sim.hotspot;if(hot&&sim.time-hot.time<10){cameraTarget=hot}else if(!cameraTarget&&sim.units.length){const moving=sim.units.find(u=>u.goal&&!u.inside);if(moving)cameraTarget=moving}if(cameraTarget){const rate=1-Math.exp(-elapsed*1.6);view.x+=(cameraTarget.x-view.x)*rate;view.y+=(cameraTarget.y-view.y)*rate;keepCamera()}}
uiTime+=elapsed;if(uiTime>=.45||uiDirty){uiTime=0;updateUI()}render()}
resize();start();requestAnimationFrame(loop);
// Readable diagnostic hooks are exposed only when explicitly opening ?qa=1.
if(new URLSearchParams(location.search).has('qa'))window.__RTS={get state(){return sim},get view(){return view},step(seconds){const wasPaused=paused;paused=true;for(let i=0;i<Math.round(seconds/STEP)&&!sim.finished;i++)step();updateCounts();updateUI();render();paused=wasPaused;return {time:sim.time,units:sim.units.length,captures:sim.captures,renovations:sim.renovations,shots:sim.shots,teams:sim.teams}},reset:s=>start(s),pause:()=>{paused=true},select:id=>select(sim.buildings[id]),focus,grade,spawn,capture,damageBuilding,assignJob,constants:{N,CAP,WAVE,WORK,LIMIT}};
})();
</script>
