<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>PURPLE GRAVITY RUSH</title>
  <style>
    :root {
      color-scheme: dark;
      --purple:#8a2bff;
      --purple2:#471078;
      --panel:rgba(7,0,14,.78);
      --line:rgba(176,91,255,.54);
      --safe-t:env(safe-area-inset-top,0px);
      --safe-b:env(safe-area-inset-bottom,0px);
      --safe-l:env(safe-area-inset-left,0px);
      --safe-r:env(safe-area-inset-right,0px);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#fff; overscroll-behavior:none; }
    body { position:fixed; inset:0; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
    button { font:inherit; color:inherit; }
    #game { position:absolute; inset:0; width:100%; height:100%; display:block; background:#000; touch-action:none; }
    #hud { position:absolute; inset:0; pointer-events:none; padding:calc(var(--safe-t) + 8px) calc(var(--safe-r) + 8px) calc(var(--safe-b) + 8px) calc(var(--safe-l) + 8px); display:flex; flex-direction:column; justify-content:space-between; gap:8px; }
    .glass { background:var(--panel); border:1px solid var(--line); box-shadow:0 0 18px rgba(106,21,198,.16),inset 0 0 0 1px rgba(255,255,255,.025); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
    #top { width:min(940px,calc(100vw - 16px)); align-self:center; border-radius:14px; overflow:hidden; }
    #summary { min-height:46px; display:flex; align-items:center; gap:14px; padding:6px 10px; border-bottom:1px solid rgba(165,77,255,.24); }
    #brand { min-width:180px; }
    #brand strong { display:block; color:#d5aaff; font-size:13px; line-height:1; letter-spacing:.13em; }
    #brand span { color:#9472ad; font-size:9px; letter-spacing:.06em; }
    #raceInfo { flex:1; display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
    .metric { min-width:0; text-align:center; }
    .metric b { display:block; font-size:12px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .metric small { display:block; margin-top:1px; font-size:8px; color:#9877ae; letter-spacing:.08em; }
    #teams { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:rgba(120,30,190,.22); }
    .team { --c:#fff; min-width:0; padding:6px 8px 7px; background:rgba(3,0,7,.9); border-top:2px solid var(--c); }
    .teamHead { display:flex; align-items:center; justify-content:space-between; gap:4px; font-size:10px; font-weight:800; }
    .teamName { display:flex; align-items:center; min-width:0; }
    .dot { width:8px; height:8px; flex:0 0 auto; margin-right:5px; border-radius:50%; background:var(--c); box-shadow:0 0 8px var(--c); }
    .teamMeta { color:#bca7c9; font-size:9px; white-space:nowrap; }
    .bar { height:3px; margin-top:5px; overflow:hidden; border-radius:9px; background:#1c1023; }
    .bar i { display:block; width:0; height:100%; border-radius:inherit; background:var(--c); box-shadow:0 0 7px var(--c); transition:width .25s linear; }
    #bottom { align-self:center; width:min(1040px,calc(100vw - 16px)); display:flex; align-items:flex-end; justify-content:center; gap:8px; }
    #controls { pointer-events:auto; display:flex; flex-wrap:wrap; justify-content:center; gap:5px; padding:6px; border-radius:14px; }
    .btn { min-width:44px; min-height:44px; padding:5px 9px; border:1px solid rgba(177,92,255,.35); border-radius:10px; background:rgba(31,5,51,.88); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px; font-size:10px; font-weight:750; letter-spacing:.02em; transition:.12s transform,.12s background,.12s border-color; }
    .btn:active { transform:scale(.94); background:#59149a; }
    .btn.active { background:#6920ac; border-color:#d1a0ff; box-shadow:0 0 10px rgba(162,75,255,.34); }
    .btn .ico { font-size:15px; line-height:1; }
    .speed { min-width:44px; padding-inline:6px; }
    #event { position:absolute; left:50%; bottom:calc(var(--safe-b) + 74px); translate:-50% 12px; max-width:min(620px,88vw); padding:8px 16px; opacity:0; border:1px solid rgba(193,123,255,.45); border-radius:999px; background:rgba(9,0,17,.88); box-shadow:0 0 25px rgba(112,25,211,.25); font-size:12px; font-weight:800; text-align:center; pointer-events:none; transition:.2s opacity,.25s translate; }
    #event.show { opacity:1; translate:-50% 0; }
    #countdown { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; font-size:clamp(64px,17vw,170px); font-weight:1000; font-style:italic; letter-spacing:-.09em; color:#fff; opacity:0; text-shadow:0 0 10px #b859ff,0 0 40px #7817cb,6px 8px 0 #4a006d; }
    #countdown.show { animation:pop .68s ease both; }
    @keyframes pop { 0%{opacity:0;transform:scale(1.45)} 22%{opacity:1;transform:scale(.92)} 66%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(.72)} }
    .overlay { position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:calc(var(--safe-t) + 20px) calc(var(--safe-r) + 20px) calc(var(--safe-b) + 20px) calc(var(--safe-l) + 20px); background:radial-gradient(circle at 50% 45%,rgba(79,4,139,.27),rgba(0,0,0,.88) 55%,#000 100%); }
    .overlay.hidden { display:none; }
    .hero { width:min(560px,94vw); text-align:center; padding:28px 22px; border-radius:24px; background:linear-gradient(145deg,rgba(18,2,31,.93),rgba(3,0,7,.96)); border:1px solid rgba(181,79,255,.5); box-shadow:0 0 65px rgba(102,15,192,.22); }
    .eyebrow { color:#b96fff; font-size:10px; font-weight:900; letter-spacing:.26em; }
    .hero h1 { margin:9px 0 4px; font-size:clamp(28px,8vw,58px); line-height:.84; letter-spacing:-.065em; font-style:italic; text-shadow:0 0 24px rgba(164,63,255,.46); }
    .hero h2 { margin:12px 0 18px; color:#b89aca; font-size:13px; font-weight:650; }
    .legend { display:flex; justify-content:center; gap:9px; margin:16px 0 22px; }
    .orb { width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c); position:relative; }
    .orb:after { content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.8;left:4px;top:3px; }
    #startBtn { width:100%; min-height:56px; border:1px solid #c27cff; border-radius:15px; background:linear-gradient(90deg,#4f0a88,#8f22ee,#4f0a88); background-size:200% 100%; font-weight:950; letter-spacing:.08em; box-shadow:0 0 22px rgba(145,41,235,.38); animation:shine 3s linear infinite; cursor:pointer; }
    @keyframes shine { to { background-position:-200% 0; } }
    .hint { margin:13px 0 0; color:#755d84; font-size:9px; line-height:1.5; }
    #result { background:rgba(0,0,0,.7); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
    .resultCard { width:min(620px,94vw); max-height:88vh; overflow:auto; padding:24px; border-radius:22px; text-align:center; }
    #resultTitle { margin:4px 0 2px; font-size:clamp(32px,8vw,58px); line-height:1; font-style:italic; }
    #resultSub { margin:5px 0 18px; color:#b39ac2; font-size:11px; }
    #resultGrid { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; text-align:left; }
    .resultItem { padding:10px; border-radius:10px; background:rgba(68,20,100,.22); border:1px solid rgba(174,92,238,.15); }
    .resultItem small { display:block; color:#8f70a3; font-size:8px; margin-bottom:2px; letter-spacing:.05em; }
    .resultItem b { font-size:11px; }
    #nextLine { margin-top:15px; color:#a671ce; font-size:10px; }
    #stats { pointer-events:auto; position:absolute; right:calc(var(--safe-r) + 10px); bottom:calc(var(--safe-b) + 70px); z-index:12; width:min(270px,calc(100vw - 20px)); padding:14px; border-radius:15px; transform:translateX(calc(100% + 24px)); transition:.24s transform; }
    #stats.open { transform:translateX(0); }
    #stats h3 { margin:0 0 10px; font-size:12px; color:#d9b3ff; letter-spacing:.08em; }
    #statRows { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .stat { padding:8px; border-radius:8px; background:rgba(79,23,116,.25); }
    .stat small { display:block;color:#886c99;font-size:8px; }
    .stat b { font-size:12px; }
    #resetStats { position:relative; overflow:hidden; width:100%; margin-top:9px; min-height:44px; border:1px solid rgba(255,95,144,.35); border-radius:9px; background:rgba(85,10,36,.35); font-size:9px; color:#ff9cbd; }
    #resetStats:before { content:""; position:absolute; inset:0 auto 0 0; width:var(--hold,0%); background:rgba(255,61,126,.25); }
    #resetStats span { position:relative; }
    #quality { position:absolute; left:calc(var(--safe-l) + 10px); bottom:calc(var(--safe-b) + 10px); color:#4c3a58; font-size:8px; pointer-events:none; }
    @media (max-width:700px) {
      #hud { padding-top:calc(var(--safe-t) + 5px); }
      #top { width:calc(100vw - var(--safe-l) - var(--safe-r) - 10px); }
      #summary { min-height:40px;padding:4px 6px;gap:4px; }
      #brand { min-width:0;width:84px; }
      #brand strong { font-size:9px;letter-spacing:.05em;line-height:1.05; }
      #brand span { display:none; }
      #raceInfo { gap:1px; }
      .metric b { font-size:9px; }
      .metric small { font-size:6px;letter-spacing:0; }
      .team { padding:4px 4px 5px; }
      .teamHead { font-size:8px; }
      .teamMeta { font-size:7px; }
      .dot { width:6px;height:6px;margin-right:3px; }
      #bottom { width:calc(100vw - var(--safe-l) - var(--safe-r) - 8px); }
      #controls { gap:3px;padding:4px;max-width:100%; }
      .btn { min-width:44px;min-height:44px;padding:4px 6px;font-size:0;border-radius:9px; }
      .btn .ico { font-size:15px; }
      .speed { font-size:9px; }
      .speed .ico { display:none; }
      #event { bottom:calc(var(--safe-b) + 61px);font-size:10px;padding:7px 12px; }
      #stats { bottom:calc(var(--safe-b) + 61px); }
    }
    @media (max-width:430px) and (orientation:portrait) {
      #controls { display:grid;grid-template-columns:repeat(6,44px); }
      #bottom { align-items:center; }
      #quality { display:none; }
    }
    @media (max-height:520px) {
      #summary { min-height:36px; }
      .team { padding-block:3px; }
      .bar { margin-top:2px; }
      .btn { min-height:42px; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="네 팀의 자동 물리 레이스"></canvas>
  <div id="hud">
    <section id="top" class="glass" aria-live="polite">
      <div id="summary">
        <div id="brand"><strong>PURPLE GRAVITY RUSH</strong><span>보랏빛 중력 실험장의 네 팀</span></div>
        <div id="raceInfo">
          <div class="metric"><b id="roundV">1</b><small>ROUND</small></div>
          <div class="metric"><b id="timeV">00:00.0</b><small>TIME</small></div>
          <div class="metric"><b id="remainV">03:00</b><small>REMAIN</small></div>
          <div class="metric"><b id="leaderV">—</b><small>LEADER</small></div>
          <div class="metric"><b id="seedV">000000</b><small>SEED</small></div>
        </div>
      </div>
      <div id="teams"></div>
    </section>
    <div id="bottom">
      <nav id="controls" class="glass" aria-label="게임 조작">
        <button class="btn" id="pauseBtn" aria-label="일시정지"><span class="ico">Ⅱ</span><span>일시정지</span></button>
        <button class="btn" id="restartBtn" aria-label="현재 시드 다시 시작"><span class="ico">↻</span><span>다시 시작</span></button>
        <button class="btn" id="seedBtn" aria-label="다음 시드"><span class="ico">⌁</span><span>다음 시드</span></button>
        <button class="btn" id="cameraBtn" aria-label="카메라 모드"><span class="ico">◉</span><span id="cameraLabel">전체</span></button>
        <button class="btn" id="muteBtn" aria-label="음소거"><span class="ico">♪</span><span>사운드</span></button>
        <button class="btn" id="fullBtn" aria-label="전체 화면"><span class="ico">⛶</span><span>전체 화면</span></button>
        <button class="btn speed" data-speed="0.5">0.5×</button>
        <button class="btn speed active" data-speed="1">1×</button>
        <button class="btn speed" data-speed="2">2×</button>
        <button class="btn speed" data-speed="4">4×</button>
        <button class="btn" id="statsBtn" aria-label="누적 기록"><span class="ico">▥</span><span>기록</span></button>
      </nav>
    </div>
  </div>
  <div id="event"></div>
  <div id="countdown"></div>
  <aside id="stats" class="glass" aria-label="누적 기록">
    <h3>LAB ARCHIVE · 누적 기록</h3>
    <div id="statRows"></div>
    <button id="resetStats"><span>1.5초 길게 눌러 기록 초기화</span></button>
  </aside>
  <div id="quality">AUTO QUALITY · HIGH</div>
  <div id="start" class="overlay">
    <div class="hero">
      <div class="eyebrow">AUTONOMOUS PHYSICS RACE</div>
      <h1>PURPLE<br>GRAVITY RUSH</h1>
      <h2>보랏빛 중력 실험장의 네 팀</h2>
      <div class="legend" aria-hidden="true">
        <i class="orb" style="--c:#ff2738"></i><i class="orb" style="--c:#2f67ff"></i><i class="orb" style="--c:#ffe119"></i><i class="orb" style="--c:#39ef45"></i>
      </div>
      <button id="startBtn">화면을 터치하여 시작</button>
      <p class="hint">32개의 공 · 4개의 체크포인트 · 15종 물리 기믹<br>직접 조종하지 않아도 경기는 무한히 계속됩니다.</p>
    </div>
  </div>
  <div id="result" class="overlay hidden">
    <section class="resultCard glass">
      <div class="eyebrow">EXPERIMENT COMPLETE</div>
      <h2 id="resultTitle">RED TEAM WINS</h2>
      <p id="resultSub"></p>
      <div id="resultGrid"></div>
      <div id="nextLine">다음 실험까지 6초</div>
    </section>
  </div>
  <script>
  (() => {
    'use strict';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha:false, desynchronized:true });
    const $ = id => document.getElementById(id);
    const TAU = Math.PI * 2;
    const W = 2400, H = 1350;
    const BALL_R = 11;
    const FIXED = 1 / 120;
    const LIMIT = 180;
    const STORE_KEY = 'purpleGravityRush_v1';
    const TEAMS = [
      {name:'빨강', en:'RED', color:'#ff2738', dark:'#7c0612'},
      {name:'파랑', en:'BLUE', color:'#2f67ff', dark:'#0b2c86'},
      {name:'노랑', en:'YELLOW', color:'#ffe119', dark:'#8b7600'},
      {name:'초록', en:'GREEN', color:'#39ef45', dark:'#087d25'}
    ];
    const CAMERA_NAMES = {overview:'전체', auto:'자동 연출', leader:'선두 추적'};
    const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
    const lerp = (a,b,t) => a + (b-a)*t;
    const smooth = t => t*t*(3-2*t);
    const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}.${Math.floor((s%1)*10)}`;
    const fmtShort = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
    const overlap = (b,z) => b.x+b.r>z.x && b.x-b.r<z.x+z.w && b.y+b.r>z.y && b.y-b.r<z.y+z.h;

    class RNG {
      constructor(seed){ this.s = seed >>> 0 || 0x91e10da5; }
      next(){ let x=this.s; x^=x<<13; x^=x>>>17; x^=x<<5; this.s=x>>>0; return this.s/4294967296; }
      range(a,b){ return a+(b-a)*this.next(); }
      pick(a){ return a[(this.next()*a.length)|0]; }
    }

    let persistent = loadPersistent();
    function loadPersistent(){
      const base={wins:[0,0,0,0],races:0,best:null,lastSeed:(Date.now()%1000000)|0,mute:false,camera:'overview',speed:1};
      try { const p=JSON.parse(localStorage.getItem(STORE_KEY)||'null'); if(p) Object.assign(base,p); } catch(_){ }
      if(!Array.isArray(base.wins)||base.wins.length!==4) base.wins=[0,0,0,0];
      if(!CAMERA_NAMES[base.camera]) base.camera='overview';
      if(![.5,1,2,4].includes(Number(base.speed))) base.speed=1;
      return base;
    }
    function savePersistent(){ try { localStorage.setItem(STORE_KEY,JSON.stringify(persistent)); } catch(_){ } }

    const game = {
      started:false, paused:false, hiddenPause:false, state:'idle', round:1,
      seed:persistent.lastSeed||((Date.now()%1000000)|0), rng:null, elapsed:0,
      countdown:3.75, countShown:'', winner:-1, timeout:false, victoryReal:0,
      resultReal:0, resultRecorded:false, firstFinisher:null, maxImpact:null,
      balls:[], particles:[], waves:[], events:[], gatesOpen:false,
      lastLeader:-1, leaderCheck:0, eventCooldown:0, simTime:0, gameSpeed:Number(persistent.speed),
      quality:1, fpsAvg:60, frameSamples:[], accumulator:0, lastFrame:0, lastUI:0
    };

    const camera = {
      mode:persistent.camera, x:W/2, y:H/2, zoom:1, tx:W/2, ty:H/2, tz:1,
      manualUntil:0, shake:0, focusUntil:0, focusX:W/2, focusY:H/2, focusZoom:1.5,
      pointers:new Map(), lastPinch:0
    };
    let cw=1,ch=1,dpr=1;

    const staticRects=[];
    const ramps=[];
    const checkpoints=[
      {x:950,y:150,w:34,h:210,label:'CHECKPOINT 1'},
      {x:1235,y:720,w:165,h:28,label:'CHECKPOINT 2'},
      {x:800,y:895,w:34,h:225,label:'CHECKPOINT 3'},
      {x:1715,y:640,w:34,h:180,label:'CHECKPOINT 4'}
    ];
    const goalZone={x:2090,y:1120,w:150,h:112};
    const bumpers=[
      {x:530,y:1018,r:25},{x:670,y:960,r:28},{x:930,y:1020,r:27},
      {x:1600,y:740,r:23},{x:1960,y:742,r:25}
    ];
    const jumpPads=[
      {x:450,y:1087,w:90,h:20,vx:330,vy:-590},{x:1110,y:1087,w:105,h:20,vx:280,vy:-650},
      {x:1510,y:788,w:86,h:20,vx:340,vy:-470},{x:2060,y:1207,w:86,h:20,vx:260,vy:-560}
    ];
    const conveyors=[
      {x:410,y:336,w:190,h:24,dir:1},{x:1510,y:796,w:540,h:24,dir:1},
      {x:620,y:1096,w:300,h:24,dir:-1}
    ];
    const windZones=[
      {x:1235,y:410,w:160,h:405,fx:85,fy:185},{x:2045,y:825,w:210,h:385,fx:-85,fy:105}
    ];
    const teleports=[{x:760,y:1000,r:27,to:1},{x:1280,y:785,r:27,to:0}];
    const magnet={x:1785,y:628,w:210,h:182};
    const breakFloor={x:1080,y:360,w:160,h:20,active:true,hits:0,timer:0};
    const g={};

    function addRect(x,y,w,h,kind='wall'){ staticRects.push({x,y,w,h,kind}); }
    function buildMap(){
      staticRects.length=0; ramps.length=0;
      addRect(0,0,28,H); addRect(W-28,0,28,H); addRect(0,H-28,W,28);
      // Starting laboratory and four equal release cells.
      addRect(52,44,365,16); addRect(52,44,18,290); addRect(52,322,365,18);
      [112,178,244].forEach(y=>addRect(70,y,310,13));
      // Upper machine hall.
      addRect(350,360,730,24);
      addRect(430,80,260,20); addRect(780,80,420,20);
      addRect(430,80,18,112); addRect(1182,80,18,115);
      addRect(720,315,35,45); addRect(1000,320,35,40);
      addRect(540,315,75,45,'block'); addRect(950,325,62,35,'block');
      // Central fall shaft.
      addRect(1060,430,22,405); addRect(1400,360,22,550);
      addRect(1260,545,55,24,'block'); addRect(1340,660,60,24,'block');
      // Lower-left maze floor and structures.
      addRect(300,820,24,328); addRect(300,1120,1110,28);
      addRect(330,820,280,22); addRect(690,850,250,22); addRect(1010,820,200,22);
      addRect(340,1010,70,24,'block'); addRect(590,1060,65,60,'block');
      addRect(845,1070,74,50,'block'); addRect(1010,1050,58,70,'block');
      addRect(1160,1065,65,55,'block');
      ramps.push({x1:350,y1:1095,x2:470,y2:1028});
      ramps.push({x1:950,y1:1118,x2:1060,y2:1058});
      // Lift tower and compression corridor.
      addRect(1558,630,22,80); addRect(1558,850,22,270);
      addRect(1490,820,570,24); addRect(1500,600,560,22);
      addRect(1640,795,45,25,'block'); addRect(1940,800,58,20,'block');

          const to=teleports[p.to];addWave(b.x,b.y,'#f2a5ff',65);b.x=to.x+(p.to?32:-32);b.y=to.y-35;b.vy=-180;b.teleportCooldown=2;addWave(b.x,b.y,b.color,72);sound('cp',.65);break;

    function updateBall(b,dt){
      if(b.rescueTimer>0){
        b.rescueTimer-=dt;b.vx=0;b.vy=0;b.trail.length=0;

        return;
      }
      if(game.state==='race'||game.state==='victory')b.stageTime+=dt;
      b.impactCooldown=Math.max(0,b.impactCooldown-dt);b.padCooldown=Math.max(0,b.padCooldown-dt);b.teleportCooldown=Math.max(0,b.teleportCooldown-dt);b.spawnFlash=Math.max(0,b.spawnFlash-dt*2);b.goalPulse=Math.max(0,b.goalPulse-dt);

    function checkProgress(b){
      if(b.finished)return;
      const loosePass = b.cp===0 ? (b.x>947&&b.y<410) :
        b.cp===1 ? (b.y>710&&b.x>1060&&b.x<1425) :
        b.cp===2 ? (b.x<850&&b.y>850) :
        b.cp===3 ? (b.leg===2&&b.x>1695&&b.y<900) : false;
      if(b.cp<4&&(overlap(b,checkpoints[b.cp])||loosePass)){
        b.cp++;b.reachedAt=game.elapsed;b.maxProgress=Math.max(b.maxProgress,b.cp);
        b.stageTime=0;
        addWave(b.x,b.y,b.color,105);addParticle(b.x,b.y,b.color,10,190);sound('cp');focusAt(b.x,b.y,1.75,1.8);
        announce(`${TEAMS[b.team].name} ${b.num}번, CHECKPOINT ${b.cp} 돌파!`,b.color,1);
        if(b.cp===3)b.leg=0;

      if(b.cp===4&&(overlap(b,goalZone)||(b.x>2075&&b.y>1080)))finishBall(b);

    function routeSafety(b){

      else if(b.cp===2&&b.stageTime>34){nx=840;ny=1060;}
      else if(b.cp===3&&b.stageTime>40){nx=1660;ny=790;b.leg=2;}
      else if(b.cp===4&&b.stageTime>22){nx=2085;ny=900;}
      if(nx===null)return;
      addWave(b.x,b.y,'#f1c8ff',55);b.x=nx+game.rng.range(-10,10);b.y=ny;b.vx=game.rng.range(90,180);b.vy=-80;b.stageTime=0;b.trail.length=0;b.spawnFlash=1;addWave(b.x,b.y,b.color,70);sound('cp',.35);
    }

    function finishBall(b){
      if(b.finished)return;b.finished=true;b.finishTime=game.elapsed;b.vx*=.3;b.vy=-120;b.x=clamp(b.x,goalZone.x+18,goalZone.x+goalZone.w-18);b.goalPulse=1;

      if(!game.firstFinisher)game.firstFinisher=b;
      addWave(b.x,b.y,b.color,150);addParticle(b.x,b.y,b.color,18,260);sound('goal');focusAt(b.x,b.y,2.35,2.4);
      announce(`${TEAMS[b.team].name} ${b.num}번 골인!  ${teamFin}/5`,b.color,2);
      if(teamFin===4)announce(`${TEAMS[b.team].name}팀, 골인까지 1개 남았습니다!`,b.color,2);
      if(teamFin>=5&&game.winner<0)endRace(b.team,false,b);
    }

    function updateStuck(b,dt){
      if(b.finished)return;
      b.windowTimer+=dt;b.distanceWindow+=Math.hypot(b.x-b.lastX,b.y-b.lastY);b.lastX=b.x;b.lastY=b.y;
      if(b.windowTimer>=1){
        if(b.distanceWindow<22)b.stuckTime+=b.windowTimer;else b.stuckTime=Math.max(0,b.stuckTime-b.windowTimer*.75);
        b.windowTimer=0;b.distanceWindow=0;

      if(b.stuckTime>4&&b.stuckTime<9.8){
        const [tx]=routeTarget(b);b.vx+=Math.sign(tx-b.x||1)*85*dt;b.vy-=b.onGround?110*dt:0;
        if(game.rng.next()<dt*.8){b.vy-=150;b.vx+=game.rng.range(-80,80);}

    function spawnFor(b){
      if(b.cp===0)return {x:430,y:320};
      if(b.cp===1)return {x:1090,y:320};
      if(b.cp===2)return {x:1280,y:1060};
      if(b.cp===3)return {x:820,y:1060};
      return {x:1765,y:770};
    }
    function rescueBall(b,why){
      if(b.rescueTimer>0)return;const p=spawnFor(b);if(b.cp===3)b.leg=0;if(Number.isFinite(b.x+b.y))addWave(b.x,b.y,'#ffffff',52);b.x=p.x+game.rng.range(-18,18);b.rescueY=p.y-game.rng.range(0,24);b.y=b.rescueY-38;b.vx=0;b.vy=0;b.rescueTimer=2;b.stuckTime=0;b.windowTimer=0;b.distanceWindow=0;b.teleportCooldown=1.5;b.spawnFlash=1;

    }

    function routeProgress(b){
      if(b.finished)return 5;
      if(b.cp===0)return clamp((b.x-350)/600,0,.98);
      if(b.cp===1)return 1+clamp((b.y-350)/390,0,.98);
      if(b.cp===2)return 2+clamp((1260-b.x)/450,0,.98);
      if(b.cp===3){
        if(b.leg===0)return 3+clamp((b.x-820)/580,0,1)*.56;
        if(b.leg===1)return 3.56+clamp((1080-b.y)/320,0,1)*.24;

    }

    function teamData(){
      return TEAMS.map((_,t)=>{
        const bs=game.balls.filter(b=>b.team===t),progress=bs.map(routeProgress).sort((a,b)=>b-a),finished=bs.filter(b=>b.finished).length;
        return {t,bs,finished,max:progress[0]||0,score:progress.slice(0,5).reduce((a,b)=>a+b,0)/5,rank:0};

    }
    function leaderTeam(){const d=teamData().sort((a,b)=>b.finished-a.finished||b.score-a.score);return d[0]?.t??0;}

    function timeoutWinner(){
      const d=teamData();
      d.sort((a,b)=>b.finished-a.finished||b.max-a.max||b.score-a.score||Math.min(...a.bs.map(x=>x.reachedAt||999))-Math.min(...b.bs.map(x=>x.reachedAt||999)));

    function endRace(team,timeout,ball=null){
      if(game.winner>=0)return;game.winner=team;game.timeout=timeout;game.state='victory';game.victoryReal=0;

      camera.shake=8;sound('win');announce(`${TEAMS[team].name}팀 승리!`,TEAMS[team].color,3);

    function recordResult(){

    }

    function physicsStep(dt){
      game.simTime+=dt;game.eventCooldown=Math.max(0,game.eventCooldown-dt);updateGimmicks(dt);

        const n=game.countdown>2.7?'3':game.countdown>1.7?'2':game.countdown>.7?'1':game.countdown>0?'GO':'';
        if(n&&n!==game.countShown){game.countShown=n;showCountdown(n);sound(n==='GO'?'go':'count');}
        if(game.countdown<=0){game.state='race';game.gatesOpen=true;for(const b of game.balls){b.vx=270+game.rng.range(-18,18);b.vy=game.rng.range(-30,20);}announce('모든 출발문 개방 — 실험 시작!', '#e5c6ff',2);}
      }

    function showCountdown(v){const el=$('countdown');el.textContent=v;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');}

    function updateCamera(rawDt){
      const fit=Math.min(cw/(W+50),ch/(H+50));

      // Flippers.

      const f2=Math.pow(Math.max(0,Math.sin(game.simTime*2.3+g.flipperPhase+2.2)),3),a2=Math.PI+.15+f2*.8;ctx.beginPath();ctx.moveTo(2005,800);ctx.lineTo(2005+Math.cos(a2)*88,800+Math.sin(a2)*88);ctx.stroke();ctx.lineCap='butt';

      ctx.fillStyle='#951944';ctx.fillRect(g.piston.x,g.piston.y,g.piston.w,g.piston.h);ctx.fillStyle='#531071';ctx.fillRect(g.piston.x+25,600,22,g.piston.y-600);ctx.fillStyle=g.door.closed?'#a221bf':'rgba(162,33,191,.18)';ctx.fillRect(g.door.x,g.door.y,g.door.w,g.door.h);ctx.fillStyle=g.door.closed?'#ff83ec':'#8affb0';ctx.beginPath();ctx.arc(g.door.x+12,g.door.y-12,6,0,TAU);ctx.fill();
      // Teleporters and magnet.
      teleports.forEach((p,i)=>{ctx.strokeStyle=i?'#65f6ff':'#ff75ef';ctx.lineWidth=6;ctx.beginPath();ctx.arc(p.x,p.y,p.r+Math.sin(game.simTime*4+i)*4,0,TAU);ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,p.r-10,0,TAU);ctx.stroke();});
      ctx.fillStyle='rgba(224,69,255,.05)';ctx.fillRect(magnet.x,magnet.y,magnet.w,magnet.h);ctx.strokeStyle='rgba(239,124,255,.35)';ctx.setLineDash([10,8]);ctx.strokeRect(magnet.x,magnet.y,magnet.w,magnet.h);ctx.setLineDash([]);ctx.fillStyle='rgba(246,179,255,.6)';ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.fillText(g.magnetDir>0?'MAGNET +':'MAGNET −',magnet.x+magnet.w/2,magnet.y+18);
    }

    function drawEffects(){
      for(const w of game.waves){ctx.globalAlpha=clamp(w.life/.8,0,1);ctx.strokeStyle=w.color;ctx.lineWidth=4;ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,TAU);ctx.stroke();}
      ctx.globalAlpha=1;
      for(const p of game.particles){ctx.globalAlpha=clamp(p.life/.5,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill();}
      ctx.globalAlpha=1;
    }

    function drawBalls(){
      for(const b of game.balls){
        const speed=Math.hypot(b.vx,b.vy),trailCount=Math.min(b.trail.length,Math.floor(4+speed/34));
        if(trailCount>1){ctx.lineCap='round';for(let i=Math.max(1,b.trail.length-trailCount);i<b.trail.length;i++){const p=b.trail[i-1],q=b.trail[i],a=(i-(b.trail.length-trailCount))/trailCount*.45;ctx.globalAlpha=a;ctx.strokeStyle=b.color;ctx.lineWidth=lerp(2,b.r*1.25,a/.45);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}ctx.globalAlpha=1;}
        ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);if(b.rescueTimer>0)ctx.globalAlpha=.22+.26*(.5+.5*Math.sin(game.simTime*12));
        if(game.quality>.55){ctx.shadowColor=b.color;ctx.shadowBlur=8+Math.min(18,speed/28);}
        const grad=ctx.createRadialGradient(-4,-5,2,0,0,b.r);grad.addColorStop(0,'#fff');grad.addColorStop(.18,b.color);grad.addColorStop(1,TEAMS[b.team].dark);ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,b.r,0,TAU);ctx.fill();ctx.shadowBlur=0;
        ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,b.r-.5,0,TAU);ctx.stroke();
        ctx.rotate(-b.angle);ctx.fillStyle=b.team===2?'#171000':'#fff';ctx.font='900 8px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(b.num),0,.5);
        if(b.spawnFlash>0){ctx.globalAlpha=b.spawnFlash;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,b.r+8*(1-b.spawnFlash),0,TAU);ctx.stroke();}
        if(b.rescueTimer>0){ctx.globalAlpha=.75;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(0,0,b.r+9,0,TAU);ctx.stroke();ctx.setLineDash([]);}
        ctx.restore();
      }
    }

    function render(){
      ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cw,ch);
      let sx=0,sy=0;if(camera.shake>.1){sx=(Math.random()-.5)*camera.shake;sy=(Math.random()-.5)*camera.shake;camera.shake*=.88;}
      ctx.save();ctx.translate(cw/2+sx,ch/2+sy);ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);
      drawMap();drawEffects();drawBalls();ctx.restore();
      if(game.paused){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,cw,ch);ctx.fillStyle='#e4c2ff';ctx.textAlign='center';ctx.font='900 18px system-ui';ctx.fillText('PAUSED',cw/2,ch/2);}
    }

    function updateUI(force=false){
      $('roundV').textContent=game.round;$('timeV').textContent=fmt(game.elapsed);$('remainV').textContent=fmtShort(Math.max(0,LIMIT-game.elapsed));$('seedV').textContent=String(game.seed).padStart(6,'0');
      const data=teamData().sort((a,b)=>b.finished-a.finished||b.score-a.score);data.forEach((d,i)=>d.rank=i+1);const lead=data[0];$('leaderV').textContent=game.started?TEAMS[lead.t].name:'—';$('leaderV').style.color=game.started?TEAMS[lead.t].color:'#fff';
      const byTeam=data.slice().sort((a,b)=>a.t-b.t);byTeam.forEach(d=>{
        const node=document.querySelector(`.team[data-team="${d.t}"]`);if(!node)return;
        node.querySelector('.finish').textContent=`${d.finished}/5`;node.querySelector('.cp').textContent=d.finished>=5?'GOAL':`CP ${Math.floor(d.max)}`;node.querySelector('.rank').textContent=`#${d.rank}`;node.querySelector('.bar i').style.width=`${clamp(d.score/5*100,0,100)}%`;
      });
      $('cameraLabel').textContent=CAMERA_NAMES[camera.mode];$('muteBtn').classList.toggle('active',persistent.mute);$('muteBtn').querySelector('.ico').textContent=persistent.mute?'×':'♪';
      document.querySelectorAll('.speed').forEach(b=>b.classList.toggle('active',Number(b.dataset.speed)===game.gameSpeed));
      if(force)updateStats();
    }

    function buildTeamUI(){
      $('teams').innerHTML=TEAMS.map((t,i)=>`<div class="team" data-team="${i}" style="--c:${t.color}"><div class="teamHead"><span class="teamName"><i class="dot"></i>${t.name}</span><span class="finish">0/5</span></div><div class="teamMeta"><span class="rank">#—</span> · <span class="cp">CP 0</span></div><div class="bar"><i></i></div></div>`).join('');
    }
    function updateStats(){
      const labels=TEAMS.map((t,i)=>`<div class="stat"><small style="color:${t.color}">${t.name}팀 승리</small><b>${persistent.wins[i]||0}회</b></div>`).join('');
      $('statRows').innerHTML=labels+`<div class="stat"><small>전체 경기</small><b>${persistent.races||0}회</b></div><div class="stat"><small>최단 경기</small><b>${persistent.best==null?'—':fmt(persistent.best)}</b></div>`;
    }

    function showResult(){
      game.state='result';game.resultReal=0;const t=TEAMS[game.winner],d=teamData();
      $('resultTitle').textContent=`${t.en} TEAM WINS`;$('resultTitle').style.color=t.color;$('resultTitle').style.textShadow=`0 0 28px ${t.color}`;
      $('resultSub').textContent=`${game.timeout?'제한 시간 판정 · ':''}경기 ${fmt(game.elapsed)} · 시드 ${String(game.seed).padStart(6,'0')}`;
      const far=game.balls.slice().sort((a,b)=>b.maxFlight-a.maxFlight)[0],hits=game.balls.slice().sort((a,b)=>b.collisions-a.collisions)[0];
      const teamScores=d.map(x=>`${TEAMS[x.t].name} ${x.finished}개`).join(' · ');
      $('resultGrid').innerHTML=`
        <div class="resultItem"><small>팀별 골인</small><b>${teamScores}</b></div>
        <div class="resultItem"><small>첫 번째 골인</small><b>${game.firstFinisher?`${TEAMS[game.firstFinisher.team].name} ${game.firstFinisher.num}번`:'—'}</b></div>
        <div class="resultItem"><small>가장 멀리 날아간 공</small><b>${far?`${TEAMS[far.team].name} ${far.num}번 · ${Math.round(far.maxFlight)}px`:'—'}</b></div>
        <div class="resultItem"><small>최다 충돌</small><b>${hits?`${TEAMS[hits.team].name} ${hits.num}번 · ${hits.collisions}회`:'—'}</b></div>
        <div class="resultItem"><small>팀별 최고 진행</small><b>${d.map(x=>`${TEAMS[x.t].name} ${Math.min(5,x.max).toFixed(2)}`).join(' · ')}</b></div>
        <div class="resultItem"><small>누적 실험</small><b>${persistent.races}경기 · 최단 ${persistent.best?fmt(persistent.best):'—'}</b></div>`;
      $('result').classList.remove('hidden');
    }

    function frame(now){
      requestAnimationFrame(frame);if(!game.lastFrame)game.lastFrame=now;let raw=Math.min(.1,(now-game.lastFrame)/1000);game.lastFrame=now;
      if(raw>0){game.frameSamples.push(1/raw);if(game.frameSamples.length>45)game.frameSamples.shift();game.fpsAvg=game.frameSamples.reduce((a,b)=>a+b,0)/game.frameSamples.length;if(game.frameSamples.length===45){game.quality=game.fpsAvg<38?.5:game.fpsAvg<50?.72:1;$('quality').textContent=`AUTO QUALITY · ${game.quality===1?'HIGH':game.quality>.6?'MED':'LOW'} · ${Math.round(game.fpsAvg)} FPS`;}}
      if(game.started&&!game.paused&&!game.hiddenPause){
        if(game.state==='victory'){game.victoryReal+=raw;if(game.victoryReal>=5)showResult();}
        else if(game.state==='result'){game.resultReal+=raw;$('nextLine').textContent=`다음 실험까지 ${Math.max(0,Math.ceil(6-game.resultReal))}초`;if(game.resultReal>=6){game.round++;resetRound(true);}}
        const slow=game.state==='victory'?.25:1;game.accumulator+=raw*game.gameSpeed*slow;game.accumulator=Math.min(game.accumulator,FIXED*20);let steps=0;
        while(game.accumulator>=FIXED&&steps<20&&game.state!=='result'){physicsStep(FIXED);game.accumulator-=FIXED;steps++;}
      }
      updateCamera(raw);render();if(now-game.lastUI>100){game.lastUI=now;updateUI();}
    }

    function resize(){
      cw=window.innerWidth;ch=window.innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);canvas.style.width=cw+'px';canvas.style.height=ch+'px';
      if(!camera.zoom)camera.zoom=Math.min(cw/(W+50),ch/(H+50));
    }

    function startGame(){
      initAudio();if(audio?.state==='suspended')audio.resume();game.started=true;$('start').classList.add('hidden');resetRound(false);sound('ui');
    }
    function togglePause(){if(!game.started)return;game.paused=!game.paused;$('pauseBtn').classList.toggle('active',game.paused);$('pauseBtn').querySelector('.ico').textContent=game.paused?'▶':'Ⅱ';sound('ui');}
    function cycleCamera(){const modes=['overview','auto','leader'],i=modes.indexOf(camera.mode);camera.mode=modes[(i+1)%modes.length];persistent.camera=camera.mode;savePersistent();camera.manualUntil=0;sound('ui');updateUI();}

    function bindUI(){
      $('startBtn').addEventListener('click',startGame,{once:true});
      $('pauseBtn').addEventListener('click',togglePause);
      $('restartBtn').addEventListener('click',()=>{sound('ui');resetRound(false);});
      $('seedBtn').addEventListener('click',()=>{sound('ui');game.round++;resetRound(true);});
      $('cameraBtn').addEventListener('click',cycleCamera);
      $('muteBtn').addEventListener('click',()=>{persistent.mute=!persistent.mute;savePersistent();if(!persistent.mute){initAudio();audio?.resume();sound('ui');}updateUI();});
      $('fullBtn').addEventListener('click',async()=>{sound('ui');try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(_){}});
      document.querySelectorAll('.speed').forEach(btn=>btn.addEventListener('click',()=>{game.gameSpeed=Number(btn.dataset.speed);persistent.speed=game.gameSpeed;savePersistent();sound('ui');updateUI();}));
      $('statsBtn').addEventListener('click',()=>{$('stats').classList.toggle('open');sound('ui');});
      let holdTimer=0,holdStart=0,holdAnim=0;const reset=$('resetStats');
      const cancelHold=()=>{clearTimeout(holdTimer);cancelAnimationFrame(holdAnim);reset.style.setProperty('--hold','0%');};
      const animateHold=()=>{const p=clamp((performance.now()-holdStart)/1500*100,0,100);reset.style.setProperty('--hold',p+'%');if(p<100)holdAnim=requestAnimationFrame(animateHold);};
      reset.addEventListener('pointerdown',e=>{e.preventDefault();holdStart=performance.now();animateHold();holdTimer=setTimeout(()=>{persistent.wins=[0,0,0,0];persistent.races=0;persistent.best=null;savePersistent();updateStats();announce('누적 기록을 초기화했습니다.','#ff9cbd',2);cancelHold();},1500);});
      ['pointerup','pointercancel','pointerleave'].forEach(n=>reset.addEventListener(n,cancelHold));
    }

    function bindCanvas(){
      canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture?.(e.pointerId);camera.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY});camera.manualUntil=performance.now()+4500;if(camera.pointers.size===2){const a=[...camera.pointers.values()];camera.lastPinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}});
      canvas.addEventListener('pointermove',e=>{const p=camera.pointers.get(e.pointerId);if(!p)return;e.preventDefault();const dx=e.clientX-p.lastX,dy=e.clientY-p.lastY;p.x=p.lastX=e.clientX;p.y=p.lastY=e.clientY;
        if(camera.pointers.size===1){camera.x-=dx/camera.zoom;camera.y-=dy/camera.zoom;}
        else if(camera.pointers.size===2){const a=[...camera.pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(camera.lastPinch>0){const before=camera.zoom;camera.zoom=clamp(camera.zoom*d/camera.lastPinch,Math.min(cw/(W+50),ch/(H+50))*.72,Math.min(cw/(W+50),ch/(H+50))*4);const mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;camera.x+=(mx-cw/2)*(1/before-1/camera.zoom);camera.y+=(my-ch/2)*(1/before-1/camera.zoom);}camera.lastPinch=d;}
        camera.tx=camera.x;camera.ty=camera.y;camera.tz=camera.zoom;camera.manualUntil=performance.now()+4500;
      },{passive:false});
      const up=e=>{camera.pointers.delete(e.pointerId);if(camera.pointers.size<2)camera.lastPinch=0;};canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
      canvas.addEventListener('dblclick',e=>e.preventDefault());
    }

    document.addEventListener('visibilitychange',()=>{game.hiddenPause=document.hidden;game.lastFrame=performance.now();});
    window.addEventListener('resize',resize,{passive:true});window.addEventListener('orientationchange',()=>setTimeout(resize,120),{passive:true});
    buildTeamUI();game.rng=new RNG(game.seed);buildMap();makeBalls();resize();bindUI();bindCanvas();updateUI(true);requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
