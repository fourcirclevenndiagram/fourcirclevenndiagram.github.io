<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LATENT CITADEL : 비가환 방들의 합의</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#05070d;
 overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;
 -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
 color:#dfe6f2;font-size:12px;line-height:1.35}
#app{position:relative;margin:0 auto;width:100%;max-width:560px;height:100vh;height:100dvh;
 display:flex;flex-direction:column;
 padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
 background:radial-gradient(130% 90% at 50% -5%, #0d1730 0%, #080d1c 52%, #05070d 100%);
 touch-action:manipulation}
/* ---------- HUD ---------- */
#hud{flex:0 0 auto;padding:6px 8px 4px;display:flex;flex-direction:column;gap:4px;
 background:linear-gradient(180deg, rgba(10,16,34,.92), rgba(10,16,34,.55) 80%, rgba(10,16,34,0));z-index:5}
#hudTop{display:flex;align-items:baseline;gap:8px;min-height:20px}
#ttl{font-weight:800;letter-spacing:1.5px;font-size:13px;color:#cfe3ff;text-shadow:0 0 12px rgba(80,160,255,.45);white-space:nowrap}
#ttl small{font-weight:500;color:#7b8db0;letter-spacing:.5px;font-size:10px;margin-left:2px}
#phaseChip{font-size:11px;padding:2px 8px;border-radius:9px;background:rgba(90,140,255,.14);
 border:1px solid rgba(120,170,255,.35);color:#a9c8ff;white-space:nowrap}
#hudSpacer{flex:1}
#clock{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#e8f2ff;letter-spacing:.5px}
#seedTag{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#5f7398}
#hudBtns{display:flex;gap:5px;align-items:center}
.btn{min-width:44px;min-height:44px;padding:0 4px;border-radius:11px;border:1px solid rgba(120,150,210,.28);
 background:linear-gradient(180deg, rgba(38,52,88,.75), rgba(22,30,54,.85));color:#cfe0ff;
 font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
 touch-action:manipulation;cursor:pointer;flex:1 1 0;letter-spacing:.3px}
.btn:active{background:linear-gradient(180deg, rgba(70,96,160,.85), rgba(34,46,84,.9));transform:translateY(1px)}
.btn.on{border-color:rgba(120,220,255,.65);color:#9be6ff;box-shadow:0 0 10px rgba(60,170,255,.25) inset}
#solveWrap{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:2px}
#solveBar{height:100%;width:0%;border-radius:3px;
 background:linear-gradient(90deg,#2dd4bf,#60a5fa,#c084fc);transition:width .5s ease}
/* ---------- STAGE ---------- */
#stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:7px 14px;border-radius:10px;
 background:rgba(16,24,46,.92);border:1px solid rgba(130,180,255,.4);color:#d7e7ff;font-size:12px;
 opacity:0;transition:opacity .35s;pointer-events:none;white-space:nowrap;z-index:8}
/* ---------- TEAM CARDS ---------- */
#cards{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 8px 8px;z-index:5;
 background:linear-gradient(0deg, rgba(8,12,24,.95), rgba(8,12,24,.6) 70%, rgba(8,12,24,0))}
.card{border-radius:12px;padding:6px 8px 7px;border:1px solid rgba(120,150,210,.22);min-height:64px;
 background:linear-gradient(160deg, rgba(26,36,64,.78), rgba(14,20,38,.86));
 touch-action:manipulation;cursor:pointer;position:relative;overflow:hidden}
.card:active{background:linear-gradient(160deg, rgba(40,56,98,.85), rgba(20,28,52,.9))}
.card.sel{border-color:rgba(160,220,255,.6)}
.cHead{display:flex;align-items:center;gap:5px}
.cDot{width:9px;height:9px;border-radius:3px;flex:0 0 auto;box-shadow:0 0 8px currentColor}
.cName{font-weight:800;font-size:11px;letter-spacing:.6px;flex:1;white-space:nowrap;overflow:hidden}
.cScore{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700}
.cAct{font-size:11px;color:#b9c8e4;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
.cBarW{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:4px;overflow:hidden}
.cBar{height:100%;width:0%;border-radius:2px;transition:width .4s}
.cSub{display:flex;justify-content:space-between;font-size:10px;color:#7f90b2;margin-top:3px}
/* ---------- BOTTOM SHEET ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:20;
 background:linear-gradient(180deg, rgba(20,29,54,.97), rgba(11,16,32,.98));
 border-top:1px solid rgba(140,180,255,.35);border-radius:16px 16px 0 0;
 padding:10px 14px calc(12px + env(safe-area-inset-bottom));
 transform:translateY(105%);transition:transform .3s ease;max-height:46%;overflow:hidden auto}
#sheet.open{transform:translateY(0)}
#sheetHead{display:flex;align-items:center;gap:7px;margin-bottom:6px}
#sheetName{font-weight:800;font-size:14px;letter-spacing:.6px;flex:1}
#sheetClose{min-width:44px;min-height:44px;border:none;background:rgba(255,255,255,.06);border-radius:10px;
 color:#cfe0ff;font-size:16px;touch-action:manipulation;cursor:pointer}
.shRow{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed rgba(140,160,200,.14);font-size:12px}
.shRow b{color:#8fa4c8;font-weight:600;flex:0 0 auto}
.shRow span{text-align:right;color:#e6eeff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheetFacts{margin-top:7px;font-size:11px;color:#a6b7d6;line-height:1.55}
#sheetFacts em{color:#cfe3ff;font-style:normal}
/* ---------- OVERLAY (help / results) ---------- */
#ovl{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
 background:rgba(4,7,14,.82);backdrop-filter:blur(3px)}
#ovl.show{display:flex}
#ovlBox{width:min(92%,470px);max-height:86%;overflow:hidden auto;border-radius:16px;padding:14px 15px 16px;
 background:linear-gradient(170deg, rgba(24,34,64,.98), rgba(12,17,34,.99));
 border:1px solid rgba(140,180,255,.4);box-shadow:0 12px 50px rgba(0,0,0,.6)}
#ovlBox h2{margin:0 0 8px;font-size:15px;letter-spacing:1px;color:#d9e8ff}
#ovlBox h2 small{color:#7d90b6;font-weight:500;font-size:11px;margin-left:6px}
.resRow{border-radius:11px;padding:7px 9px;margin:6px 0;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.resTop{display:flex;align-items:center;gap:7px}
.resRank{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:14px;width:22px}
.resName{font-weight:800;font-size:12px;letter-spacing:.5px;flex:1}
.resComp{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:800}
.resGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:5px}
.rgCell{text-align:center}
.rgCell i{display:block;font-style:normal;font-size:8.5px;color:#7c8db0;letter-spacing:.2px}
.rgCell b{display:block;font-size:10.5px;font-family:ui-monospace,Menlo,monospace;color:#dce8ff}
.resNote{font-size:10.5px;color:#93a5c6;margin-top:4px}
.resFoot{margin-top:9px;font-size:11px;color:#9fb2d4;line-height:1.6;border-top:1px solid rgba(255,255,255,.09);padding-top:8px}
#ovlCnt{margin-top:9px;text-align:center;font-size:12px;color:#8fe3c8;font-family:ui-monospace,Menlo,monospace}
.helpList{margin:8px 0 4px;padding-left:16px;color:#c6d4ee;font-size:12px;line-height:1.75}
.ovlBtn{margin-top:11px;width:100%;min-height:46px;border-radius:12px;border:1px solid rgba(140,190,255,.45);
 background:linear-gradient(180deg, rgba(52,76,140,.8), rgba(28,40,80,.9));color:#e2eeff;font-size:13px;
 font-weight:700;touch-action:manipulation;cursor:pointer;letter-spacing:.5px}
#toast.show{opacity:1}
#ovlBox p{margin:7px 0;font-size:12px;line-height:1.65;color:#c2d0ea}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#9fe0c9}
@media (max-height:640px){ .cAct{display:none} .card{min-height:52px} }
</style>
</head>

<script>
"use strict";
/* ============================================================
   LATENT CITADEL : 비가환 방들의 합의
   single-file auto-spectator puzzle game
   ============================================================ */

/* ---------- utils ---------- */
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function lerp(a,b,t){return a+(b-a)*t}
function fmtT(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function pick(rng,arr){return arr[Math.floor(rng()*arr.length)]}

/* ---------- mod-7 / permutation algebra ---------- */
const M7=7;
function m7(v){v%=M7;return v<0?v+M7:v}
function circ7(a,b){const d=Math.abs(a-b)%M7;return Math.min(d,M7-d)}
const PERMS=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
function permApply(pi,arr){const s=PERMS[pi];return[arr[s[0]],arr[s[1]],arr[s[2]]]}
const PCOMP=(function(){
  const t=[];
  for(let a=0;a<6;a++){t[a]=[];
    for(let b=0;b<6;b++){
      const v=permApply(a,permApply(b,[0,1,2]));
      for(let k=0;k<6;k++){const s=PERMS[k];
        if(s[0]===v[0]&&s[1]===v[1]&&s[2]===v[2]){t[a][b]=k;break}}
    }}
  return t;
})();
const P_ROT=4, P_ROT_INV=3, P_SWAP01=2, P_SWAP12=1, P_SWAP02=5;

/* ---------- op definitions ----------
   each device op: fwd(R,d) applies, inv(R,d) exact inverse, ord = cyclic order */
const OP_KR={ROTATE:"회전",SWAP:"교환",SHEARX:"전단X",SHEARY:"전단Y",INVERT:"반전",PHASE:"위상",
  CONJ:"켤레변환",ENT:"얽힘",TRANS:"전송",PROBE:"관측",LOCK:"고정",ROLL:"롤백"};
const OPS={
  ROTATE:{ord:d=>3,
    fwd(R,d){const r=R[d.room];r.q=[r.q[2],r.q[0],r.q[1]];r.perm=PCOMP[P_ROT][r.perm]},
    inv(R,d){const r=R[d.room];r.q=[r.q[1],r.q[2],r.q[0]];r.perm=PCOMP[P_ROT_INV][r.perm]}},
  SWAP:{ord:d=>2,
    fwd(R,d){const r=R[d.room],i=d.p.i,j=d.p.j;const t=r.q[i];r.q[i]=r.q[j];r.q[j]=t;r.perm=PCOMP[d.p.pp][r.perm]},
    inv(R,d){OPS.SWAP.fwd(R,d)}},
  SHEARX:{ord:d=>7,
    fwd(R,d){const r=R[d.room];r.q[0]=m7(r.q[0]+d.p.k*r.q[1])},
    inv(R,d){const r=R[d.room];r.q[0]=m7(r.q[0]-d.p.k*r.q[1])}},
  SHEARY:{ord:d=>7,
    fwd(R,d){const r=R[d.room];r.q[1]=m7(r.q[1]+d.p.k*r.q[2])},
    inv(R,d){const r=R[d.room];r.q[1]=m7(r.q[1]-d.p.k*r.q[2])}},
  INVERT:{ord:d=>2,
    fwd(R,d){const r=R[d.room];for(const i of d.p.mask)r.q[i]=m7(-r.q[i])},
    inv(R,d){OPS.INVERT.fwd(R,d)}},
  PHASE:{ord:d=>(d.p.d===2?2:4),
    fwd(R,d){const r=R[d.room];r.phase=(r.phase+d.p.d)%4},
    inv(R,d){const r=R[d.room];r.phase=(r.phase+4-d.p.d)%4}},
  CONJ:{ord:d=>7,
    fwd(R,d){const r=R[d.room],s=PERMS[r.perm];r.q[s[1]]=m7(r.q[s[1]]+r.q[s[0]])},
    inv(R,d){const r=R[d.room],s=PERMS[r.perm];r.q[s[1]]=m7(r.q[s[1]]-r.q[s[0]])}},
  ENT:{ord:d=>7,
    fwd(R,d){const a=R[d.room],b=R[d.p.other],i=d.p.i;a.q[i]=m7(a.q[i]+b.q[i])},
    inv(R,d){const a=R[d.room],b=R[d.p.other],i=d.p.i;a.q[i]=m7(a.q[i]-b.q[i])}},
  TRANS:{ord:d=>7,
    fwd(R,d){const a=R[d.room],b=R[d.p.other],i=d.p.i;b.q[i]=m7(b.q[i]+a.q[i])},
    inv(R,d){const a=R[d.room],b=R[d.p.other],i=d.p.i;b.q[i]=m7(b.q[i]-a.q[i])}},
  PROBE:{ord:d=>1,fwd(){},inv(){}},
  LOCK:{ord:d=>1,fwd(){},inv(){}},
  ROLL:{ord:d=>1,fwd(){},inv(){}}
};
function opAffects(d){const a=[d.room];if(d.p&&d.p.other!=null)a.push(d.p.other);return a}

/* ---------- isometric constants ---------- */
const TW=28,TH=14,EZ=11,STEP_MAX=1.05;
function isoP(x,y,e){return{x:(x-y)*(TW/2),y:(x+y)*(TH/2)-(e||0)*EZ}}
function tkey(x,y){return x*64+y}

/* ============================================================
   MAP — floating dungeon rooms, corridors, doors, ladders, portal
   ============================================================ */
const MATS={
  white:{top:"#d9d4c6",alt:"#ccc6b6",s1:"#a7a08e",s2:"#8b8574",edge:"#efe9da"},
  purple:{top:"#6f5b96",alt:"#655384",s1:"#4c3f68",s2:"#3c3153",edge:"#9a86c6"},
  mint:{top:"#a3dbc8",alt:"#93ccb9",s1:"#6ea695",s2:"#5a8a7b",edge:"#d1f5e8"},
  brown:{top:"#5d4837",alt:"#524030",s1:"#3e3025",s2:"#31261d",edge:"#7d6350"},
  beige:{top:"#d8c093",alt:"#cbb384",s1:"#a28c62",s2:"#857250",edge:"#efdcb4"},
  ice:{top:"#c2e6f8",alt:"#b0d8ee",s1:"#82abc6",s2:"#6d92aa",edge:"#e8f8ff"},
  lrock:{top:"#4b3b38",alt:"#43332f",s1:"#302523",s2:"#251c1a",edge:"#6b514b"},
  gray:{top:"#9ba1a9",alt:"#8e949c",s1:"#6e747c",s2:"#5b6168",edge:"#c2c8d0"},
  teal:{top:"#9fd0cc",alt:"#90c1bd",s1:"#6c9995",s2:"#597f7c",edge:"#ccf1ed"},
  blue:{top:"#8fb2e0",alt:"#81a4d2",s1:"#5f7ba3",s2:"#4e6588",edge:"#bcd8fa"},
  metal:{top:"#414b5c",alt:"#3a4353",s1:"#2b3240",s2:"#222834",edge:"#5c6a82"}
};
const ROOM_DEFS=[
 {id:0,key:"archive", kr:"기록 보관실", mat:"white", x:2,y:2,w:7,h:5,e:2},
 {id:1,key:"isolation",kr:"격리실",     mat:"purple",x:13,y:1,w:5,h:4,e:2},
 {id:2,key:"lab",     kr:"실험실",     mat:"brown", x:1,y:10,w:6,h:5,e:2},
 {id:3,key:"garden",  kr:"수로 정원",  mat:"mint",  x:11,y:8,w:7,h:6,e:1},
 {id:4,key:"relay",   kr:"중계 발판",  mat:"white", x:8,y:17,w:3,h:3,e:2},
 {id:5,key:"sand",    kr:"모래 방",    mat:"beige", x:2,y:22,w:6,h:5,e:1},
 {id:6,key:"split",   kr:"빙염 분할 방",mat:"ice",  x:13,y:18,w:6,h:6,e:1},
 {id:7,key:"mint",    kr:"수정 보관실",mat:"mint",  x:2,y:29,w:5,h:4,e:1},
 {id:8,key:"shaft",   kr:"수직 통로",  mat:"gray",  x:13,y:27,w:4,h:4,e:0},
 {id:9,key:"cisternA",kr:"교정 수조 A",mat:"teal",  x:3,y:36,w:4,h:4,e:0},
 {id:10,key:"cisternB",kr:"교정 수조 B",mat:"blue", x:9,y:37,w:4,h:4,e:0},
 {id:11,key:"core",   kr:"최종 코어",  mat:"metal", x:15,y:34,w:6,h:6,e:0}
];
const RK={};ROOM_DEFS.forEach(r=>RK[r.key]=r.id);
const CORS=[
 {a:"archive",b:"isolation",pts:[[9,3],[10,3],[11,3],[12,3]]},
 {a:"archive",b:"lab",pts:[[4,7],[4,8],[4,9]]},
 {a:"isolation",b:"garden",pts:[[15,5],[15,6],[15,7]]},
 {a:"lab",b:"sand",pts:[[3,15],[3,16],[3,17],[3,18],[3,19],[3,20],[3,21]],door:{at:[3,19],kind:"gate",condRoom:"lab"}},
 {a:"garden",b:"relay",pts:[[12,14],[12,15],[11,15],[10,15],[9,15],[9,16]]},
 {a:"relay",b:"split",pts:[[11,18],[12,18]]},
 {a:"sand",b:"split",pts:[[8,23],[9,23],[10,23],[11,23],[12,23]],door:{at:[10,23],kind:"gate",condRoom:"sand"}},
 {a:"sand",b:"mint",pts:[[4,27],[4,28]]},
 {a:"split",b:"shaft",pts:[[15,24],[15,25],[15,26]],ev:[1,2,0],ladder:[[15,25],[15,26]]},
 {a:"shaft",b:"core",pts:[[17,29],[18,29],[18,30],[18,31],[18,32],[18,33]],door:{at:[18,31],kind:"core"}},
 {a:"mint",b:"cisternA",pts:[[4,33],[4,34],[4,35]]},
 {a:"cisternA",b:"cisternB",pts:[[7,37],[8,37]]},
 {a:"cisternB",b:"core",pts:[[13,38],[14,38]],door:{at:[13,38],kind:"core"}}
];
const WATER_TILES={
 garden:[[12,10],[12,11],[14,10],[14,11]],
 cisternA:[[4,37],[5,37],[4,38],[5,38]],
 cisternB:[[10,38],[11,38],[10,39],[11,39]]
};
const PLANK_TILES=[[13,10],[13,11]];
const NOWALK=[[4,3],[13,20],[18,20]];
const PORTALS=[{a:[16,2],b:[3,30]}];
const PLATFORM={tile:[16,9],e:3,ladderFrom:[16,10]};
const DEV_DEFS=[
 {id:0, type:"ROTATE",room:0, x:6,y:3, label:"회전 제단"},
 {id:1, type:"PROBE", room:0, x:3,y:5, label:"관측 프로브 α"},
 {id:2, type:"PHASE", room:1, x:14,y:3, p:{d:1}, label:"위상 패널"},
 {id:3, type:"TRANS", room:1, x:17,y:3, p:{other:3,i:0}, label:"데이터 캡슐 전송기"},
